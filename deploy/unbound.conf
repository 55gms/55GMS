# Local DNS cache for this server (epoxy-server, Node fetch, Caddy, Docker).
# netcup's resolvers answered in ~100 ms with nothing cached; these answer in ~5 ms.
server:
    interface: 127.0.0.1
    access-control: 127.0.0.0/8 allow
    num-threads: 2
    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800
    cache-min-ttl: 60
    msg-cache-size: 64m
    rrset-cache-size: 128m
    so-reuseport: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
