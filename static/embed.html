<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading</title>
    <script src="/assets/js/script.js?v=19"></script>

    <!-- Versioned, compatible controller/core/transport bundles. -->
    <script src="/assets/lib/vendor-core.js?v=2.0.67-alpha.2"></script>
    <script src="/assets/lib/vendor-frame.js?v=0.0.14"></script>
    <script src="/assets/lib/vendor-util.js?v=0.0.3"></script>
    <script src="/assets/lib/vendor-net.js?v=3.0.1"></script>
    <script src="/assets/js/frame-runtime.js?v=1"></script>

    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #111111;
        --border: #262626;
        --text: #ededed;
        --text-2: #a1a1a1;
        --accent: #3b82f6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Geist",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
      }

      #iframe-container {
        position: fixed;
        inset: 0;
      }

      #iframe-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #fff;
      }

      /* First-connect state: only visible while the transport boots. */
      .status {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: var(--bg);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
      }

      .status.visible {
        opacity: 1;
        visibility: visible;
      }

      .status-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        padding: 0 24px;
        text-align: center;
      }

      .status-title {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
      }

      .status-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-2);
      }

      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--text);
        animation: spin 0.8s linear infinite;
      }

      .status-icon {
        display: none;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: #f5a524;
      }

      .status.error .spinner {
        display: none;
      }

      .status.error .status-icon {
        display: grid;
      }

      .status-btn {
        display: none;
        margin-top: 4px;
        height: 32px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .status.error .status-btn {
        display: inline-block;
      }

      .status-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }

        .status {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="status" class="status" role="status" aria-live="polite">
      <div class="status-card">
        <div class="spinner" aria-hidden="true"></div>
        <div class="status-icon" aria-hidden="true">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
            />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
        </div>
        <p id="status-title" class="status-title">Connecting</p>
        <p id="status-text" class="status-text">
          Starting a secure connection…
        </p>
        <button id="status-retry" class="status-btn" type="button">
          Try again
        </button>
      </div>
    </div>

    <div id="iframe-container"></div>

    <script>
      // ---------------- BRIDGE ----------------
      // Events go up to the browser shell as { type: "browser:*" }.
      // Commands come down as { type: "browser:command", command, url }.
      const inShell = window.parent && window.parent !== window;

      function emit(type, detail = {}) {
        if (!inShell) return;
        window.parent.postMessage({ type, ...detail }, location.origin);
      }

      const statusEl = document.getElementById("status");
      const statusTitle = document.getElementById("status-title");
      const statusText = document.getElementById("status-text");

      function showStatus(title, text, isError = false) {
        statusTitle.textContent = title;
        statusText.textContent = text;
        statusEl.classList.toggle("error", isError);
        statusEl.classList.add("visible");
      }

      function hideStatus() {
        statusEl.classList.remove("visible", "error");
      }

      document
        .getElementById("status-retry")
        .addEventListener("click", () => location.reload());

      // ---------------- CONTROLLER / TRANSPORT ----------------
      let frames;
      const newTabPlugin = new frameRuntime.NewTabPlugin((type, detail) =>
        emit("browser:" + type, detail),
      );

      // Only show the connecting screen if booting is actually slow.
      const bootStatusTimer = setTimeout(
        () => showStatus("Connecting", "Starting a secure connection…"),
        350,
      );

      const endpoint =
        (location.protocol === "https:" ? "wss://" : "ws://") +
        location.host +
        "/api/live/";

      const ready = frameRuntime
        .createController(endpoint)
        .then((controller) => {
          frames = controller;
        });

      ready.then(
        () => {
          clearTimeout(bootStatusTimer);
          hideStatus();
          emit("browser:ready");
        },
        (err) => {
          clearTimeout(bootStatusTimer);
          console.error("Player failed to start:", err);
          // Name the stage that failed so reports can be diagnosed.
          const reason =
            err instanceof Error && err.message
              ? err.message
              : "The connection failed to start.";
          showStatus(
            "Couldn't connect",
            reason + " Check your connection and try again.",
            true,
          );
          emit("browser:error", {
            kind: "transport",
            message: "The connection failed to start.",
          });
          emit("browser:loaded", { url: currentUrl });
        },
      );

      // ---------------- FRAME + NAVIGATION ----------------
      let frame = null;
      let currentUrl = "";
      let loadTimer = null;
      let navigationId = 0;

      // Per-tab history. The iframe's own history is joint session history
      // shared with every other tab, so history.back() could navigate a
      // different tab; we track entries here and navigate explicitly instead.
      let entries = [];
      let index = -1;
      let pendingHistoryMove = null;

      function emitHistory() {
        emit("browser:history", {
          canGoBack: index > 0,
          canGoForward: index < entries.length - 1,
        });
      }

      function recordUrl(url) {
        if (pendingHistoryMove !== null) {
          index = pendingHistoryMove;
          entries[index] = url; // a redirect may land somewhere slightly different
          pendingHistoryMove = null;
        } else if (url !== entries[index]) {
          entries = entries.slice(0, index + 1);
          entries.push(url);
          index = entries.length - 1;
        }
        emitHistory();
      }

      function startLoading(url) {
        emit("browser:loading", { url });
        clearTimeout(loadTimer);
        loadTimer = setTimeout(() => {
          emit("browser:error", {
            kind: "timeout",
            message: "This page is taking longer than usual to load.",
          });
        }, 30000);
      }

      function frameDocument() {
        try {
          return frame.element.contentDocument;
        } catch {
          return null;
        }
      }

      function readTitle() {
        const doc = frameDocument();
        let title = "";
        try {
          title = (doc && doc.title) || "";
        } catch {}
        if (!title) {
          try {
            title = new URL(currentUrl).hostname;
          } catch {}
        }
        return title.trim();
      }

      function toFrameAsset(href) {
        if (!href) return "";
        if (href.startsWith("data:") || href.startsWith(location.origin))
          return href;
        try {
          return frameRuntime.core.rewriteUrl(
            new URL(href, currentUrl).href,
            frame.context,
            {
              origin: new URL(currentUrl),
              base: new URL(currentUrl),
            },
          );
        } catch {
          return "";
        }
      }

      function readFavicon() {
        const doc = frameDocument();
        if (!doc) return "";
        try {
          const link = doc.querySelector(
            'link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]',
          );
          // Sites without a declared icon usually still serve /favicon.ico.
          return toFrameAsset(
            link ? link.href : new URL("/favicon.ico", currentUrl).href,
          );
        } catch {
          return "";
        }
      }

      // The shell sits outside the worker's scope and can't load frame assets,
      // so the icon is fetched through the page frame and handed over as pixels.
      const setImageSrc = Object.getOwnPropertyDescriptor(
        HTMLImageElement.prototype,
        "src",
      ).set;
      let faviconRequest = 0;

      function reportFavicon(request, favicon) {
        if (request !== faviconRequest) return;
        faviconData = favicon;
        emit("browser:faviconchange", { favicon });
      }

      function loadFavicon(src) {
        const request = ++faviconRequest;
        const doc = frameDocument();
        if (!src || !doc || src.startsWith("data:"))
          return reportFavicon(request, src);
        try {
          const img = doc.createElement("img");
          img.addEventListener("load", () => {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = canvas.height = 32;
              canvas.getContext("2d").drawImage(img, 0, 0, 32, 32);
              reportFavicon(request, canvas.toDataURL("image/png"));
            } catch {
              reportFavicon(request, "");
            }
          });
          img.addEventListener("error", () => reportFavicon(request, ""));
          // The embed's own setter: src is already a frame URL.
          setImageSrc.call(img, src);
        } catch {
          reportFavicon(request, "");
        }
      }

      let lastTitle = "";
      let lastFavicon = "";
      let faviconData = "";
      let observer = null;
      let observedDoc = null;

      function syncMeta() {
        const title = readTitle();
        if (title && title !== lastTitle) {
          lastTitle = title;
          emit("browser:titlechange", { title });
        }
        const favicon = readFavicon();
        if (favicon !== lastFavicon) {
          lastFavicon = favicon;
          loadFavicon(favicon);
        }
      }

      function observeDocument() {
        const doc = frameDocument();
        if (!doc || doc === observedDoc || !doc.documentElement) return;
        observedDoc = doc;
        if (observer) observer.disconnect();
        observer = new MutationObserver(syncMeta);
        try {
          observer.observe(doc.head || doc.documentElement, {
            subtree: true,
            childList: true,
            characterData: true,
            attributes: true,
            attributeFilter: ["href", "rel"],
          });
        } catch {}
      }

      // Browser shortcuts pressed while the framed page has focus are
      // forwarded to the shell so they behave the same everywhere.
      const SHORTCUT_KEYS = new Set([
        "l",
        "t",
        "w",
        "r",
        "1",
        "2",
        "3",
        "4",
        "5",
        "6",
        "7",
        "8",
        "9",
        "tab",
      ]);

      function bindPageKeys() {
        let win;
        try {
          win = frame.element.contentWindow;
        } catch {
          return;
        }
        if (!win || win.__browserKeysBound) return;
        win.__browserKeysBound = true;
        win.addEventListener(
          "keydown",
          (e) => {
            const key = e.key.toLowerCase();
            const mod = e.ctrlKey || e.metaKey;
            if (!mod || !SHORTCUT_KEYS.has(key)) return;
            e.preventDefault();
            emit("browser:shortcut", {
              key: e.key,
              ctrlKey: e.ctrlKey,
              metaKey: e.metaKey,
              shiftKey: e.shiftKey,
              altKey: e.altKey,
            });
          },
          true,
        );
        win.addEventListener("pagehide", () => startLoading(currentUrl));
      }

      function mountFrame() {
        const container = document.getElementById("iframe-container");
        container.innerHTML = "";
        frame = frames.createFrame(undefined, {
          plugins: [
            new frameRuntime.ResourceIntegrityPlugin(),
            new frameRuntime.AssetCachePlugin(),
            ...(inShell ? [newTabPlugin] : []),
            new frameRuntime.UrlWatcherPlugin((url) => {
              if (!url) return;
              currentUrl = url;
              recordUrl(url);
              emit("browser:urlchange", { url });
              observeDocument();
              syncMeta();
            }),
          ],
        });
        frame.element.setAttribute("allowfullscreen", "");
        frame.element.setAttribute(
          "allow",
          "fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture",
        );
        container.appendChild(frame.element);

        frameRuntime.core.Tap.tap(frame.hooks.init.post, (context) => {
          if (!context.isTopLevel) return;
          observeDocument();
          bindPageKeys();
          syncMeta();
        });
        frameRuntime.core.Tap.tap(
          frame.hooks.error.request,
          ({ error, rawrequest }) => {
            if (rawrequest.rawUrl !== frame.element.src) return;
            clearTimeout(loadTimer);
            emit("browser:error", {
              kind: "request",
              message:
                error instanceof Error
                  ? error.message
                  : "The page could not be loaded.",
            });
            emit("browser:loaded", { url: currentUrl });
          },
        );

        frame.element.addEventListener("load", () => {
          clearTimeout(loadTimer);
          observeDocument();
          bindPageKeys();
          syncMeta();
          emit("browser:loaded", {
            url: currentUrl,
            title: lastTitle,
            favicon: faviconData,
          });
        });
      }

      async function navigate(url, { historyMove = null } = {}) {
        if (!url) return;
        const id = ++navigationId;
        startLoading(url);
        try {
          await ready;
        } catch {
          return;
        }
        if (id !== navigationId) return;
        if (!frame) mountFrame();
        // The shell clears a tab's title/favicon on navigation, so always re-report them.
        lastTitle = "";
        lastFavicon = "";
        faviconData = "";
        faviconRequest++;
        pendingHistoryMove = historyMove;
        currentUrl = url;
        frame.go(url);
      }

      function goBack() {
        if (index > 0) navigate(entries[index - 1], { historyMove: index - 1 });
      }

      function goForward() {
        if (index < entries.length - 1)
          navigate(entries[index + 1], { historyMove: index + 1 });
      }

      function reload() {
        if (!frame) return;
        startLoading(currentUrl);
        try {
          frame.reload();
        } catch {
          frame.go(currentUrl);
        }
      }

      function stop() {
        clearTimeout(loadTimer);
        try {
          frame.element.contentWindow.stop();
        } catch {}
        emit("browser:loaded", {
          url: currentUrl,
          title: lastTitle,
          favicon: faviconData,
        });
      }

      // Eruda is ~500KB, so it's only fetched when requested.
      function toggleDevtools() {
        let win;
        try {
          win = frame.element.contentWindow;
        } catch {
          return;
        }
        if (!win) return;
        if (win.eruda && win.__erudaActive) {
          win.eruda.destroy();
          win.__erudaActive = false;
          return;
        }
        const start = () => {
          win.eruda.init();
          win.eruda.show();
          win.__erudaActive = true;
        };
        if (win.eruda) return start();
        const script = win.document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/eruda";
        script.onload = start;
        script.onerror = () =>
          emit("browser:error", {
            kind: "devtools",
            message: "Developer tools couldn't be loaded on this page.",
          });
        win.document.head.appendChild(script);
      }

      // The shell focuses this embed when its tab is opened from another page;
      // hand that focus on to the framed page.
      window.addEventListener("focus", () => {
        if (frame && document.activeElement === document.body)
          frame.element.focus();
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.origin !== location.origin)
          return;
        const data = event.data;
        if (!data || data.type !== "browser:command") return;
        switch (data.command) {
          case "go":
            navigate(data.url);
            break;
          case "back":
            goBack();
            break;
          case "forward":
            goForward();
            break;
          case "reload":
            reload();
            break;
          case "stop":
            stop();
            break;
          case "devtools":
            toggleDevtools();
            break;
          case "popupclosed":
            newTabPlugin.popupClosed(data.popupId);
            break;
        }
      });

      function urlFromHash() {
        let raw = window.location.hash.substring(1);
        if (!raw) return "https://start.duckduckgo.com/";
        // The media player passes its target as an opaque token.
        if (raw.startsWith("~")) raw = frameRuntime.codec.decode(raw.slice(1));
        return /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
      }

      window.addEventListener("hashchange", () => navigate(urlFromHash()));
      navigate(urlFromHash());
    </script>
  </body>
</html>
