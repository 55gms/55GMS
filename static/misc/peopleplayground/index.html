<!DOCTYPE html>
<html lang="en-us">

<head>
    <script src="/assets/js/loader-ui.js?v=e39jq3w37n"></script>
    <script src="/assets/js/game-loader.js?v=e39jq3w37n" data-title="People Playground"></script>
    <base href="https://cdn.jsdelivr.net/gh/kfm5/55gms-web-port-archive@main/people-playground/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | People Playground</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
        }

        body {
            background: #231F20;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        .webgl-content {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .fullscreen {
            cursor: pointer;
            display: inline-block;
            width: 24px;
            height: 24px;
            background: url('TemplateData/fullscreen.png') no-repeat center;
        }

        /* Hide Unity's default loading elements */
        #unity-loading-bar {
            display: none !important;
        }

        #unity-logo {
            display: none !important;
        }

        #unity-progress-bar-empty {
            display: none !important;
        }

        #unity-progress-bar-full {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="webgl-content">
        <div id="unity-container" class="unity-desktop" hidden>
            <canvas id="unity-canvas" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-warning"> </div>
        </div>
    </div>
    <script>
        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        function resizeCanvas() {
            var canvas = document.getElementById("unity-canvas");
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        (async () => {
            const wasmPartsFiles = getParts("Build/PPG.wasm", 1, 3);
            const dataPartsFiles = getParts("Build/PPG.data", 1, 6);
            const allParts = [...wasmPartsFiles, ...dataPartsFiles];

            await GameLoader.measure(allParts);

            // Start merging files with progress
            const [wasmUrl, dataUrl] = await Promise.all([
                GameLoader.merge(wasmPartsFiles),
                GameLoader.merge(dataPartsFiles)
            ]);

            container.hidden = false;
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/PPG.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/PPG.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Studio Minus",
                productName: "People Playground",
                productVersion: "0"
            };

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            loadingBar.style.display = "none";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    // Progress is handled by our custom loading system
                }).then((unityInstance) => {
                    resizeCanvas();
                    GameLoader.finish();
                }).catch(GameLoader.fail);
            };
            document.body.appendChild(script);
        })().catch(GameLoader.fail);
    </script>
</body>

</html>
