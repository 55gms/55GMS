<script>
(function () {
  function res(v) { return Promise.resolve(v); }

  var listeners = {};
  function on(key, cb) {
    if (typeof cb !== "function") return;
    (listeners[key] = listeners[key] || []).push(cb);
  }
  function emit(key, value) {
    var a = listeners[key] || [];
    for (var i = 0; i < a.length; i++) { try { a[i](value); } catch (e) {} }
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var deviceType = /iPad|Tablet/i.test(ua) ? "tablet" : (/iPhone|iPod|Android/i.test(ua) ? "mobile" : "desktop");

  var lbKey = "pg_lb";
  function lbAll() { try { return JSON.parse(lsGet(lbKey) || "{}") || {}; } catch (e) { return {}; } }
  function lbSave(o) { lsSet(lbKey, JSON.stringify(o)); }

    PLATFORM_MESSAGE: {},

    platform: {
      get id() { return window.GAME_PLATFORM_ID || "crazy_games"; },
      get language() { return window.GAME_LANG || "en"; },

    },

    device: {
      get type() { return deviceType; }
    },

    player: {
      get isAuthorizationSupported() { return false; },
      get isAuthorized() { return false; },
      get id() { return ""; },
      get name() { return ""; },
      get photos() { return []; },
      authorize: function () { return Promise.reject(new Error("not supported")); }
    },

    game: {
      get visibilityState() { return document.hidden ? "hidden" : "visible"; },
      on: function (e, cb) { on("game:" + e, cb); }
    },

    storage: {
      get defaultType() { return "local_storage"; },
      isSupported: function () { return true; },
      isAvailable: function () { return true; },
      get: function (keys, type, tryParse) {
        var arr = Array.isArray(keys) ? keys : [keys];
        var out = [];
        for (var i = 0; i < arr.length; i++) {
          var v = lsGet("pg_" + arr[i]);
          if (v === null) { out.push(null); continue; }
          if (tryParse) { try { v = JSON.parse(v); } catch (e) {} }
          out.push(v);
        }
        return res(out);
      },
      set: function (keys, values, type) {
        var k = Array.isArray(keys) ? keys : [keys];
        var v = Array.isArray(values) ? values : [values];
        for (var i = 0; i < k.length; i++) {
          var val = v[i];
          if (val !== null && typeof val === "object") { try { val = JSON.stringify(val); } catch (e) { val = ""; } }
          lsSet("pg_" + k[i], val === undefined || val === null ? "" : String(val));
        }
        return res(true);
      },
      delete: function (keys, type) {
        var k = Array.isArray(keys) ? keys : [keys];
        for (var i = 0; i < k.length; i++) lsDel("pg_" + k[i]);
        return res(true);
      }
    },

    advertisement: {
      on: function (e, cb) { on("adv:" + e, cb); },
      get interstitialState() { return interstitialState; },
      get rewardedState() { return rewardedState; },
      get bannerState() { return bannerState; },
      get isBannerSupported() { return false; },
      get minimumDelayBetweenInterstitial() { return minDelay; },
      setMinimumDelayBetweenInterstitial: function (o) {
        var v = (o && typeof o === "object") ? (o.default !== undefined ? o.default : o) : o;
        var n = parseInt(v, 10);
        if (!isNaN(n)) minDelay = n;
      },
      showBanner: function () {
        bannerState = "failed";
        emit("adv:banner_state_changed", bannerState);
      },
      hideBanner: function () {
        bannerState = "hidden";
        emit("adv:banner_state_changed", bannerState);
      },
      showInterstitial: function () {
        interstitialState = "closed";
        emit("adv:interstitial_state_changed", interstitialState);
      },
      showRewarded: function () {
        rewardedState = "loading";
        emit("adv:rewarded_state_changed", rewardedState);
        setTimeout(function () {
          rewardedState = "opened";
          emit("adv:rewarded_state_changed", rewardedState);
          setTimeout(function () {
            rewardedState = "rewarded";
            emit("adv:rewarded_state_changed", rewardedState);
            rewardedState = "closed";
            emit("adv:rewarded_state_changed", rewardedState);
          }, 60);
        }, 60);
      },
      checkAdBlock: function () { return res(false); }
    },

    social: {
      get isShareSupported() { return false; },
      get isInviteFriendsSupported() { return false; },
      get isJoinCommunitySupported() { return false; },
      get isCreatePostSupported() { return false; },
      get isAddToHomeScreenSupported() { return false; },
      get isAddToFavoritesSupported() { return false; },
      get isRateSupported() { return false; },
      get isExternalLinksAllowed() { return false; },
      share: function () { return Promise.reject(new Error("not supported")); },
      inviteFriends: function () { return Promise.reject(new Error("not supported")); },
      joinCommunity: function () { return Promise.reject(new Error("not supported")); },
      createPost: function () { return Promise.reject(new Error("not supported")); },
      addToHomeScreen: function () { return Promise.reject(new Error("not supported")); },
      addToFavorites: function () { return Promise.reject(new Error("not supported")); },
      rate: function () { return Promise.reject(new Error("not supported")); }

    leaderboard: {
      get isSupported() { return true; },
      get isNativePopupSupported() { return false; },
      get isSetScoreSupported() { return true; },
      get isGetScoreSupported() { return true; },
      get isGetEntriesSupported() { return true; },
      setScore: function (o) {
        o = o || {};
        var id = String(o.leaderboardId || o.id || "default");

        var all = lbAll();
        if (!all[id] || score > all[id]) { all[id] = score; lbSave(all); }
        return res(true);
      },
      getScore: function (o) {
        o = o || {};
        var id = String(o.leaderboardId || o.id || "default");
        var all = lbAll();
        return res(all[id] || 0);
      },
      getEntries: function (o) {
        o = o || {};
        var id = String(o.leaderboardId || o.id || "default");
        var all = lbAll();
        if (all[id] === undefined) return res([]);
        return res([{ id: "local-player", name: "You", score: all[id], rank: 1, photos: [] }]);
      },
      showNativePopup: function () { return Promise.reject(new Error("not supported")); }
    },

    payments: {
      get isSupported() { return false; },
      purchase: function () { return Promise.reject(new Error("not supported")); },
      consumePurchase: function () { return Promise.reject(new Error("not supported")); },
      getCatalog: function () { return res([]); },
      getPurchases: function () { return res([]); }
    },

    remoteConfig: {
      get isSupported() { return false; },
      get: function () { return res({}); }
    },

    achievements: {
      get isSupported() { return false; },
      get isGetListSupported() { return false; },
      get isNativePopupSupported() { return false; },
      unlock: function () { return Promise.reject(new Error("not supported")); },
      showNativePopup: function () { return Promise.reject(new Error("not supported")); },
      getList: function () { return res([]); }
    },

    initialize: function () { return res(true); }
  };

  document.addEventListener("visibilitychange", function () {
    emit("game:visibility_state_changed", document.hidden ? "hidden" : "visible");
  });

  window.bridge = bridge;
  window.playgamaBridge = bridge;
})();
</script>

<script>
(function () {
  var C = window.GAME_CFG;
  var F = window.GAME_FILES;
  var B = window.GAME_B;

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement("meta");
    meta.name = "viewport";
    meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
    document.getElementsByTagName("head")[0].appendChild(meta);
  }

  var canvas = document.getElementById("canvas");
  var loadingOverlay = document.getElementById("loading-overlay");
  var progressBarFill = document.getElementById("progress-bar-fill");

  var STORAGE_DATA_SEPARATOR = "{bridge_data_separator}";
  var STORAGE_KEYS_SEPARATOR = "{bridge_keys_separator}";
  var STORAGE_VALUES_SEPARATOR = "{bridge_values_separator}";

  window.unityInstance = null;
  var progressBarFillingInterval = null;
  var progressBarCompleteFillingStarted = false;

  function sendMessageToUnity(name, value) {
    if (window.unityInstance !== null) {
      if (value === undefined) window.unityInstance.SendMessage("PlaygamaBridge", name);
      else window.unityInstance.SendMessage("PlaygamaBridge", name, value);
    }
  }

  function onUnityLoadingProgressChanged(progress) {
    if (progress >= 1 && progressBarFillingInterval !== null) {
      clearInterval(progressBarFillingInterval);
      progressBarFillingInterval = null;
      return;
    }
    if (progressBarCompleteFillingStarted) return;
    if (progress >= 0.9) {
      progressBarCompleteFillingStarted = true;
      completeProgressBarFilling();
      return;
    }
    progressBarFill.style.width = (progress * 100) + "%";
  }

  function completeProgressBarFilling() {
    if (progressBarFillingInterval !== null) return;
    var currentPercent = 90;
    progressBarFill.style.width = currentPercent + "%";
    progressBarFillingInterval = setInterval(function () {
      currentPercent++;
      if (currentPercent > 100) currentPercent = 100;
      progressBarFill.style.width = currentPercent + "%";
      if (currentPercent >= 100) {
        clearInterval(progressBarFillingInterval);
        progressBarFillingInterval = null;
      }
    }, 100);
  }

  window.addEventListener("pointerdown", function () {
    try { window.focus(); canvas.focus(); } catch (e) {}
  });

  var brotliMod = null;
  function GetBrotli() {
    if (brotliMod) return Promise.resolve(brotliMod);
    return import(C.BROTLI).then(function (m) {
      var d = m && m.default;
      return (d && typeof d.then === "function") ? d : (d || m);
    }).then(function (m) { brotliMod = m; return m; });
  }

  function IsUnityData(u) {
    return u.length > 15 && u[0] === 0x55 && u[1] === 0x6E && u[2] === 0x69 && u[3] === 0x74;
  }

  function Decode(bytes) {
    if (IsUnityData(bytes)) return Promise.resolve(bytes);
    if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
      if (typeof DecompressionStream === "undefined") return Promise.resolve(bytes);
      try {
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).arrayBuffer().then(function (buf) {
          var out = new Uint8Array(buf);
          return out.length ? out : bytes;
        }).catch(function () { return bytes; });
      } catch (e) { return Promise.resolve(bytes); }
    }
    return GetBrotli().then(function (m) {
      var out = m.decompress(bytes);
      return (out && out.length) ? out : bytes;
    }).catch(function () { return bytes; });
  }

  function FetchBytes(url) {
    return fetch(url, { cache: "force-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " -> " + r.status);
      return r.arrayBuffer();
    }).then(function (b) { return new Uint8Array(b); });
  }

  function FetchParts(name, count) {
    var jobs = [];
    for (var i = 0; i < count; i++) jobs.push(FetchBytes(B(name + ".part" + i)));
    return Promise.all(jobs).then(function (chunks) {
      var total = 0, i;
      for (i = 0; i < chunks.length; i++) total += chunks[i].length;
      var merged = new Uint8Array(total), off = 0;
      for (i = 0; i < chunks.length; i++) { merged.set(chunks[i], off); off += chunks[i].length; }
      return Decode(merged);
    }).then(function (u8) {
      return URL.createObjectURL(new Blob([u8], { type: "application/octet-stream" }));
    });
  }

  var dataUrlPromise = FetchParts(C.DATA, C.DATA_PARTS);

  window.bridge.initialize().then(function () {
    window.bridge.advertisement.on("banner_state_changed", function (s) { sendMessageToUnity("OnBannerStateChanged", s); });
    window.bridge.advertisement.on("interstitial_state_changed", function (s) { sendMessageToUnity("OnInterstitialStateChanged", s); });
    window.bridge.advertisement.on("rewarded_state_changed", function (s) { sendMessageToUnity("OnRewardedStateChanged", s); });
    window.bridge.game.on("visibility_state_changed", function (s) { sendMessageToUnity("OnVisibilityStateChanged", s); });

    var deviceType = String(window.bridge.device.type || "").toLowerCase();
    var handheld = deviceType === "mobile" || deviceType === "tablet";
    var density = window.devicePixelRatio || 1;
    var renderScale = handheld ? Math.min(density, 1.5) : density;

    return dataUrlPromise.then(function (dataUrl) {
      var unityLoader = document.createElement("script");
      unityLoader.src = B(C.LOADER);
      unityLoader.onload = function () {
        createUnityInstance(canvas, {
          dataUrl: dataUrl,
          frameworkUrl: B(C.FRAMEWORK),
          codeUrl: B(C.WASM),
          streamingAssetsUrl: F.STREAMING,
          companyName: "DefaultCompany",
          productName: "PirateBattle",
          productVersion: "0.1",
          devicePixelRatio: renderScale
        }, onUnityLoadingProgressChanged).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          loadingOverlay.remove();
          canvas.focus();
        }).catch(function (error) { console.error(error); });
      };
      unityLoader.onerror = function () { console.error("loader failed"); };
      document.body.appendChild(unityLoader);
    });
  }).catch(function (e) { console.error(e); });

  window.getPlatformId = function () { return window.bridge.platform.id; };
  window.getPlatformLanguage = function () { return window.bridge.platform.language; };
  window.getPlatformPayload = function () {
    var p = window.bridge.platform.payload;
    return typeof p === "string" ? p : "";
  };
  window.getPlatformTld = function () {
    var t = window.bridge.platform.tld;
    return typeof t === "string" ? t : "";
  };
  window.getIsPlatformGetAllGamesSupported = function () { return window.bridge.platform.isGetAllGamesSupported.toString(); };
  window.getIsPlatformGetGameByIdSupported = function () { return window.bridge.platform.isGetGameByIdSupported.toString(); };
  window.sendMessageToPlatform = function (message) { window.bridge.platform.sendMessage(message); };

  window.getServerTime = function () {

      .catch(function () { sendMessageToUnity("OnGetServerTimeCompleted", "false"); });

  window.getAllGames = function () {
    window.bridge.platform.getAllGames()

  window.getGameById = function (options) {

    window.bridge.platform.getGameById(options)
      .then(function (r) { sendMessageToUnity("OnGetGameByIdCompletedSuccess", JSON.stringify(r)); })
      .catch(function () { sendMessageToUnity("OnGetGameByIdCompletedFailed"); });
  };

  window.getDeviceType = function () { return window.bridge.device.type; };

  window.getIsPlayerAuthorizationSupported = function () { return window.bridge.player.isAuthorizationSupported.toString(); };
  window.getIsPlayerAuthorized = function () { return window.bridge.player.isAuthorized.toString(); };
  window.getPlayerId = function () { return window.bridge.player.id ? window.bridge.player.id.toString() : ""; };
  window.getPlayerName = function () { return window.bridge.player.name ? window.bridge.player.name.toString() : ""; };
  window.getPlayerPhotos = function () {
    return window.bridge.player.photos.length > 0 ? JSON.stringify(window.bridge.player.photos) : "";
  };
  window.authorizePlayer = function (options) {
    if (options) options = JSON.parse(options);
    window.bridge.player.authorize(options)
      .then(function () { sendMessageToUnity("OnAuthorizeCompleted", "true"); })
      .catch(function () { sendMessageToUnity("OnAuthorizeCompleted", "false"); });
  };

  window.getVisibilityState = function () { return window.bridge.game.visibilityState; };

  window.getStorageDefaultType = function () { return window.bridge.storage.defaultType; };
  window.getIsStorageSupported = function (t) { return window.bridge.storage.isSupported(t).toString(); };
  window.getIsStorageAvailable = function (t) { return window.bridge.storage.isAvailable(t).toString(); };

  window.getStorageData = function (key, storageType) {
    var keys = key.split(STORAGE_KEYS_SEPARATOR);
    window.bridge.storage.get(keys, storageType, false)
      .then(function (data) {
        if (keys.length > 1) {
          var values = [];
          for (var i = 0; i < keys.length; i++) {
            var value = data[i];
            if (value) {
              if (typeof value !== "string") value = JSON.stringify(value);
              values.push(value);

          }
          sendMessageToUnity("OnGetStorageDataSuccess", key + STORAGE_DATA_SEPARATOR + values.join(STORAGE_VALUES_SEPARATOR));
        } else {

          sendMessageToUnity("OnGetStorageDataSuccess", key + STORAGE_DATA_SEPARATOR + out);
        }

      .catch(function () { sendMessageToUnity("OnGetStorageDataFailed", key); });
  };

      .catch(function () { sendMessageToUnity("OnSetStorageDataFailed", key); });
  };
