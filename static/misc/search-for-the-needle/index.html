        var brotliModule = null;

            return import(CFG.BROTLI).then(function (m) {
                return m["default"];
            }).then(function (mod) {
                if (!mod || typeof mod.decompress !== "function") throw new Error("bad brotli module");
                brotliModule = mod;

            });

            if (u.length < 4) return false;
            if (kind === "wasm") return (u[0] === 0x00 && u[1] === 0x61 && u[2] === 0x73 && u[3] === 0x6D);

                    if (!r.ok) throw new Error(name + ".part" + index + " " + r.status);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    var bytes = new Uint8Array(buf);
                    chunks.push(bytes);
                    total += bytes.length;
                    mergedParts++;
                    UpdateProgress((mergedParts / totalParts) * 0.4);
                    index++;
                    return next();
                });
            }
            return next();
        }

            return fetch(buildUrl + "/" + name).then(function (r) {
                if (!r.ok) throw new Error(name + " " + r.status);
                return r.arrayBuffer();

                mergedParts++;

                    resolve(res);
                }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    ysdk.getPayments().then(function (_payments) {
                        payments = _payments;
                        payments.getCatalog().then(function (products) {
                            var productID = [], title = [], description = [], imageURI = [], price = [],
                                priceValue = [], priceCurrencyCode = [], currencyImageURL = [], consumed = [];
                            payments.getPurchases().then(function (purchases) {
                                for (var i = 0; i < products.length; i++) {
                                    productID[i] = products[i].id;
                                    title[i] = products[i].title;
                                    description[i] = products[i].description;
                                    imageURI[i] = products[i].imageURI;
                                    price[i] = products[i].price;
                                    priceValue[i] = products[i].priceValue;
                                    priceCurrencyCode[i] = products[i].priceCurrencyCode;
                                    currencyImageURL[i] = products[i].getPriceCurrencyImage("medium");
                                    consumed[i] = true;
                                    for (var i2 = 0; i2 < purchases.length; i2++) {
                                        if (purchases[i2].productID === productID[i]) { consumed[i] = false; break; }
                                    }
                                }
                                Final(JSON.stringify({
                                    "id": productID, "title": title, "description": description, "imageURI": imageURI,
                                    "price": price, "priceValue": priceValue, "priceCurrencyCode": priceCurrencyCode,
                                    "currencyImageURL": currencyImageURL, "consumed": consumed,
                                    "language": ysdk.environment.i18n.lang
                                }));
                            });
                        });
                    })["catch"](function () { Final(NO_DATA); });
                } catch (e) { Final(NO_DATA); }
            });
        }

        function BuyPayments(id) {
            try {
                if (payments != null) {
                    payments.purchase({ id: id }).then(function () {
                        YG2Instance('OnPurchaseSuccess', id);
                        FocusGame();
                    })["catch"](function () {
                        YG2Instance('OnPurchaseFailed', id);
                        FocusGame();
                    });
                } else {
                    YG2Instance('OnPurchaseFailed', id);
                }
            } catch (e) {
                YG2Instance('OnPurchaseFailed', id);
                FocusGame();
            }
        }

        function ConsumePurchase(id, onPurchaseSuccess) {
            try {
                if (payments == null) return;
                payments.getPurchases().then(function (purchases) {
                    for (var i = 0; i < purchases.length; i++) {
                        if (purchases[i].productID === id) {
                            if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', id);
                            else payments.consumePurchase(purchases[i].purchaseToken);
                        }
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Consume Purchase: ', e.message);
            }
        }

        function ConsumePurchases(onPurchaseSuccess) {
            try {
                if (payments == null) return;
                payments.getPurchases().then(function (purchases) {
                    for (var i = 0; i < purchases.length; i++) {
                        if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', purchases[i].productID);
                        else payments.consumePurchase(purchases[i].purchaseToken);
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Consume purchases: ', e.message);
            }
        }

        var allGamesData = NO_DATA;

        function GetAllGames() {
            return new Promise(function (resolve) {
                function Final(res) { allGamesData = res; resolve(res); }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    ysdk.features.GamesAPI.getAllGames().then(function (r) {
                        var games = (r && r.games) || [];
                        var appID = [], title = [], url = [], coverURL = [], iconURL = [];
                        for (var i = 0; i < games.length; i++) {
                            appID[i] = games[i].appID;
                            title[i] = games[i].title;
                            url[i] = games[i].url;
                            coverURL[i] = games[i].coverURL;
                            iconURL[i] = games[i].iconURL;
                        }
                        Final(JSON.stringify({
                            "appID": appID, "title": title, "url": url,
                            "coverURL": coverURL, "iconURL": iconURL,
                            "developerURL": (r && r.developerURL) || ""
                        }));
                    })["catch"](function () { Final(NO_DATA); });
                } catch (e) { Final(NO_DATA); }
            });
        }

        function SetLeaderboard(name, score, extraData) {
            if (!ysdk) return;
            try { ysdk.leaderboards.setScore(name, score, extraData); }
            catch (e) { console.error('CRASH Set Leaderboard: ', e.message); }
        }

        function GetLeaderboard(nameLB, quantityTop, quantityAround, photoSize, auth) {
            if (!ysdk) return;
            var jsonEntries = { technoName: '', isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: '' };

            ysdk.leaderboards.getDescription(nameLB)
                .then(function (res) {
                    jsonEntries.technoName = nameLB;
                    jsonEntries.isDefault = res["default"];
                    jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
                    jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
                    jsonEntries.type = res.description.type;
                    return ysdk.leaderboards.getEntries(nameLB, {
                        quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
                    });
                })
                .then(function (res) {
                    var jsonPlayers = EntriesLB(res, photoSize);
                    var combinedJson = Object.assign({}, jsonEntries, jsonPlayers);
                    YG2Instance('LeaderboardEntries', JSON.stringify(combinedJson));
                })["catch"](function (err) { console.error(err); });
        }

        function EntriesLB(res, photoSize) {
            var LbdEntriesText = '';
            var plCount = res.entries.length;

            var ranks = new Array(plCount);
            var photos = new Array(plCount);
            var names = new Array(plCount);
            var scores = new Array(plCount);
            var uniqueIDs = new Array(plCount);
            var extraDataArray = new Array(plCount);

            for (var i = 0; i < plCount; i++) {
                ranks[i] = res.entries[i].rank;
                scores[i] = res.entries[i].score;
                uniqueIDs[i] = res.entries[i].player.uniqueID;
                photos[i] = res.entries[i].player.getAvatarSrc(photoSize);

                if (res.entries[i].extraData == "" || res.entries[i].extraData == null) extraDataArray[i] = NO_DATA;
                else extraDataArray[i] = res.entries[i].extraData;

                if (res.entries[i].player.scopePermissions.public_name !== "allow") names[i] = "anonymous";
                else names[i] = res.entries[i].player.publicName;

                LbdEntriesText += ranks[i] + '. ' + names[i] + ": " + scores[i] + '\n';
            }

            if (plCount === 0) LbdEntriesText = 'no data';

            return {
                "entries": LbdEntriesText, "ranks": ranks, "photos": photos,
                "names": names, "scores": scores, "uniqueIDs": uniqueIDs,
                "extraDataArray": extraDataArray
            };
        }

        var nowFullAdOpen = false;

        function InterAdvShow() {
            try {
                if (ysdk == null) return;
                if (nowFullAdOpen == true) return;
                ysdk.adv.showFullscreenAdv({
                    callbacks: {
                        onOpen: function () {
                            nowFullAdOpen = true;
                            if (initGame === true) YG2Instance('OpenInterAdv');
                        },
                        onClose: function (wasShown) {
                            nowFullAdOpen = false;
                            if (initGame === true) YG2Instance('CloseInterAdv', wasShown ? 'true' : 'false');
                            FocusGame();
                        },
                        onError: function () {
                            nowFullAdOpen = false;
                            YG2Instance('ErrorInterAdv');
                            FocusGame();
                        }
                    }
                });
            } catch (e) {
                console.error('CRASH Interstitial Adv Show: ', e.message);
            }
        }

        var environmentData = NO_DATA;

        function RequestingEnvironmentData() {
            return new Promise(function (resolve) {
                function Final(res) {
                    environmentData = res;
                    YG2Instance('SetEnvirData', res);
                    resolve(res);
                }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    var browser = navigator.userAgent;
                    if (browser.indexOf('YaBrowser') >= 0 || browser.indexOf('YaSearchBrowser') >= 0) browser = 'Yandex';
                    else if (browser.indexOf('Opera') >= 0 || browser.indexOf('OPR') >= 0) browser = 'Opera';
                    else if (browser.indexOf('Firefox') >= 0) browser = 'Firefox';
                    else if (browser.indexOf('MSIE') >= 0) browser = 'IE';
                    else if (browser.indexOf('Edge') >= 0) browser = 'Edge';
                    else if (browser.indexOf('Chrome') >= 0) browser = 'Chrome';
                    else if (browser.indexOf('Safari') >= 0) browser = 'Safari';
                    else browser = 'Other';

                    Final(JSON.stringify({
                        "language": ysdk.environment.i18n.lang,
                        "domain": ysdk.environment.i18n.tld,
                        "deviceType": ysdk.deviceInfo.type,
                        "isMobile": ysdk.deviceInfo.isMobile(),
                        "isDesktop": ysdk.deviceInfo.isDesktop(),
                        "isTablet": ysdk.deviceInfo.isTablet(),
                        "isTV": ysdk.deviceInfo.isTV(),
                        "appID": ysdk.environment.app.id,
                        "browserLang": ysdk.environment.browser.lang,
                        "payload": ysdk.environment.payload,
                        "platform": navigator.platform,
                        "browser": browser
                    }));
                } catch (e) { Final(NO_DATA); }
            });
        }

        var playerData = NO_DATA;
        var player = null;

        function InitPlayer() {
            function Final(res) {
                playerData = res;
                YG2Instance('SetAuth', res);
                return res;
            }
            if (!ysdk) return Promise.resolve(Final(NotAuthorized(false)));
            return ysdk.getPlayer().then(function (p) {
                player = p;
                if (!player || !player.isAuthorized()) return Final(NotAuthorized(true));
                return Final(JSON.stringify({
                    playerAuth: "resolved",
                    playerName: player.getName(),
                    playerId: player.getUniqueID(),
                    playerPhoto: player.getPhoto('medium'),
                    payingStatus: player.getPayingStatus()
                }));
            })["catch"](function () {
                player = null;
                return Final(NotAuthorized(false));
            });
        }

        function NotAuthorized(hasPlayer) {
            return JSON.stringify({
                playerAuth: "rejected",
                playerName: "unauthorized",
                playerId: (hasPlayer && player && player.getUniqueID) ? player.getUniqueID() : "unauthorized",
                playerPhoto: "no data",
                payingStatus: "unknown"
            });
        }

        function OpenAuthDialog() {
            if (!ysdk) return;
            try {
                ysdk.auth.openAuthDialog().then(function () {
                    return InitPlayer();
                }).then(function () {
                    YG2Instance('LoggedIn');
                })["catch"](function () { InitPlayer(); });
            } catch (e) {}
        }
    </script>
