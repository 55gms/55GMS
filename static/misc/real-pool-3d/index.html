// --- Aspect ratio lock ---
function lock(el, ratio) {
  if (window.innerWidth / window.innerHeight > ratio) {
    el.style.width = window.innerHeight * ratio + 'px';
    el.style.height = '100%';
  } else {
    el.style.width = '100%';
    el.style.height = window.innerWidth / ratio + 'px';
  }
  el.style.margin = 'auto';
  el.style.top = el.style.left = el.style.bottom = el.style.right = '0';
}

function Update() {
  lock(canvas, 16/9);
  lock(loading, 16/9);
}

// --- Unity loader with wasm.br part merging ---
var buildUrl = '/misc/real-pool-3d/_ext/cdn.jsdelivr.net/gh/z799gs/8poo%404d78100/Build';

async function loadWasmParts() {
  var totalParts = 9;
  var parts = [];
  for (var i = 0; i < totalParts; i++) {
    var resp = await fetch(buildUrl + '/builld.wasm.br.part' + i);
    parts.push(await resp.arrayBuffer());
  }
  var totalSize = parts.reduce(function(sum, p) { return sum + p.byteLength; }, 0);
  var merged = new Uint8Array(totalSize);
  var offset = 0;
  for (var j = 0; j < parts.length; j++) {
    merged.set(new Uint8Array(parts[j]), offset);
    offset += parts[j].byteLength;
  }
  return URL.createObjectURL(new Blob([merged], { type: 'application/wasm' }));
}

async function startGame() {
  var wasmUrl = await loadWasmParts();

  var config = {
    dataUrl: '/misc/real-pool-3d/_ext/cdn.jsdelivr.net/gh/z799gs/8poo%407a8aff0/Build/builld.data.br',
    frameworkUrl: buildUrl + '/builld.framework.js',
    codeUrl: wasmUrl,
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'EivaaGames',
    productName: 'Real Pool 3D',
    productVersion: '2.6',
    showBanner: function() {},
  };

  var script = document.createElement('script');
  script.src = buildUrl + '/builld.loader.js';
  script.onload = function() {
    createUnityInstance(canvas, config, function(progress) {
      spinner.style.display = 'none';
      loading_bar_fill.style.width = (111.2 * progress) + '%';
    }).then(function(instance) {
      myGameInstance = instance;
      ATinstance = instance;
      loading_bg.style.display = 'none';
      Update();
    }).catch(function(err) {
      console.error('Unity load error:', err);
    });
  };
  document.body.appendChild(script);
}

startGame();

window.addEventListener('beforeunload', function() {

});
