                    photos[i] = 'nonePhoto';
                } else {
                    photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
                }

                if (res.entries[i].player.scopePermissions.public_name !== "allow") {
                    mames[i] = "anonymous";
                } else {
                    mames[i] = res.entries[i].player.publicName;
                }

                LeaderboardEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
            }

            if (playersCount === 0) LeaderboardEntriesText = 'no data';

            return {
                "entries": LeaderboardEntriesText,
                "ranks": ranks,
                "photos": photos,
                "names": mames,
                "scores": scores,
                "uniqueIDs": uniqueIDs
            };
        }

        function LanguageRequest() {
            try {
                var lang = (window.ysdk && window.ysdk.environment && window.ysdk.environment.i18n)
                    ? window.ysdk.environment.i18n.lang : CFG.LANG;
                if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetLanguage', lang);
            } catch (e) {
                console.error('CRASH Language Request: ', e.message);
            }
        }

        function RequestingEnvironmentData() {
            try {
                if (!window.ysdk) return;
                var jsonEnvir = {
                    "language": window.ysdk.environment.i18n.lang,
                    "domain": window.ysdk.environment.i18n.tld,
                    "deviceType": window.ysdk.deviceInfo.type,
                    "isMobile": window.ysdk.deviceInfo.isMobile(),
                    "isDesktop": window.ysdk.deviceInfo.isDesktop(),
                    "isTablet": window.ysdk.deviceInfo.isTablet(),
                    "isTV": window.ysdk.deviceInfo.isTV(),
                    "appID": window.ysdk.environment.app.id,
                    "browserLang": window.ysdk.environment.browser.lang,
                    "payload": window.ysdk.environment.payload,
                    "promptCanShow": promptCanShow,
                    "reviewCanShow": reviewCanShow
                };
                if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetEnvironmentData', JSON.stringify(jsonEnvir));
            } catch (e) {
                console.error('CRASH Requesting Environment Data: ', e.message);
            }
        }

        function Review() {
            try {
                if (!window.ysdk) return;
                window.ysdk.feedback.canReview().then(function (r) {
                    if (r && r.value) {
                        window.ysdk.feedback.requestReview().then(function (res) {
                            if (myGameInstance)
                                myGameInstance.SendMessage('YandexGame', 'ReviewSent', res.feedbackSent ? 'true' : 'false');
                            try { window.focus(); } catch (e) {}
                        })["catch"](function () {});
                    } else {
                        if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'ReviewSent', 'false');
                        try { window.focus(); } catch (e) {}
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Review: ', e.message);
            }
        }

        function PromptShow() {
            try {
                if (!window.ysdk) return;
                window.ysdk.shortcut.showPrompt().then(function (result) {
                    if (result && result.outcome === 'accepted') {
                        if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'OnPromptSuccess');
                    } else {
                        if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'OnPromptFail');
                    }
                    try { window.focus(); } catch (e) {}
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Prompt Show: ', e.message);
            }
        }

        function PaintRBT(rbt) {
            try {
                var el = document.getElementById(rbt);
                if (el) el.style.background = '#ff0000';
            } catch (e) {}
        }

        function StaticRBTDeactivate() {
        }
    </script>
