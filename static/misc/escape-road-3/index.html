<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<script src="/assets/js/loader-ui.js?v=63f0cr4hc0"></script>
<script src="/assets/js/game-loader.js?v=63f0cr4hc0" data-title="Escape Road 3"></script>
<script>
  GameLoader.unity([
    ["Build/escape-road-3.framework.js.br",501799],
    ["Build/escape-road-3.loader.js",20642],
  ]);
  GameLoader.expect(81817268);
</script>
<script src="/assets/js/game-parts.js?v=1"></script>
<base href="https://cdn.jsdelivr.net/gh/55gms/55gms@main/static/misc/escape-road-3/">
<script>
  GameParts.serve({
    "Build/escape-road-3.data.br": ["Build/escape-road-3.data.br.part1","Build/escape-road-3.data.br.part2","Build/escape-road-3.data.br.part3","Build/escape-road-3.data.br.part4"],
    "Build/escape-road-3.wasm.br": ["Build/escape-road-3.wasm.br.part1","Build/escape-road-3.wasm.br.part2","Build/escape-road-3.wasm.br.part3","Build/escape-road-3.wasm.br.part4","Build/escape-road-3.wasm.br.part5"],
  });
</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Escape Road 3</title>
   </head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div id="preloader">
            <div id="preloader-top">
                <img id="thumbnail" alt="Game Logo" src="icon.png">
                <div id="preloader-top-container">
                    <div id="game-title">Loading...</div>
                    <div id="progress-container">
                        <div id="progress-bar">
                            <div id="progress-fill"></div>
                        </div>
                        <div id="progress-amount">0%</div>
                    </div>
                    <div id="progress-comment">Initializing...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <div id="game" style="width: 100%; height: 100%; position: relative; background: rgb(35, 31, 32);">
            <canvas id="canvas" style="width: 100%; height: 100%; display: block;"></canvas>
        </div>
    </div>

    <script src="unityloader.js"></script>
    
    <script>
        const GAME_CONFIG = {
            productName: "Escape Road 3",
            dataUrl: "Build/escape-road-3.data.br",
            frameworkUrl: "Build/escape-road-3.framework.js.br",
            codeUrl: "Build/escape-road-3.wasm.br",
            loaderUrl: "Build/escape-road-3.loader.js",
            
            productVersion: "1.0",
            companyName: "Arcadrome",
            streamingAssetsUrl: "StreamingAssets",
            icon: "icon.png"
        };

        (function loadGame() {
            document.getElementById("page-title").textContent = GAME_CONFIG.productName;
            GameLoader.init(GAME_CONFIG);
            const loaderScript = document.createElement("script");
            loaderScript.src = GAME_CONFIG.loaderUrl;
            
            loaderScript.onload = function() {
                createUnityInstance(
                    document.getElementById("canvas"),
                    GAME_CONFIG,
                    GameLoader.updateProgress
                )
                .then(function(unityInstance) {
                    window.gameInstance = unityInstance;
                    console.log("Game loaded successfully");
                })
                .catch(function(error) {
                    console.error("Failed to load game:", error);
                    if (GameLoader.ui.comment) {
                        GameLoader.ui.comment.textContent = "Failed to load game";
                    }
                });
            };
            
            loaderScript.onerror = function() {
                console.error("Failed to load loader script");
                if (GameLoader.ui.comment) {
                    GameLoader.ui.comment.textContent = "Failed to load game";
                }
            };
            
            document.body.appendChild(loaderScript);
        })();
    </script>
</body>
</html>
