<!DOCTYPE html>
<html lang="en-us">

<head>
    <script src="/assets/js/loader-ui.js?v=4pgt4ltcze"></script>
    <script src="/assets/js/game-loader.js?v=4pgt4ltcze" data-title="Cuphead"></script>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #231F20;
        }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
</head>

<body>
    <div id="unityContainer"></div>
    <script>
        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        function resizeUnityContainer() {
            var container = document.getElementById("unityContainer");
            var canvas = container.querySelector("canvas");

            container.style.width = window.innerWidth + "px";
            container.style.height = window.innerHeight + "px";

            if (canvas) {
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
        }


        (async () => {
            GameLoader.expect(2101.31 * 1048576);

            const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
                GameLoader.merge(getParts("Build/CupheadPort.data.unityweb", 1, 103)),
                GameLoader.merge(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2)),
                GameLoader.merge(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3)),
            ]);

            // The build config names whole files; hand Unity the merged parts.
            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url, ...rest) {
                url = String(url);
                if (url.includes("CupheadPort.data.unityweb")) url = dataUrl;
                else if (url.includes("CupheadPort.wasm.code.unityweb")) url = wasmUrl;
                else if (url.includes("CupheadPort.asm.code.unityweb")) url = asmUrl;
                return originalOpen.call(this, method, url, ...rest);
            };
            window.addEventListener("resize", resizeUnityContainer);

            UnityLoader.instantiate("unityContainer", "Build/CupheadPort.json", {
                Module: {
                    onRuntimeInitialized: function () {
                        resizeUnityContainer();
                        GameLoader.finish();
                    },
                },
            });
        })().catch(GameLoader.fail);
    </script>
</body>

</html>
