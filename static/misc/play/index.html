<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <script src="/assets/js/font.js"></script>
    <meta name="google" content="notranslate" />
    <script>
        (function applySavedTheme() {
            var allowedThemes = ["blue", "legacy", "midnight", "forest", "sunset", "contrast"];
            var savedTheme = localStorage.getItem("siteTheme") || "legacy";
            var theme = savedTheme === "classic" ? "legacy" : savedTheme;
            document.documentElement.dataset.theme = allowedThemes.includes(theme) ? theme : "legacy";
        })();
    </script>
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css?v=5" />
    <link rel="stylesheet" href="/assets/css/nav.css?v=5" />
    <title>Google</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rednotsus" />
    <meta http-equiv="Cache-control" content="public">
    <meta charset="utf-8">

    <link rel="stylesheet" href="/assets/css/gameframe.css?v=13" />
    <script src="/assets/js/script.js?v=28"></script>

    <script src="/assets/js/cloud-saves.js?v=4"></script>
</head>

<body>
    <nav>
        <div class="navbar">
            <a id="nav-title" href="/">Reds Exploit Corner</a>
            <a href="/g"><i class="fa-solid fa-gamepad">&nbsp;</i>Games</a>
            <a href="/a"><i class="fa-solid fa-box-archive">&nbsp;</i>Apps</a>
            <a href="/-"><i class="fa-solid fa-tv">&nbsp;</i>Media</a>
            <a href="/s"><i class="fa-solid fa-gears">&nbsp;</i>Settings</a>
            <a href="/chat"><i class="fa-solid fa-comments">&nbsp;</i></a>
            <a href="/profile"><i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <div class="game-page" id="gamepage">
    <div id="gameframe">
        <div class="gameDisplay">
            <div class="game">
                <iframe id="iframe" src="/l"></iframe>
            </div>
            <div class="options">
                <div class="left">
                    <div class="gametext">
                        <img class="gameicon" />
                        <div class="margin">
                            <div class="flex">
                                <h1 class="titletext">&nbsp;</h1>
                            </div>
                            <span class="bytext">By </span>
                        </div>
                    </div>
                </div>
                <div class="right">
                    <i class="fa-solid fa-rotate-right reloadbtn" id="reloadbtn"></i>
                    <i class="fa-solid fa-expand fullscreenbtn" onclick="fullscreen();"></i>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script>
        // Runs before DOMContentLoaded so script.js reads the real title.
        (function () {
            const urlParams = new URLSearchParams(window.location.search);

            const title = urlParams.get('title') || 'No title provided';
            const author = urlParams.get('author') || 'Author';
            // `link` is a game folder (`2048`) or a path under /misc/
            // (`papas/papas-burgeria`, `flash/index.html?swf=hobo.swf`).
            // A path whose last part has no extension opens its index.html.
            const link = (urlParams.get('link') || '').replace(/^\/+|\/+$/g, '');
            const [linkPath, linkQuery] = link.split(/\?(.*)/s);
            const lastPart = linkPath.split('/').pop();
            const frame = new URL(
                `/misc/${linkPath}${lastPart.includes('.') ? '' : '/index.html'}${linkQuery ? '?' + linkQuery : ''}`,
                location.origin,
            );
            const folder = linkPath.split('/')[0];

            const titleElement = document.querySelector('.titletext');
            const byTextElement = document.querySelector('.bytext');
            const iframeElement = document.getElementById('iframe');
            const gameIconElement = document.querySelector('.gameicon');

            titleElement.textContent = title;
            byTextElement.textContent = 'By ' + author;
            // game-page.js shows the game's cover from the catalogue, or this.
            gameIconElement.dataset.fallback = `https://cdn.jsdelivr.net/gh/55gms/assets@8c89e0016e7d61f82bc2674662454c8c72d9cf6b/misc/${encodeURIComponent(folder)}/img.webp`;
            gameIconElement.alt = title;

            // Only game documents: nothing outside /misc/, and not this page.
            if (
                !linkPath ||
                frame.origin !== location.origin ||
                !frame.pathname.startsWith('/misc/') ||
                frame.pathname.startsWith('/misc/play/')
            ) return;
            iframeElement.dataset.src = frame.pathname + frame.search;
            if (window.GMSSaves) GMSSaves.launch(iframeElement);
            else iframeElement.src = iframeElement.dataset.src;
        })();
    </script>
    </div>
    <script>
        var elem = document.getElementById("iframe");

        function fullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else {
                location.href = elem.src;
            }
        }
        function reload() {
            document.getElementById("iframe").src += "";
        }
        reloadbtn.onclick = reload;
    </script>

    <script src="/assets/js/game-page.js?v=13"></script>
    <script src="/assets/js/hover-preview.js?v=1" defer></script>
</body>

</html>
