            document.documentElement.dataset.theme = allowedThemes.includes(theme) ? theme : "legacy";

    <script>
        // One page for every game: /misc/play/?g=<id> looks the game up in the
        // catalog (assets/json/load/g.json) by its "id".
        (async function loadGame() {
            const params = new URLSearchParams(location.search);
            const iframe = document.getElementById('iframe');
            const icon = document.querySelector('.gameicon');
            const titleText = document.querySelector('.titletext');
            const byText = document.querySelector('.bytext');

            let game = null;
            const id = params.get('g');
            if (id) {
                try {
                    const response = await fetch('/assets/json/load/g.json');
                    const games = await response.json();
                    game = games.find((entry) => entry.id === id) || null;
                } catch (error) {
                    console.error('Could not load the game catalog:', error);
                }
            } else if (params.get('link')) {
                // Older links: ?title=…&author=…&link=<folder under /misc/>
                const folder = encodeURIComponent(params.get('link').replace(/^\/+|\/+$/g, ''));
                game = {
                    name: params.get('title') || '',
                    author: params.get('author') || '',
                    image: `/misc/${folder}/img.webp`,
                    frame: `/misc/${folder}/index.html`,
                };
            }

            if (!game) {
                titleText.textContent = 'Game not found';
                byText.innerHTML = '<a href="/g">Back to games</a>';
                icon.hidden = true;
                iframe.src = 'about:blank';
                return;
            }

            titleText.textContent = game.name;
            byText.textContent = game.author ? 'By ' + game.author : '';
            icon.src = game.image;
            icon.alt = game.name;
            if (game.sandbox) iframe.setAttribute('sandbox', game.sandbox);
            iframe.src = game.frame || game.url;
            if (game.fullscreenOpensGame) {
                document.querySelector('.fullscreenbtn').onclick = () => {
                    location.href = iframe.src;
                };
            }
        })();
    </script>

    <script>
        var elem = document.getElementById("iframe");

        function fullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else {
                location.href = elem.src;
            }
        }
        function reload() {
            document.getElementById("iframe").src += "";
        }
        reloadbtn.onclick = reload;
    </script>
