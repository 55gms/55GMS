        function FullAdShow() {
    try {
        // Prevent multiple fullscreen ads from opening simultaneously
        if (!nowFullAdOpen) {
            nowFullAdOpen = true;

            // If the game is initialized, notify Unity to open the fullscreen ad

}


function RewardedShow(rewardId) {
    try {
        // Notify Unity to open the rewarded video with the given reward ID
        myGameInstance.SendMessage("YandexGame", "RewardVideo", rewardId);

        // After the ad, close it and refocus the game

        function ConsumePurchases() { console.warn("ConsumePurchases is not implemented"); } //

        //
        try {
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = async () => {
                // Bölünen part'ları yükle ve birleştir (toplam 3 part varsayılarak, PowerShell çıktısına göre ayarlayın)
                const partCount = 3; // PowerShell'den hesaplanan parça sayısını buraya yazın
                const parts = [];
                for (let i = 1; i <= partCount; i++) {
                    const partUrl = buildUrl + `/OSP.data_part${i}.unityweb`;
                    try {
                        const response = await fetch(partUrl);
                        if (!response.ok) {
                            throw new Error(`Part ${i} yüklenemedi: ${response.statusText}`);
                        }
                        const arrayBuffer = await response.arrayBuffer();
                        parts.push(arrayBuffer);
                        console.log(`Part ${i} yüklendi: ${arrayBuffer.byteLength} byte`);
                    } catch (error) {
                        console.error(error);
                        alert(`Hata: ${error.message}`);
                        return;
                    }
                }

                // ArrayBuffer'ları birleştir
                let totalLength = 0;
                for (let ab of parts) {
                    totalLength += ab.byteLength;
                }
                const merged = new Uint8Array(totalLength);
                let offset = 0;
                for (let ab of parts) {
                    merged.set(new Uint8Array(ab), offset);
                    offset += ab.byteLength;
                }

                // Blob oluştur ve URL üret
                const blob = new Blob([merged], { type: 'application/octet-stream' });
                const dataUrl = URL.createObjectURL(blob);
                config.dataUrl = dataUrl;

                console.log(`Birleştirme tamamlandı. Toplam boyut: ${totalLength} byte`);

                StartUnityInstance = function () {
                    createUnityInstance(canvas, config, (progress) => {
                        spinner.style.display = "none";
                        progressBarEmpty.style.display = "";
                        progressBarFull.style.width = `${100 * progress}%`;
                    }).then((unityInstance) => {
                        myGameInstance = unityInstance;
                        loadingCover.style.display = "none";
                    }).catch((message) => {
                        console.error("Unity yükleme hatası:", message);
                    });
                };
                StartUnityInstance();
            };
            document.body.appendChild(script);
        } catch (error) {
            console.error("Başlatma sırasında hata:", error);

            } catch (error) {
                console.error("InitGame sırasında hata:", error);
            }
        }

            console.warn("Hata es geçildi:", event.reason);
            event.preventDefault();
