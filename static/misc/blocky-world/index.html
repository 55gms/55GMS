async function downloadAndMergeParts(fileName, partCount) {
    var parts = [], totalLoaded = 0;
    for (var i = 0; i < partCount; i++) {
        var resp = await fetch("/misc/blocky-world/_ext/cdn.jsdelivr.net/gh/schoolflashx/99o999%40main/Build/parts/" + fileName + ".part" + i);
        if (!resp.ok) throw new Error("Part hata: " + fileName + ".part" + i + " (" + resp.status + ")");
        var ab = await resp.arrayBuffer();
        parts.push(new Uint8Array(ab));
        totalLoaded += ab.byteLength;
        console.log("  [" + fileName + "] Part " + (i+1) + "/" + partCount + " (" + (totalLoaded/1048576).toFixed(1) + " MB)");
    }
    var totalSize = parts.reduce(function(s,p){ return s+p.length; }, 0);
    var merged = new Uint8Array(totalSize);
    var offset = 0;
    for (var j = 0; j < parts.length; j++) { merged.set(parts[j], offset); offset += parts[j].length; }
    console.log("%c[Merger] " + fileName + ": " + (totalSize/1048576).toFixed(1) + " MB OK", "color:#73FF73;background:#454545");
    return merged.buffer;
}

    if (!ysdk) return;
    var jsonEntries = { technoName:'', isDefault:false, isInvertSortOrder:false, decimalOffset:0, type:'' };
    ysdk.leaderboards.getDescription(nameLB).then(res => {
        jsonEntries.technoName = nameLB;
        jsonEntries.isDefault = res.default;
        jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
        jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
        jsonEntries.type = res.description.type;
        return ysdk.leaderboards.getEntries(nameLB, { quantityTop:quantityTop, includeUser:auth, quantityAround:quantityAround });
    }).then(res => {
        let combinedJson = { ...jsonEntries, ...EntriesLB(res, photoSize) };
        YG2Instance('LeaderboardEntries', JSON.stringify(combinedJson));
    }).catch(err => { console.error(err); });
}

function EntriesLB(res, photoSize) {
    let text='', c=res.entries.length;
    let ranks=new Array(c),photos=new Array(c),names=new Array(c),scores=new Array(c),uids=new Array(c),extra=new Array(c);
    for(var i=0;i<c;i++){
        ranks[i]=res.entries[i].rank;scores[i]=res.entries[i].score;
        uids[i]=res.entries[i].player.uniqueID;photos[i]=res.entries[i].player.getAvatarSrc(photoSize);
        extra[i]=(res.entries[i].extraData===""||res.entries[i].extraData==null)?NO_DATA:res.entries[i].extraData;
        names[i]=res.entries[i].player.scopePermissions.public_name!=="allow"?"anonymous":res.entries[i].player.publicName;
        text+=ranks[i]+'. '+names[i]+": "+scores[i]+'\n';
    }
    if(c===0)text='no data';
    return{"entries":text,"ranks":ranks,"photos":photos,"names":names,"scores":scores,"uniqueIDs":uids,"extraDataArray":extra};
}

var gameLabelData = 'false';

function InitGameLabel() {
    return new Promise((resolve) => {
        if (ysdk == null) { resolve('false'); return; }
        try {
            ysdk.shortcut.canShowPrompt().then(prompt => {
                if (prompt.canShow) { gameLabelData = 'true'; resolve('true'); }
                else resolve('false');
            });
        } catch (e) { resolve('false'); }
    });
}

function GameLabelShowDialog() {
    try {
        ysdk.shortcut.showPrompt().then(result => {
            if (result.outcome === 'accepted') YG2Instance('OnGameLabelSuccess');
            else YG2Instance('OnGameLabelFail');
            FocusGame();
        });
    } catch (e) { FocusGame(); }
}

// ================================================================
// FLAGS
// ================================================================
let flasgsData = NO_DATA;

function GetFlags() {
    return new Promise((resolve) => {
        if (ysdk == null) { Final(NO_DATA); return; }
        try {
            ysdk.getFlags().then(flags => {
                let names = [], values = [];
                for (let key in flags) { if (flags.hasOwnProperty(key)) { names.push(key); values.push(flags[key]); } }
                Final(JSON.stringify({ "names": names, "values": values }));
            });
        } catch (e) { Final(NO_DATA); }
        function Final(res) { flasgsData = res; resolve(res); }
    });
}

// ================================================================
// ENVIRONMENT DATA
// ================================================================
var environmentData = NO_DATA;

function RequestingEnvironmentData() {
    return new Promise((resolve) => {
        if (ysdk == null) { Final(NO_DATA); return; }
        try {
            var browser = navigator.userAgent;
            if (browser.includes('Chrome')) browser='Chrome';
            else if (browser.includes('Firefox')) browser='Firefox';
            else if (browser.includes('Safari')) browser='Safari';
            else if (browser.includes('Edge')) browser='Edge';
            else browser='Other';

            let jsonEnvir = {
                "language":ysdk.environment.i18n.lang,"domain":ysdk.environment.i18n.tld,
                "deviceType":ysdk.deviceInfo.type,"isMobile":ysdk.deviceInfo.isMobile(),
                "isDesktop":ysdk.deviceInfo.isDesktop(),"isTablet":ysdk.deviceInfo.isTablet(),
                "isTV":ysdk.deviceInfo.isTV(),"appID":ysdk.environment.app.id,
                "browserLang":ysdk.environment.browser.lang,"payload":ysdk.environment.payload,
                "platform":navigator.platform,"browser":browser
            };
            Final(JSON.stringify(jsonEnvir));
        } catch (e) { Final(NO_DATA); }
        function Final(res) { environmentData = res; YG2Instance('SetEnvirData', res); resolve(res); }
    });
}

// ================================================================
// PLAYER / AUTH
// ================================================================
var playerData = NO_DATA;
let player = null;

async function InitPlayer() {
    return new Promise(async (resolve) => {
        try {
            if (!ysdk) return Final(NotAuthorized(false));
            player = await ysdk.getPlayer();
            if (!player.isAuthorized()) return Final(NotAuthorized());
            const authJson = {
                "playerAuth":"resolved","playerName":player.getName(),
                "playerId":player.getUniqueID(),"playerPhoto":player.getPhoto('medium'),
                "payingStatus":player.getPayingStatus()
            };
            return Final(JSON.stringify(authJson));
        } catch (e) { return Final(NotAuthorized(false)); }
        function Final(res) { playerData = res; YG2Instance('SetAuth', res); resolve(res); }
    });
}

function NotAuthorized(isInitSDK) {
    if (isInitSDK === undefined) isInitSDK = true;
    return JSON.stringify({
        "playerAuth":"rejected","playerName":"unauthorized",
        "playerId": (isInitSDK && player && player.getUniqueID) ? player.getUniqueID() : "unauthorized",
        "playerPhoto":"no data","payingStatus":"unknown"
    });
}

function OpenAuthDialog() {
    if (ysdk !== null) {
        try {
            ysdk.auth.openAuthDialog().then(() => {
                InitPlayer().then(() => { YG2Instance('LoggedIn'); });
            });
        } catch (e) {}
    }
}
