<script>
/* ================================================================
   CDN — değiştir
   ================================================================ */
var CDN      = "/misc/drift-hunters-26/_ext/cdn.jsdelivr.net/gh/netclassroom/pdf%40main/Build";  /* <-- degistir */
var DATA_FILE = "303773a367cad857a889b5941688b932.data.br";
var WASM_FILE = "8adf153fd5f023b1e26694d1c6c22d2c.wasm.br";
var DATA_PARTS = 7;  /* 53.1MB / 8MB = 7 part */
var WASM_PARTS = 5;  /* 37.0MB / 8MB = 5 part */

var sources           = {};
var sourcesPlayOneShot= {};
var sdk;
var MyGameInstance    = null;
var _dataBlobUrl      = null;
var _wasmBlobUrl      = null;
var _partsReady       = false;

var loadingBar    = document.querySelector("#unity-loading-bar");
var progressFull  = document.querySelector("#unity-progress-bar-full");
var dlStatus      = document.querySelector("#dl-status");

loadingBar.style.display = "block";

/* DATA 0-50%, WASM 50-90%, Unity 90-100% */
function setBar(pct, label) {
  progressFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || '';
}

async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts = [];
  for (var i = 0; i < partCount; i++) {
    setBar(barStart + (i/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+(i/partCount)*(barEnd-barStart))+'%)');
    var r = await fetch(baseUrl + '.part' + i);
    if (!r.ok) throw new Error(label+'part'+i+' HTTP '+r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(barStart+((i+1)/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+((i+1)/partCount)*(barEnd-barStart))+'%)');
  }
  var total = parts.reduce(function(s,p){return s+p.length;},0);
  var merged = new Uint8Array(total); var off=0;
  for(var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  return merged;
}
function brotliBlobUrl(uint8, filename){
  var blob = new Blob([uint8],{type:'application/octet-stream'});
  return URL.createObjectURL(blob)+'#'+encodeURIComponent(filename);
}

/* Part'ları önceden indir */
async function preloadParts() {
  try {
    setBar(0,'Data indiriliyor...');
    var dataBytes = await fetchParts(CDN+'/'+DATA_FILE, DATA_PARTS, 0,  50, 'Data indiriliyor... ');
    _dataBlobUrl  = brotliBlobUrl(dataBytes, DATA_FILE);

    var wasmBytes = await fetchParts(CDN+'/'+WASM_FILE, WASM_PARTS, 50, 90, 'WASM indiriliyor... ');
    _wasmBlobUrl  = brotliBlobUrl(wasmBytes, WASM_FILE);

    setBar(90, 'Oyun başlatılıyor...');
    _partsReady = true;
    console.log('[Drift] Parts ready, waiting for ad close...');
  } catch(e) {
    dlStatus.textContent = 'İndirme hatası: ' + e.message;
    console.error(e);
  }
}

/* SDK init + reklam — reklam kapanınca Unity başlar */
YaGames.init().then(function(ysdk) {
  console.log('Yandex SDK initialized');
  window.ysdk = ysdk;
  sdk = ysdk;

  sdk.adv.showFullscreenAdv({callbacks:{
    onClose:   function(){ closeAdFunction(); },
    onError:   function(){ closeAdFunction(); },
    onOffline: function(){ closeAdFunction(); }
  }});
});

/* Paralel: SDK init + reklam + part indirme aynı anda */
preloadParts();

function closeAdFunction() {
  console.log('[Drift] Ad closed');
  if (_partsReady) {
    initializeUnity();
  } else {
    /* Parts henüz bitmemiş, bitince Unity başlatılacak */
    var iv = setInterval(function(){
      if (_partsReady) { clearInterval(iv); initializeUnity(); }
    }, 200);
  }
}

function initializeUnity() {
  var container     = document.querySelector("#unity-container");
  var canvas        = document.querySelector("#unity-canvas");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function upd(){ warningBanner.style.display = warningBanner.children.length?'block':'none'; }
    var div=document.createElement('div'); div.innerHTML=msg; warningBanner.appendChild(div);
    if(type==='error') div.style='background:red;padding:10px;';
    else { if(type==='warning') div.style='background:yellow;padding:10px;';
      setTimeout(function(){ warningBanner.removeChild(div); upd(); },5000); }
    upd();
  }

  var config = {
    dataUrl:            _dataBlobUrl,
    frameworkUrl:       CDN + "/2fb08521b297a16e9d5ff3bb0f8e317c.js",
    codeUrl:            _wasmBlobUrl,
    streamingAssetsUrl: "StreamingAssets",
    companyName:        "Drift No Limit",
    productName:        "Drift No Limit",
    productVersion:     "90",
    showBanner:         unityShowBanner
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta=document.createElement('meta');
    meta.name='viewport';
    meta.content='width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    container.className="unity-mobile";
  }
  canvas.style.width="100%"; canvas.style.height="100%";

  var script=document.createElement("script");
  script.src=CDN+"/_YandexGames.loader.js";
  script.onload=function(){
    createUnityInstance(canvas, config, function(progress){
      setBar(90+progress*10, progress<1?'Oyun yükleniyor... '+Math.round(90+progress*10)+'%':'');
    }).then(function(inst){
      MyGameInstance = inst;
      loadingBar.style.display = "none";
    }).catch(function(msg){ alert(msg); });
  };
  document.body.appendChild(script);
}
</script>
