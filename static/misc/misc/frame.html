<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link id="favicon" rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <script>
      (function applySavedTheme() {
        var allowedThemes = [
          "blue",
          "legacy",
          "midnight",
          "forest",
          "sunset",
          "contrast",
        ];
        var savedTheme = localStorage.getItem("siteTheme") || "blue";
        var theme = savedTheme === "classic" ? "legacy" : savedTheme;
        document.documentElement.dataset.theme = allowedThemes.includes(theme)
          ? theme
          : "blue";
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/style.css?v=6" />
    <link rel="stylesheet" href="css.css?v=2" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="stylesheet" href="/assets/css/ui.css?v=1" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to game</a>
    <main id="main-content" class="embed-container" tabindex="-1">
      <div id="overlay">
        <img
          src="/img/no.webp"
          id="imageplay"
          alt=""
          width="320"
          height="320"
        />
        <div class="overlay-content">
          <h1 class="game-title">Loading game…</h1>
          <button id="play-btn" type="button">Play Now!</button>
        </div>
      </div>
      <iframe
        id="embed-frame"
        title="Game content"
        allowfullscreen
        src=""
      ></iframe>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const iframeElement = document.getElementById("embed-frame");
        const titleElement = document.querySelector(".game-title");
        const imgElement = document.getElementById("imageplay");

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        const title = urlParams.get("title") || "Title Not Set";
        window.gameLink = (urlParams.get("link") || "").replace(
          /^\/+|\/+$/g,
          "",
        );
        const link = window.gameLink;
        titleElement.textContent = title;
        imgElement.src = link
          ? `/misc/${encodeURIComponent(link)}/img.webp`
          : "/img/no.webp";
      });

      document
        .getElementById("play-btn")
        .addEventListener("click", function () {
          const iframe = document.getElementById("embed-frame");
          iframe.src = `/misc/${encodeURIComponent(window.gameLink)}/index.html`;
          iframe.focus();
          document.getElementById("overlay").style.display = "none";
        });
    </script>
  </body>
</html>
