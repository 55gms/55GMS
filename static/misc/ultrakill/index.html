<!DOCTYPE html>
<html lang="en-us">

<head>
    <script src="/assets/js/loader-ui.js?v=e39jq3w37n"></script>
    <script src="/assets/js/game-loader.js?v=e39jq3w37n" data-title="Ultrakill"></script>
    <base href="https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@main/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
        }

        body {
            background: #231F20;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        .webgl-content {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .fullscreen {
            cursor: pointer;
            display: inline-block;
            width: 24px;
            height: 24px;
            background: url('TemplateData/fullscreen.png') no-repeat center;
        }

    </style>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        function resizeCanvas() {
            var canvas = document.getElementById("unity-canvas");
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        (async () => {
            const dataPartsFiles = getParts("Build/ultrakill.data.unityweb", 1, 4);
            const wasmPartsFiles = getParts("Build/ultrakill.wasm.unityweb", 1, 2);
            const allParts = [...dataPartsFiles, ...wasmPartsFiles];

            await GameLoader.measure(allParts);

            // Start merging files with progress
            const [dataUrl, wasmUrl] = await Promise.all([
                GameLoader.merge(dataPartsFiles),
                GameLoader.merge(wasmPartsFiles)
            ]);

            var canvas = document.querySelector("#unity-canvas");

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                canvas.style.width = "100%";
                canvas.style.height = "100%";
                canvas.style.position = "fixed";
            }

            canvas.hidden = false;
            window.addEventListener('resize', resizeCanvas);

            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
            }).then((e) => {
                resizeCanvas();
                GameLoader.finish();
            }).catch(GameLoader.fail);
        })().catch(GameLoader.fail);
    </script>
</head>

<body>
    <div class="webgl-content">
        <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    </div>
</body>

</html>
