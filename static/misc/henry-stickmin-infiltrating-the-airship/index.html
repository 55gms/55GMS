<html>
    <head>
<script src="/assets/js/game-parts.js?v=1"></script>
<base href="https://cdn.jsdelivr.net/gh/55gms/assets@main/misc/henry-stickmin-infiltrating-the-airship/">
<script>
  GameParts.serve({
    "infiltratingtheairship.swf": ["infiltratingtheairship.swf.part1","infiltratingtheairship.swf.part2","infiltratingtheairship.swf.part3"],
  });
</script>


      <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infiltrating the Airship | </title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="lib/ruffle/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load(new URL("infiltratingtheairship.swf", document.baseURI).href);
      });
    </script>
  </body>
</html>
