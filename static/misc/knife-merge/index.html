		padding-top: 0;

	.loading-percent {

		color: #185da1;
		font: 600 14px/18px Arial, sans-serif;
		text-align: center;
		font-variant-numeric: tabular-nums;
	}

	.loading-progress-track {
		display: grid;
		grid-template-columns: repeat(25, minmax(0, 1fr));
		gap: clamp(2px, 0.45vw, 4px);
		width: 100%;
	}

	.loading-progress-segment {
		box-sizing: border-box;
		height: 8px;
		border-radius: 3px;
		background: #e3edf7;
		transition: background-color 120ms linear, border-color 120ms linear;
	}

	.loading-progress-segment.is-filled {

		background: #185da1;
	}

	.loading-label {
		width: min(100%, 260px);
		margin-top: 12px;

  <script id="web-helpers" type="text/javascript">
	function addJavaScript(src, type) {
		return new Promise(function(resolve, reject) {
			var script = document.createElement("script");
			script.src = src;
			if (type) {
				script.type = type;
			}
			script.addEventListener("load", resolve);
			script.addEventListener("error", reject);
			document.head.appendChild(script);
		});
	}

	function Timer(seconds) {
		var self = this;
		self.seconds = seconds;
		self.isCompleted = false;
		self._timer = setInterval(function() {
			self.seconds -= 1;
			if (self.seconds <= 0) {
				self.seconds = 0;
				self.isCompleted = true;
				clearInterval(self._timer);
			}
		}, 1000);
	}

	function isMobileDevice() {
		return (typeof window.orientation !== "undefined") || /Android|iPhone|iPad|iPod|Mobile|IEMobile/i.test(navigator.userAgent);
	}

	var isMobile = {
		Android: function() { return /Android/i.test(navigator.userAgent); },
		BlackBerry: function() { return /BlackBerry/i.test(navigator.userAgent); },
		iOS: function() { return /iPhone|iPad|iPod/i.test(navigator.userAgent); },
		Opera: function() { return /Opera Mini/i.test(navigator.userAgent); },
		Windows: function() { return /IEMobile/i.test(navigator.userAgent); },
		Kindle: function() { return /Silk/i.test(navigator.userAgent); },
		any: function() {
			return isMobile.Kindle() || isMobile.Android() || isMobile.BlackBerry() || isMobile.iOS() || isMobile.Opera() || isMobile.Windows();
		}
	};
	</script>

  <script id="loading-ui" type="text/javascript">
	(function() {
		var screen = document.getElementById("myprogress");
		var progress = document.getElementById("loading-progress");
		var percent_label = document.getElementById("loading-percent");
		var label = document.getElementById("loading-label");
		var segments = document.querySelectorAll(".loading-progress-segment");
		var recovery = document.getElementById("loading-recovery");
		var canvas = document.getElementById("canvas");
		var failed = false;
		var percent = 0;

		function show_error(title, message) {
			failed = true;
			screen.hidden = false;
			progress.hidden = true;
			label.hidden = true;
			recovery.hidden = false;
			canvas.inert = true;
			document.getElementById("loading-error-title").textContent = title;
			document.getElementById("loading-error-message").textContent = message;
		}

		Progress.addListener(function(value) {
			if (failed || typeof value !== "number" || !isFinite(value)) return;
			// Download completion is not engine readiness. Keep the screen until main starts.
			percent = Math.max(percent, Math.min(99, Math.max(0, Math.floor(value))));
			percent_label.textContent = percent + "%";
			label.textContent = percent >= 90 ? "STARTING..." : "LOADING...";
			progress.style.setProperty("--loading-progress", percent + "%");
			progress.setAttribute("aria-valuenow", String(percent));
			for (var i = 0; i < segments.length; i++) {
				segments[i].classList.toggle("is-filled", i < Math.floor(percent * segments.length / 100));
			}
		});

		var previous_start_success = CUSTOM_PARAMETERS.start_success;
		CUSTOM_PARAMETERS.start_success = function() {
			// start_success runs before main; allow synchronous graphics errors to surface.
			setTimeout(function() {
				if (!failed) screen.hidden = true;
			}, 0);
			previous_start_success.apply(this, arguments);
		};
		var previous_start_error = CUSTOM_PARAMETERS.start_error;
		CUSTOM_PARAMETERS.start_error = function(error) {
			show_error("Let's try again", "Loading was interrupted. Reload the game to continue.");
			previous_start_error.apply(this, arguments);
		};
		CUSTOM_PARAMETERS.unsupported_webgl_callback = function() {
			show_error("Graphics unavailable", "Your browser couldn't start the game. Try reloading or restarting your browser.");
		};
		canvas.addEventListener("webglcontextlost", function(event) {
			event.preventDefault();
			show_error("Game interrupted", "The game's graphics were interrupted. Reload the game to continue.");
			console.warn("[Knife Merge] Graphics context lost; waiting for player to reload.");
		});
		// Restoring a WebGL context does not recreate Defold's graphics resources.
		// Keep recovery visible until the player explicitly reloads, avoiding reload loops.
		document.getElementById("loading-retry").addEventListener("click", function() {
			window.location.reload();
		});
	}());
	</script>

  <script id="engine-setup" type="text/javascript">
	var extra_params = {
		archive_location_filter: function( path ) {
			return ("archive" + path + "");
		},
		engine_arguments: ["--verify-graphics-calls=false",],
		custom_heap_size: 134217728,
		full_screen_container: "#canvas-container",
		disable_context_menu: true
	}

	Module['onRuntimeInitialized'] = function() {
		Module.runApp("canvas", extra_params);
	};

	Module["locateFile"] = function(path, scriptDirectory)
	{
		// dmengine*.wasm is hardcoded in the built JS loader for WASM,
		// we need to replace it here with the correct project name.
		if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") {
			path = "Knifemerge.wasm";
		}
		return scriptDirectory + path;
	};

	var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
	var buttonHeight = 0;


	// Resize on init, screen resize and orientation change
	function resize_game_canvas() {
		// Hack for iOS when exit from Fullscreen mode
		if (is_iOS) {
			window.scrollTo(0, 0);
		}

		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight - buttonHeight;
		if (innerWidth <= 0 || innerHeight <= 0) return;
		var width = 700;
		var height = 1100;
		var targetRatio = width / height;
		var actualRatio = innerWidth / innerHeight;
	
	
		//Stretch
		width = innerWidth;
		height = innerHeight;
	
	
	
		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		// Use one resize owner, with a bounded high-DPI buffer on large/mobile screens.
		var dpi = 1;
	
		dpi = Math.min(window.devicePixelRatio || 1, 2);
	
		var buffer_scale = Math.min(dpi, Math.sqrt(2073600 / (width * height)));
		var buffer_width = Math.max(1, Math.floor(width * buffer_scale));
		var buffer_height = Math.max(1, Math.floor(height * buffer_scale));
		if (game_canvas.width !== buffer_width) game_canvas.width = buffer_width;
		if (game_canvas.height !== buffer_height) game_canvas.height = buffer_height;
	}
	resize_game_canvas();
	CUSTOM_PARAMETERS.resize_window_callback = resize_game_canvas;
	</script>

  <script id="poki-sdk-setup" type="text/javascript">
		var isWasmLoaded = false;
		var isPokiSDKInited = false;
		var runFunc = function() {
			if (isPokiSDKInited && isWasmLoaded) {
				Module.runApp("canvas");
			}
		}
		Module['onRuntimeInitialized'] = function() {
			isWasmLoaded = true;
			runFunc();
		};
		function poki_sdk_loaded() {
			var data = {};
			var isLoadFinished = false;
			Progress.addListener(function(percentage){
				data.percentageDone = percentage / 100;
				if (!isLoadFinished)
					PokiSDK.gameLoadingProgress(data);
				if (percentage == 100 && !isLoadFinished) {
					PokiSDK.gameLoadingFinished();
					isLoadFinished = true;
				}
			});
			PokiSDK.init().then(()=>{
					isPokiSDKInited = true;
					runFunc();
				}, ()=>{
					isPokiSDKInited = true;
					runFunc();
				});
		}
	</script>
