    _syncBackgroundMusicEditMode(isEditMode) {
        const inEdit = !!isEditMode;
        if (inEdit) {
            if (this._backgroundMusicPausedByEditMode) return;
            this._backgroundMusicPausedByEditMode = true;
            if (this._usesBackgroundMusicFile()) {
                this._pauseBackgroundMusicFile(false);
            } else if (RCHIPL.Sampler?.stopComposition) {
                RCHIPL.Sampler.stopComposition();
                this._backgroundMusicStarted = false;
                this._backgroundMusicStartPromise = null;
            }
            return;
        }

        if (!this._backgroundMusicPausedByEditMode) return;
        this._backgroundMusicPausedByEditMode = false;
        this._ensureBackgroundMusic(this._getBackgroundMusicTargetForState(), 120);
    },

    _isUiInteractionLocked() {
        if (RCHIPL.Editor?.isEditMode?.()) return false;
        if (RCHIPL.Layouts?._transitioning) return true;
        if (this._restartInFlight || this._skipLevelInFlight) return true;
        if (this._skipRewardModal?.rewardInFlight) return true;
        if (this._worldMapAutoLaunchInFlight) return true;
        return false;
    },

    _isSkipRewardModalInteractive() {
        const modal = this._skipRewardModal;
        if (!modal?.active) return false;
        if (modal.phase !== 'open') return false;
        if (modal.rewardInFlight) return false;
        if (this._isUiInteractionLocked()) return false;
        return true;
    },

    _resetSkipRewardHoverState(obj) {
        if (!obj) return;
        obj._skipRewardHoverState = 0;
        obj._skipRewardHoverTime = 0;
    },

    _getSkipRewardHoverScale(obj) {
        const hover = Math.max(0, Math.min(1, Number(obj?._skipRewardHoverState) || 0));
        if (hover <= 0) return 1;
        const t = Number(obj?._skipRewardHoverTime) || 0;
        const pulse = 1 + Math.sin(t * 18) * 0.04 * hover;
        return (1 + 0.08 * hover) * pulse;
    },

    _getSkipRewardHoverRotation(obj) {
        const hover = Math.max(0, Math.min(1, Number(obj?._skipRewardHoverState) || 0));
        if (hover <= 0) return 0;
        const t = Number(obj?._skipRewardHoverTime) || 0;
        return Math.sin(t * 18) * 4 * hover;
    },

    _updateSkipRewardModalHover(dt) {
        const modal = this._skipRewardModal;
        const buttons = [this._skipRewardValidateObj, this._skipRewardCloseObj];
        if (!buttons.some(Boolean)) return false;

        if (!modal?.active || !this._isSkipRewardModalInteractive()) {
            buttons.forEach(btn => this._resetSkipRewardHoverState(btn));
            return false;
        }

        const I = RCHIPL.Input;
        const S = RCHIPL.Screen;
        if (!S) return false;
        const pointerX = (I.rawX - (S.offsetX || 0)) / (S.scale || 1);
        const pointerY = (I.rawY - (S.offsetY || 0)) / (S.scale || 1);
        const closeProps = this._getSkipRewardCloseProps();
        const closeHitPadding = Math.max(0, this._uiNum(closeProps.hitPaddingPx, 18));
        let changed = false;

        for (const btn of buttons) {
            if (!btn) continue;
            const hoverScale = this._getSkipRewardHoverScale(btn);
            const hovered = modal.closeAlpha > 0.05
                && modal.closeScale > 0.25
                && this._isSkipRewardObjectHit(
                    btn,
                    pointerX,
                    pointerY,
                    modal.closeScale * hoverScale,
                    modal.closeStretch,
                    closeHitPadding,
                    I.rawX,
                    I.rawY
                );
            const prev = Number(btn._skipRewardHoverState) || 0;
            const target = hovered ? 1 : 0;
            const next = prev + (target - prev) * Math.min(1, dt * 12);
            btn._skipRewardHoverState = next;
            btn._skipRewardHoverTime = hovered ? ((Number(btn._skipRewardHoverTime) || 0) + dt) : 0;
            if (Math.abs(next - prev) > 0.0001) changed = true;
        }
        return changed;
    },

    _updateSkipHint(dt) {
        if (RCHIPL.Editor?.isEditMode?.()) {
            this._resetSkipHintState();
            return false;
        }
        if (this.state !== 'PLAYING' || this.levelComplete || this.levelFailed) {
            this._skipHintActive = false;
            return false;
        }
        if (this._skipRewardModal?.active) {
            this._skipHintActive = false;
            return false;
        }
        if (!this._skipLevelButtonObjs?.length) {
            this._skipHintActive = false;
            return false;
        }

        const props = this._getSkipHintProps();
        if (props.enabled === false) {
            this._skipHintActive = false;
            return false;
        }

        const delaySec = Math.max(0, Number(props.delaySec) || 0);
        this._skipHintTimer += Math.max(0, dt || 0);
        if (this._skipHintTimer >= delaySec) {
            this._skipHintActive = true;
        }
        return this._skipHintActive;
    },

    _getUiButtonScreenPosition(btn, out = null) {
        const p = out || { x: 0, y: 0 };
        if (!btn) {
            p.x = 0;
            p.y = 0;
            return p;
        }
        const S = RCHIPL.Screen;
        let x = btn.x || 0;
        let y = btn.y || 0;
        if (btn.anchor && btn.anchorToScreen && RCHIPL.Anchor?.POINTS?.[btn.anchor] && S?.getVisibleBounds) {
            const vb = S.getVisibleBounds();
            const point = RCHIPL.Anchor.POINTS[btn.anchor];
            const offsetX = btn.anchorOffsetX ?? 0;
            const offsetY = btn.anchorOffsetY ?? 0;
            x = vb.left + point.x * vb.width + offsetX;
            y = vb.top + point.y * vb.height + offsetY;
        }
        p.x = x;
        p.y = y;
        return p;
    },

    _renderSkipHintArrow(ctx) {
        if (!this._skipHintActive) return;
        const skipBtn = this._skipLevelButtonObjs?.[0];
        if (!skipBtn) return;

        const props = this._getSkipHintProps();
        if (props.enabled === false) return;

        const pos = this._getUiButtonScreenPosition(skipBtn);
        const t = (this._now || performance.now()) * 0.001;
        const amplitude = Math.max(0, Number(props.amplitudePx) || 0);
        const frequency = Math.max(0, Number(props.frequencyHz) || 0);
        const offsetY = Number(props.offsetYPx) || 0;
        const yBob = Math.sin(t * Math.PI * 2 * frequency) * amplitude;
        const alpha = Math.max(0, Math.min(1, Number(props.alpha) || 0));
        const scale = Math.max(0.1, Number(props.scale) || 0.6);
        const rotationValue = Number(props.rotationDeg);
        const rotationDeg = Number.isFinite(rotationValue) ? rotationValue : 0;

        const sourceObj = this._skipHintArrowObj;
        const fallbackAssetName = RCHIPL.Assets?.get?.('_UI_Arrow') ? '_UI_Arrow' : null;
        const assetName = sourceObj?._instanceAsset || sourceObj?.asset || fallbackAssetName;
        if (!assetName) return;
        const renderObj = {
            asset: assetName,
            _instanceAsset: sourceObj?._instanceAsset,
            width: sourceObj?.width,
            height: sourceObj?.height,
            scaleX: (sourceObj?.scaleX ?? 1) * scale,
            scaleY: (sourceObj?.scaleY ?? 1) * scale,
            rotation: (sourceObj?.rotation ?? 0) + rotationDeg,
            anchorX: sourceObj?.anchorX ?? 0.5,
            anchorY: sourceObj?.anchorY ?? 0.5,
            alpha: (sourceObj?.alpha ?? 1) * alpha,
            flipX: sourceObj?.flipX ?? false,
            flipY: sourceObj?.flipY ?? false
        };

        const asset = RCHIPL.Assets?.get?.(assetName);
        const baseScaleX = Math.abs(renderObj.scaleX ?? 1);
        const baseScaleY = Math.abs(renderObj.scaleY ?? 1);
        const w = Number.isFinite(renderObj.width)
            ? Math.abs(renderObj.width) * baseScaleX
            : (asset?.width || 100) * baseScaleX;
        const h = Number.isFinite(renderObj.height)
            ? Math.abs(renderObj.height) * baseScaleY
            : (asset?.height || 100) * baseScaleY;
        const skipAssetName = skipBtn?._instanceAsset || skipBtn?.asset;
        const skipAsset = skipAssetName ? RCHIPL.Assets?.get?.(skipAssetName) : null;
        const skipBaseScaleX = Math.abs(skipBtn?._baseScaleX ?? skipBtn?.scaleX ?? 1);
        const skipBaseScaleY = Math.abs(skipBtn?._baseScaleY ?? skipBtn?.scaleY ?? 1);
        const skipW = skipBtn?.width != null
            ? Math.abs(skipBtn.width) * skipBaseScaleX
            : (skipAsset?.width || 100) * skipBaseScaleX;
        const skipH = skipBtn?.height != null
            ? Math.abs(skipBtn.height) * skipBaseScaleY
            : (skipAsset?.height || 100) * skipBaseScaleY;
        const edgeGap = Number.isFinite(offsetY) ? offsetY : 0;
        const x = pos.x;
        const y = pos.y + (skipH * 0.5) + (h * 0.5) + edgeGap + yBob;

        if (RCHIPL.Scene?._drawObjectAt) {
            RCHIPL.Scene._drawObjectAt(ctx, renderObj, x, y);
            return;
        }
        RCHIPL.Assets?.draw?.(ctx, assetName, x, y, {
            width: renderObj.width,
            height: renderObj.height,
            scaleX: renderObj.width === undefined ? renderObj.scaleX : undefined,
            scaleY: renderObj.height === undefined ? renderObj.scaleY : undefined,
            angle: (renderObj.rotation || 0) * Math.PI / 180,
            alpha: renderObj.alpha,
            flipX: renderObj.flipX,
            flipY: renderObj.flipY,
            anchorX: renderObj.anchorX,
            anchorY: renderObj.anchorY
        });
    },

    _ensureButtonHoverBase(btn) {
        if (!btn) return;
        if (btn._hoverState === undefined) btn._hoverState = 0;
        if (btn._hoverTime === undefined) btn._hoverTime = 0;
        if (btn._baseScaleX === undefined) btn._baseScaleX = btn.scaleX ?? 1;
        if (btn._baseScaleY === undefined) btn._baseScaleY = btn.scaleY ?? 1;
        if (btn._baseWidth === undefined && Number.isFinite(btn.width)) btn._baseWidth = btn.width;
        if (btn._baseHeight === undefined && Number.isFinite(btn.height)) btn._baseHeight = btn.height;
        if (btn._baseRotation === undefined) btn._baseRotation = btn.rotation ?? 0;
    },

    _resetButtonHoverPose(btn, forceZeroRotation = false) {
        if (!btn) return;
        this._ensureButtonHoverBase(btn);
        if (forceZeroRotation) btn._baseRotation = 0;
        btn._hoverState = 0;
        btn._hoverTime = 0;
        btn.scaleX = btn._baseScaleX;
        btn.scaleY = btn._baseScaleY;
        if (btn._baseWidth !== undefined) btn.width = btn._baseWidth;
        if (btn._baseHeight !== undefined) btn.height = btn._baseHeight;
        btn.rotation = btn._baseRotation;
    },

    _normalizeSkipLevelButtonPose() {
        const buttons = this._skipLevelButtonObjs || [];
        for (const btn of buttons) {
            this._resetButtonHoverPose(btn, true);
        }
    },

    _cacheSkipRewardAuthorVisibility(obj) {
        if (!obj) return;
        if (obj._skipRewardAuthorVisible === undefined) {
            obj._skipRewardAuthorVisible = obj.visible !== false;
        }
    },

    _syncSkipRewardSceneVisibility() {
        const isEditMode = RCHIPL.Editor?.isEditMode?.() ?? false;
        for (const obj of [this._skipRewardPopupObj, this._skipRewardCloseObj, this._skipRewardValidateObj]) {
            if (!obj) continue;
            this._cacheSkipRewardAuthorVisibility(obj);
            obj.visible = isEditMode ? (obj._skipRewardAuthorVisible !== false) : false;
        }
    },

    _hideSkipRewardSceneObjectsImmediate() {
        if (RCHIPL.Editor?.isEditMode?.()) return;
        const popupObjs = RCHIPL.Scene?.getByFamily?.('skipRewardPopup') || [];
        const closeObjs = RCHIPL.Scene?.getByFamily?.('skipRewardClose') || [];
        const validateObjs = RCHIPL.Scene?.getByFamily?.('skipRewardValidate') || [];
        for (const obj of [...popupObjs, ...closeObjs, ...validateObjs]) {
            if (!obj) continue;
            this._cacheSkipRewardAuthorVisibility(obj);
            obj.visible = false;
            obj.isInvisible = false;
        }
    },

    _hideSkipHintArrowSceneObjectsImmediate() {
        if (RCHIPL.Editor?.isEditMode?.()) return;
        const hintObjs = RCHIPL.Scene?.getByFamily?.('skipHintArrow') || [];
        for (const obj of hintObjs) {
            if (!obj) continue;
            obj.visible = false;
            obj.isInvisible = false;
        }
    },

    _captureSkipRewardModalBase(obj) {
        if (!obj) return null;
        obj._skipRewardModalBase = {
            asset: obj.asset,
            _instanceAsset: obj._instanceAsset,
            x: obj.x || 0,
            y: obj.y || 0,
            width: obj.width,
            height: obj.height,
            scaleX: obj.scaleX ?? 1,
            scaleY: obj.scaleY ?? 1,
            rotation: obj.rotation ?? 0,
            anchor: obj.anchor,
            anchorToScreen: !!obj.anchorToScreen,
            anchorOffsetX: obj.anchorOffsetX ?? 0,
            anchorOffsetY: obj.anchorOffsetY ?? 0,
            anchorX: obj.anchorX,
            anchorY: obj.anchorY,
            alpha: obj.alpha ?? 1,
            flipX: obj.flipX ?? false,
            flipY: obj.flipY ?? false
        };
        return obj._skipRewardModalBase;
    },

    _captureSkipRewardModalLayoutState() {
        this._captureSkipRewardModalBase(this._skipRewardPopupObj);
        this._captureSkipRewardModalBase(this._skipRewardCloseObj);
        this._captureSkipRewardModalBase(this._skipRewardValidateObj);
    },

    _getSkipRewardModalRenderObj(obj) {
        if (!obj) return null;
        const base = obj._skipRewardModalBase || this._captureSkipRewardModalBase(obj);
        if (!base) return null;
        const renderObj = { ...base };
        const isActionButton = obj === this._skipRewardCloseObj || obj === this._skipRewardValidateObj;
        const authoredBoost = isActionButton ? 1.3 : 1;
        if (authoredBoost !== 1) {
            if (Number.isFinite(renderObj.width)) renderObj.width = Math.abs(renderObj.width) * authoredBoost;
            else renderObj.scaleX = (renderObj.scaleX ?? 1) * authoredBoost;
            if (Number.isFinite(renderObj.height)) renderObj.height = Math.abs(renderObj.height) * authoredBoost;
            else renderObj.scaleY = (renderObj.scaleY ?? 1) * authoredBoost;
        }
        return renderObj;
    },

    _getSkipRewardScreenPosition(obj, out = null) {
        const p = out || { x: 0, y: 0 };
        const renderObj = this._getSkipRewardModalRenderObj(obj);
        if (!renderObj) {
            p.x = 0;
            p.y = 0;
            return p;
        }

        const S = RCHIPL.Screen;
        const safeW = S?.safeW || this.WIDTH;
        const safeH = S?.safeH || this.HEIGHT;
        if (renderObj.anchor && RCHIPL.Anchor?.POINTS?.[renderObj.anchor]) {
            if (renderObj.anchorToScreen && S?.getVisibleBounds) {
                const vb = S.getVisibleBounds();
                const anchored = RCHIPL.Anchor.getScreenPosition(renderObj, safeW, safeH, vb);
                p.x = anchored.x;
                p.y = anchored.y;
                return p;
            }
            const anchored = RCHIPL.Anchor.getScreenPosition(renderObj, safeW, safeH, null);
            p.x = safeW / 2 + anchored.x;
            p.y = safeH / 2 + anchored.y;
            return p;
        }

        // Skip reward modal is an overlay, but its authored x/y are still centered
        // around the game viewport, like regular scene objects.
        // Keep it out of camera space while preserving the layout's center-based pose.
        p.x = safeW / 2 + (renderObj.x || 0);
        p.y = safeH / 2 + (renderObj.y || 0);
        return p;
    },

    _getSkipRewardScreenBounds(obj, extraScale = 1, hitPadding = 0, stretchMul = 0, out = null) {
        const rect = out || { x: 0, y: 0, w: 0, h: 0, left: 0, top: 0, right: 0, bottom: 0 };
        const renderObj = this._getSkipRewardModalRenderObj(obj);
        if (!renderObj?.asset) {
            rect.x = rect.y = rect.w = rect.h = rect.left = rect.top = rect.right = rect.bottom = 0;
            return rect;
        }

        const pos = this._getSkipRewardScreenPosition(renderObj, rect);
        const asset = RCHIPL.Assets.get(renderObj._instanceAsset || renderObj.asset);
        const anchorX = renderObj.anchorX ?? asset?.anchor?.x ?? 0.5;
        const anchorY = renderObj.anchorY ?? asset?.anchor?.y ?? 0.5;
        const baseScaleX = Math.abs(renderObj.scaleX ?? 1);
        const baseScaleY = Math.abs(renderObj.scaleY ?? 1);
        const scaleXMul = Math.max(0, extraScale * (1 + stretchMul));
        const scaleYMul = Math.max(0, extraScale * (1 - stretchMul * 0.8));
        const baseW = Number.isFinite(renderObj.width)
            ? Math.abs(renderObj.width) * baseScaleX
            : (asset?.width || 100) * baseScaleX;
        const baseH = Number.isFinite(renderObj.height)
            ? Math.abs(renderObj.height) * baseScaleY
            : (asset?.height || 100) * baseScaleY;
        const w = baseW * scaleXMul;
        const h = baseH * scaleYMul;
        rect.x = pos.x;
        rect.y = pos.y;
        rect.w = w;
        rect.h = h;
        rect.left = pos.x - w * anchorX - hitPadding;
        rect.top = pos.y - h * anchorY - hitPadding;
        rect.right = rect.left + w + hitPadding * 2;
        rect.bottom = rect.top + h + hitPadding * 2;
        return rect;
    },

    _pointInSkipRewardBounds(bounds, x, y) {
        return !!bounds && x >= bounds.left && x <= bounds.right && y >= bounds.top && y <= bounds.bottom;
    },

    _buildSkipRewardModalTestObject(obj, scaleMul = 1, stretchMul = 0) {
        const baseObj = this._getSkipRewardModalRenderObj(obj);
        if (!baseObj) return null;
        const testObj = { ...baseObj };
        const baseScaleX = testObj.scaleX ?? 1;
        const baseScaleY = testObj.scaleY ?? 1;
        const drawScaleX = Math.max(0, scaleMul * (1 + (stretchMul || 0)));
        const drawScaleY = Math.max(0, scaleMul * (1 - (stretchMul || 0) * 0.8));
        if (Number.isFinite(testObj.width)) {
            testObj.width = Math.abs(testObj.width) * Math.abs(baseScaleX) * drawScaleX;
            testObj.scaleX = baseScaleX < 0 ? -1 : 1;
        } else {
            testObj.scaleX = baseScaleX * drawScaleX;
        }
        if (Number.isFinite(testObj.height)) {
            testObj.height = Math.abs(testObj.height) * Math.abs(baseScaleY) * drawScaleY;
            testObj.scaleY = baseScaleY < 0 ? -1 : 1;
        } else {
            testObj.scaleY = baseScaleY * drawScaleY;
        }
        return testObj;
    },

    _isSkipRewardObjectHit(obj, pointerX, pointerY, scaleMul = 1, stretchMul = 0, hitPadding = 0, rawPointerX = null, rawPointerY = null) {
        if (!obj) return false;
        const bounds = this._getSkipRewardScreenBounds(obj, scaleMul, hitPadding, stretchMul);
        return this._pointInSkipRewardBounds(bounds, pointerX, pointerY);
    },

    _easeOutBack(t01, overshoot = 1.18) {
        const t = Math.max(0, Math.min(1, t01));
        const c1 = Math.max(0, overshoot);
        const c3 = c1 + 1;
        const x = t - 1;
        return 1 + c3 * x * x * x + c1 * x * x;
    },

    _stepTowards(current, target, delta) {
        const step = Math.max(0, delta || 0);
        if (current < target) return Math.min(target, current + step);
        if (current > target) return Math.max(target, current - step);
        return target;
    },

    _clearSkipRewardModalState({ resumeSdk = false } = {}) {
        const modal = this._skipRewardModal;
        if (!modal) return;
        if (modal.gameplayPaused) {
            RCHIPL.Game?.resumeGameplay?.();
        }
        if (resumeSdk && modal.sdkPaused) {
            RCHIPL.Platform?.gameplayStart?.();
        }
        modal.active = false;
        modal.phase = 'closed';
        modal.phaseTime = 0;
        modal.overlayAlpha = 0;
        modal.popupScale = 0;
        modal.popupAlpha = 0;
        modal.popupStretch = 0;
        modal.closeScale = 0;
        modal.closeAlpha = 0;
        modal.closeStretch = 0;
        modal.rewardInFlight = false;
        modal.gameplayPaused = false;
        modal.sdkPaused = false;
        modal.resumeSdkOnClose = false;
        this._resetSkipRewardHoverState(this._skipRewardCloseObj);
        this._resetSkipRewardHoverState(this._skipRewardValidateObj);
        this._resetLauncherTransientState();
        RCHIPL.Input?.reset?.();
        this._syncSkipRewardSceneVisibility();
        this._normalizeSkipLevelButtonPose();
    },

    _requestSkipRewardClose(resumeSdk = true) {
        const modal = this._skipRewardModal;
        if (!modal?.active || modal.rewardInFlight) return false;
        modal.phase = 'closing';
        modal.phaseTime = 0;
        modal.resumeSdkOnClose = !!resumeSdk;
        return true;
    },

    _openSkipRewardModal() {
        if (this._skipLevelInFlight) return false;
        if (this._isUiInteractionLocked()) return false;
        if (RCHIPL.Editor?.isEditMode?.()) return false;
        if (this.state !== 'PLAYING') return false;
        const currentLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
        const currentFamily = currentLayoutId ? RCHIPL.Layouts?._all?.[currentLayoutId]?.family : null;
        if (currentFamily !== 'level') return false;

        const popupProps = this._getSkipRewardPopupProps();
        if (!this._skipRewardPopupObj || popupProps.enabled === false) {
            
            return false;
        }

        const modal = this._skipRewardModal;
        if (modal.active) return false;

        this._normalizeSkipLevelButtonPose();
        this._resetLauncherTransientState();
        this._captureSkipRewardModalLayoutState();
        modal.active = true;
        modal.phase = 'opening';
        modal.phaseTime = 0;
        modal.overlayAlpha = 0;
        modal.popupScale = 0;
        modal.popupAlpha = 0;
        modal.popupStretch = 0;
        modal.closeScale = 0;
        modal.closeAlpha = 0;
        modal.closeStretch = 0;
        modal.rewardInFlight = false;
        modal.resumeSdkOnClose = false;
        modal.gameplayPaused = !!RCHIPL.Game?.pauseGameplay?.();
        modal.sdkPaused = !!RCHIPL.Platform?.gameplayStop?.();
        RCHIPL.Input?.reset?.();
        this._syncSkipRewardSceneVisibility();
        return true;
    },

    requestSkipLevel() {
        return this._openSkipRewardModal();
    },

    _updateSkipRewardModal(dt) {
        const modal = this._skipRewardModal;
        if (!modal?.active) return false;

        const popupProps = this._getSkipRewardPopupProps();
        const closeProps = this._getSkipRewardCloseProps();
        const appearDuration = Math.max(0.05, this._uiNum(popupProps.appearDuration, 0.42));
        const disappearDuration = Math.max(0.05, this._uiNum(popupProps.disappearDuration, 0.18));
        const overlayFade = Math.max(0.01, this._uiNum(popupProps.overlayFadeDuration, 0.2));
        const overlayTarget = modal.phase === 'closing'
            ? 0
            : Math.max(0, Math.min(1, this._uiNum(popupProps.overlayAlpha, 0.62)));
        modal.overlayAlpha = this._stepTowards(modal.overlayAlpha, overlayTarget, dt / overlayFade);
        modal.phaseTime += dt;

        if (modal.phase === 'opening') {
            const t = Math.max(0, Math.min(1, modal.phaseTime / appearDuration));
            modal.popupScale = 1;
            modal.popupAlpha = Math.min(1, t);
            modal.popupStretch = 0;
            const hasActionButtons = !!this._skipRewardValidateObj
                || (!!this._skipRewardCloseObj && closeProps.enabled !== false);
            const popupDone = t >= 1;

            if (hasActionButtons) {
                modal.closeScale = 1;
                modal.closeAlpha = modal.popupAlpha;
                modal.closeStretch = 0;
            } else {
                modal.closeScale = 0;
                modal.closeAlpha = 0;
                modal.closeStretch = 0;
            }

            if (popupDone) {
                modal.phase = 'open';
                modal.phaseTime = 0;
                modal.popupScale = 1;
                modal.popupAlpha = 1;
                modal.popupStretch = 0;
                if (hasActionButtons) {
                    modal.closeScale = 1;
                    modal.closeAlpha = 1;
                    modal.closeStretch = 0;
                }
            }
            return true;
        }

        if (modal.phase === 'closing') {
            const t = Math.max(0, Math.min(1, modal.phaseTime / disappearDuration));
            const ease = t * t;
            modal.popupScale = 1;
            modal.popupAlpha = Math.max(0, 1 - ease);
            modal.popupStretch = 0;
            modal.closeScale = 1;
            modal.closeAlpha = modal.popupAlpha;
            modal.closeStretch = 0;
            if (t >= 1 && modal.overlayAlpha <= 0.001) {
                this._clearSkipRewardModalState({ resumeSdk: modal.resumeSdkOnClose });
            }
            return true;
        }

        if (modal.phase === 'open') {
            modal.popupScale = 1;
            modal.popupAlpha = 1;
            modal.popupStretch = 0;
            modal.closeScale = 1;
            modal.closeAlpha = 1;
            modal.closeStretch = 0;
            return true;
        }

        modal.popupScale = 1;
        modal.popupAlpha = 1;
        modal.popupStretch = 0;
        modal.closeScale = 1;
        modal.closeAlpha = 1;
        modal.closeStretch = 0;
        return true;
    },

    async _confirmSkipRewardFromModal() {
        const modal = this._skipRewardModal;
        if (!modal?.active || modal.rewardInFlight || this._skipLevelInFlight) return false;
        modal.rewardInFlight = true;
        

        try {
            const adapter = RCHIPL.Platform?._adapter || null;
            const host = String(location?.hostname || '').toLowerCase();
            const isLoopback = host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '';
            const isPrivateIpv4 = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(host);
            const isLocalSuffix = host.endsWith('.local');
            const isLocalDev = adapter?._isLocal === true || location?.protocol === 'file:' || isLoopback || isPrivateIpv4 || isLocalSuffix;
            let watched = false;

            if (isLocalDev) {
                
                watched = true;
            } else {
                watched = await RCHIPL.Platform?.rewardedAd?.();
            }
            
            if (!watched) {
                modal.rewardInFlight = false;
                this._requestSkipRewardClose(true);
                return false;
            }

            this._clearSkipRewardModalState({ resumeSdk: false });
            this._hideSkipRewardSceneObjectsImmediate();
            const didSkip = await this.skipLevel();
            return !!didSkip;
        } catch (err) {
            
            modal.rewardInFlight = false;
            this._requestSkipRewardClose(true);
            return false;
        }
    },

    _handleSkipRewardModalInput() {
        const modal = this._skipRewardModal;
        if (!modal?.active) return false;
        if (!this._isSkipRewardModalInteractive()) return true;

        const I = RCHIPL.Input;
        if (I.keyPressed?.('Escape')) {
            this._requestSkipRewardClose(true);
            return true;
        }

        const pointerPressed = I.touchStart?.() || I.leftClicked?.();
        if (!pointerPressed) return true;

        const S = RCHIPL.Screen;
        const pointerX = (I.rawX - (S?.offsetX || 0)) / (S?.scale || 1);
        const pointerY = (I.rawY - (S?.offsetY || 0)) / (S?.scale || 1);
        const popupProps = this._getSkipRewardPopupProps();
        const closeProps = this._getSkipRewardCloseProps();
        const popupHitPadding = Math.max(0, this._uiNum(popupProps.popupHitPaddingPx, 20));
        const closeHitPadding = Math.max(0, this._uiNum(closeProps.hitPaddingPx, 18));

        // Validate button (green check) — confirms skip reward
        if (this._skipRewardValidateObj
            && modal.closeAlpha > 0.05
            && modal.closeScale > 0.25
            && this._isSkipRewardObjectHit(this._skipRewardValidateObj, pointerX, pointerY, modal.closeScale * this._getSkipRewardHoverScale(this._skipRewardValidateObj), modal.closeStretch, closeHitPadding, I.rawX, I.rawY)) {
            
            this._confirmSkipRewardFromModal();
            return true;
        }

        if (this._skipRewardCloseObj
            && closeProps.enabled !== false
            && modal.closeAlpha > 0.05
            && modal.closeScale > 0.25
            && this._isSkipRewardObjectHit(this._skipRewardCloseObj, pointerX, pointerY, modal.closeScale * this._getSkipRewardHoverScale(this._skipRewardCloseObj), modal.closeStretch, closeHitPadding, I.rawX, I.rawY)) {
            
            this._requestSkipRewardClose(true);
            return true;
        }

        // Tap on popup body = do nothing (absorb the tap so backdrop dismiss doesn't fire)
        if (this._isSkipRewardObjectHit(this._skipRewardPopupObj, pointerX, pointerY, modal.popupScale, modal.popupStretch, popupHitPadding, I.rawX, I.rawY)) {
            return true;
        }

        if (popupProps.dismissOnBackdrop !== false) {
            this._requestSkipRewardClose(true);
        }
        return true;
    },

    _renderSkipRewardObject(ctx, obj, screenX, screenY, scaleMul, alphaMul, stretchMul = 0) {
        const baseObj = this._getSkipRewardModalRenderObj(obj);
        if (!baseObj) return;
        const alpha = Math.max(0, Math.min(1, alphaMul));
        if (alpha <= 0.001) return;
        const drawScale = Math.max(0, Number.isFinite(scaleMul) ? scaleMul : 1);
        const renderObj = {
            ...baseObj,
            alpha: (baseObj.alpha ?? 1) * alpha,
            rotation: (baseObj.rotation ?? 0) + this._getSkipRewardHoverRotation(obj)
        };
        if (drawScale !== 1) {
            if (Number.isFinite(renderObj.width)) renderObj.width = Math.abs(renderObj.width) * drawScale;
            else renderObj.scaleX = (renderObj.scaleX ?? 1) * drawScale;
            if (Number.isFinite(renderObj.height)) renderObj.height = Math.abs(renderObj.height) * drawScale;
            else renderObj.scaleY = (renderObj.scaleY ?? 1) * drawScale;
        }
        // Ignore legacy modal stretch: preserve authored proportions from the UI layout.
        void stretchMul;
        if (RCHIPL.Scene?._drawObjectAt) {
            RCHIPL.Scene._drawObjectAt(ctx, renderObj, screenX, screenY);
            return;
        }
        const assetName = renderObj._instanceAsset || renderObj.asset;
        if (!assetName) return;
        RCHIPL.Assets?.draw?.(ctx, assetName, screenX, screenY, {
            width: renderObj.width,
            height: renderObj.height,
            scaleX: renderObj.width === undefined ? (renderObj.scaleX ?? 1) : undefined,
            scaleY: renderObj.height === undefined ? (renderObj.scaleY ?? 1) : undefined,
            angle: (renderObj.rotation || 0) * Math.PI / 180,
            alpha: renderObj.alpha,
            flipX: renderObj.flipX ?? false,
            flipY: renderObj.flipY ?? false,
            anchorX: renderObj.anchorX,
            anchorY: renderObj.anchorY
        });
    },

    _renderSkipRewardModal(ctx) {
        const modal = this._skipRewardModal;
        if (!modal?.active) return;

        const overlayColor = this._parseHexColorRgb(this._getSkipRewardPopupProps().overlayColor || '#0b1d54') || { r: 11, g: 29, b: 84 };
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = `rgba(${overlayColor.r}, ${overlayColor.g}, ${overlayColor.b}, ${Math.max(0, Math.min(1, modal.overlayAlpha))})`;
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.restore();

        const S = RCHIPL.Screen;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(S.dpr, S.dpr);
        ctx.translate(S.offsetX, S.offsetY);
        ctx.scale(S.scale, S.scale);

        const popupPos = this._getSkipRewardScreenPosition(this._skipRewardPopupObj);
        this._renderSkipRewardObject(ctx, this._skipRewardPopupObj, popupPos.x, popupPos.y, modal.popupScale, modal.popupAlpha, modal.popupStretch);

        if (this._skipRewardValidateObj) {
            const validatePos = this._getSkipRewardScreenPosition(this._skipRewardValidateObj);
            this._renderSkipRewardObject(ctx, this._skipRewardValidateObj, validatePos.x, validatePos.y, modal.closeScale * this._getSkipRewardHoverScale(this._skipRewardValidateObj), modal.closeAlpha, modal.closeStretch);
        }

        if (this._skipRewardCloseObj && this._getSkipRewardCloseProps().enabled !== false) {
            const closePos = this._getSkipRewardScreenPosition(this._skipRewardCloseObj);
            this._renderSkipRewardObject(ctx, this._skipRewardCloseObj, closePos.x, closePos.y, modal.closeScale * this._getSkipRewardHoverScale(this._skipRewardCloseObj), modal.closeAlpha, modal.closeStretch);
        }
        ctx.restore();
    },

    _applyWorldMapBackgroundGradientColors(color1, color2) {
        const c1 = String(color1 || '').trim();
        const c2Raw = String(color2 || '').trim();
        const c2 = c2Raw || c1;
        if (!c1 && !c2) return;

        const layoutName = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const layout = layoutName ? RCHIPL.Layouts?._all?.[layoutName] : null;
        if (!layout) return;

        const preferredLayer = String(this._levelMapLinkLayer || '').trim();
        const layoutLayers = Array.isArray(layout.layers) ? layout.layers : [];
        const layerName = (preferredLayer && layoutLayers.includes(preferredLayer))
            ? preferredLayer
            : (layoutLayers.includes('BG') ? 'BG' : (preferredLayer || null));
        if (!layerName) return;

        if (!layout.layerOverrides || typeof layout.layerOverrides !== 'object') {
            layout.layerOverrides = {};
        }
        if (!layout.layerOverrides[layerName] || typeof layout.layerOverrides[layerName] !== 'object') {
            layout.layerOverrides[layerName] = {};
        }

        const override = layout.layerOverrides[layerName];
        const globalBg = RCHIPL._projectData?.layers?.[layerName]?.background || {};
        const prevBg = (override.background && typeof override.background === 'object')
            ? override.background
            : globalBg;
        const finalC1 = c1 || prevBg.color1 || '#1a1a2e';
        const finalC2 = c2 || prevBg.color2 || finalC1 || '#16213e';

        override.mode = 'normal';
        override.background = {
            ...prevBg,
            color1: finalC1,
            color2: finalC2,
            stops: [
                { pos: 0, color: finalC1, alpha: 1 },
                { pos: 100, color: finalC2, alpha: 1 }
            ]
        };

        RCHIPL.Scene?.invalidateLayerCaches?.();
    },

    _applyWorldMapBackgroundGradient(node) {
        if (!node) return;

        const color1 = String(node._lmBgGradientColor1 || '').trim();
        const color2 = String(node._lmBgGradientColor2 || '').trim() || color1;
        if (!color1 && !color2) return;
        this._applyWorldMapBackgroundGradientColors(color1, color2);
    },

    _updateWorldMapAdvance() {
        const rt = this._worldMapAdvanceRuntime;
        if (!rt) return;
        if (RCHIPL.Editor?.isEditMode?.()) return;

        const now = performance.now();
        const phaseElapsed = now - (rt.phaseStartMs || now);
        const markers = this._levelMapPlayers || [];

        if (rt.bgTransition) {
            const bgElapsed = now - (rt.bgTransition.startMs || now);
            const bgDuration = Math.max(1, rt.bgTransition.durationMs || 1);
            const bt = Math.max(0, Math.min(1, bgElapsed / bgDuration));
            const be = this._easeInOutCubic01(bt);
            const c1 = this._lerpColorHex(rt.bgTransition.fromColor1, rt.bgTransition.toColor1, be);
            const c2 = this._lerpColorHex(rt.bgTransition.fromColor2, rt.bgTransition.toColor2, be);
            this._applyWorldMapBackgroundGradientColors(c1, c2);
            if (bt >= 1) rt.bgTransition = null;
        }

        if (rt.phase === 'holdBeforeMove') {
            if (!rt.confettiDone) {
                const origin = rt.fromNode || markers[0] || null;
                if (origin && RCHIPL.FX?.spawnConfettiAt) {
                    RCHIPL.FX.spawnConfettiAt(origin.x, origin.y, {
                        count: 72,
                        duration: 1.5,
                        speed: 760,
                        direction: -90,
                        spread: 105,
                        gravity: 980,
                        size: 16,
                        sizeVar: 7
                    });
                }
                const fromC1 = String(rt.fromNode?._lmBgGradientColor1 || '').trim();
                const fromC2 = String(rt.fromNode?._lmBgGradientColor2 || '').trim() || fromC1;
                const toC1 = String(rt.toNode?._lmBgGradientColor1 || '').trim() || fromC1;
                const toC2 = String(rt.toNode?._lmBgGradientColor2 || '').trim() || toC1 || fromC2;
                rt.bgTransition = {
                    startMs: now,
                    durationMs: Math.max(220, (rt.holdBeforeMs || 500) + (rt.moveDurationMs || 850)),
                    fromColor1: fromC1 || toC1,
                    fromColor2: fromC2 || toC2 || toC1,
                    toColor1: toC1 || fromC1,
                    toColor2: toC2 || toC1 || fromC2
                };
                rt.confettiDone = true;
                const confettiOrigin = rt.fromNode || markers[0];
                if (confettiOrigin) RCHIPL.Events.emit('OnWorldMapConfetti', { x: confettiOrigin.x, y: confettiOrigin.y });
            }
            this._updateWorldMapPlayerSpring(rt, now, 1, 1);
            if (phaseElapsed >= (rt.holdBeforeMs || 500)) {
                rt.phase = 'move';
                rt.phaseStartMs = now;
            }
            return;
        }

        if (rt.phase === 'move') {
            const from = rt.fromNode;
            const to = rt.toNode;
            if (!from || !to) {
                rt.phase = 'holdAfterMove';
                rt.phaseStartMs = now;
                return;
            }

            if (!rt.moveSoundDone) {
                RCHIPL.Events.emit('OnWorldMapMove', { progress: 0 });
                rt.moveSoundDone = true;
            }

            const duration = Math.max(1, rt.moveDurationMs || 850);
            const t = Math.max(0, Math.min(1, phaseElapsed / duration));
            const e = this._easeInOutCubic01(t);
            const x = from.x + (to.x - from.x) * e;
            const y = from.y + (to.y - from.y) * e;

            for (const marker of markers) {
                marker.x = x;
                marker.y = y;
                marker.visible = true;
            }

            const prevX = Number.isFinite(rt.prevMarkerX) ? rt.prevMarkerX : x;
            const prevY = Number.isFinite(rt.prevMarkerY) ? rt.prevMarkerY : y;
            const dx = x - prevX;
            const dy = y - prevY;
            rt.prevMarkerX = x;
            rt.prevMarkerY = y;
            const frameSpeed = Math.hypot(dx, dy);
            const amp = Math.max(0, Math.min(0.14, frameSpeed * 0.012));
            const invSpeed = frameSpeed > 0.0001 ? (1 / frameSpeed) : 0;
            const dirX = frameSpeed > 0.0001 ? Math.abs(dx * invSpeed) : 0.5;
            const dirY = frameSpeed > 0.0001 ? Math.abs(dy * invSpeed) : 0.5;
            const targetSx = 1 - amp * 0.35 + amp * 0.9 * dirX;
            const targetSy = 1 - amp * 0.35 + amp * 0.9 * dirY;
            this._updateWorldMapPlayerSpring(rt, now, targetSx, targetSy);

            if (t >= 1) {
                for (const marker of markers) {
                    marker.x = to.x;
                    marker.y = to.y;
                }
                this._applyWorldMapBackgroundGradient(to);
                RCHIPL.Events.emit('OnWorldMapArrive', { x: to.x, y: to.y });
                if (to._lmIsCrown && !rt.arrivalConfettiDone && RCHIPL.FX?.spawnConfettiAt) {
                    RCHIPL.FX.spawnConfettiAt(to.x, to.y, {
                        count: 96,
                        duration: 1.9,
                        speed: 920,
                        direction: -90,
                        spread: 120,
                        gravity: 980,
                        size: 18,
                        sizeVar: 8
                    });
                    rt.arrivalConfettiDone = true;
                }
                rt.phase = 'holdAfterMove';
                rt.phaseStartMs = now;
            }
            return;
        }

        if (rt.phase === 'holdAfterMove') {
            this._updateWorldMapPlayerSpring(rt, now, 1, 1);
            if (phaseElapsed < (rt.holdAfterMs || 500)) return;
            const containerName = rt.targetContainerName || '';
            const targetKind = String(rt.targetKind || 'container');
            const finishLayoutId = rt.finishLayoutId || null;
            this._resetWorldMapPlayerScale();
            this._worldMapAdvanceRuntime = null;
            this._worldMapAdvancePending = null;
            if (targetKind === 'finish') {
                this._launchWorldMapFinishLayout(finishLayoutId);
                return;
            }
            if (!containerName) return;
            this._launchWorldMapContainer(containerName, { auto: true });
        }
    },

    _drawWorldMapLinks(ctx, layerName = null) {
        const links = this._levelMapLinks;
        if (!links?.length) return;
        const explicitLayer = String(this._levelMapLinkLayer || '').trim();
        if (layerName && explicitLayer && layerName !== explicitLayer) return;

        // ctx is already in world space (Viewport transform applied by caller)
        ctx.save();
        for (const link of links) {
            const from = link.fromNode;
            const to = link.toNode;
            if (layerName && !explicitLayer) {
                const fromLayer = from?.layer || 'Main';
                const toLayer = to?.layer || 'Main';
                if (fromLayer !== layerName || toLayer !== layerName) continue;
            }

            ctx.strokeStyle = link.color;
            ctx.lineWidth = link.width;
            ctx.lineCap = 'round';
            if (link.dash > 0) {
                ctx.setLineDash([link.dash, link.dash]);
            } else {
                ctx.setLineDash([]);
            }
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
    },

    _drawWorldMapLayerPass(ctx, layerName) {
        if (!this._levelMapLinks?.length && !this._levelMapNodes?.length && !this._levelMapPlayers?.length) return;
        // Draw links for this layer, then redraw nodes of this layer on top.
        this._drawWorldMapLinks(ctx, layerName);
        if (this._levelMapNodes?.length) {
            for (const node of this._levelMapNodes) {
                if ((node.layer || 'Main') !== layerName) continue;
                RCHIPL.Scene?.drawObject?.(ctx, node);
            }
        }
        if (this._levelMapPlayers?.length) {
            for (const marker of this._levelMapPlayers) {
                if ((marker.layer || 'Main') !== layerName) continue;
                RCHIPL.Scene?.drawObject?.(ctx, marker);
            }
        }
    },

    _handleWorldMapTap() {
        if (!this._levelMapNodes?.length) return;
        if (RCHIPL.Editor?.isEditMode?.()) return;
        if (this._worldMapAdvanceRuntime) return;
        if (this._worldMapAutoLaunchInFlight) return;
        if (performance.now() < this._levelMapTapEnabled) return;

        const I = RCHIPL.Input;
        if (!I?.leftClicked?.()) return;

        // Convert screen coords to world space via Viewport
        const vp = RCHIPL.Viewport;
        const vpZoom = vp?.zoom || 1;
        const vpPanX = vp?.pan?.x || 0;
        const vpPanY = vp?.pan?.y || 0;
        const mx = (I.x - this.WIDTH / 2 - vpPanX) / vpZoom;
        const my = (I.y - this.HEIGHT / 2 - vpPanY) / vpZoom;

        for (const node of this._levelMapNodes) {
            if (node._lmIsCrown) continue;
            if (!node._lmUnlocked) continue;

            const hw = (node.width || 100) * (node.scaleX || 1) * 0.5;
            const hh = (node.height || 100) * (node.scaleY || 1) * 0.5;

            if (mx >= node.x - hw && mx <= node.x + hw &&
                my >= node.y - hh && my <= node.y + hh) {

                const containerName = node._lmContainer;
                if (!containerName) continue;
                this._launchWorldMapContainer(containerName, { auto: false });
                return;
            }
        }
    },

    _getMenuLayoutId() {
        const layouts = RCHIPL.Layouts?._all || {};
        if (layouts.Menu) return 'Menu';
        const firstMenu = Object.entries(layouts).find(([, l]) => l?.family === 'menu');
        return firstMenu ? firstMenu[0] : null;
    },

    _getResumeLayoutForContainer(containerName) {
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const container = containers.find(c => c?.name === containerName);
        const layouts = Array.isArray(container?.layouts) ? container.layouts : [];
        if (!layouts.length) return null;

        const levels = RCHIPL.Save.get('levels') || {};
        const nextIncomplete = layouts.find(lid => !levels?.[lid]?.completed);
        return nextIncomplete || layouts[0] || null;
    },

    _getGlobalLevelOrdinal(layoutId = null) {
        const target = layoutId || RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        if (!target) return Infinity;

        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        let ordinal = 1;
        for (const container of containers) {
            const layouts = Array.isArray(container?.layouts) ? container.layouts : [];
            for (const lid of layouts) {
                if (lid === target) return ordinal;
                ordinal += 1;
            }
        }
        return Infinity;
    },

    _uiNum(value, fallback = 0) {
        const raw = typeof value === 'string' ? value.replace(',', '.') : value;
        const n = parseFloat(raw);
        return Number.isFinite(n) ? n : fallback;
    },

    _getLayoutVarSafe(name, fallback = '', layoutName = null) {
        const L = RCHIPL.Layouts;
        if (!L) return fallback;
        const targetLayout = layoutName || L.getCurrentId?.() || L._currentName;
        const layout = targetLayout ? (L._all?.[targetLayout] || null) : null;
        if (layout?.vars && Object.prototype.hasOwnProperty.call(layout.vars, name)) {
            const v = layout.vars[name];
            return v === undefined ? fallback : v;
        }
        const def = L._varDefs?.[name];
        if (def && Object.prototype.hasOwnProperty.call(def, 'default')) {
            return def.default;
        }
        return fallback;
    },

    _markUiProgressDirty() {
        if (!this._uiRuntime) return;
        this._uiRuntime.progressDirty = true;
        this._uiRuntime.progressKey = '';
    },

    _getUiPreviewOrientationMode() {
        const isEdit = RCHIPL.Editor?.isEditMode?.() ?? false;
        if (!isEdit) return 'auto';
        const raw = String(this._getLayoutVarSafe('uiPreviewOrientation', 'auto')).trim().toLowerCase();
        if (raw === 'portrait' || raw === 'landscape') return raw;
        return 'auto';
    },

    _getUiOrientation() {
        const forced = this._getUiPreviewOrientationMode();
        if (forced !== 'auto') return forced;
        const w = RCHIPL.Screen?.realW || window.innerWidth || this.WIDTH;
        const h = RCHIPL.Screen?.realH || window.innerHeight || this.HEIGHT;
        return h > w ? 'portrait' : 'landscape';
    },

    _getUiScreenId() {
        const fromVar = String(this._getLayoutVarSafe('uiScreenId', '')).trim();
        if (fromVar) return fromVar;
        return this.state === 'MENU' ? 'menu' : 'ingame';
    },

    _isUiOrientationMatch(objOrientation, currentOrientation) {
        const mode = String(objOrientation || 'both').toLowerCase();
        if (mode === 'both' || mode === '') return true;
        return mode === currentOrientation;
    },

    _isUiScreenMatch(objScreenId, currentScreenId) {
        const lhs = String(objScreenId || '').trim().toLowerCase();
        if (!lhs) return true;
        return lhs === String(currentScreenId || '').trim().toLowerCase();
    },

    _getUiConfigObject(screenId, orientation) {
        const objs = RCHIPL.Scene?.getByFamily?.('uiConfig') || [];
        for (const obj of objs) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            if (props.enabled === false) continue;
            if (!this._isUiOrientationMatch(props.orientation, orientation)) continue;
            if (!this._isUiScreenMatch(props.screenId, screenId)) continue;
            return obj;
        }
        return null;
    },

    _computeUiRatioClass(uiConfig = {}) {
        const w = Math.max(1, RCHIPL.Screen?.realW || window.innerWidth || this.WIDTH);
        const h = Math.max(1, RCHIPL.Screen?.realH || window.innerHeight || this.HEIGHT);
        const ratio = Math.max(w, h) / Math.max(1, Math.min(w, h));
        const compactMax = Math.max(1, this._uiNum(uiConfig.compactMaxRatio, 1.45));
        const ultraMin = Math.max(compactMax, this._uiNum(uiConfig.ultraMinRatio, 1.9));
        if (ratio < compactMax) return 'compact';
        if (ratio > ultraMin) return 'ultra';
        return 'standard';
    },

    _applyUiRootGeometry(rootObj, rootProps, uiConfig, bounds, orientation) {
        if (!rootObj || !bounds) return;

        const sideRaw = String(rootProps.side || 'top').toLowerCase();
        const side = ['top', 'bottom', 'left', 'right'].includes(sideRaw) ? sideRaw : 'top';
        const stretchMainAxis = rootProps.stretchMainAxis !== false;

        const defaultThicknessFromCfg = orientation === 'portrait'
            ? this._uiNum(uiConfig.barThicknessPortrait, this._uiNum(rootProps.thicknessPx, 96))
            : this._uiNum(uiConfig.barThicknessLandscape, this._uiNum(rootProps.thicknessPx, 96));

        const thickness = Math.max(1, this._uiNum(rootObj.thicknessPx, defaultThicknessFromCfg));
        const offset = this._uiNum(rootObj.offsetPx, this._uiNum(rootProps.offsetPx, 0));
        const padding = Math.max(0, this._uiNum(rootObj.paddingPx, this._uiNum(rootProps.paddingPx, 0)));

        // Bridge uiRoot "side" props to RCHIPL anchor ids.
        // RCHIPL.Anchor expects: tl/tc/tr/cl/c/cr/bl/bc/br.
        const anchorBySide = {
            top: 'tc',
            bottom: 'bc',
            left: 'cl',
            right: 'cr'
        };

        rootObj.anchorToScreen = true;
        rootObj.anchor = anchorBySide[side] || 'tc';

        if (side === 'top' || side === 'bottom') {
            if (stretchMainAxis) rootObj.width = Math.max(8, bounds.width - padding * 2);
            rootObj.height = thickness;
            rootObj.anchorOffsetX = 0;
            rootObj.anchorOffsetY = side === 'top' ? offset : -offset;
        } else {
            if (stretchMainAxis) rootObj.height = Math.max(8, bounds.height - padding * 2);
            rootObj.width = thickness;
            rootObj.anchorOffsetX = side === 'left' ? offset : -offset;
            rootObj.anchorOffsetY = 0;
        }
    },

    _collectContainerProgress() {
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const levels = RCHIPL.Save?.get?.('levels') || {};
        const loopCount = this._getCompletedLoopCount();
        const byIndex = {};
        const byName = {};
        const signatureParts = [];
        let firstIncomplete = 0;
        let allDone = containers.length > 0;

        for (let i = 0; i < containers.length; i++) {
            const container = containers[i] || {};
            const layouts = Array.isArray(container.layouts) ? container.layouts : [];
            const total = layouts.length;
            let completed = 0;
            let stars = 0;
            for (const layoutId of layouts) {
                if (levels?.[layoutId]?.completed) {
                    completed++;
                    if (levels?.[layoutId]?.star) stars++;
                }
            }
            const done = total > 0 && completed >= total;
            if (!done && firstIncomplete === 0) firstIncomplete = i + 1;
            if (!done) allDone = false;
            const info = { completed, stars, total, done, container };
            byIndex[i + 1] = info;
            byName[container?.name || `container_${i + 1}`] = info;
            signatureParts.push(`${i + 1}:${completed}/${total}:${stars}`);
        }

        if (containers.length === 0) allDone = false;
        const currentContainerIndex = firstIncomplete || (containers.length > 0 ? containers.length : 1);
        const pageStart = Math.floor((Math.max(1, currentContainerIndex) - 1) / 5) * 5 + 1;

        return {
            containers,
            byIndex,
            byName,
            allDone,
            currentContainerIndex,
            pageStart,
            loopCount,
            signature: [...signatureParts, `loops:${loopCount}`].join('|')
        };
    },

    _extractContainerWorldId(container, containerIndex) {
        const direct = this._uiNum(container?.worldId, NaN);
        if (Number.isFinite(direct) && direct >= 1) return Math.round(direct);

        const fromVars = this._uiNum(container?.vars?.worldId, NaN);
        if (Number.isFinite(fromVars) && fromVars >= 1) return Math.round(fromVars);

        const nested = this._uiNum(container?.meta?.worldId, NaN);
        if (Number.isFinite(nested) && nested >= 1) return Math.round(nested);

        const name = String(container?.name || '');
        const nameMatch = name.match(/\d+/);
        if (nameMatch) {
            const parsed = parseInt(nameMatch[0], 10);
            if (Number.isFinite(parsed) && parsed >= 1) return parsed;
        }

        return Math.max(1, Math.round(containerIndex || 1));
    },

    _applyIconSourceToMount(sourceObj, mountObj, copySourceTransform = true) {
        if (!sourceObj || !mountObj) return;
        if (!mountObj._uiOrigAsset) mountObj._uiOrigAsset = mountObj.asset;
        if (mountObj.asset !== sourceObj.asset) mountObj.asset = sourceObj.asset;

        if (copySourceTransform) {
            mountObj.scaleX = sourceObj.scaleX ?? mountObj.scaleX;
            mountObj.scaleY = sourceObj.scaleY ?? mountObj.scaleY;
            mountObj.rotation = sourceObj.rotation ?? mountObj.rotation;
        }

        const cloneValue = (value) => {
            if (value === null || value === undefined) return value;
            if (typeof value !== 'object') return value;
            try { return JSON.parse(JSON.stringify(value)); }
            catch { return value; }
        };

        const overrideKeys = [
            'instanceFillType', 'instanceFillStops', 'instanceFillAngle',
            'instanceFillOffsetX', 'instanceFillOffsetY', 'instanceFillScale',
            'instanceStrokeType', 'instanceStrokeStops', 'instanceStrokeAngle',
            'instanceStrokeOffsetX', 'instanceStrokeOffsetY', 'instanceStrokeScale',
            'instanceStroke', 'instanceColorSource'
        ];
        for (const key of overrideKeys) {
            if (sourceObj[key] !== undefined) {
                mountObj[key] = cloneValue(sourceObj[key]);
            } else if (mountObj[key] !== undefined) {
                delete mountObj[key];
            }
        }
    },

    _applyUiProgressFromGameStructure(progressData, screenId, orientation) {
        const isEditMode = RCHIPL.Editor?.isEditMode?.() ?? false;
        const uiProgressObjs = RCHIPL.Scene?.getByFamily?.('uiProgress') || [];
        if (!uiProgressObjs.length) return;

        const iconSourcesByWorld = new Map();
        let fallbackSource = null;
        const slots = [];
        const slotStates = new Map();
        const slotMounts = new Map();

        const pushBySlot = (map, slotIndex, value) => {
            if (!map.has(slotIndex)) map.set(slotIndex, []);
            map.get(slotIndex).push(value);
        };

        for (const obj of uiProgressObjs) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            const enabled = props.enabled !== false;
            const role = String(props.role || 'slot');
            const orientOk = this._isUiOrientationMatch(props.orientation, orientation);
            const screenOk = this._isUiScreenMatch(props.screenId, screenId);
            const slotIndex = Math.max(1, Math.round(this._uiNum(obj.slotIndex ?? props.slotIndex, 1)));

            if (role === 'iconSource') {
                if (!isEditMode) obj.visible = false;
                if (enabled && orientOk && screenOk) {
                    const worldId = Math.max(1, Math.round(this._uiNum(obj.worldId ?? props.worldId, 1)));
                    if (!iconSourcesByWorld.has(worldId)) iconSourcesByWorld.set(worldId, obj);
                    if (!fallbackSource) fallbackSource = obj;
                }
                continue;
            }

            if (!enabled || !orientOk || !screenOk) continue;

            if (role === 'slot') {
                slots.push({ obj, props, slotIndex });
            } else if (role === 'slotState') {
                pushBySlot(slotStates, slotIndex, { obj, props });
            } else if (role === 'iconMount') {
                pushBySlot(slotMounts, slotIndex, { obj, props });
            }
        }

        slots.sort((a, b) => a.slotIndex - b.slotIndex);

        for (const entry of slots) {
            const slotObj = entry.obj;
            const slotIndex = entry.slotIndex;
            const containerIndex = progressData.pageStart + slotIndex - 1;
            const containerInfo = progressData.byIndex[containerIndex];
            const hasContainer = !!containerInfo?.container;

            slotObj.visible = hasContainer;

            let stateName = 'locked';
            if (hasContainer) {
                if (progressData.allDone) {
                    stateName = 'done';
                } else if (containerIndex < progressData.currentContainerIndex) {
                    stateName = 'done';
                } else if (containerIndex === progressData.currentContainerIndex) {
                    stateName = 'current';
                }
            }

            const states = slotStates.get(slotIndex) || [];
            for (const stateEntry of states) {
                const wanted = String(stateEntry.props.state || 'locked');
                stateEntry.obj.visible = hasContainer && (wanted === stateName);
            }

            const mounts = slotMounts.get(slotIndex) || [];
            for (const mountEntry of mounts) {
                mountEntry.obj.visible = hasContainer;
                if (!hasContainer) continue;
                const worldId = this._extractContainerWorldId(containerInfo.container, containerIndex);
                const sourceObj = iconSourcesByWorld.get(worldId) || fallbackSource;
                const copySourceTransform = mountEntry.props.copySourceTransform !== false;
                this._applyIconSourceToMount(sourceObj, mountEntry.obj, copySourceTransform);
            }
        }
    },

    _updateTemplateUIRuntime(force = false) {
        if (!this._uiTemplateEnabled) return;
        if (!RCHIPL.Scene?.getAll) return;

        const S = RCHIPL.Screen;
        const bounds = S?.getGameVisibleBounds?.() || S?.getVisibleBounds?.();
        if (!bounds) return;

        const isEditMode = RCHIPL.Editor?.isEditMode?.() ?? false;
        const previewMode = this._getUiPreviewOrientationMode();
        const orientation = this._getUiOrientation();
        const screenId = this._getUiScreenId();
        const layoutId = RCHIPL.Layouts?.getCurrentId?.() || '';

        // Fast-path in Play mode: if viewport/state/progression didn't change,
        // skip all family scans (including getByFamily('uiConfig')).
        const rawViewportKey = [
            layoutId,
            isEditMode ? 'edit' : 'play',
            previewMode,
            orientation,
            screenId,
            Math.round(bounds.width),
            Math.round(bounds.height)
        ].join('|');

        if (!force && !isEditMode && !this._uiRuntime.progressDirty && rawViewportKey === this._uiRuntime.rawViewportKey) {
            return;
        }

        const uiConfigObj = this._getUiConfigObject(screenId, orientation);
        const uiConfig = uiConfigObj ? (RCHIPL.FamilyProps?.getAll?.(uiConfigObj) || {}) : {};
        const ratioClass = this._computeUiRatioClass(uiConfig);

        const viewportKey = [
            rawViewportKey,
            ratioClass,
        ].join('|');

        const viewportChanged = force || (viewportKey !== this._uiRuntime.viewportKey);
        if (viewportChanged) {
            this._uiRuntime.rawViewportKey = rawViewportKey;
            this._uiRuntime.viewportKey = viewportKey;
            this._uiRuntime.orientation = orientation;
            this._uiRuntime.ratioClass = ratioClass;
            this._uiRuntime.screenId = screenId;
            this._uiRuntime.topRootInsetPx = 0;

            const shouldFilterByOrientation = !isEditMode || previewMode !== 'auto';
            // Re-query families only on force (layout change) or if not cached yet
            if (force || !this._uiRuntime.cachedRoots) {
                this._uiRuntime.cachedRoots = RCHIPL.Scene?.getByFamily?.('uiRoot') || [];
                this._uiRuntime.cachedActions = RCHIPL.Scene?.getByFamily?.('uiAction') || [];
                this._uiRuntime.cachedProgresses = RCHIPL.Scene?.getByFamily?.('uiProgress') || [];
            }
            const roots = this._uiRuntime.cachedRoots;
            const actions = this._uiRuntime.cachedActions;
            const progresses = this._uiRuntime.cachedProgresses;

            // Pre-normalize once (avoid per-object string allocs in loops)
            const normScreenId = String(screenId || '').trim().toLowerCase();
            const normOrientation = orientation; // already lowercase from _getUiOrientation

            const computeVisible = (obj, props, isIconSource = false) => {
                if (props.enabled === false) return false;
                if (!isEditMode && obj.isInvisible) return false;
                if (!shouldFilterByOrientation) return !(!isEditMode && isIconSource);
                // Inline orientation match (avoid function call + string allocs)
                const om = String(props.orientation || 'both').toLowerCase();
                if (om !== 'both' && om !== '' && om !== normOrientation) return false;
                // Inline screen match (avoid function call + string allocs)
                const sm = String(props.screenId || '').trim().toLowerCase();
                if (sm && sm !== normScreenId) return false;
                if (!isEditMode && isIconSource) return false;
                return true;
            };

            for (const root of roots) {
                const props = RCHIPL.FamilyProps?.getAll?.(root) || {};
                const visible = computeVisible(root, props, false);
                root.visible = visible;
                if (visible) {
                    this._applyUiRootGeometry(root, props, uiConfig, bounds, orientation);

                    // Cache occupied top UI space for portrait HUD offsets (bomb feedback, etc.).
                    const side = String(props.side || 'top').toLowerCase();
                    if (side === 'top') {
                        const h = Math.max(0, (root.height || 0) * Math.abs(root.scaleY ?? 1));
                        const anchorY = root.anchorY ?? 0.5;
                        const offsetY = root.anchorOffsetY ?? 0;
                        const inset = Math.max(0, offsetY + h * (1 - anchorY));
                        if (inset > this._uiRuntime.topRootInsetPx) {
                            this._uiRuntime.topRootInsetPx = inset;
                        }
                    }
                }
            }

            for (const action of actions) {
                const props = RCHIPL.FamilyProps?.getAll?.(action) || {};
                action.visible = computeVisible(action, props, false);
            }

            for (const pObj of progresses) {
                const props = RCHIPL.FamilyProps?.getAll?.(pObj) || {};
                const isIconSource = String(props.role || 'slot') === 'iconSource';
                pObj.visible = computeVisible(pObj, props, isIconSource);
            }
        }

        if (isEditMode) {
            this._uiRuntime.rawViewportKey = rawViewportKey;
            this._uiRuntime.progressKey = '';
            this._uiRuntime.progressDirty = true;
            return;
        }

        // Perf: only recompute progression when viewport changed or progression was marked dirty.
        if (!force && !viewportChanged && !this._uiRuntime.progressDirty) {
            return;
        }

        const progressData = this._collectContainerProgress();
        const progressKey = [
            layoutId,
            orientation,
            screenId,
            progressData.currentContainerIndex,
            progressData.pageStart,
            progressData.signature
        ].join('|');

        if (force || viewportChanged || progressKey !== this._uiRuntime.progressKey) {
            this._uiRuntime.progressKey = progressKey;
            this._uiRuntime.currentContainerIndex = progressData.currentContainerIndex;
            this._uiRuntime.pageStart = progressData.pageStart;
            this._applyUiProgressFromGameStructure(progressData, screenId, orientation);
        }
        this._uiRuntime.progressDirty = false;
    },

    _debugGoToMenu() {
        const menuLayoutId = this._getMenuLayoutId();
        if (!menuLayoutId) return false;
        RCHIPL.Layouts.goTo(menuLayoutId, { showAd: false });
        return true;
    },

    _getAnalyticsLevelName(layoutId = null) {
        const current = layoutId
            || RCHIPL.Layouts?.getCurrentId?.()
            || RCHIPL.Layouts?._currentName
            || '';
        return String(current || '').trim();
    },

    _pokiMeasure(category, what, action) {
        if (!category || !what || !action) return false;
        if (typeof PokiSDK === 'undefined' || typeof PokiSDK.measure !== 'function') return false;
        try {
            PokiSDK.measure(String(category), String(what), String(action));
            return true;
        } catch (_) {
            return false;
        }
    },

    _trackPokiLevelStart(layoutId = null) {
        const levelName = this._getAnalyticsLevelName(layoutId);
        this._pokiLaunchCount = 0;
        if (!levelName) return;
        if (this._pokiLevelStartSent.has(levelName)) return;
        this._pokiLevelStartSent.add(levelName);
        this._pokiMeasure('level', levelName, 'start');
    },

    _trackPokiLevelComplete(layoutId = null) {
        const levelName = this._getAnalyticsLevelName(layoutId);
        if (!levelName) return;
        if (this._pokiLevelCompleteSent.has(levelName)) return;
        this._pokiLevelCompleteSent.add(levelName);
        this._pokiMeasure('level', levelName, 'complete');
        const totalLaunches = Math.max(0, Math.floor(this._pokiLaunchCount || 0));
        const launchBucketCap = Math.max(1, Number(this._pokiLaunchEventCap) || 12);
        const launchBucketLabel = totalLaunches <= launchBucketCap
            ? `launch_total_${totalLaunches}`
            : `launch_total_${launchBucketCap}_plus`;
        this._pokiMeasure('level', levelName, launchBucketLabel);
    },

    _trackPokiLaunch(layoutId = null) {
        const levelName = this._getAnalyticsLevelName(layoutId);
        if (!levelName) return;
        this._pokiLaunchCount = (this._pokiLaunchCount || 0) + 1;
        const cap = Math.max(1, Number(this._pokiLaunchEventCap) || 30);
        if (this._pokiLaunchCount <= cap) {
            this._pokiMeasure('level', levelName, `launch_${this._pokiLaunchCount}`);
        } else if (this._pokiLaunchCount === cap + 1) {
            this._pokiMeasure('level', levelName, `launch_${cap}_plus`);
        }
    },

    _trackPokiSkipClick(layoutId = null) {
        const levelName = this._getAnalyticsLevelName(layoutId);
        if (!levelName) return;
        this._pokiMeasure('level', levelName, 'skip_click');
    },

    _runSecretSaveReset() {
        if (!RCHIPL.Save?._initialized) return false;
        RCHIPL.Save.reset();
        this._uiRuntime.progressDirty = true;
        const currentLayout = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const fallbackLayout = containers[0]?.layouts?.[0] || currentLayout || null;
        const resumeLayout = (typeof RCHIPL._getResumeLayout === 'function')
            ? RCHIPL._getResumeLayout(containers)
            : null;
        const targetLayout = resumeLayout || fallbackLayout;

        if (targetLayout && RCHIPL.Layouts?.goTo) {
            const targetContainer = RCHIPL.Layouts?.getContainerFor?.(targetLayout)
                || containers.find(c => Array.isArray(c?.layouts) && c.layouts.includes(targetLayout));
            if (targetContainer?.name && RCHIPL.GameStructure?.setCurrent) {
                RCHIPL.GameStructure.setCurrent(targetContainer.name, targetLayout);
            }
            RCHIPL.Layouts.goTo(targetLayout, { showAd: false }).catch(() => {});
        } else if (currentLayout && RCHIPL.Layouts?.load) {
            // Fallback: reload current layout if navigation target is unavailable.
            RCHIPL.Layouts.load(currentLayout).catch(() => {});
        }
        return true;
    },

    _updateSecretSaveReset(isEditMode = false) {
        if (isEditMode) {
            this._secretResetHoldStartMs = 0;
            this._secretResetFiredThisHold = false;
            return;
        }

        const now = this._now || performance.now();
        const touchCount = Number(RCHIPL.Input?.touchCount || 0);
        const isMobileRuntime = this._isMobileUaForCatapult()
            || !!RCHIPL.Screen?._isMobileRuntime
            || !!RCHIPL._isMobile;
        const activeHold = isMobileRuntime && touchCount >= 3;

        if (!activeHold) {
            this._secretResetHoldStartMs = 0;
            this._secretResetFiredThisHold = false;
            return;
        }

        if (this._secretResetCooldownUntilMs > now) return;

        if (!this._secretResetHoldStartMs) {
            this._secretResetHoldStartMs = now;
            return;
        }

        if (this._secretResetFiredThisHold) return;

        const heldMs = now - this._secretResetHoldStartMs;
        if (heldMs < this._secretResetHoldRequiredMs) return;

        const didReset = this._runSecretSaveReset();
        if (didReset) {
            this._secretResetFiredThisHold = true;
            this._secretResetCooldownUntilMs = now + this._secretResetCooldownMs;
        }
    },

    _applyAntiPenTestModeFromLayout() {
        const sb = RCHIPL.SoftBody;
        if (!sb) return;

        const raw = String(this._getLayoutVarSafe('antiPenTestMode', 'normal')).trim().toLowerCase();
        const mode = (raw === 'off' || raw === 'noantipen' || raw === 'no_antipen')
            ? 'off'
            : ((raw === 'bouncyonly' || raw === 'bouncy_only')
                ? 'bouncyOnly'
                : ((raw === 'norecovery' || raw === 'no_recovery') ? 'noRecovery' : 'normal'));

        // Reset to baseline every level to avoid stale debug flags.
        sb._disableHardPenetrationRecovery = false;
        sb._disableThinAntiStuckAssist = false;
        sb.setBouncyAntiPenDisabled?.(false);
        // Baseline tuned to reduce "hard-stop" feel on glancing/curved contacts.
        // Very cheap: only changes response coefficients, no extra loops.
        sb._thinAntiStuckDelaySec = 0.35;
        sb._proximityReboundScale = 0.12;
        sb._proximityMinSpeedRatio = 0.25;

        if (mode === 'noRecovery') {
            sb._disableHardPenetrationRecovery = true;
        } else if (mode === 'bouncyOnly') {
            sb.setBouncyAntiPenDisabled?.(true);
        } else if (mode === 'off') {
            sb._disableHardPenetrationRecovery = true;
            sb._disableThinAntiStuckAssist = true;
            sb.setBouncyAntiPenDisabled?.(true);
        }

        this._antiPenTestModeApplied = mode;
    },

    // ─── INIT ───
    async init() {
        const canvas = document.getElementById('game');
        const self = this;

        // Preload Nunito Black font for canvas using FontFace API
        // Use document.baseURI for srcdoc mode (window.location is about:srcdoc there).
        try {
            const fontTimeoutMs = 1200;
            const raceFontTimeout = (promise, label) => Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), fontTimeoutMs))
            ]);
            const fontBase = document.baseURI || window.location.href;
            const fontUrl = new URL('./fonts/Nunito-Black.woff2', fontBase).href;
            if (typeof FontFace === 'function' && document.fonts?.add) {
                const nunitoBlack = new FontFace('Nunito', `url(${fontUrl})`, { weight: '900' });
                const nunitoBlackAlias = new FontFace('Nunito Black', `url(${fontUrl})`, { weight: '900' });
                const loadedNunito = await raceFontTimeout(nunitoBlack.load(), 'Nunito');
                const loadedAlias = await raceFontTimeout(nunitoBlackAlias.load(), 'Nunito alias');
                document.fonts.add(loadedNunito);
                document.fonts.add(loadedAlias);
                // Never block boot forever on Firefox/Poki font readiness.
                if (document.fonts?.ready) {
                    void Promise.race([
                        document.fonts.ready,
                        new Promise(resolve => setTimeout(resolve, fontTimeoutMs))
                    ]).catch(() => {});
                }
                const fontCheck = document.fonts.check('900 48px Nunito');
                const fontAliasCheck = document.fonts.check('900 48px "Nunito Black"');
                
            }
        } catch (e) {
            
        }

        // Core initialization
        RCHIPL.Screen.init(canvas, this.WIDTH, this.HEIGHT);
        RCHIPL.Input.init();
        this._bindBackgroundMusicGestureUnlock();

        // ═══ 2P VERSUS: track raw touch clientX for left/right split ═══
        const _vsTouchHandler = (e) => {
            self._rawTouches = [];
            for (let i = 0; i < e.touches.length; i++) {
                self._rawTouches.push({ clientX: e.touches[i].clientX, id: e.touches[i].identifier });
            }
        };
        canvas.addEventListener('touchstart', _vsTouchHandler, { passive: true });
        canvas.addEventListener('touchmove', _vsTouchHandler, { passive: true });
        canvas.addEventListener('touchend', _vsTouchHandler, { passive: true });
        canvas.addEventListener('touchcancel', _vsTouchHandler, { passive: true });

        // Debug hotkey: M always returns to Menu in runtime (reliable even if input focus changes).
        if (!this._debugMenuHotkeyBound) {
            this._debugMenuHotkeyBound = true;
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                if (e.code !== 'KeyM') return;
                if (RCHIPL.Editor?.isEditMode?.()) return;
                const tag = e.target?.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable) return;
                self._debugGoToMenu();
            });
        }

        // ─── VIEWPORT (camera pan/zoom for Edit mode) ───
        RCHIPL.Viewport.init(canvas, { zoomMin: 0.25, zoomMax: 4 });
        RCHIPL.Viewport.updateDimensions(this.WIDTH, this.HEIGHT);

        // ─── SCENE (universal objects array with bounds calculation) ───
        RCHIPL.Scene.init({
            getBounds: (obj) => {
                // Default bounds using object dimensions and anchor
                const sx = obj.scaleX ?? 1;
                const sy = obj.scaleY ?? 1;
                const ax = obj.anchorX ?? 0.5;
                const ay = obj.anchorY ?? 0.5;
                const baseW = obj.width || 64;
                const baseH = obj.height || 64;
                const w = baseW * Math.abs(sx);
                const h = baseH * Math.abs(sy);
                return { x: obj.x - w * ax, y: obj.y - h * ay, w, h };
            },

            onObjectCreated: (obj) => {
                // Called when objects are dropped from Library
                // Add game-specific defaults here
                obj.scaleX = obj.scaleX ?? 1;
                obj.scaleY = obj.scaleY ?? 1;
                obj.rotation = obj.rotation ?? 0;
                obj.anchorX = obj.anchorX ?? 0.5;
                obj.anchorY = obj.anchorY ?? 0.5;
            }
        });

        // Load project data
        await RCHIPL.loadProjectData('./library.json');

        // Background music plays through the <audio> element + webm file path,
        // never through Sampler.playComposition. Skip the expensive composition
        // stem prewarm at each layout load — pure CPU waste on mobile low-end.
        if (RCHIPL.Sampler) {
            RCHIPL.Sampler._skipCompositionPrewarm = true;
        }

        // Pre-fetch the background music webm so it sits in the HTTP cache before
        // the first user gesture. Mobile browsers (iOS especially) ignore
        // <audio preload="auto"> until a gesture and then block play() on network
        // download. An explicit fetch populates the cache so audioEl.play() hits
        // it instantly and starts without delay.
        if (this._backgroundMusicFileSrc) {
            try {
                fetch(this._backgroundMusicFileSrc, { cache: 'force-cache' }).catch(() => {});
            } catch (_) {}
        }
        // Runtime perf safety for this game:
        // hard-disable background jobs (test mode) to eliminate any mid-level spikes
        // from lazy asset registration / audio bake.
        if (RCHIPL._projectData) {
            // Keep anti-penetration behavior aligned with ploptheblob_newcontrol:

                RCHIPL._projectData.performance.alwaysRegisterAssets.length === 0) {

                    'fingerBomb',
