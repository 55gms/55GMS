    // ─── RESTART LEVEL (clean restart during gameplay) ───
    _restartInFlight: false,
    async restartLevel() {
        if (this._restartInFlight) return false;
        this._restartInFlight = true;
        try {
            
            RCHIPL.Events.emit('OnLevelRestart', { layoutId: RCHIPL.Layouts?.getCurrentId?.() || '' });

            this._pendingBombSpawning = false;

            // Layouts.restart() handles: gameplayStop → commercialBreak → reload → gameplayStart
            // cleanupBombs is called via family level onExit (triggered by load → Families.enter)
            await RCHIPL.Layouts.restart();

            
        } finally {
            this._restartInFlight = false;
        }
    },


    // ─── SKIP LEVEL ───
    // Progresses to the next layout/container without ad.
    // Reuses Layouts.win() so world-map / container progression stay on the same path.
    async skipLevel() {
        if (this._skipLevelInFlight) return false;
        if (RCHIPL.Editor?.isEditMode?.()) return false;

        const currentLayout = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
        if (!currentLayout) return false;

        this._skipLevelInFlight = true;
        try {
            this._trackPokiSkipClick(currentLayout);
            RCHIPL.Events.emit('OnLevelSkip', { layoutId: currentLayout });
            // Fire confetti on the next level's arrival as reward confirmation (Poki guideline)
            this._skipArrivalConfettiPending = true;

            const levels = RCHIPL.Save?.get?.('levels') || {};
            const prevLevelSave = levels[currentLayout] || {};
            levels[currentLayout] = {
                ...prevLevelSave,
                completed: true,
                star: !!prevLevelSave.star,
                skipped: true
            };
            RCHIPL.Save?.set?.('levels', levels);
            this._markUiProgressDirty();
            RCHIPL.GameStructure?.completeLevel?.(currentLayout, 0);

            this.levelComplete = true;
            this.levelFailed = false;
            this.defeatCheckActive = false;
            this._resetLauncherTransientState();
            this._clearBombSpawnTimers();

            const prevDisableAds = RCHIPL.Platform?._disableCommercialBreaks;
            if (RCHIPL.Platform) {
                RCHIPL.Platform._disableCommercialBreaks = true;
            }
            try {
                if (this._startWorldMapAdvanceAfterContainerWin(currentLayout)) {
                    return true;
                }
                const didWin = await RCHIPL.Layouts.win();
                return !!didWin;
            } finally {
                if (RCHIPL.Platform) {
                    RCHIPL.Platform._disableCommercialBreaks = prevDisableAds;
                }
            }
        } finally {
            this._skipLevelInFlight = false;
        }
    },


    _resetLauncherTransientState() {
        this._launcherFrozenAngleDeg = null;
        this._launcherCharge = 0;
        this._launcherIsCharging = false;
        this._catapultDragStartX = 0;
        this._catapultDragStartY = 0;
        this._catapultDragX = 0;
        this._catapultDragY = 0;
        this._catapultHasAimSample = false;
        this._justExploded = false;
        this._isHolding = false;
        this.isTouching = false;
    },


    // ─── CLEANUP BOMBS ───
    cleanupBombs() {
        this._clearBombSpawnTimers();
        this._resetLauncherTransientState();

        // Reset spawn flag (in case we interrupted an async spawn)
        this._pendingBombSpawning = false;

        // Remove active bomb softbody and scene object
        if (this.activeBomb) {
            if (this.activeBomb.softbody) {
                RCHIPL.SoftBody.destroy(this.activeBomb.softbody);
            }
            if (this.activeBomb.obj) {
                const idx = RCHIPL.Scene.objects.indexOf(this.activeBomb.obj);
                if (idx >= 0) RCHIPL.Scene.objects.splice(idx, 1);
            }
        }
        this.activeBomb = null;

        // Remove pending bomb softbody and scene object
        if (this.pendingBomb) {
            if (this.pendingBomb.softbody) {
                RCHIPL.SoftBody.destroy(this.pendingBomb.softbody);
            }
            if (this.pendingBomb.obj) {
                const idx = RCHIPL.Scene.objects.indexOf(this.pendingBomb.obj);
                if (idx >= 0) RCHIPL.Scene.objects.splice(idx, 1);
            }
        }
        this.pendingBomb = null;

        // Reset tutorial tap hint runtime state
        this._tapHintShown = false;
        this._tapHintTimer = 0;
        this._tapHintLowSpeedTime = 0;
        this._tapHintPhase = 0;
        this._tapHintPrevCx = null;
        this._tapHintPrevCy = null;

        // ═══ 2P VERSUS: cleanup per-player bombs ═══
        this._cleanupVsBombs();

        // Clear particles
        this._fuseParticles = [];
        this._smokeParticles = [];
        this._emberParticles = [];
        this._emotionBubbles = [];
        this._clearTutorialWaterHints();

        // Reset launch hint (but NOT _launchHintDismissed — persists across retries)
        this._launchHintActive = false;
        this._launchHintPhase = 0;
        this._catapultTapMissCount = 0;

        // Clear puff balls (explosion smoke clouds)
        this._puffBalls = [];

        // Clear active puffs + remove their scene objects (prevents leak on restart)
        if (this._activePuffs) {
            for (const puff of this._activePuffs) {
                if (puff.sceneObj) {
                    const oi = RCHIPL.Scene.objects.indexOf(puff.sceneObj);
                    if (oi >= 0) RCHIPL.Scene.objects.splice(oi, 1);
                }
            }
            this._activePuffs = [];
        }

        // Clear reinflate queue
        this._reinflateQueue = [];

        // Clear squash/spring animations (they hold refs to old objects)
        this._squashAnims = [];
        this._springAnims = [];

        // Clear transient full-screen visual states so Edit mode cannot keep a stale veil.
        this._victoryFlash = 0;
        this._victoryYes = null;

        // Clear springboards (handled by RCHIPL.Springboard.clear())
        if (RCHIPL.Springboard) {
            RCHIPL.Springboard.clear();
        }

        // Clear new gameplay family modules
        if (RCHIPL.Sticky) RCHIPL.Sticky.clear();
        if (RCHIPL.Bouncy) RCHIPL.Bouncy.clear();
        if (RCHIPL.Magnet) RCHIPL.Magnet.clear();
        if (RCHIPL.Move) RCHIPL.Move.clear();
        if (RCHIPL.Switch) RCHIPL.Switch.clear();
        if (RCHIPL.Portal) RCHIPL.Portal.clear();

        // ═══ CLEANUP STUNTMAN RIGIDBODIES ═══
        if (this.savedBlobs) {
            for (const blob of this.savedBlobs) {
                if (blob.softbody?._rigidProxy) {
                    const proxy = blob.softbody._rigidProxy;
                    Matter.Composite.remove(RCHIPL.Physics._engine.world, proxy);
                    // Also remove from _bodies array
                    const idx = RCHIPL.Physics._bodies.indexOf(proxy);
                    if (idx !== -1) RCHIPL.Physics._bodies.splice(idx, 1);
                    blob.softbody._rigidProxy = null;
                    blob.softbody._isPinnedSleep = false;
                }
            }
        }

        
    },

    _clearBombSpawnTimers() {
        if (this._introBombTimeout) {
            clearTimeout(this._introBombTimeout);
            this._introBombTimeout = null;
        }
        if (this._pendingBombTimeout) {
            clearTimeout(this._pendingBombTimeout);
            this._pendingBombTimeout = null;
        }
        if (this._nextBombTimeout) {
            clearTimeout(this._nextBombTimeout);
            this._nextBombTimeout = null;
        }
        this._pendingBombSpawning = false;
    },

    _ensureIntroParallaxCameraFx() {
        if (!RCHIPL.CameraFX) return;
        const introDurationMs = Math.max(0, Number(this._introCameraFxDurationMs) || 1000);
        const introPreset = (this._disableIntroZoomFx === true)
            ? []
            : [
                { type: 'easing', prop: 'zoom', from: 1.5, to: 1.0, duration: introDurationMs, ease: 'outCubic' }
            ];

        // Required headroom for cached layers during intro zoom (prevents clipping).
        // Keep it tight to limit cache surface growth.
        RCHIPL.CameraFX.maxFxScale = Math.max(1.55, Number(RCHIPL.CameraFX.maxFxScale) || 1);

        if (!RCHIPL.CameraFX._presets || typeof RCHIPL.CameraFX._presets !== 'object') {
            RCHIPL.CameraFX.loadPresets();
        }
        RCHIPL.CameraFX._presets.intro = introPreset;
        if (RCHIPL._projectData?.cameraFxPresets) {
            RCHIPL._projectData.cameraFxPresets.intro = JSON.parse(JSON.stringify(introPreset));
        }

        const bindings = RCHIPL.Events?.getBindings?.() || {};
        const startBindings = Array.isArray(bindings.OnLevelStart) ? bindings.OnLevelStart : [];
        const hasIntroTrigger = startBindings.some((b) => b?.type === 'playCameraFx' && b?.asset === 'intro');
        if (!hasIntroTrigger) {
            RCHIPL.Events?.bind?.('OnLevelStart', {
                type: 'playCameraFx',
                asset: 'intro',
                cooldownMs: 80
            });
        }
    },

    _ensureCameraFxLayerWeights() {
        this._ensureIntroParallaxCameraFx();
        const layerSources = [RCHIPL._projectData?.layers, RCHIPL._library?.layers].filter(Boolean);
        const setWeight = (name, weight) => {
            for (const layers of layerSources) {
                if (layers?.[name]) {
                    layers[name].cameraFxWeight = weight;
                }
            }
        };
        const setCached = (name, enabled) => {
            for (const layers of layerSources) {
                if (layers?.[name]) {
                    layers[name].cached = !!enabled;
                }
            }
        };

        setWeight('BGelements', 0.4);      // 1.5 global zoom -> 1.2 on BG
        setWeight('BGelements_00', 0.4);
        setWeight('BGcolor', 0.4);
        setWeight('BGcolor_00', 0.4);
        setWeight('BG', 0.4);
        setWeight('BG_00', 0.4);
        setWeight('Water', 1.1);           // 1.5 global zoom -> 1.55 on Water
        setWeight('Water_00', 1.1);
        // Important: keep Water uncached so intro zoom doesn't trigger viewport cache rebuilds.
        setCached('Water', false);
        setCached('Water_00', false);
        setWeight('Main', 1.0);            // 1.5 -> 1.0
        setWeight('Main_00', 1.0);
        setWeight('FinishLine', 1.0);      // Match Main exactly during intro dezoom
        setWeight('FinishLine_00', 1.0);
        setWeight('UI', 0);
        setWeight('UI_00', 0);
    },

    _primeLevelIntroCameraFx(layoutName = null) {
        const targetLayoutName = layoutName
            || RCHIPL.Layouts?.getCurrentId?.()
            || RCHIPL.Layouts?._currentName
            || null;
        const layoutZoom = parseFloat(RCHIPL.Layouts.getVar('zoom', targetLayoutName)) || 0.5;
        const introDurationMs = Math.max(0, Number(this._introCameraFxDurationMs) || 1000);
        const introUnlockAt = performance.now() + introDurationMs;

        this._ensureCameraFxLayerWeights();
        this._levelIntroUnlockAtMs = introUnlockAt;
        this._tutorialHintsUnlockAtMs = introUnlockAt;
        this._screenEdgeCollidersUnlockAtMs = introUnlockAt;

        RCHIPL.Camera.zoom = layoutZoom;
        RCHIPL.Camera.targetZoom = layoutZoom;
        RCHIPL.Camera.z = RCHIPL.Camera.baseZ / RCHIPL.Camera.zoom;
        Game.zoom = layoutZoom;

        if (this._disableIntroZoomFx !== true) {
            RCHIPL.CameraFX?.play?.('intro');
        }
    },

    _resetWorldMapCamera() {
        RCHIPL.CameraFX?.clear?.();
        this._levelIntroUnlockAtMs = 0;
        this._tutorialHintsUnlockAtMs = 0;
        this._screenEdgeCollidersUnlockAtMs = 0;
        if (RCHIPL.Camera) {
            RCHIPL.Camera.zoom = 1;
            RCHIPL.Camera.targetZoom = 1;
            RCHIPL.Camera.z = RCHIPL.Camera.baseZ / RCHIPL.Camera.zoom;
        }
        if (RCHIPL.Viewport) {
            RCHIPL.Viewport.zoom = 1;
            if (RCHIPL.Viewport.pan) {
                RCHIPL.Viewport.pan.x = 0;
                RCHIPL.Viewport.pan.y = 0;
            }
        }
        this.zoom = 1;
    },


        // ─── INIT LEVEL (called when entering play mode) ───
    initLevel() {
        // Reward confirmation when arriving after a skip (Poki guideline: confirmation feedback)
        if (this._skipArrivalConfettiPending) {
            this._skipArrivalConfettiPending = false;
            if (RCHIPL.FX?.spawnConfetti) {
                RCHIPL.FX.spawnConfetti({ count: 50, duration: 4 });
            }
        }

        this._ensureCameraFxLayerWeights();
        this._applyAntiPenTestModeFromLayout();
        const introDurationMs = Math.max(0, Number(this._introCameraFxDurationMs) || 1000);
        const introUnlockAt = (Number(this._levelIntroUnlockAtMs) > performance.now())
            ? Number(this._levelIntroUnlockAtMs)
            : (performance.now() + introDurationMs);
        this._levelIntroUnlockAtMs = introUnlockAt;
        this._tutorialHintsUnlockAtMs = introUnlockAt;
        this._screenEdgeCollidersUnlockAtMs = introUnlockAt;

        // Clean up any leftover bombs from previous session
        this.cleanupBombs();

        // Launch hint policy:
        // - auto on first N onboarding levels
        // - hidden by default afterwards, until struggle reminder triggers
        const currentLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || null;
        const globalLevelOrdinal = this._getGlobalLevelOrdinal(currentLayoutId);
        const autoLevels = Math.max(0, parseInt(this._launchHintAutoLevels, 10) || 0);
        this._launchHintOnboardingLevel = Number.isFinite(globalLevelOrdinal)
            && globalLevelOrdinal <= autoLevels;
        this._launchHintForcedByStruggle = false;
        this._launchHintExplosionsThisLevel = 0;
        this._launchHintDismissed = this._launchHintOnboardingLevel ? false : true;
        this._launchHintActive = false;
        this._launchHintPhase = 0;
        this._catapultTapMissCount = 0;
        this._resetSkipHintState();

        // Hide UIFinish layer (victory YES) at start
        this._victoryYes = null;
        // Invalidate cached YES render so each level can use its own instance colors.
        this._victoryYesCache = null;
        this._clearSkipRewardModalState({ resumeSdk: false });

        // Restore UIFinish to disabledLayers if it was hidden before victory
        if (this._wasUIFinishHidden) {
            const currentLayoutName = RCHIPL.Layouts?.getCurrentId?.();
            const currentLayout = currentLayoutName ? RCHIPL.Layouts._all?.[currentLayoutName] : null;
            if (currentLayout) {
                if (!currentLayout.disabledLayers) currentLayout.disabledLayers = [];
                if (!currentLayout.disabledLayers.includes('UIFinish')) {
                    currentLayout.disabledLayers.push('UIFinish');
                }
            }
            this._wasUIFinishHidden = false;
        }

        this._setVictoryYesRuntimeHidden(true);
        const yesObjs = RCHIPL.Scene?.getAll?.().filter(o => o.asset === 'superYess');
        yesObjs?.forEach(obj => {
            obj.visible = false;
            obj._origScaleX = obj.scaleX;
            obj._origScaleY = obj.scaleY;
        });

        // Reset cached scene refs (will be re-cached on first update)
        this._cachedSceneRefs = false;
        this._railObj = null;
        this._railLeftObj = null;
        this._railRightObj = null;
        this._bombUIObjs = null;
        this._buttonObjs = null;
        this._soundToggleButtonObj = null;
        this._borderObjs = null;
        this._skipRewardPopupObj = null;
        this._skipRewardCloseObj = null;
        this._skipRewardValidateObj = null;
        this._skipHintArrowObj = null;

        // Read launcher spawner parameters (new control mode).
        this._hideBombSpawnerFamilyInPlay();
        this._hideExplosionTriggerFamilyInPlay();
        this._refreshBombSpawnerConfig();

        // Find all target blobs (softbodies that are NOT projectiles)
        this.targetBlobs = [];
        this.savedBlobs = [];
        this.levelComplete = false;
        this.levelFailed = false;
        this._levelStartTime = performance.now();
        if (this._celebrationInterval) clearInterval(this._celebrationInterval);
        this._celebrationInterval = null;
        if (this._celebrationWaveTimeout) clearTimeout(this._celebrationWaveTimeout);
        this._celebrationWaveTimeout = null;
        if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
        this._victoryTimeout = null;
        this.defeatCheckActive = false;
        this.defeatCheckTimer = 0;
        this._updateScreenEdgeColliderState(true);

        // Reset grayscale filter
        this._setCanvasFilter('');

        // Get softbodies from the scene that are targets (isSticky = true means they're level blobs)
        if (RCHIPL.SoftBody?._softbodies) {
            for (const sb of RCHIPL.SoftBody._softbodies) {
                // Skip projectile blobs (bombs we throw)
                if (sb._sceneObj?.isProjectile) continue;

                // Get blob centroid for pin anchor calculation
                let cx = 0, cy = 0;
                const verts = sb.envelopes?.[0]?.vertices;
                if (verts) {
                    for (const v of verts) { cx += v.x; cy += v.y; }
                    cx /= verts.length;
                    cy /= verts.length;
                }

                // Raycast down to find platform contact point
                const anchorY = this.raycastDown(cx, cy);

                // This is a target blob - add to tracking with pin info
                // Joint will be created when blob touches platform
                this.targetBlobs.push({
                    softbody: sb,
                    sceneObj: sb._sceneObj,
                    saved: false,
                    // Pin system: wait for contact, then permanent until collision/explosion
                    pinned: true,
                    settled: false,  // Will be true when contact detected
                    activated: false,  // Once unpinned, can never be pinned again
                    anchorX: cx,
                    anchorY: anchorY,
                    settleDropDist: Math.max(0, anchorY - cy),
                    // Bubble timing (desync)
                    bubbleDelay: 700,   // Synced: all blobs appear together
                    bubbleOffset: 0,    // Synced: all blobs disappear together
                    // Random "want" emoji for this blob
                    bubbleWantEmoji: ['🌊', '🏄', '🐟', '👇', '🤿', '🙏', '👀', '🤩'][Math.floor(Math.random() * 8)],
                    // Tutorial hint stays until first real interaction (collision/explosion)
                    _tutorialHintTouched: false,
                    _pendingHideApplied: false
                });
            }
        }

        // Activate easiest-to-settle blobs first (closest to floor/contact).
        this.targetBlobs.sort((a, b) => (a.settleDropDist || 0) - (b.settleDropDist || 0));

        // Push blobs behind collision/gameplay elements (hide vertex penetration)
        // Find the minimum z on each blob's layer, then place blobs below it
        for (const blob of this.targetBlobs) {
            const obj = blob.sceneObj;
            if (!obj) continue;
            const layer = obj.layer || 'Main';
            let minZ = Infinity;
            for (const o of RCHIPL.Scene.objects) {
                if (!o || o.type === 'softbody' || o.layer !== layer) continue;
                const z = parseFloat(o.z) || 0;
                if (z < minZ) minZ = z;
            }
            obj.z = (minZ === Infinity ? 0 : minZ) - 1;
        }

        // Create runtime tutorial icons on the same layer as each blob
        this._initTutorialWaterHints();

        // ═══ STAGGERED SETTLING: activate blobs with low parallelism ═══
        // Avoids CPU spike from all blobs simulating at once
        const SETTLE_BATCH_SIZE = Math.max(1, Math.min(this.settleInitialBatch ?? 2, this.targetBlobs.length));
        for (let i = 0; i < this.targetBlobs.length; i++) {
            const blob = this.targetBlobs[i];
            const sb = blob.softbody;
            const verts = sb.envelopes?.[0]?.vertices;

            // Reset velocity to zero for ALL blobs (ensure clean start)
            // In Verlet: velocity = pos - oldPos, so set oldPos = pos for zero velocity
            if (verts) {
                for (const v of verts) {
                    v.ox = v.x;
                    v.oy = v.y;
                }
            }

            if (i < SETTLE_BATCH_SIZE) {
                // First batch: active immediately
                sb._pendingSettle = false;
                if (this.hidePendingSettleVisuals) this._setPendingBlobVisibility(blob, false);
            } else {
                // Others: wait their turn (physics paused)
                sb._pendingSettle = true;
                if (this.hidePendingSettleVisuals) this._setPendingBlobVisibility(blob, true);
            }
        }

        // Initialize settle timeout tracking
        this._lastActivationTime = performance.now();

        // Get bomb count from layout variable (or fallback to blob count)
        const layoutBombs = RCHIPL.Layouts.getVar('bomb');
        this.bombsTotal = layoutBombs ?? Math.max(3, this.targetBlobs.length);
        this.bombsRemaining = this.bombsTotal;

        // Star system: position of the "star bomb" (1-indexed)
        // Player earns star if they win BEFORE using this bomb
        const layoutVarDefs = RCHIPL.Layouts?.getVarDefs?.() || {};
        if (Object.prototype.hasOwnProperty.call(layoutVarDefs, 'starBomb')) {
            this.starBomb = parseInt(RCHIPL.Layouts.getVar('starBomb')) || 0;
        } else {
            this.starBomb = 0;
        }
        this.earnedStar = false;

        // Get zoom from layout variable (allows per-level zoom control)
        const layoutZoom = parseFloat(RCHIPL.Layouts.getVar('zoom')) || 0.5;
        Game.zoom = layoutZoom;  // Update global for viewport preview

        
        const analyticsLevelId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
        RCHIPL.Events.emit('OnLevelStart', { layoutId: analyticsLevelId, bombsTotal: this.bombsTotal });
        this._trackPokiLevelStart(analyticsLevelId);

        // Apply final layout zoom immediately (no intro zoom animation)
        RCHIPL.Camera.zoom = layoutZoom;
        RCHIPL.Camera.targetZoom = layoutZoom;
        RCHIPL.Camera.z = RCHIPL.Camera.baseZ / RCHIPL.Camera.zoom;

        // ═══ GPE: Initialize Voronoi destructibles ═══
        if (RCHIPL.Voronoi) {
            RCHIPL.Voronoi.initDestructibles();
        }

        // ═══ GPE: Initialize Suspended platforms ═══
        if (RCHIPL.Suspended) {
            RCHIPL.Suspended.init();
        }

        // ═══ GPE: Initialize Bridges ═══
        if (RCHIPL.Bridge) {
            RCHIPL.Bridge.init();
        }

        // ═══ GPE: Initialize Pivots ═══
        if (RCHIPL.Pivot) {
            RCHIPL.Pivot.init();
        }

        // ═══ GPE: Initialize Wind Zones ═══
        if (RCHIPL.WindZone) {
            RCHIPL.WindZone.init();
        }

        // ═══ GPE: Initialize Zero-G Zones ═══
        if (RCHIPL.ZeroGZone) {
            RCHIPL.ZeroGZone.init();
        }

        // ═══ GPE: Initialize Springboards ═══
        if (RCHIPL.Springboard) {
            RCHIPL.Springboard.init();
        }

        // ═══ GPE: Initialize new gameplay families ═══
        if (RCHIPL.Sticky) RCHIPL.Sticky.init();
        if (RCHIPL.Bouncy) RCHIPL.Bouncy.init();
        if (RCHIPL.Magnet) RCHIPL.Magnet.init();
        if (RCHIPL.Move) RCHIPL.Move.init();
        if (RCHIPL.Switch) RCHIPL.Switch.init();
        if (RCHIPL.Portal) RCHIPL.Portal.init();

        // ═══ 2P VERSUS: init level and spawn kings+bombs — skip 1P bomb spawn ═══
        if (this._versusMode && this._vs) {
            this._initVersusLevel();
            return;
        }

        // Create first pending bomb shortly after level init
        const self = this;
        this._introBombTimeout = setTimeout(() => {
            this._introBombTimeout = null;
            if (RCHIPL.Editor?.isEditMode()) return;  // Don't spawn if switched to edit
            if (self.state !== 'PLAYING' || self.levelComplete || self.levelFailed) return;
            self.createPendingBomb();
            self.updateBombUI();
        }, 100);
    },


    // ─── CHECK BLOB IN WATER ───
    checkBlobsInWater() {
        if (!RCHIPL.Liquid?._liquids || this.targetBlobs.length === 0) return;

        const water = this._getPrimaryWaterLiquid();
        if (!water) return;

        // Water bounds
        const waterTop = water.y - water.height / 2;
        const waterLeft = water.x - water.width / 2;
        const waterRight = water.x + water.width / 2;

        for (const blob of this.targetBlobs) {
            // Get blob center and bounds from softbody vertices
            const sb = blob.softbody;
            if (!sb?.envelopes?.[0]?.vertices) continue;

            const verts = sb.envelopes[0].vertices;
            // Single pass: centroid + lowestY + velocity
            let cx = 0, cy = 0, lowestY = -Infinity;
            let vx = 0, vy = 0;
            for (const v of verts) {
                cx += v.x;
                cy += v.y;
                if (v.y > lowestY) lowestY = v.y;
                vx += (v.x - (v.ox || v.x));
                vy += (v.y - (v.oy || v.y));
            }
            const vLen = verts.length;
            cx /= vLen; cy /= vLen;
            vx /= vLen; vy /= vLen;
            const speed = Math.sqrt(vx * vx + vy * vy);

            // Check if blob touches water surface (for splash effect)
            const touchingWater = lowestY > waterTop && cx > waterLeft && cx < waterRight;
            const wasInWater = blob._wasInWater || false;

            // Splash on first water contact, or on re-entry with high velocity
            if (touchingWater && !wasInWater) {
                const isFirstSplash = !blob._hasSplashed;
                const speedThreshold = isFirstSplash ? 0 : 8; // First time: always, after: need speed

                if (speed >= speedThreshold && RCHIPL.FX?.spawnWaterSplash) {
                    const intensity = Math.min(1, speed / 15);
                    const impactVel = { x: vx * 30, y: vy * 30 };
                    RCHIPL.FX.spawnWaterSplash(cx, waterTop, impactVel, Math.max(0.3, intensity));
                    blob._hasSplashed = true;
                    RCHIPL.Events.emit('OnWaterSplash', { x: cx, y: waterTop, speed });
                }
            }
            blob._wasInWater = touchingWater;

            if (blob.saved) continue; // Already saved - skip save logic

            // ═══ 2P: skip 1P save logic for king blobs (handled by _checkVersusKingsInWater) ═══
            if (this._versusMode && blob._isVersusKing) continue;

            // Check if blob is in water (for saving)
            // Use lowest point instead of center - blobs float so center may stay above surface
            if (lowestY > waterTop && cx > waterLeft && cx < waterRight) {
                blob.saved = true;
                this.savedBlobs.push(blob);

                // ═══ SPLASH: force splash+wave before stuntman conversion kills the softbody path ═══
                if (speed > 1) {
                    const splashIntensity = Math.min(1.5, speed / 10);
                    const impactVel = { x: vx * 30, y: vy * 30 };
                    // Visual particle splash
                    RCHIPL.FX?.spawnWaterSplash?.(cx, waterTop, impactVel, Math.max(0.4, splashIntensity));
                    // Surface wave disturbance (proportional to impact speed)
                    const waveForce = Math.min(12, speed * 1.5);
                    RCHIPL.Liquid?._disturbSurfaceWide?.(water, cx, waveForce, 80);
                }

                // ═══ STUNTMAN SYSTEM: Switch softbody → rigidbody for performance ═══
                if (blob.softbody) {
                    const sb = blob.softbody;
                    const verts = sb.envelopes?.[0]?.vertices || [];

                    // Reuse vx/vy already computed above (single-pass centroid+velocity)
                    const avgVx = vx, avgVy = vy;

                    // Calculate blob radius from current vertex positions (includes extend)
                    let avgRadius = 0;
                    for (const v of verts) {
                        const dx = v.x - cx, dy = v.y - cy;
                        avgRadius += Math.sqrt(dx * dx + dy * dy);
                    }
                    avgRadius = verts.length > 0 ? avgRadius / verts.length : 40;
                    // Apply bodyExpand (collision compensation) - read from template like RCHIPL.SoftBody does
                    const template = RCHIPL.SoftBody?._library?.[sb.templateName]
                        || RCHIPL._projectData?.softbodies?.[sb.templateName];
                    const bodyExpand = template?.bodyExpand ?? sb.bodyExpand ?? 0;
                    avgRadius += bodyExpand;

                    // Create rigidbody "stuntman" circle
                    const stuntman = Matter.Bodies.circle(cx, cy, avgRadius * 1.1, {
                        restitution: 0.3,
                        friction: 0.1,
                        frictionAir: 0,     // No air drag - water drag handles it
                        density: 0.001,     // Default density - buoyancy force scales with mass
                        label: 'blobStuntman'
                    });
                    // Set custom property AFTER creation (Matter.js doesn't copy from options)
                    stuntman._isStuntman = true;
                    Matter.Body.setVelocity(stuntman, { x: avgVx, y: avgVy });
                    Matter.Composite.add(RCHIPL.Physics._engine.world, stuntman);
                    RCHIPL.Physics._bodies.push(stuntman);  // Register for Water system

                    // Scale restX/restY to match actual blob size (includes extend)
                    let templateRadius = 0;
                    for (const v of verts) {
                        templateRadius += Math.sqrt(v.restX * v.restX + v.restY * v.restY);
                    }
                    templateRadius = verts.length > 0 ? templateRadius / verts.length : 50;
                    const sizeRatio = templateRadius > 0 ? (avgRadius - bodyExpand) / templateRadius : 1;
                    for (const v of verts) {
                        v.restX *= sizeRatio;
                        v.restY *= sizeRatio;
                        v.x = v.restX;
                        v.y = v.restY;
                        v.ox = v.restX;
                        v.oy = v.restY;
                    }

                    // Compensate face scale for rescaled rest positions
                    // (bodyExpand ratio changes when restRadius changes)
                    sb._faceScaleCompensation = sizeRatio;

                    // Mark softbody to follow rigidbody (skip all physics)
                    sb._rigidProxy = stuntman;
                    sb._isPinnedSleep = true;  // Skip softbody physics

                    
                }
                

                // Play the saved-state hint with the same pop timing as tutorial water drop.
                this._triggerSavedHappyHint(blob);

                // Check victory
                if (this.savedBlobs.length === this.targetBlobs.length) {
                    this.levelComplete = true;
                    this.defeatCheckActive = false;
                    this._clearBombSpawnTimers();
                    // Reset grayscale immediately on victory
                    this._setCanvasFilter('');

                    // ═══ STAR SYSTEM: Calculate if star was earned ═══
                    const bombsUsed = this.bombsTotal - this.bombsRemaining;
                    this.earnedStar = this.starBomb > 0 && bombsUsed < this.starBomb;

                    // Save level progress
                    const layoutId = RCHIPL.Layouts._currentName;
                    if (layoutId) {
                        const levels = RCHIPL.Save.get('levels') || {};
                        const prevLevelSave = levels[layoutId] || {};
                        levels[layoutId] = {
                            ...prevLevelSave,
                            completed: true,
                            star: !!(prevLevelSave.star || this.earnedStar),
                            skipped: false
                        };
                        RCHIPL.Save.set('levels', levels);
                        this._markUiProgressDirty();
                    }

                    
                    const winAnalyticsLevelId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
                    RCHIPL.Events.emit('OnLevelWin', { layoutId: winAnalyticsLevelId, bombsUsed: bombsUsed, earnedStar: this.earnedStar });
                    this._trackPokiLevelComplete(winAnalyticsLevelId);
                    // Spawn confetti from bottom corners!
                    if (RCHIPL.FX?.spawnConfetti) {
                        // Extra golden confetti if star earned!
                        const confettiCount = this.earnedStar ? 80 : 50;
                        RCHIPL.FX.spawnConfetti({ count: confettiCount, duration: 4 });
                    }
                    // Start victory YES animation
                    this._startVictoryYes();

                    // Looping party emojis.
                    // Keep the exact victory frame light: YES prerender + confetti already happen here.
                    // Include star emojis if star was earned
                    const partyEmojis = this.earnedStar
                        ? ['🎉', '🥳', '🎊', '⭐', '✨', '🌟', '💫']
                        : ['🎉', '🥳', '🎊', '🙌', '✨', '🎆'];
                    const spawnCelebrationWave = () => {
                        if (this.levelComplete) {
                            for (const savedBlob of this.savedBlobs) {
                                const delay = Math.random() * 300;
                                setTimeout(() => {
                                    // Safety: callbacks may fire after mode/layout transition
                                    if (!this.levelComplete || this.state !== 'PLAYING') return;
                                    // Emoji
                                    const emoji = partyEmojis[Math.floor(Math.random() * partyEmojis.length)];
                                    this._showEmotionBubble(savedBlob, emoji, 1.0);
                                    // IMPORTANT: do not wake/impulse saved blobs during YES.
                                    // They are intentionally converted to rigid "stuntman" proxies,
                                    // and reactivating softbody physics here can create jitter/explosions.
                                }, delay);
                            }
                        }
                    };
                    // Start looping celebration with a short defer to avoid a visible hitch on YES.
                    this._celebrationWaveTimeout = setTimeout(() => {
                        this._celebrationWaveTimeout = null;
                        if (!this.levelComplete || this.state !== 'PLAYING') return;
                        spawnCelebrationWave();
                    }, 220);
                    this._celebrationInterval = setInterval(spawnCelebrationWave, 1600);

                    // Go to next level after 1.25 seconds
                    const winLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
                    this._victoryTimeout = setTimeout(() => {
                        if (this._celebrationInterval) {
                            clearInterval(this._celebrationInterval);
                            this._celebrationInterval = null;
                        }
                        if (this._celebrationWaveTimeout) {
                            clearTimeout(this._celebrationWaveTimeout);
                            this._celebrationWaveTimeout = null;
                        }
                        this._victoryTimeout = null;
                        // Don't transition if switched to Edit mode
                        if (RCHIPL.Editor?.isEditMode()) return;
                        if (!this.levelComplete || this.levelFailed || this.state !== 'PLAYING') return;
                        const activeLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
                        if (activeLayoutId !== winLayoutId) return;

                        // End-of-container flow: go through world map if available,
                        // then auto-move marker and launch next world.
                        if (this._startWorldMapAdvanceAfterContainerWin(activeLayoutId)) return;
                        // Default flow: advance to next level/container directly.
                        RCHIPL.Layouts.win();
                    }, 1250);
                }
            }
        }

        // ═══ 2P VERSUS: check king water detection ═══
        if (this._versusMode && this._vs?.roundActive) {
            this._checkVersusKingsInWater();
        }
    },

    _setCanvasFilter(filterValue = '') {
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const nextValue = filterValue || '';
        if (this._lastCanvasFilterValue === nextValue) return;
        canvas.style.filter = nextValue;
        this._lastCanvasFilterValue = nextValue;
    },

    // ─── DEFEAT DETECTION ───
    // Called every frame to check if player has lost (1P only)
    // CHILL MODE: defeat is disabled — player can never lose
    _updateDefeatCheck(dt) {
        // CHILL MODE: no defeat, always clear grayscale
        this._setCanvasFilter('');
        return;

        // --- Original defeat logic (kept for future hardcore mode) ---
        // Skip in 2P mode (handled by _checkVersusDrawRound)
        if (this._versusMode) return;
        // Skip if not active or already won/lost
        if (!this.defeatCheckActive) {
            // Reset grayscale only if NOT defeated (defeat keeps grayscale until restart)
            if (!this.levelFailed) this._setCanvasFilter('');
            return;
        }
        if (this.levelComplete || this.levelFailed) return;

        // Count unsaved blobs
        const unsavedBlobs = this.targetBlobs.filter(b => !b.saved);

        // If all blobs saved, victory will be handled by checkBlobsInWater
        if (unsavedBlobs.length === 0) {
            this.defeatCheckActive = false;
            this._setCanvasFilter('');
            return;
        }

        // Update defeat timer
        this.defeatCheckTimer += dt;

        // ═══ GRAYSCALE: starts after DEFEAT_DELAY, lasts GRAYSCALE_DURATION ═══
        const grayscaleElapsed = Math.max(0, this.defeatCheckTimer - this.DEFEAT_DELAY);
        const grayscaleProgress = Math.min(1, grayscaleElapsed / this.GRAYSCALE_DURATION);
        this._setCanvasFilter(`grayscale(${grayscaleProgress * 100}%)`);

        // ═══ SAD EMOJI: when grayscale starts ═══
        if (grayscaleElapsed > 0 && !this._sadEmojisShown) {
            this._sadEmojisShown = true;
            for (const blob of unsavedBlobs) {
                this._showEmotionBubble(blob, '😢', 3);
            }
        }

        // Update stuck time for each unsaved blob
        let allStuck = true;
        for (const blob of unsavedBlobs) {
            const sb = blob.softbody;
            if (!sb?.envelopes?.[0]?.vertices) continue;

            // Calculate average velocity (more stable than max)
            let avgSpeed = 0;
            const verts = sb.envelopes[0].vertices;
            for (const v of verts) {
                const vx = v.x - (v.ox ?? v.x);
                const vy = v.y - (v.oy ?? v.y);
                avgSpeed += Math.sqrt(vx * vx + vy * vy);
            }
            avgSpeed /= verts.length;

            // Update stuck time
            if (avgSpeed < this.STUCK_VELOCITY) {
                blob._stuckTime = (blob._stuckTime || 0) + dt;
            } else {
                blob._stuckTime = 0;
            }

            // Check if this blob is stuck
            if ((blob._stuckTime || 0) < this.STUCK_TIME) {
                allStuck = false;
            }
        }

        // DEFEAT: All unsaved blobs stuck (but wait for full grayscale animation: DELAY + GRAYSCALE)
        if (allStuck && this.defeatCheckTimer >= this.DEFEAT_TIMEOUT) {
            this._triggerDefeat(`All ${unsavedBlobs.length} remaining blobs stuck`);
            return;
        }

        // DEFEAT: Safety timeout (extends if any blob still moving fast)
        if (this.defeatCheckTimer >= this.defeatCurrentTimeout) {
            // Check if any blob is still moving fast
            let anyMovingFast = false;
            for (const blob of unsavedBlobs) {
                const sb = blob.softbody;
                if (!sb?.envelopes?.[0]?.vertices) continue;
                let avgSpeed = 0;
                const verts = sb.envelopes[0].vertices;
                for (const v of verts) {
                    const vx = v.x - (v.ox ?? v.x);
                    const vy = v.y - (v.oy ?? v.y);
                    avgSpeed += Math.sqrt(vx * vx + vy * vy);
                }
                avgSpeed /= verts.length;
                if (avgSpeed > this.MOVING_VELOCITY) {
                    anyMovingFast = true;
                    break;
                }
            }

            if (anyMovingFast && this.defeatCurrentTimeout < this.MAX_DEFEAT_TIMEOUT) {
                // Extend timeout by 0.5s (grayscale stays at 100%)
                this.defeatCurrentTimeout += this.DEFEAT_EXTEND;
                
            } else {
                this._triggerDefeat(`Timeout - ${unsavedBlobs.length} blobs remaining`);
            }
            return;
        }
    },


    // Trigger defeat - lose a life and restart, or show game over popup
    _triggerDefeat(reason) {
        this.levelFailed = true;
        this.defeatCheckActive = false;
        this._clearBombSpawnTimers();
        
        RCHIPL.Events.emit('OnLevelLose', { layoutId: RCHIPL.Layouts?.getCurrentId?.() || '', reason: reason });

        // All blobs sad (including saved ones in the water)
        for (const blob of this.targetBlobs) {
            this._showEmotionBubble(blob, '😢', 1.5);
        }

        // Défaite - restart le niveau
        this.restartLevel();
    },

    // ═══ STAGGERED SETTLING ═══
    _setPendingBlobVisibility(blob, hide) {
        if (!blob?.sceneObj) return;
        const obj = blob.sceneObj;

        if (hide) {
            if (blob._pendingHideApplied) return;
            blob._pendingWasVisible = obj.visible !== false;
            if (blob._pendingWasVisible) obj.visible = false;
            blob._pendingHideApplied = true;
            return;
        }

        if (!blob._pendingHideApplied) return;
        if (blob._pendingWasVisible) obj.visible = true;
        blob._pendingHideApplied = false;
        blob._pendingWasVisible = undefined;
    },

    _activateBlobForSettling(blob, logMessage = '') {
        const sb = blob?.softbody;
        if (!sb || !sb._pendingSettle) return false;

        sb._pendingSettle = false;
        if (this.hidePendingSettleVisuals) this._setPendingBlobVisibility(blob, false);

        // Reset velocity to zero (ensure clean fall from frozen position)
        // In Verlet: velocity = pos - oldPos, so set oldPos = pos for zero velocity
        const verts = sb.envelopes?.[0]?.vertices;
        if (verts) {
            for (const v of verts) {
                v.ox = v.x;
                v.oy = v.y;
            }
        }

        this._lastActivationTime = performance.now();
        if (logMessage) 
        return true;
    },

    // Activate next pending blob (called when one settles)
    _activateNextPendingBlob() {
        let pendingCount = 0;
        for (let i = 0; i < this.targetBlobs.length; i++) {
            if (this.targetBlobs[i]?.softbody?._pendingSettle) pendingCount++;
        }
        for (let i = 0; i < this.targetBlobs.length; i++) {
            const blob = this.targetBlobs[i];
            if (!blob.softbody._pendingSettle) continue;
            if (this._activateBlobForSettling(blob, `🔓 Activated blob #${i} for settling (${pendingCount - 1} still pending)`)) {
                return;  // Only activate one at a time
            }
        }
        if (pendingCount === 0) {
            
        }
    },

    // Check for stalled settling (timeout safety)
    _checkSettleTimeout() {
        const SETTLE_TIMEOUT = this.settleTimeoutMs ?? 1200;
        const now = this._now || performance.now();
        const timeSinceActivation = now - (this._lastActivationTime || now);

        // If we have pending blobs and timeout exceeded, force activate next
        let hasPending = false;
        for (let i = 0; i < this.targetBlobs.length; i++) {
            if (this.targetBlobs[i]?.softbody?._pendingSettle) {
                hasPending = true;
                break;
            }
        }
        if (hasPending && timeSinceActivation > SETTLE_TIMEOUT) {
            
            this._activateNextPendingBlob();
        }
    },

    // ═══ BLOB PIN SYSTEM ═══
    // Soft spring that keeps blobs near their spawn point until hit by explosion
    // - Blobs can wiggle ~pinSlack px freely (gives life)
    // - Spring pulls them back if they go too far
    // - Pin releases on explosion impact
    // Values are now per-instance (editable in inspector): pinSlack, pinSpringK, pinSettleVel

    _updateBlobPins(dt) {
        // ═══ PRE-COMPUTE: softbody bboxes (shared across all blob checks) ═══
        const allSoftbodies = RCHIPL.SoftBody?._softbodies || [];
        const sbBboxes = this._pinSbBboxes || (this._pinSbBboxes = []);
        // Reuse cached bbox objects (zero allocation per frame)
        const count = allSoftbodies.length;
        for (let i = 0; i < count; i++) {
            const osb = allSoftbodies[i];
            const ov = osb.envelopes?.[0]?.vertices;
            if (!ov || ov.length === 0) {
                if (i < sbBboxes.length) { sbBboxes[i] = null; } else { sbBboxes.push(null); }
                continue;
            }
            let x0 = ov[0].x, x1 = x0, y0 = ov[0].y, y1 = y0;
            for (let j = 1; j < ov.length; j++) {
                const p = ov[j];
                if (p.x < x0) x0 = p.x; else if (p.x > x1) x1 = p.x;
                if (p.y < y0) y0 = p.y; else if (p.y > y1) y1 = p.y;
            }
            let box = sbBboxes[i];
            if (!box) { box = { minX: 0, maxX: 0, minY: 0, maxY: 0, verts: null, sb: null }; sbBboxes[i] = box; }
            box.minX = x0; box.maxX = x1; box.minY = y0; box.maxY = y1; box.verts = ov; box.sb = osb;
        }
        sbBboxes.length = count;

        for (const blob of this.targetBlobs) {
            if (!blob.pinned || blob.saved) continue;

            const sb = blob.softbody;
            const verts = sb?.envelopes?.[0]?.vertices;
            if (!verts || verts.length === 0) continue;
            const now = this._now || performance.now();

            // A bumper hit is an explicit gameplay activation. Do not let the blob
            // fall back into the pinned/sleep settle path after being launched.
            if ((sb._bouncyHitUntil || 0) > now) {
                delete sb._bouncyHitUntil;
                if (sb._pendingSettle) {
                    this._activateBlobForSettling(blob, '🔓🏐 Pending blob activated by bumper!');
                }
                blob.pinned = false;
                blob.activated = true;
                blob._tutorialHintTouched = true;
                sb._isSleeping = false;
                sb._isPinnedSleep = false;
                sb._sleepVertices = null;
                blob._pinSettleFrames = 0;
                this._activateNextPendingBlob();
                continue;
            }

            // ═══ COMPUTE BLOB BBOX + CENTROID + VELOCITY (once per blob) ═══
            let minX = verts[0].x, maxX = minX, minY = verts[0].y, maxY = minY;
            let cx = verts[0].x, cy = verts[0].y;
            let avgVel = 0;
            const v0 = verts[0];
            const vx0 = v0.x - (v0.ox ?? v0.x), vy0 = v0.y - (v0.oy ?? v0.y);
            avgVel += Math.sqrt(vx0 * vx0 + vy0 * vy0);
            for (let i = 1; i < verts.length; i++) {
                const v = verts[i];
                if (v.x < minX) minX = v.x; else if (v.x > maxX) maxX = v.x;
                if (v.y < minY) minY = v.y; else if (v.y > maxY) maxY = v.y;
                cx += v.x; cy += v.y;
                const dvx = v.x - (v.ox ?? v.x), dvy = v.y - (v.oy ?? v.y);
                avgVel += Math.sqrt(dvx * dvx + dvy * dvy);
            }
            const vLen = verts.length;
            cx /= vLen; cy /= vLen;
            avgVel /= vLen;

            // ═══ UNIFIED COLLISION CHECK (pending / sleeping / pinned) ═══
            // Single broadphase pass for all states that need collision detection
            const needsCollisionCheck = sb._pendingSettle || (sb._isSleeping && sb._isPinnedSleep) || blob.pinned;

            if (needsCollisionCheck) {
                const touchDist = sb._pendingSettle ? 25 : 20;
                const touchDistSq = touchDist * touchDist;
                let collision = false;
                let collisionImpactorSb = null; // Track which softbody caused the collision

                // Broadphase + narrowphase: softbodies
                for (let i = 0; i < sbBboxes.length; i++) {
                    const other = sbBboxes[i];
                    if (!other || other.sb === sb) continue;
                    if (sb._pendingSettle && other.sb._pendingSettle) continue;
                    // Bbox overlap test
                    if (maxX + touchDist < other.minX || other.maxX + touchDist < minX ||
                        maxY + touchDist < other.minY || other.maxY + touchDist < minY) continue;
                    // Narrowphase: vertex-to-vertex
                    const ov = other.verts;
                    for (let a = 0; a < vLen; a++) {
                        const va = verts[a];
                        for (let b = 0; b < ov.length; b++) {
                            const dx = va.x - ov[b].x, dy = va.y - ov[b].y;
                            if (dx * dx + dy * dy < touchDistSq) { collision = true; collisionImpactorSb = other.sb; break; }
                        }
                        if (collision) break;
                    }
                    if (collision) break;
                }

                // Broadphase + narrowphase: dynamic physics bodies (voronoi, suspended, bridge)
                if (!collision && !sb._pendingSettle) {
                    const matterBodies = RCHIPL.Physics?.getBodies?.() || [];
                    for (let i = 0; i < matterBodies.length; i++) {
                        const body = matterBodies[i];
                        if (body.isStatic || (!body._voronoiFrag && !body._isSuspendedPlatform && !body._bridgePlank)) continue;
                        const bounds = body.bounds;
                        if (maxX + touchDist < bounds.min.x || bounds.max.x + touchDist < minX ||
                            maxY + touchDist < bounds.min.y || bounds.max.y + touchDist < minY) continue;
                        const bodyVerts = body.vertices;
                        if (!bodyVerts) continue;
                        for (let a = 0; a < vLen; a++) {
                            const va = verts[a];
                            for (let b = 0; b < bodyVerts.length; b++) {
                                const dx = va.x - bodyVerts[b].x, dy = va.y - bodyVerts[b].y;
                                if (dx * dx + dy * dy < touchDistSq) { collision = true; break; }
                            }
                            if (collision) break;
                        }
                        if (collision) break;
                    }
                }

                // ═══ APPLY COLLISION RESULT per state ═══
                // (Collision sounds handled by CollisionSound squash detection → collisionBomb/collisionBlob events)
                if (sb._pendingSettle) {
                    if (collision) {
                        blob._tutorialHintTouched = true;
                        this._activateBlobForSettling(blob, `🔓🤝 Pending blob activated by collision!`);
                    } else {
                        continue; // Still pending
                    }
                } else if (sb._isSleeping && sb._isPinnedSleep) {
                    if (collision) {
                        sb._isSleeping = false;
                        sb._isPinnedSleep = false;
                        sb._sleepVertices = null;
                        blob._pinSettleFrames = 0;
                        blob.pinned = false;
                        blob.activated = true;
                        blob._tutorialHintTouched = true;

                        // Transfer impactor momentum so the wake feels punchy
                        if (collisionImpactorSb?.envelopes?.[0]?.vertices) {
                            const iv = collisionImpactorSb.envelopes[0].vertices;
                            let ivx = 0, ivy = 0, ic = 0;
                            for (const v of iv) {
                                ivx += v.x - v.ox;
                                ivy += v.y - v.oy;
                                ic++;
                            }
                            if (ic > 0) {
                                ivx /= ic; ivy /= ic;
                                const transfer = 0.5; // Transfer 50% of impactor velocity
                                for (const v of verts) {
                                    v.ox = v.x - ivx * transfer;
                                    v.oy = v.y - ivy * transfer;
                                }
                            }
                        }
                    } else {
                        continue; // Stay asleep
                    }
                } else if (collision) {
                    // Pinned blob hit — unpin
                    blob.pinned = false;
                    blob.activated = true;
                    blob._tutorialHintTouched = true;
                    if (sb._isSleeping) {
                        sb._isSleeping = false;
                        sb._isPinnedSleep = false;
                        sb._sleepVertices = null;
                        blob._pinSettleFrames = 0;
                    }
                    // Transfer impactor momentum on unpin
                    if (collisionImpactorSb?.envelopes?.[0]?.vertices) {
                        const iv = collisionImpactorSb.envelopes[0].vertices;
                        let ivx = 0, ivy = 0, ic = 0;
                        for (const v of iv) {
                            ivx += v.x - v.ox;
                            ivy += v.y - v.oy;
                            ic++;
                        }
                        if (ic > 0) {
                            ivx /= ic; ivy /= ic;
                            const transfer = 0.5;
                            for (const v of verts) {
                                v.ox = v.x - ivx * transfer;
                                v.oy = v.y - ivy * transfer;
                            }
                        }
                    }
                    this._activateNextPendingBlob();
                }
            }

            // Read pin settings from sceneObj (with fallbacks to new defaults)
            const sceneObj = blob.sceneObj;
            const pinSlack = sceneObj?.pinSlack ?? 0;
            const pinSpringK = sceneObj?.pinSpringK ?? 0.5;
            const pinSettleVel = sceneObj?.pinSettleVel ?? 1.5;

            // ═══ DETECT PLATFORM CONTACT (at game start only) ═══
            if (!blob.settled) {
                const slopeCheckOffset = 12;
                const leftY = this.raycastDown(cx - slopeCheckOffset, cy);
                const rightY = this.raycastDown(cx + slopeCheckOffset, cy);
                const centerY = this.raycastDown(cx, cy);

                const yDiff = Math.abs(rightY - leftY);
                const slopeAngle = Math.atan2(yDiff, slopeCheckOffset * 2);
                const slopeThreshold = Math.PI / 60;
                const blobRadius = 40;
                const contactMargin = 25;
                const blobBottom = cy + blobRadius;
                const distToPlat = centerY - blobBottom;

                if (distToPlat < contactMargin) {
                    blob.settled = true;
                    if (slopeAngle < slopeThreshold) {
                        blob.anchorX = cx;
                        blob.anchorY = centerY;
                    } else {
                        blob.pinned = false;
                        blob.activated = true;
                        this._activateNextPendingBlob();
                    }
                }
                continue;
            }

            // ═══ DISTANCE CONSTRAINT (no spring, no oscillation) ═══
            if (blob.pinned) {
                const dx = cx - blob.anchorX;
                const absDx = Math.abs(dx);

                if (absDx > pinSlack) {
                    const correction = (absDx - pinSlack) * (dx > 0 ? -1 : 1);
                    for (const v of verts) {
                        v.x += correction;
                        v.ox += correction;
                    }
                }

                // Light damping to settle jiggles
                const damping = 0.92;
                for (const v of verts) {
                    const vx = v.x - v.ox;
                    v.ox = v.x - vx * damping;
                }

                // ═══ SLEEP FOR PINNED BLOBS ═══
                const sleepVelThreshold = this.settleSleepVelThreshold ?? 1.1;
                const sleepFramesRequired = this.settleSleepFrames ?? 8;

                if (avgVel < sleepVelThreshold) {
                    blob._pinSettleFrames = (blob._pinSettleFrames || 0) + 1;
                    if (blob._pinSettleFrames >= sleepFramesRequired && !sb._isSleeping) {
                        sb._isSleeping = true;
                        sb._isPinnedSleep = true;
                        sb._sleepVertices = verts.map(v => ({ x: v.x, y: v.y }));
                        this._activateNextPendingBlob();
                    }
                } else {
                    blob._pinSettleFrames = 0;
                    if (sb._isSleeping) {
                        sb._isSleeping = false;
                        sb._isPinnedSleep = false;
                        sb._sleepVertices = null;
                    }
                }
            } else {
                if (sb._isSleeping) {
                    sb._isSleeping = false;
                    sb._isPinnedSleep = false;
                    sb._sleepVertices = null;
                    blob._pinSettleFrames = 0;
                }
            }
        }
    },


    // ─── ROTATE FAMILY (visual + optional physics angle sync) ───
    _refreshRotateFamilyCache() {
        const layoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
        const objs = RCHIPL.Scene?.getByFamily?.('rotate') || [];
        const signature = objs.map(obj => obj?.id || '').join('|');
        // Rebuild cache whenever rotate-family membership changes (e.g. duplicated instances).
        if (this._rotators && this._rotatorsLayoutId === layoutId && this._rotatorsSignature === signature) return;

        const rotators = [];
        for (const obj of objs) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            if (props.enabled === false) continue;
            const dirRaw = String(props.direction || 'clockwise').trim().toLowerCase();
            const sign = (dirRaw === 'anticlockwise' || dirRaw === 'counterclockwise') ? -1 : 1;
            const speed = Number(props.speed);
            if (!Number.isFinite(speed) || speed === 0) continue;
            rotators.push({ obj, sign, speed });
        }

        this._rotators = rotators;
        this._rotatorsLayoutId = layoutId;
        this._rotatorsSignature = signature;
    },

    _updateRotateFamily(dt) {
        if (!this._rotators || this._rotators.length === 0) return;

        for (const entry of this._rotators) {
            const obj = entry.obj;
            if (!obj) continue;

            let nextDeg = Number(obj.rotation) || 0;
            nextDeg += entry.sign * entry.speed * dt;
            if (nextDeg > 360 || nextDeg < -360) nextDeg %= 360;
            obj.rotation = nextDeg;

            const body = obj._physicsBody;
            if (body && typeof Matter !== 'undefined' && Matter.Body?.setAngle) {
                Matter.Body.setAngle(body, nextDeg * Math.PI / 180);
                if (Matter.Body.setAngularVelocity) Matter.Body.setAngularVelocity(body, 0);
            }
        }
    },

    _refreshPulseFamilyCache() {
        const layoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
        const objs = RCHIPL.Scene?.getByFamily?.('pulse') || [];
        const signature = objs.map(obj => obj?.id || '').join('|');
        // Rebuild cache whenever pulse-family membership changes (e.g. duplicated instances).
        if (this._pulsers && this._pulsersLayoutId === layoutId && this._pulsersSignature === signature) return;

        const pulsers = [];
        for (const obj of objs) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            if (props.enabled === false) continue;

            const sizeStart = Number(props.sizeStart);
            const sizeEnd = Number(props.sizeEnd);
            const cycleTime = Number(props.cycleTime);
            if (!Number.isFinite(sizeStart) || !Number.isFinite(sizeEnd) || !Number.isFinite(cycleTime) || cycleTime <= 0) continue;

            pulsers.push({
                obj,
                sizeStart,
                sizeEnd,
                cycleTime,
                baseScaleX: Number(obj.scaleX) || 1,
                baseScaleY: Number(obj.scaleY) || 1
            });
        }

        this._pulsers = pulsers;
        this._pulsersLayoutId = layoutId;
        this._pulsersSignature = signature;
    },

    _updatePulseFamily() {
        if (!this._pulsers || this._pulsers.length === 0) return;
        const nowSec = (this._now || performance.now()) * 0.001;

        for (const entry of this._pulsers) {
            const obj = entry.obj;
            if (!obj) continue;

            const phase = (nowSec / entry.cycleTime) * Math.PI * 2;
            const t = 0.5 + 0.5 * Math.sin(phase);
            const pulseMul = entry.sizeStart + (entry.sizeEnd - entry.sizeStart) * t;
            obj.scaleX = entry.baseScaleX * pulseMul;
            obj.scaleY = entry.baseScaleY * pulseMul;
        }
    },


    // ─── UPDATE ───
    update(dt) {
        // Cache timestamp once per frame (avoid repeated performance.now() syscalls)
        this._now = performance.now();

        const isEditMode = RCHIPL.Editor?.isEditMode?.() ?? false;
        this._syncBackgroundMusicEditMode(isEditMode);
        if (isEditMode) {
            // Edit mode keeps its own selection/transform input path.
            this.handleInput();
        }
        this._updateTemplateUIRuntime(false);
        this._updateSecretSaveReset(isEditMode);

        // === MENU STATE: zero gameplay ===
        if (this.state === 'MENU') {
            // worldMap family may enter before scene objects are injected by Layouts.load().
            // Keep a lazy-safe init path so nodes/colors/links are always prepared once objects exist.
            const currentLayout = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
            const currentFamily = currentLayout ? RCHIPL.Layouts?._all?.[currentLayout]?.family : null;
            if (currentFamily === 'worldMap') {
                if (!this._levelMapNodes?.length) this._initWorldMap();
                this._updateWorldMapAdvance();
            } else if (this._levelMapNodes?.length || this._levelMapLinks?.length) {
                this._cleanupWorldMap();
            }
            // World map tap handling
            if (this._levelMapNodes?.length) {
                this._handleWorldMapTap();
            }
            this._refreshRotateFamilyCache();
            this._updateRotateFamily(dt);
            this._refreshPulseFamilyCache();
            this._updatePulseFamily();
            return; // ZERO gameplay update
        }

        // Cache rail/bombUI refs once (not every frame)
        if (!this._cachedSceneRefs) {
