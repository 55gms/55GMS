    // Pre-render YES with white stroke and drop shadow (called once)
    _prerenderVictoryYes(obj) {
        const baseScaleX = obj._origScaleX || obj.scaleX || 1;
        const baseScaleY = obj._origScaleY || obj.scaleY || 1;
        const assetName = obj._instanceAsset || obj.asset;

        // Get object bounds at full scale
        const w = (obj.width || 548) * baseScaleX;
        const h = (obj.height || 250) * baseScaleY;

        // Padding for stroke (10px) and shadow (offset 8 + blur 12)
        const strokeWidth = 10;
        const shadowOffsetX = 40;
        const shadowOffsetY = 40;
        const padding = Math.max(strokeWidth * 2, shadowOffsetX, shadowOffsetY) + 20;

        const canvasW = Math.ceil(w + padding * 2);
        const canvasH = Math.ceil(h + padding * 2);

        // === 1. Render object to temp canvas ===
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvasW;
        tempCanvas.height = canvasH;
        const tempCtx = tempCanvas.getContext('2d');

        // Render asset at full scale, centered in canvas
        tempCtx.save();
        tempCtx.translate(canvasW / 2, canvasH / 2);
        RCHIPL.Assets.draw(tempCtx, assetName, 0, 0, {
            scaleX: baseScaleX,
            scaleY: baseScaleY,
            angle: 0,
            alpha: 1
        });
        tempCtx.restore();

        // === 2. Create final canvas with effects ===
        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // === 3. Draw flat black shadow (no blur, pure black, offset) ===
        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = canvasW;
        shadowCanvas.height = canvasH;
        const shadowCtx = shadowCanvas.getContext('2d');
        shadowCtx.drawImage(tempCanvas, 0, 0);
        shadowCtx.globalCompositeOperation = 'source-atop';
        shadowCtx.fillStyle = '#000000';
        shadowCtx.fillRect(0, 0, canvasW, canvasH);
        ctx.drawImage(shadowCanvas, shadowOffsetX, shadowOffsetY);

        // === 4. Draw white stroke (16 directions for smooth outline) ===
        const strokeCanvas = document.createElement('canvas');
        strokeCanvas.width = canvasW;
        strokeCanvas.height = canvasH;
        const strokeCtx = strokeCanvas.getContext('2d');
        strokeCtx.drawImage(tempCanvas, 0, 0);
        strokeCtx.globalCompositeOperation = 'source-atop';
        strokeCtx.fillStyle = '#FFFFFF';
        strokeCtx.fillRect(0, 0, canvasW, canvasH);

        // 16 directions for smooth outline
        for (let a = 0; a < 16; a++) {
            const angle = (a / 16) * Math.PI * 2;
            const ox = Math.cos(angle) * strokeWidth;
            const oy = Math.sin(angle) * strokeWidth;
            ctx.drawImage(strokeCanvas, ox, oy);
        }

        // === 5. Draw main content on top ===
        ctx.drawImage(tempCanvas, 0, 0);

        return {
            canvas,
            width: canvasW,
            height: canvasH,
            centerX: canvasW / 2,
            centerY: canvasH / 2
        };
    },

    // Start the victory YES pop-in animation
    _startVictoryYes() {
        // Preferred: superYess on UIFinish (legacy behavior).
        // Fallback: any superYess instance in scene so LD can place/tweak it on another layer.
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        let yesObjs = allObjs.filter(o => o.asset === 'superYess' && o.layer === 'UIFinish');
        if (!yesObjs.length) {
            yesObjs = allObjs.filter(o => o.asset === 'superYess');
        }
        if (!yesObjs.length) return;

        const obj = yesObjs[0];

        // Store original scales before any modification
        yesObjs.forEach(o => {
            o._origScaleX = o._origScaleX || o.scaleX || 1;
            o._origScaleY = o._origScaleY || o.scaleY || 1;
            o._origY = o._origY || o.y;
        });

        // Rebuild cache for current level instance (so per-level gradient overrides are respected).
        this._victoryYesCache = this._prerenderVictoryYes(obj);

        // Hide original objects - we'll draw the cached version instead
        yesObjs.forEach(o => {
            o.visible = false;
        });

        this._victoryYes = {
            objs: yesObjs,
            startTime: performance.now(),
            baseX: obj.x,
            baseY: obj._origY,
            x: obj.x,
            y: obj._origY,
            vy: 0,
            scale: 0,
            squash: 0
        };

        // Camera flash effect (soft white, fades out)
        this._victoryFlash = 0.7;
        RCHIPL.Events?.emit?.('OnVictoryYesAppear', { x: obj.x ?? 0, y: obj._origY ?? obj.y ?? 0 });
    },


    // Update victory YES animation (physics only - we render the cached canvas)
    _updateVictoryYes(dt) {
        // Fade out camera flash (smooth decay)
        if (this._victoryFlash > 0) {
            this._victoryFlash -= dt * 1.4;  // ~500ms to fade out
            if (this._victoryFlash < 0) this._victoryFlash = 0;
        }

        if (!this._victoryYes) return;

        const v = this._victoryYes;
        const now = performance.now();
        const elapsed = (now - v.startTime) / 1000;

        // Spring physics for scale
        if (!v.scaleSpring) {
            v.scaleSpring = { value: 0, velocity: 0 };
            v.squashSpring = { value: 0, velocity: 0 };
        }

        const stiffness = 180;
        const damping = 12;

        const scaleForce = (1 - v.scaleSpring.value) * stiffness;
        const scaleDamping = -v.scaleSpring.velocity * damping;
        v.scaleSpring.velocity += (scaleForce + scaleDamping) * dt;
        v.scaleSpring.value += v.scaleSpring.velocity * dt;

        // Initial squash impulse (once only)
        if (!v.squashImpulseApplied) {
            v.squashSpring.velocity = 20;  // Big juicy pop impulse
            v.squashImpulseApplied = true;
        }
        const squashForce = (0 - v.squashSpring.value) * stiffness * 1.3;
        const squashDamping = -v.squashSpring.velocity * damping * 1.0;
        v.squashSpring.velocity += (squashForce + squashDamping) * dt;
        v.squashSpring.value += v.squashSpring.velocity * dt;

        // Store computed values for rendering (don't touch objects)
        v.scale = Math.max(0, v.scaleSpring.value);
        // Clamp squash to prevent flipping (max ±0.6 = 60% stretch, juicy but safe)
        v.squash = Math.max(-0.6, Math.min(0.6, v.squashSpring.value * 0.5));

        // Move up after delay
        if (elapsed > 0.25) {
            v.vy = (v.vy || 0) - 500 * dt;
            v.y += v.vy * dt;
        }

        // End animation
        if (elapsed > 5.0) {
            this._victoryYes = null;
        }
    },

    // Render the pre-rendered YES with cached effects
    _renderVictoryYes(ctx) {
        if (!this._victoryYes || !this._victoryYesCache) return;

        const v = this._victoryYes;
        const cache = this._victoryYesCache;

        // Apply viewport transform (world space)
        const vp = RCHIPL.Viewport;
        const safeW = RCHIPL.Screen?.safeW || ctx.canvas.width;
        const safeH = RCHIPL.Screen?.safeH || ctx.canvas.height;

        ctx.save();
        ctx.translate(safeW / 2 + (vp?.pan?.x || 0), safeH / 2 + (vp?.pan?.y || 0));
        ctx.scale(vp?.zoom || 1, vp?.zoom || 1);

        // Position and scale with squash/stretch
        ctx.translate(v.x, v.y);
        const scaleX = v.scale * (1 + v.squash);
        const scaleY = v.scale * (1 - v.squash);
        ctx.scale(scaleX, scaleY);

        // Draw cached canvas centered
        ctx.drawImage(cache.canvas, -cache.centerX, -cache.centerY);

        ctx.restore();
    },


    // ─── BUTTON HOVER EFFECT ───
    // Pop and tilt effect on buttons when hovered
    _updateButtonHover(dt) {
        const buttons = this._buttonObjs || [];
        if (!buttons || buttons.length === 0) return false;
        if (this._isUiInteractionLocked()) return false;

        const I = RCHIPL.Input;
        const S = RCHIPL.Screen;
        if (!S) return false;
        const pointerPressed = I.touchStart?.() || I.leftClicked();
        const pointerHolding = I.touch || I.leftDown?.();
        const pointerReleased = I.touchEnd?.() || I.leftReleased?.();
        if (this._uiPointerCapture && (pointerReleased || !pointerHolding)) {
            this._uiPointerCapture = false;
        }

        // Convert raw mouse coords to screen coords (same as renderer)
        // rawX/rawY are in CSS pixels relative to canvas
        const mouseScreenX = (I.rawX - S.offsetX) / S.scale;
        const mouseScreenY = (I.rawY - S.offsetY) / S.scale;

        for (const btn of buttons) {
            const familyProps = RCHIPL.FamilyProps?.getAll?.(btn) || {};
            const isSkipLevel = this._isSkipLevelButton(btn);
            const isRestartAction = this._isRestartActionButton(btn);
            const isSoundToggle = this._isSoundToggleButton(btn);
            const isEnabled = familyProps.enabled !== false;
            this._ensureButtonHoverBase(btn);
            if (!isEnabled) {
                this._resetButtonHoverPose(btn, isSkipLevel);
                continue;
            }
            if (isSkipLevel) btn._baseRotation = 0;

            // Get button screen position (same as renderer uses for anchorToScreen)
            let btnScreenX = btn.x;
            let btnScreenY = btn.y;
            if (btn.anchor && btn.anchorToScreen && RCHIPL.Anchor?.POINTS?.[btn.anchor]) {
                const vb = S.getVisibleBounds();
                const point = RCHIPL.Anchor.POINTS[btn.anchor];
                const offsetX = btn.anchorOffsetX ?? 0;
                const offsetY = btn.anchorOffsetY ?? 0;
                btnScreenX = vb.left + point.x * vb.width + offsetX;
                btnScreenY = vb.top + point.y * vb.height + offsetY;
            }

            // Check if mouse is over this button (simple AABB hit test)
            const asset = RCHIPL.Assets.get(btn.asset);
            const w = btn.width !== undefined
                ? Math.abs(btn.width)
                : (asset?.width || 100) * Math.abs(btn._baseScaleX ?? 1);
            const h = btn.height !== undefined
                ? Math.abs(btn.height)
                : (asset?.height || 100) * Math.abs(btn._baseScaleY ?? 1);
            const ax = asset?.anchor?.x ?? 0.5;
            const ay = asset?.anchor?.y ?? 0.5;
            const left = btnScreenX - w * ax;
            const top = btnScreenY - h * ay;
            const isHovered = mouseScreenX >= left && mouseScreenX <= left + w &&
                              mouseScreenY >= top && mouseScreenY <= top + h;

            // Handle click on button
            if (isHovered && pointerPressed) {
                this._uiPointerCapture = true;
                if (isSkipLevel) {
                    this._resetButtonHoverPose(btn, true);
                    this.requestSkipLevel();
                    return true;
                }
                if (isSoundToggle) {
                    this._resetButtonHoverPose(btn, true);
                    this._toggleSoundMuted();
                    return true;
                }
                // Check if it's a restart button
                if (isRestartAction || btn.asset?.toLowerCase().includes('restart')) {
                    
                    this.restartLevel();
                    return true;  // Stop processing buttons
                }
            }

            // Smooth transition to hover state
            const targetState = isHovered ? 1 : 0;
            const speed = 8;  // Transition speed
            btn._hoverState += (targetState - btn._hoverState) * speed * dt;

            // Accumulate time for sin oscillation
            if (isHovered) {
                btn._hoverTime += dt;
            } else {
                btn._hoverTime = 0;
            }

            // Apply effects based on hover state
            const hoverAmount = btn._hoverState;

            // Pop effect: scale up by 20%
            const popScale = 1 + hoverAmount * 0.2;
            if (btn._baseWidth !== undefined) btn.width = btn._baseWidth * popScale;
            else btn.scaleX = btn._baseScaleX * popScale;
            if (btn._baseHeight !== undefined) btn.height = btn._baseHeight * popScale;
            else btn.scaleY = btn._baseScaleY * popScale;

            // Tilt effect: sin oscillation (±10 degrees, 20Hz)
            const tiltAngle = hoverAmount * Math.sin(btn._hoverTime * 20) * 10;
            btn.rotation = btn._baseRotation + tiltAngle;
        }
        return false;
    },


    // ─── PORTRAIT UI OFFSET ───
    // Adjust UI elements (buttons, rail, etc.) to be below progression bar in portrait
    _updatePortraitUIOffset() {
        const S = RCHIPL.Screen;
        const vb = S?.getVisibleBounds?.();
        if (!vb) return;

        const isEditMode = RCHIPL.Editor?.isEditMode?.();

        // In edit mode: restore original positions and clear stored originals
        if (isEditMode) {
            const buttons = this._buttonObjs || [];
            for (const btn of buttons) {
                if (btn._originalAnchorOffsetY !== undefined) {
                    btn.anchorOffsetY = btn._originalAnchorOffsetY;
                    delete btn._originalAnchorOffsetY;
                }
                if (btn._originalAnchorOffsetX !== undefined) {
                    btn.anchorOffsetX = btn._originalAnchorOffsetX;
                    delete btn._originalAnchorOffsetX;
                }
            }
            const railObj = this._railObj;
            if (railObj?._originalAnchorOffsetY !== undefined) {
                railObj.anchorOffsetY = railObj._originalAnchorOffsetY;
                delete railObj._originalAnchorOffsetY;
            }
            // Restore borders
            const borders = this._borderObjs || [];
            for (const border of borders) {
                if (border._originalAnchorOffsetX !== undefined) {
                    border.anchorOffsetX = border._originalAnchorOffsetX;
                    delete border._originalAnchorOffsetX;
                }
            }
            return;
        }

        const isPortrait = vb.height > vb.width;
        const notchHeight = 42;  // Approximate notch height (27 icon + 15 padding)
        const railMargin = -25;  // Closer to notch
        const railOffset = notchHeight + railMargin;  // Just below notch

        // Adjust buttons with anchorToScreen - use original offsets (no panel offset)
        const buttons = this._buttonObjs || [];
        for (const btn of buttons) {
            if (btn.anchorToScreen) {
                // Store original offsets if not yet stored
                if (btn._originalAnchorOffsetY === undefined) {
                    btn._originalAnchorOffsetY = btn.anchorOffsetY ?? 0;
                }
                if (btn._originalAnchorOffsetX === undefined) {
                    btn._originalAnchorOffsetX = btn.anchorOffsetX ?? 0;
                }
                // Use original offsets (no panels to offset for anymore)
                btn.anchorOffsetY = btn._originalAnchorOffsetY;
                btn.anchorOffsetX = btn._originalAnchorOffsetX;
            }
        }

        // Adjust rail position (bomb spawn) - below notch
        const railObj = this._railObj;
        if (railObj?.anchorToScreen) {
            if (railObj._originalAnchorOffsetY === undefined) {
                railObj._originalAnchorOffsetY = railObj.anchorOffsetY ?? 0;
            }
            railObj.anchorOffsetY = railObj._originalAnchorOffsetY + railOffset;
        }

        // ═══ BORDERS - sync with zoom/orientation/resize ═══
        // Physics bodies must follow screen edges as camera zooms, device rotates, or window resizes
        const borders = this._borderObjs || [];

        const vp = RCHIPL.Viewport;
        // Use TARGET zoom (Game.zoom) not current camera zoom
        // This prevents borders from moving during intro zoom animation
        const targetZoomRaw = Game.zoom || 0.5;
        // Quantize tiny float jitter (prevents false "zoom changed" churn).
        const targetZoom = Math.round(targetZoomRaw * 1000) / 1000;
        // Use rounded real size; mobile viewport can fluctuate by sub-pixel fractions.
        const currentScreenW = Math.round(S?.realW || 0);
        const currentScreenH = Math.round(S?.realH || 0);
        const RESIZE_TOLERANCE_PX = 2;
        const BORDER_SYNC_EPSILON = 0.75;

        for (const border of borders) {
            if (border.anchorToScreen) {
                // Store original offset
                if (border._originalAnchorOffsetX === undefined) {
                    border._originalAnchorOffsetX = border.anchorOffsetX ?? 0;
                }

                // No panel offset - borders at screen edge
                const newOffsetX = border._originalAnchorOffsetX;

                // Update if offset, zoom, orientation, or screen size changed
                const offsetChanged = border.anchorOffsetX !== newOffsetX;
                const zoomChanged = border._lastSyncZoom !== targetZoom;
                const orientationChanged = border._lastOrientation !== isPortrait;
                const screenResized =
                    Math.abs((border._lastScreenW ?? currentScreenW) - currentScreenW) > RESIZE_TOLERANCE_PX ||
                    Math.abs((border._lastScreenH ?? currentScreenH) - currentScreenH) > RESIZE_TOLERANCE_PX;

                if (offsetChanged || zoomChanged || orientationChanged || screenResized) {
                    border.anchorOffsetX = newOffsetX;
                    border._lastSyncZoom = targetZoom;
                    border._lastOrientation = isPortrait;
                    border._lastScreenW = currentScreenW;
                    border._lastScreenH = currentScreenH;

                    // Update physics body position
                    if (border._physicsBody && RCHIPL.Anchor?.POINTS?.[border.anchor]) {
                        // Calculate world bounds at TARGET zoom (not current camera zoom)
                        // This keeps borders stable during intro zoom animation
                        const hw = S.safeW / 2;
                        const hh = S.safeH / 2;
                        const panX = vp?.pan?.x || 0;
                        const panY = vp?.pan?.y || 0;
                        const vbWorld = {
                            left: (S.visibleLeft - hw - panX) / targetZoom,
                            right: (S.visibleRight - hw - panX) / targetZoom,
                            top: (S.visibleTop - hh - panY) / targetZoom,
                            bottom: (S.visibleBottom - hh - panY) / targetZoom
                        };
                        const point = RCHIPL.Anchor.POINTS[border.anchor];

                        // Anchor offset in screen coords - convert to world coords
                        const offsetX = newOffsetX / targetZoom;
                        const offsetY = (border.anchorOffsetY ?? 0) / targetZoom;

                        // Calculate position in world coords
                        const vbWidth = vbWorld.right - vbWorld.left;
                        const vbHeight = vbWorld.bottom - vbWorld.top;
                        let bodyX = vbWorld.left + point.x * vbWidth + offsetX;
                        let bodyY = vbWorld.top + point.y * vbHeight + offsetY;

                        // Adjust for object's anchorX/anchorY
                        const objAnchorX = border.anchorX ?? 0.5;
                        const objAnchorY = border.anchorY ?? 0.5;
                        const w = border.width || 243;
                        const h = border.height || 5000;
                        const sx = border.scaleX ?? 1;
                        const sy = border.scaleY ?? 1;
                        bodyX += (0.5 - objAnchorX) * w * sx;
                        bodyY += (0.5 - objAnchorY) * h * sy;

                        const currentPos = border._physicsBody.position;
                        const dx = bodyX - currentPos.x;
                        const dy = bodyY - currentPos.y;
                        // Avoid tiny teleports that can inject continuous push on edge contacts.
                        if ((dx * dx + dy * dy) > (BORDER_SYNC_EPSILON * BORDER_SYNC_EPSILON)) {
                            Matter.Body.setPosition(border._physicsBody, { x: bodyX, y: bodyY });
                        }
                    }
                }
            }
        }
    },


    _updateScreenEdgeColliderState(forceScan = false) {
        if (forceScan || !Array.isArray(this._borderObjs)) {

                o => o?.asset === 'borderR' || o?.asset === 'borderL'
