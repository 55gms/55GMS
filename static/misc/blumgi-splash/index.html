            const allObjs = RCHIPL.Scene?.getAll?.() || [];
            this._railObj = allObjs.find(o => o.asset === 'rail' || o.id?.includes('rail'));
            this._railLeftObj = allObjs.find(o => o.id === 'rail_left' || o.asset === 'rail_left') || null;
            this._railRightObj = allObjs.find(o => o.id === 'rail_right' || o.asset === 'rail_right') || null;
            this._bombUIObjs = allObjs.filter(o => o.asset === 'bombUI');
            this._borderObjs = allObjs.filter(o => o.asset === 'borderR' || o.asset === 'borderL');
            const familyButtons = RCHIPL.Scene?.getByFamily?.('button') || [];
            const actionButtons = RCHIPL.Scene?.getByFamily?.('uiAction') || [];
            const inferredSoundButtons = allObjs.filter(o => this._isSoundToggleButton(o));
            this._buttonObjs = [...new Set([...familyButtons, ...actionButtons, ...inferredSoundButtons])];
            this._soundToggleButtonObj = this._buttonObjs.find(btn => this._isSoundToggleButton(btn)) || null;
            this._skipLevelButtonObjs = this._buttonObjs.filter(btn => this._isSkipLevelButton(btn));
            this._skipRewardPopupObj = (RCHIPL.Scene?.getByFamily?.('skipRewardPopup') || [])[0] || null;
            this._skipRewardCloseObj = (RCHIPL.Scene?.getByFamily?.('skipRewardClose') || [])[0] || null;
            this._skipRewardValidateObj = (RCHIPL.Scene?.getByFamily?.('skipRewardValidate') || [])[0] || null;
            this._skipHintArrowObj = (RCHIPL.Scene?.getByFamily?.('skipHintArrow') || [])[0] || null;
            this._normalizeSkipLevelButtonPose();
            this._primeSoundToggleButtonForCurrentScene();
            this._hideSkipRewardSceneObjectsImmediate();
            this._hideSkipHintArrowSceneObjectsImmediate();
            this._syncSkipRewardSceneVisibility();
        }

        this._updateScreenEdgeColliderState();

        // Hide rail in play mode, show in edit mode
        if (this._railObj) this._railObj.visible = isEditMode;

        // Hide old bombUI scene objects in play mode (replaced by capsule UI)
        if (this._bombUIObjs) this._bombUIObjs.forEach(obj => { obj.visible = isEditMode; });

        // Adjust UI positions for portrait mode (buttons below progression bar)
        this._updatePortraitUIOffset();
        this._syncSkipRewardSceneVisibility();
        this._updateSkipHint(dt);

        if (!isEditMode && this._skipRewardModal?.active) {
            this._updateSkipRewardModalHover(dt);
            this._handleSkipRewardModalInput();
        }

        if (!isEditMode && this._updateSkipRewardModal(dt)) {
            return;
        }

        // Handle UI buttons before gameplay so the same press cannot also trigger gameplay.
        if (!isEditMode && this._updateButtonHover(dt)) {
            return;
        }

        // Gameplay input must come after UI buttons so a skip click cannot also trigger gameplay.
        if (!isEditMode) {
            this.handleInput();
        }

        // Skip gameplay update in EDIT mode (let editor control zoom freely)
        if (isEditMode) {
            this._stopAllPublishedLoopSlots(80);
            GameSFX?.magnetStop?.();
            if (GameSFX?._windSource) GameSFX?.windStop?.();
            if (GameSFX?._zeroGDrone) GameSFX?.zeroGStop?.();
            RCHIPL.CameraFX?.clear?.();
            if (Array.isArray(this._tutorialWaterHints)) {
                for (const entry of this._tutorialWaterHints) {
                    if (entry?.obj) entry.obj.visible = false;
                }
            }
            return;
        }

        // Rotate-family objects can animate in any runtime layout.
        this._refreshRotateFamilyCache();
        this._updateRotateFamily(dt);
        this._refreshPulseFamilyCache();
        this._updatePulseFamily();

        // ═══ GPE: Update Pivots (motor) ═══
        if (RCHIPL.Pivot) {
            RCHIPL.Pivot.update(dt);
        }

        // ═══ GPE: Update Springboards (angular spring) ═══
        if (RCHIPL.Springboard) {
            RCHIPL.Springboard.update(dt);
        }

        // ═══ GPE: Update new gameplay families ═══
        if (RCHIPL.Sticky) RCHIPL.Sticky.update(dt);
        if (RCHIPL.Bouncy) RCHIPL.Bouncy.update(dt);
        if (RCHIPL.Magnet) RCHIPL.Magnet.update(dt);
        if (RCHIPL.Move) RCHIPL.Move.update(dt);
        if (RCHIPL.Switch) RCHIPL.Switch.update(dt);
        if (RCHIPL.Portal) RCHIPL.Portal.update(dt);

        // Camera.update() now syncs Camera.zoom → Viewport.zoom automatically

        // ═══ PLAY MODE: Physics simulation ═══
        // Physics is now updated by RCHIPL.Game with fixed timestep (60Hz)
        // for consistent behavior across all devices

        // Tweens are updated by RCHIPL.Game loop

        // Update bomb position from physics
        this.updateBomb();

        // SFX: contact grain + continuous ambient zones for active bomb
        const _sbMetrics = (sb) => {
            const env = sb?.envelopes?.[0];
            if (!env?.vertices || env.vertices.length < 3) return null;
            const verts = env.vertices;
            const n = verts.length;
            let cx = 0, cy = 0;
            for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; }
            cx /= n; cy /= n;
            let avgDist = 0;
            for (let i = 0; i < n; i++) {
                const dx = verts[i].x - cx, dy = verts[i].y - cy;
                avgDist += Math.sqrt(dx * dx + dy * dy);
            }
            avgDist /= n;
            let rcx = 0, rcy = 0;
            for (let i = 0; i < n; i++) { rcx += verts[i].restX; rcy += verts[i].restY; }
            rcx /= n; rcy /= n;
            let restAvg = 0;
            for (let i = 0; i < n; i++) {
                const dx = verts[i].restX - rcx, dy = verts[i].restY - rcy;
                restAvg += Math.sqrt(dx * dx + dy * dy);
            }
            restAvg /= n;
            let vel = 0;
            for (let i = 0; i < n; i++) {
                const vx = verts[i].x - verts[i].ox, vy = verts[i].y - verts[i].oy;
                vel += Math.sqrt(vx * vx + vy * vy);
            }
            vel /= n;
            return { squash: restAvg > 0 ? avgDist / restAvg : 1, vel };
        };

        const _getSoftbodyWallContactStats = (sb) => {
            const contacts = sb?._frameBodyContacts;
            if (!contacts?.size) return null;
            let wallBodies = 0;
            let sampleCount = 0;
            for (const info of contacts.values()) {
                const body = info?.body;
                if (!body || body.isSensor || !body.isStatic) continue;
                wallBodies++;
                sampleCount += Math.max(1, Number(info.count) || 0);
            }
            if (!wallBodies || sampleCount <= 0) return null;
            return { wallBodies, sampleCount };
        };

        const hasPublishedMagnet = !!this._getPublishedSfxPatch('sfx_runtime_magnet_loop');
        const hasPublishedWind = !!this._getPublishedSfxPatch('sfx_runtime_wind_loop');
        const hasPublishedZeroG = !!this._getPublishedSfxPatch('sfx_runtime_zero_g_loop');

        if (this.activeBomb?.softbody) {
            const m = _sbMetrics(this.activeBomb.softbody);
            const contactStats = _getSoftbodyWallContactStats(this.activeBomb.softbody);
            if (m && contactStats) {
                const contactBoost = Math.min(1.45, 0.82 + contactStats.sampleCount * 0.045);
                if (!this._playPublishedContactGrain(m.squash, m.vel * contactBoost)) {
                    GameSFX?.contactGrain?.(m.squash, m.vel * contactBoost);
                }
            } else {
                this._lightContactLastDeform = 0;
            }
        }

        if (this.activeBomb?.softbody) {
            const bombSb = this.activeBomb.softbody;
            const bombEnv = bombSb.envelopes?.[0];
            if (bombEnv?.vertices?.length > 0) {
                const bverts = bombEnv.vertices;
                let bcx = 0, bcy = 0;
                for (let i = 0; i < bverts.length; i++) { bcx += bverts[i].x; bcy += bverts[i].y; }
                bcx /= bverts.length; bcy /= bverts.length;

                let closestMagDist = Infinity;
                let closestMagRadius = 200;
                const magnets = RCHIPL.Scene?.getByFamily?.('magnet') || [];
                for (const mag of magnets) {
                    const dx = bcx - mag.x, dy = bcy - mag.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const radius = RCHIPL.FamilyProps?.get?.(mag, 'radius') || 200;
                    if (dist < radius && dist < closestMagDist) {
                        closestMagDist = dist;
                        closestMagRadius = radius;
                    }
                }
                if (closestMagDist < Infinity) {
                    const proximity = 1 - Math.min(1, closestMagDist / Math.max(1, closestMagRadius));
                    if (hasPublishedMagnet) {
                        const magnetVolume = 0.026 + proximity * 0.082;
                        const magnetRate = 0.96 + proximity * 0.11;
                        this._ensurePublishedLoopSlot('magnet', 'sfx_runtime_magnet_loop', magnetVolume, magnetRate, 140);
                    } else {
                        GameSFX?.magnetUpdate?.(closestMagDist / closestMagRadius);
                    }
                } else {
                    if (hasPublishedMagnet) this._updatePublishedLoopSlot('magnet', 0.0001, 1, 220);
                    else GameSFX?.magnetStop?.();
                }

                let bestWindCoverage = 0;
                let bestWindForce = 1;
                let bestWindScore = 0;
                const windZones = RCHIPL.WindZone?._zones || [];
                for (const wz of windZones) {
                    let insideCount = 0;
                    for (let i = 0; i < bverts.length; i++) {
                        if (RCHIPL.WindZone._pointInZone?.(bverts[i].x, bverts[i].y, wz)) insideCount++;
                    }
                    if (!insideCount) continue;
                    const coverage = insideCount / Math.max(1, bverts.length);
                    const force = Math.max(0.25, Number(wz.props?.force) || 1);
                    const score = coverage * force;
                    if (score > bestWindScore) {
                        bestWindScore = score;
                        bestWindCoverage = coverage;
                        bestWindForce = force;
                    }
                }
                if (bestWindCoverage > 0) {
                    if (hasPublishedWind) {
                        const forceNorm = Math.max(0.45, Math.min(2.2, Number(bestWindForce) || 1));
                        const coverageNorm = Math.max(0.1, Math.min(1, bestWindCoverage));
                        const volume = 0.048 + coverageNorm * 0.075 + Math.max(0, forceNorm - 1) * 0.016;
                        const rate = 0.98 + Math.max(-0.04, Math.min(0.18, (forceNorm - 1) * 0.09));
                        this._ensurePublishedLoopSlot('wind', 'sfx_runtime_wind_loop', volume, rate, 140);
                    } else if (!GameSFX?._windSource) {
                        GameSFX?.windStart?.(bestWindForce);
                    }
                } else {
                    if (hasPublishedWind) this._updatePublishedLoopSlot('wind', 0.0001, 1, 240);
                    else if (GameSFX?._windSource) GameSFX?.windStop?.();
                }

                const zeroGMap = RCHIPL.ZeroGZone?._softbodiesInZone;
                const inZeroG = zeroGMap?.has?.(bombSb.id);
                if (inZeroG) {
                    if (hasPublishedZeroG) {
                        this._ensurePublishedLoopSlot('zeroG', 'sfx_runtime_zero_g_loop', 0.042, 1, 180);
                    } else if (!GameSFX?._zeroGDrone) {
                        GameSFX?.zeroGStart?.();
                    }
                } else {
                    this._stopPublishedLoopSlot('zeroG', 260);
                    if (GameSFX?._zeroGDrone) GameSFX?.zeroGStop?.();
                }
            }
        } else {
            this._stopPublishedLoopSlot('magnet', 140);
            this._stopPublishedLoopSlot('wind', 180);
            this._stopPublishedLoopSlot('zeroG', 220);
            GameSFX?.magnetStop?.();
            if (GameSFX?._windSource) GameSFX?.windStop?.();
            if (GameSFX?._zeroGDrone) GameSFX?.zeroGStop?.();
        }

        this._updatePivotTicksLight();

        // Update pending bomb (follows rail)
        this.updatePendingBomb();

        // ═══ 2P VERSUS: update per-player bombs ═══
        if (this._versusMode && this._vs) {
            for (let _vsi = 0; _vsi < 2; _vsi++) {
                this._updateVsPlayerBomb(_vsi);
                this._updateVsPlayerPendingBomb(_vsi);
            }
            if (this._vsScoreUiDirty) this._updateVsScoreUi(false);
        }
        if (this._isVersusScoreLayoutActive() && this._vsScoreUiDirty) {
            this._updateVsScoreUi(false);
        }

        // Update bomb eyes to look at nearest target
        this.updateBombLookTarget();

        // Update fuse particles (disabled for pufferfish mode)
        if (this._fuseEnabled) {
            this._updateFuse(dt);
            this._updateEmbers(dt);
        }

        // Update puff animation
        this._updatePuff(dt);

        // Update camera shake & spring zoom
        this._updateCameraShake(dt);
        this._updateSpringZoom(dt);

        // Update squash animations
        this._updateSquashAnimations();

        // Update emotion bubbles
        this._updateEmotionBubbles();
        this._updateTutorialWaterHints();

        // Update victory YES animation
        this._updateVictoryYes(dt);

        // Update post-explosion reinflate
        this._updateReinflate(dt);

        // ═══ GAMEPLAY: Check blob status ═══
        this.checkBlobsInWater();
        this._updateBlobPins(dt);
        this._checkSettleTimeout();  // Safety timeout for stalled settling
        this._updateDefeatCheck(dt);

        // ═══ GPE: Update suspended platforms ═══
        if (RCHIPL.Suspended) {
            RCHIPL.Suspended.update();
        }

        // ═══ STUNTMAN SYSTEM: Make softbodies follow their rigidbody proxies ═══
        if (this.savedBlobs) {
            for (const blob of this.savedBlobs) {
                const sb = blob.softbody;
                if (!sb?._rigidProxy) continue;

                const proxy = sb._rigidProxy;
                const px = proxy.position.x;
                const py = proxy.position.y;

                // Position softbody vertices around rigidbody center (rest shape)
                const verts = sb.envelopes?.[0]?.vertices;
                if (verts) {
                    for (const v of verts) {
                        v.x = px + v.restX;
                        v.y = py + v.restY;
                        v.ox = v.x;  // No velocity (static relative to proxy)
                        v.oy = v.y;
                    }
                }
            }
        }
    },


    // ─── COORDINATE CONVERSION ───
    // DEPRECATED: Use RCHIPL.Viewport.screenToWorld(I.rawX, I.rawY) instead
    // This kept for backwards compatibility with gameplay code
    canvasToWorld(canvasX, canvasY, out = null) {
        const vp = RCHIPL.Viewport;
        const panX = vp?.pan?.x || 0;
        const panY = vp?.pan?.y || 0;
        const zoom = vp?.zoom || 1;
        const canvas = RCHIPL.Screen?.canvas || document.getElementById('game');
        const w = vp?._width || canvas?.width || this.WIDTH;
        const h = vp?._height || canvas?.height || this.HEIGHT;
        const p = out || (this._tmpCanvasToWorld || (this._tmpCanvasToWorld = { x: 0, y: 0 }));
        p.x = (canvasX - w/2 - panX) / zoom;
        p.y = (canvasY - h/2 - panY) / zoom;
        return p;
    },


    // ─── INPUT HANDLING (Edit mode selection/transform) ───
    handleInput() {
        const I = RCHIPL.Input;
        const Sel = RCHIPL.Selection;
        const Trans = RCHIPL.Transform;
        const Handles = RCHIPL.Handles;
        const vp = RCHIPL.Viewport;

        // ═══ EDIT MODE: Selection and object manipulation ═══
        if (RCHIPL.Editor?.isEditMode?.()) {
            // Convert raw clientX/clientY to world coords (consistent with Selection.hitTest)
            const worldPos = RCHIPL.Viewport.screenToWorld(I.rawX, I.rawY);

            // Skip selection/manipulation if panning (space+drag)
            if (vp.isSpaceDown?.() || vp.isPanning?.()) {
                return;
            }

            // Click to select, scale, rotate, or start dragging
            if (I.leftClicked()) {
                // 1. Check handles first (for scale or rotate)
                const handle = Handles?.hitTestWorld?.(worldPos.x, worldPos.y, vp.zoom || 1);
                if (handle && Sel.selectedIds.length > 0) {
                    RCHIPL.History.save();
                    if (handle === 'rotate') {

    // ─── RENDER ───
    render() {

        // Engine already clears the backbuffer each frame: avoid redundant fullscreen fill

        ctx.save();

        }

        // Draw grid/guides overlay (in screen space)
        if (RCHIPL.Editor?.isEditMode?.()) {
            RCHIPL.Editor.renderOverlay?.(ctx, this.WIDTH, this.HEIGHT);
        }

        // Camera flash effect (white overlay that fades out)
        if (this._victoryFlash > 0 && !RCHIPL.Editor?.isEditMode?.()) {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = `rgba(255, 255, 255, ${this._victoryFlash})`;
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.restore();
        }

        // ─── HUD (screen space) ───
        if (!RCHIPL.Editor?.isEditMode?.()) {
            this.renderHUD(ctx);
        }

        if (!RCHIPL.Editor?.isEditMode?.()) {
            this._renderSkipRewardModal(ctx);
        }
    },


    // ─── POST-RENDER (after water, for UI above liquid) ───
    postRender(ctx) {
    },

    _renderCatapultVirtualJoystick(ctx) {
        if (this.state !== 'PLAYING') return;
        if (!this._useThumbDragOriginForCatapult()) return;
        if (!this._isMobileUaForCatapult()) return;

        this._ensureCatapultJoystickAnchor();
        if (!Number.isFinite(this._catapultJoyX) || !Number.isFinite(this._catapultJoyY)) return;

        const S = RCHIPL.Screen;
        if (!S) return;
        const metrics = this._getCatapultJoystickMetrics();
        const outerR = metrics.outerRadius;
        const innerR = metrics.innerRadius;
        const explodeOuterR = metrics.explosionOuterRadius || outerR;
        const explodeInnerR = metrics.explosionInnerRadius || innerR;
        const explodeStrokeScale = explodeOuterR / Math.max(1, outerR);
        const maxInner = metrics.maxInnerOffset;
        const joyCx = this._catapultJoyX;
        const joyCy = this._catapultJoyY;
        const explodeCenter = this._getCatapultExplosionButtonCenter(metrics);
        const explodeCx = explodeCenter.x;
        const explodeCy = explodeCenter.y;
        const hasActiveBomb = !!this.activeBomb;
        const canExplodeNow = hasActiveBomb ? this._canExplodeBombNow(this.activeBomb, this._bombSpawnerConfig) : false;
        const explodeMode = this._normalizeExplodeMode(this._bombSpawnerConfig?.explodeMode);
        const showExplodeButtonNow = hasActiveBomb && (explodeMode === 'canExplose' || canExplodeNow);
        const showLaunchJoystick = !hasActiveBomb;
        const showExplodeButton = showExplodeButtonNow;
        if (!showLaunchJoystick && !showExplodeButton) return;

        let innerX = joyCx;
        let innerY = joyCy;
        if (!hasActiveBomb && this._launcherIsCharging && this.pendingBomb && !this.activeBomb) {
            const dx = (this._catapultDragX || 0) - (this._catapultDragStartX || 0);
            const dy = (this._catapultDragY || 0) - (this._catapultDragStartY || 0);
            const dist = Math.hypot(dx, dy);
            if (dist > 0.001) {
                const k = Math.min(maxInner, dist) / dist;
                innerX = joyCx + dx * k;
                innerY = joyCy + dy * k;
            }
        }

        // Draw in Screen safe-space coordinates (independent of world/viewport).
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(S.dpr, S.dpr);
        ctx.translate(S.offsetX, S.offsetY);
        ctx.scale(S.scale, S.scale);

        // Slot state A: launch joystick (before shot)
        if (showLaunchJoystick) {
            ctx.save();
            ctx.globalAlpha = 1;
            ctx.lineWidth = metrics.outerLineWidth || 5;
            ctx.strokeStyle = 'rgba(255,255,255,1)';
            ctx.fillStyle = 'rgba(255,255,255,0)';
            ctx.beginPath();
            ctx.arc(joyCx, joyCy, outerR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = metrics.innerLineWidth || 3;
            ctx.strokeStyle = 'rgba(255,255,255,1)';
            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.beginPath();
            ctx.arc(innerX, innerY, innerR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // Slot state B: explosion button (after shot, only when explosion is allowed)
        if (showExplodeButton) {
            ctx.save();
            ctx.globalAlpha = 1;
            const pulse = 0.92 + 0.08 * Math.sin(performance.now() / 160);
            const ringR = explodeOuterR;
            const starOuter = explodeInnerR * 1.62 * pulse;
            const starInner = starOuter * 0.46;
            const spikes = 8;
            const rot = -Math.PI / 2;

            ctx.lineWidth = (metrics.outerLineWidth || 5) * explodeStrokeScale;
            ctx.strokeStyle = 'rgba(255,255,255,1)';
            ctx.fillStyle = 'rgba(255,255,255,0)';
            ctx.beginPath();
            ctx.arc(explodeCx, explodeCy, ringR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const a = rot + (i * Math.PI / spikes);
                const rr = (i % 2 === 0) ? starOuter : starInner;
                const px = explodeCx + Math.cos(a) * rr;
                const py = explodeCy + Math.sin(a) * rr;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.strokeStyle = 'rgba(255,255,255,1)';
            ctx.lineWidth = Math.max(2, ((metrics.innerLineWidth || 3) + 0.5) * explodeStrokeScale);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(explodeCx, explodeCy, Math.max(4, explodeInnerR * 0.23), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fill();
            ctx.restore();
        }

        ctx.restore();
    },

    // ─── CAPSULE UI SYSTEM ───
    // Auto-sizing capsules for bombs and slime goals

    _renderBombCapsule(ctx, safeW) {
        // ── Progression dots: show current container's levels ──
        const currentLayout = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const container = RCHIPL.Layouts?.getContainerFor?.(currentLayout);
        if (!container?.layouts?.length) return; // Not in a container → no capsule
        const containerLevels = container.layouts;
        const levelCount = containerLevels.length;
        const savedLevels = RCHIPL.Save?.get?.('levels') || {};
        const strokeColor = String(RCHIPL.Layouts?.getVar?.('progressStrokeColor') || '#ffffff');
        const fillColor = String(
            RCHIPL.Layouts?.getVar?.('raycastColor')
            || RCHIPL.Layouts?.getVar?.('progressFillColor')
            || '#ff8c00'
        );
        const loopCount = this._getCompletedLoopCount();
        const showLoopCrown = loopCount > 0;

        const scale = 0.75;
        const loopCrownWidth = 44 * scale;
        const loopCrownHeight = 22 * scale;
        const loopTextFontSize = Math.round(24 * scale);
        const loopTextGapY = 12 * scale;
        const loopTextLineHeight = loopTextFontSize;
        const loopCrownLiftY = -4 * scale;
        const loopTextLiftY = -2 * scale;
        const iconSize = 40 * scale * 0.9;
        const paddingX = 24 * scale;
        const paddingY = 16 * scale;
        const gap = 4 * scale;
        const cornerRadius = 24 * scale;
        const loopGapY = showLoopCrown ? 8 * scale : 0;
        const loopRowHeight = showLoopCrown ? (loopCrownHeight + loopTextGapY + loopTextLineHeight) : 0;

        // Calculate notch dimensions
        const contentWidth = levelCount * iconSize + (levelCount - 1) * gap;
        const notchWidth = contentWidth + paddingX * 2;
        const dotsAreaHeight = iconSize + paddingY * 2;
        const notchHeight = dotsAreaHeight + loopGapY + loopRowHeight;

        // Anchor to top center of visible window (like anchorToScreen)
        const vb = RCHIPL.Screen?.getVisibleBounds?.();
        const visibleWidth = vb ? vb.width : safeW;
        const visibleLeft = vb ? vb.left : 0;
        const visibleTop = vb ? vb.top : 0;
        const isPortrait = vb && vb.height > vb.width;

        const x = visibleLeft + (visibleWidth - notchWidth) / 2;
        // In portrait, place bomb feedback below top uiRoot band (if any).
        // In landscape, keep legacy top-edge behavior unchanged.
        const topUiInset = isPortrait ? Math.max(0, this._uiRuntime?.topRootInsetPx || 0) : 0;
        const portraitGap = isPortrait ? 6 : 0;
        const y = visibleTop + topUiInset + portraitGap;

        if (this._showBombCapsulePanel) {
            // Draw notch background (white) - rounded only at bottom
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + notchWidth, y);
            ctx.lineTo(x + notchWidth, y + notchHeight - cornerRadius);
            ctx.quadraticCurveTo(x + notchWidth, y + notchHeight, x + notchWidth - cornerRadius, y + notchHeight);
            ctx.lineTo(x + cornerRadius, y + notchHeight);
            ctx.quadraticCurveTo(x, y + notchHeight, x, y + notchHeight - cornerRadius);
            ctx.lineTo(x, y);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Draw shadow band from top bar (10px gray gradient)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(x, y, notchWidth, 10);

            // Draw 3px black border (sides and bottom only)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + notchHeight - cornerRadius);
            ctx.quadraticCurveTo(x, y + notchHeight, x + cornerRadius, y + notchHeight);
            ctx.lineTo(x + notchWidth - cornerRadius, y + notchHeight);
            ctx.quadraticCurveTo(x + notchWidth, y + notchHeight, x + notchWidth, y + notchHeight - cornerRadius);
            ctx.lineTo(x + notchWidth, y);
            ctx.stroke();
        }

        // Draw level progression dots
        const r = iconSize / 2 - 2;
        const innerR = Math.min(r - 1.5, Math.max(3, (r - 7) * 1.5));
        const dotsCenterY = y + paddingY + iconSize / 2;

        for (let i = 0; i < levelCount; i++) {
            const levelId = containerLevels[i];
            const iconX = x + paddingX + i * (iconSize + gap) + iconSize / 2;
            const iconY = dotsCenterY;

            const isCompleted = !!savedLevels[levelId]?.completed;
            const isCurrent = levelId === currentLayout;

            ctx.save();
            ctx.translate(iconX, iconY);

            // Base contour stays intentionally thin and sober.
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.stroke();

            if (isCompleted || isCurrent) {
                // Completed = full inner dot, current = pulsing "in progress" inner dot.
                if (isCurrent && !isCompleted) {
                    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 120);
                    ctx.globalAlpha = 0.25 + 0.35 * pulse;
                }
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.arc(0, 0, innerR, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            ctx.restore();
        }

        if (showLoopCrown) {
            const loopText = `X${loopCount}`;
            const loopBlockLiftY = 10;
            const minCrownTopY = dotsCenterY + r + 2 * scale;
            const desiredCrownCenterY = y + dotsAreaHeight + loopGapY + loopCrownHeight / 2 + loopCrownLiftY - loopBlockLiftY;
            const crownCenterY = Math.max(minCrownTopY + loopCrownHeight / 2, desiredCrownCenterY);
            const textCenterY = crownCenterY + loopCrownHeight / 2 + loopTextGapY + loopTextLineHeight / 2 + loopTextLiftY;

            ctx.save();
            ctx.font = `900 ${loopTextFontSize}px Nunito, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            const groupCenterX = x + notchWidth / 2;

            ctx.save();
            ctx.translate(groupCenterX, crownCenterY);
            ctx.scale(loopCrownWidth / 200, loopCrownHeight / 100);
            RCHIPL.Assets.draw(ctx, 'crown', 0, 0, {
                scaleX: 1,
                scaleY: 1,
                angle: 0,
                alpha: 1
            });
            ctx.restore();

            ctx.fillStyle = '#ffffff';
            ctx.fillText(loopText, groupCenterX, textCenterY);
            ctx.restore();
        }
    },

    // ─── HUD RENDERING ───
    renderHUD(ctx) {
        // 2P mode: no HUD (user handles UI)
        if (this._versusMode) return;

        // Reset to raw canvas, then apply Screen transform for HUD
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset to identity

        const S = RCHIPL.Screen;
        // Apply Screen transform: DPR + offset + scale (positions HUD in safe zone)
        ctx.scale(S.dpr, S.dpr);
        ctx.translate(S.offsetX, S.offsetY);
        ctx.scale(S.scale, S.scale);

        // Render dynamic capsule UI (bomb notch)
        this._renderBombCapsule(ctx, S.safeW);
        this._renderSkipHintArrow(ctx);
        this._renderSoundToggleMuteOverlay(ctx);

        ctx.restore();
    },


    // Update bomb UI visibility based on bombsRemaining
    // Uses bombUI instances with vars.ID to determine visibility
    // Animates with easeInBack when hiding (grows slightly then shrinks to 0)
    updateBombUI() {
        const uiObjects = RCHIPL.Scene.getAll().filter(o => o.asset === 'bombUI' && o.vars?.ID);
        for (const obj of uiObjects) {
            const shouldShow = obj.vars.ID <= this.bombsRemaining;

            if (shouldShow) {
                // Show immediately with full scale
                obj.visible = true;
                // Capture base scale on first show (preserves layout scale)
                if (obj._baseScaleX === undefined) {
                    obj._baseScaleX = obj.scaleX ?? 0.5;
                    obj._baseScaleY = obj.scaleY ?? 0.5;
                }
                obj.scaleX = obj._baseScaleX;
                obj.scaleY = obj._baseScaleY;
            } else if (obj.visible && !obj._isHiding) {
                // Animate hide with easeInBack (grows then shrinks to 0)
                obj._isHiding = true;
                // Capture base scale if not already captured
                if (obj._baseScaleX === undefined) {
                    obj._baseScaleX = obj.scaleX ?? 0.5;
                    obj._baseScaleY = obj.scaleY ?? 0.5;
                }

                RCHIPL.Tween.to(obj, { scaleX: 0, scaleY: 0 }, 0.25, 'easeInBack')
                    .then(() => {
                        obj.visible = false;
                        obj._isHiding = false;
                    });
            }
        }
    },


    // ─── NAVIGATION ───
    goTo(layoutId, params = {}) {
        return RCHIPL.Layouts.goTo(layoutId, { params });
    },


    // Get spawn Y position - uses aimY (interpolated from rail markers)
    getSpawnY() {
        // aimY is calculated every frame in updateGameplay from rail_left/rail_right
        return this.aimY;
    },

    _getSoftbodyCenter(sb, fallbackX = 0, fallbackY = 0) {
        const verts = sb?.envelopes?.[0]?.vertices;
        if (!verts || !verts.length) return { x: fallbackX, y: fallbackY };
        let x = 0;
        let y = 0;
        for (const v of verts) {
            x += v.x;
            y += v.y;
        }
        const inv = 1 / verts.length;
        return { x: x * inv, y: y * inv };
    },

    _refreshRailMarkers() {
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        this._railLeftObj = allObjs.find(o => o.id === 'rail_left' || o.asset === 'rail_left') || null;
        this._railRightObj = allObjs.find(o => o.id === 'rail_right' || o.asset === 'rail_right') || null;
    },

    _isSpawnerControlMode() {
        return this.controlMode === 'spawner' || this.controlMode === 'catapult';
    },

    _isMobileLikeForCatapult() {
        const touchCount = Number(RCHIPL.Input?.touchCount || 0);
        const inputTouching = !!RCHIPL.Input?.touching?.();
        const maxTouchPoints = typeof navigator !== 'undefined' ? (navigator.maxTouchPoints || 0) : 0;
        const coarsePointer = typeof window !== 'undefined'
            && typeof window.matchMedia === 'function'
            && (window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(any-pointer: coarse)').matches);
        const screenMobileRuntime = !!RCHIPL.Screen?._isMobileRuntime;
        return touchCount > 0
            || inputTouching
            || maxTouchPoints > 0
            || coarsePointer
            || screenMobileRuntime
            || !!RCHIPL._isMobile;
    },

    _normalizeDesktopCatapultMode(mode) {
        const raw = String(mode || '').trim();
        if (raw === 'desktopDefault' || raw === 'portraitMobileLike') return raw;
        const lc = raw.toLowerCase();
        if (
            lc === 'portraitmobilelike'
            || lc === 'portraitmobile'
            || lc === 'mobileportrait'
            || lc === 'mobile'
            || lc === 'sameasmobile'
        ) {
            return 'portraitMobileLike';
        }
        return 'desktopDefault';
    },

    _isMobileUaForCatapult() {
        const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '';
        return /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    },

    _usePortraitMobileDesktopCatapult() {
        if (this.controlMode !== 'catapult') return false;
        if (this._desktopMirrorMobileDragTest && !this._isMobileUaForCatapult()) return true;
        const mode = this._normalizeDesktopCatapultMode(this._bombSpawnerConfig?.desktopControlMode);
        if (mode !== 'portraitMobileLike') return false;
        // Keep desktop override active even on touch-capable laptops.
        // Only real mobile UA disables this desktop override.
        return !this._isMobileUaForCatapult();
    },

    _useThumbDragOriginForCatapult() {
        if (this.controlMode !== 'catapult') return false;
        if (this._usePortraitMobileDesktopCatapult()) return true;
        if (!this._isMobileLikeForCatapult()) return false;
        return this._getUiOrientation() === 'portrait';
    },

    _useCatapultExplosionButtonMode() {
        return this.controlMode === 'catapult'
            && this._useThumbDragOriginForCatapult()
            && this._isMobileUaForCatapult();
    },

    _getCatapultJoystickMetrics() {
        const S = RCHIPL.Screen;
        const safeW = S?.safeW || this.WIDTH;
        const safeH = S?.safeH || this.HEIGHT;
        const left = Number.isFinite(S?.visibleLeft) ? S.visibleLeft : 0;
        const right = Number.isFinite(S?.visibleRight) ? S.visibleRight : safeW;
        const top = Number.isFinite(S?.visibleTop) ? S.visibleTop : 0;
        const bottom = Number.isFinite(S?.visibleBottom) ? S.visibleBottom : safeH;
        const visibleW = Math.max(1, right - left);
        const visibleH = Math.max(1, bottom - top);
        const isMobilePortrait = this.controlMode === 'catapult'
            && this._isMobileLikeForCatapult()
            && this._getUiOrientation() === 'portrait';
        const joystickScale = isMobilePortrait ? 1.5 : 1;
        const explosionButtonScale = this._useCatapultExplosionButtonMode() ? 1.3 : 1;
        const outerRadius = 68 * joystickScale;
        const innerRadius = 26 * joystickScale;
        const explosionOuterRadius = outerRadius * explosionButtonScale;
        const explosionInnerRadius = innerRadius * explosionButtonScale;
        const explosionHitRadius = explosionOuterRadius * 1.16;
        const maxInnerOffset = outerRadius * 0.58;
        const margin = outerRadius + 16;
        const outerLineWidth = 5 * joystickScale;
        const innerLineWidth = 3 * joystickScale;
        const clampPadX = 0;
        const clampPadTop = 0;
        const clampPadBottom = 0;
        // In mobile portrait, keep joystick centered on X.
        const defaultX = left + visibleW * 0.5;
        const defaultY = top + visibleH * (5 / 6) + 16; // slightly lower for thumb comfort
        const topTouchResetY = top + visibleH * 0.58;
        return {
            safeW,
            safeH,
            left,
            right,
            top,
            bottom,
            visibleW,
            visibleH,
            outerRadius,
            innerRadius,
            explosionButtonScale,
            explosionOuterRadius,
            explosionInnerRadius,
            explosionHitRadius,
            maxInnerOffset,
            margin,
            outerLineWidth,
            innerLineWidth,
            clampPadX,
            clampPadTop,
            clampPadBottom,
            defaultX,
            defaultY,
            topTouchResetY
        };
    },

    _getCatapultExplosionButtonCenter(metrics = null, out = null) {
        const m = metrics || this._getCatapultJoystickMetrics();
        const p = out || (this._tmpCatapultExplodeCenter || (this._tmpCatapultExplodeCenter = { x: 0, y: 0 }));

        const joyX = Number.isFinite(this._catapultJoyX) ? this._catapultJoyX : m.defaultX;
        const joyY = Number.isFinite(this._catapultJoyY) ? this._catapultJoyY : m.defaultY;
        const centerX = m.left + m.visibleW * 0.5;
        const explodeR = m.explosionOuterRadius || m.outerRadius || 0;
        const joyR = m.outerRadius || 0;
        const useCenteredPortraitStack = this._useCatapultExplosionButtonMode()
            && this._getUiOrientation() === 'portrait';

        if (useCenteredPortraitStack) {
            const minX = m.left + explodeR;
            const maxX = m.right - explodeR;
            const minY = m.top + explodeR;
            const maxY = m.bottom - explodeR;
            p.x = Math.max(minX, Math.min(maxX, joyX));
            p.y = Math.max(minY, Math.min(maxY, joyY));
            return p;
        }

        // Mirror explosion button around screen center so it stays aligned with joystick shifts.
        let x = centerX - (joyX - centerX);
        const minGap = joyR + explodeR + 18;
        if (Math.abs(x - joyX) < minGap) {
            x = joyX + (joyX >= centerX ? -minGap : minGap);
        }

        const minX = m.left + explodeR;
        const maxX = m.right - explodeR;
        p.x = Math.max(minX, Math.min(maxX, x));
        p.y = joyY;
        return p;
    },

    _setCatapultJoystickAnchor(x, y) {
        const metrics = this._getCatapultJoystickMetrics();
        const minX = metrics.left + metrics.clampPadX;
        const maxX = metrics.right - metrics.clampPadX;
        const minY = metrics.top + metrics.clampPadTop;
        const maxY = metrics.bottom - metrics.clampPadBottom;
        const clampedX = Math.max(minX, Math.min(maxX, x));
        const clampedY = Math.max(minY, Math.min(maxY, y));
        this._catapultJoyX = clampedX;
        this._catapultJoyY = clampedY;
    },

    _setCatapultJoystickAnchorFromFirstTouch(touchX, touchY) {
        const metrics = this._getCatapultJoystickMetrics();
        // Keep joystick visually fixed in portrait.
        // Input can still start anywhere: launch angle/force continue to use drag start.
        this._setCatapultJoystickAnchor(metrics.defaultX, metrics.defaultY);
    },

    _ensureCatapultJoystickAnchor(force = false) {
        if (!this._useThumbDragOriginForCatapult()) return;
        const hasAnchor = Number.isFinite(this._catapultJoyX) && Number.isFinite(this._catapultJoyY);
        if (!hasAnchor || force) {
            const metrics = this._getCatapultJoystickMetrics();
            this._setCatapultJoystickAnchor(metrics.defaultX, metrics.defaultY);
            return;
        }
        // Re-clamp on resize/orientation changes.
        this._setCatapultJoystickAnchor(this._catapultJoyX, this._catapultJoyY);
    },

    _isPointerInsideCatapultExplodeButton(pointerX, pointerY) {
        if (!this._useCatapultExplosionButtonMode()) return false;
        if (!Number.isFinite(pointerX) || !Number.isFinite(pointerY)) return false;
        if (!this.activeBomb) return false;
        if (!this._canExplodeBombNow(this.activeBomb, this._bombSpawnerConfig)) return false;
        this._ensureCatapultJoystickAnchor();
        if (!Number.isFinite(this._catapultJoyY)) return false;

        const metrics = this._getCatapultJoystickMetrics();
        const hitR = metrics.explosionHitRadius || (metrics.outerRadius * 1.05);
        const explodeCenter = this._getCatapultExplosionButtonCenter(metrics);
        const explosionX = explodeCenter.x;
        const explosionY = explodeCenter.y;
        const dx = pointerX - explosionX;
        const dy = pointerY - explosionY;
        return (dx * dx + dy * dy) <= (hitR * hitR);
    },

    _worldToCanvas(worldX, worldY, out = null) {
        const vp = RCHIPL.Viewport;
        const panX = vp?.pan?.x || 0;
        const panY = vp?.pan?.y || 0;
        const zoom = vp?.zoom || 1;
        const canvas = RCHIPL.Screen?.canvas || document.getElementById('game');
        const w = vp?._width || canvas?.width || this.WIDTH;
        const h = vp?._height || canvas?.height || this.HEIGHT;
        const p = out || (this._tmpWorldToCanvas || (this._tmpWorldToCanvas = { x: 0, y: 0 }));
        p.x = worldX * zoom + w / 2 + panX;
        p.y = worldY * zoom + h / 2 + panY;
        return p;
    },

    _canvasToWorld(canvasX, canvasY, out = null) {
        const vp = RCHIPL.Viewport;
        const panX = vp?.pan?.x || 0;
        const panY = vp?.pan?.y || 0;
        const zoom = vp?.zoom || 1;
        const canvas = RCHIPL.Screen?.canvas || document.getElementById('game');
        const w = vp?._width || canvas?.width || this.WIDTH;
        const h = vp?._height || canvas?.height || this.HEIGHT;
        const invZoom = Math.abs(zoom) > 1e-6 ? (1 / zoom) : 1;
        const p = out || (this._tmpCanvasToWorld2 || (this._tmpCanvasToWorld2 = { x: 0, y: 0 }));
        p.x = (canvasX - w / 2 - panX) * invZoom;
        p.y = (canvasY - h / 2 - panY) * invZoom;
        return p;
    },

    _clampLauncherAngleDeg(angleDeg, cfg) {
        const min = Number.isFinite(cfg?.angleMin) ? cfg.angleMin : -180;
        const max = Number.isFinite(cfg?.angleMax) ? cfg.angleMax : 180;
        if (min <= max) return Math.max(min, Math.min(max, angleDeg));
        return angleDeg;
    },

    _getCatapultInputProfile() {
        const profiles = this._catapultInputProfiles || (this._catapultInputProfiles = {
            // Desktop: launch toward drag end (mouse direction).
            desktopPortrait: { deadzonePx: 12, maxDragPx: 260, minTapForceNorm: 0.15, forceCurve: 1.08, invertAim: false },
            desktopLandscape: { deadzonePx: 10, maxDragPx: 300, minTapForceNorm: 0.12, forceCurve: 1.06, invertAim: false },
            // Mobile: arrow follows finger direction (same as desktop).
            mobilePortrait: {
                deadzonePx: 12,
                maxDragPx: 180,
                minTapForceNorm: 0.03,
                forceCurve: 1.4,
                forceLinearKnee: 0.72,
                forceAtKnee: 0.82,
                invertAim: false
            },
            mobileLandscape: {
                deadzonePx: 10,
                maxDragPx: 210,
                minTapForceNorm: 0.03,
                forceCurve: 1.35,
                forceLinearKnee: 0.75,
                forceAtKnee: 0.84,
                invertAim: false
            }
        });
        const isMobile = this._isMobileLikeForCatapult();
        const orientation = this._getUiOrientation();
        const isPortrait = orientation === 'portrait';
        const desktopMode = this._normalizeDesktopCatapultMode(this._bombSpawnerConfig?.desktopControlMode);

        // Force portrait-mobile tuning on desktop in test mode.
        let selected = null;
        if (!this._isMobileUaForCatapult() && this._desktopMirrorMobileDragTest) {
            selected = profiles.mobilePortrait;
        }

        // Optional variant: desktop can opt into portrait-mobile profile.
        if (!selected && !this._isMobileUaForCatapult() && desktopMode === 'portraitMobileLike') {
            selected = profiles.mobilePortrait;
        }

        if (!selected && isMobile) {
            selected = isPortrait ? profiles.mobilePortrait : profiles.mobileLandscape;
        }
        if (!selected) selected = isPortrait ? profiles.desktopPortrait : profiles.desktopLandscape;

        const tuned = { ...selected };
        const cfg = this._bombSpawnerConfig || {};
        const num = (v) => {
            const n = parseFloat(v);
            return Number.isFinite(n) ? n : null;
        };
        const deadzoneOverride = num(cfg.dragDeadzonePx);
        const curveOverride = num(cfg.forceCurve);
        const kneeOverride = num(cfg.forceLinearKnee);
        const atKneeOverride = num(cfg.forceAtKnee);
        if (deadzoneOverride !== null) tuned.deadzonePx = Math.max(0, deadzoneOverride);
        if (curveOverride !== null) tuned.forceCurve = Math.max(0.25, curveOverride);
        if (kneeOverride !== null) tuned.forceLinearKnee = Math.max(0.05, Math.min(0.99, kneeOverride));
        if (atKneeOverride !== null) tuned.forceAtKnee = Math.max(0.05, Math.min(0.99, atKneeOverride));
        return tuned;
    },

    _getCatapultDragDistancePx() {
        const dx = (this._catapultDragX || 0) - (this._catapultDragStartX || 0);
        const dy = (this._catapultDragY || 0) - (this._catapultDragStartY || 0);
        return Math.hypot(dx, dy);
    },

    _getCatapultMinLaunchDragPx(profile = null) {
        const cfg = this._bombSpawnerConfig || {};
        const fromProps = parseFloat(cfg.minLaunchDragPx);
        if (Number.isFinite(fromProps) && fromProps >= 0) return fromProps;
        const deadzone = Math.max(0, profile?.deadzonePx || 0);
        return Math.max(this._catapultMinLaunchDragPxDefault || 14, deadzone + 3);
    },

    _canCatapultLaunchFromCurrentDrag(profile = null) {
        const minDragPx = this._getCatapultMinLaunchDragPx(profile || this._getCatapultInputProfile());
        return this._getCatapultDragDistancePx() >= minDragPx;
    },

    _canCatapultLaunchFromCurrentInput(profile = null, cfg = null) {
        const tunedProfile = profile || this._getCatapultInputProfile();
        const config = cfg || this._bombSpawnerConfig || {};

        // Real mobile devices keep drag-distance anti-tap guard.
        if (this._isMobileUaForCatapult()) {
            return this._canCatapultLaunchFromCurrentDrag(tunedProfile);
        }

        // Desktop override that mirrors mobile thumb-origin keeps the same guard.
        if (this._useThumbDragOriginForCatapult()) {
            return this._canCatapultLaunchFromCurrentDrag(tunedProfile);
        }

        // Desktop default: validate by arrow/charge (mouse-to-blob distance),
        // not by drag delta between mousedown/mouseup.
        const forceMax = Math.max(1, Number(config.forceMax) || 1);
        const minNormRaw = parseFloat(config.minDesktopLaunchForceNorm);
        const minNorm = Number.isFinite(minNormRaw)
            ? Math.max(0, Math.min(0.35, minNormRaw))
            : 0.06;
        const chargeNorm = Math.max(0, Math.min(1, (this._launcherCharge || 0) / forceMax));
        return chargeNorm >= minNorm;
    },

    _onCatapultShortDragRelease() {
        if (this._areTutorialHintsLocked()) return;
        const cfg = this._bombSpawnerConfig || {};
        const missesOverride = parseInt(cfg.tutoTapMissesForHint, 10);
        const missesForHint = Number.isFinite(missesOverride)
            ? Math.max(1, missesOverride)
            : Math.max(1, this._catapultTapMissesForHintDefault || 2);

        this._catapultTapMissCount = (this._catapultTapMissCount || 0) + 1;
        if (this._catapultTapMissCount < missesForHint) return;

        this._catapultTapMissCount = 0;
        if (!this._isLaunchHintEligible()) return;

        this._launchHintDismissed = false;
        this._launchHintActive = true;
        this._launchHintPhase = 0;
    },

    _isLaunchHintEligible() {
        if (this._launchHintOnboardingLevel) return true;
        if (this._launchHintForcedByStruggle) return true;
        return false;
    },

    _areTutorialHintsLocked() {
        if (RCHIPL.Editor?.isEditMode?.()) return false;
        return performance.now() < (Number(this._tutorialHintsUnlockAtMs) || 0);
    },

    _getCatapultPointerAim(cfg, profile = null, pointerX = NaN, pointerY = NaN) {
        if (!Number.isFinite(pointerX) || !Number.isFinite(pointerY)) return null;

        const tunedProfile = profile || this._getCatapultInputProfile();
        const useThumbOrigin = this._useThumbDragOriginForCatapult()
            && Number.isFinite(this._catapultDragStartX)
            && Number.isFinite(this._catapultDragStartY);
        const origin = useThumbOrigin
            ? { x: this._catapultDragStartX, y: this._catapultDragStartY }
            : this._worldToCanvas(this.aimX, this.getSpawnY());
        const rawDx = pointerX - origin.x;
        const rawDy = pointerY - origin.y;
        const dx = tunedProfile?.invertAim ? -rawDx : rawDx;
        const dy = tunedProfile?.invertAim ? -rawDy : rawDy;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.001) return null;

        const dragSensitivity = Math.max(0.1, cfg?.dragSensitivity || 1);
        const deadzonePx = Math.max(0, tunedProfile?.deadzonePx || 0);
        const maxDragPx = Math.max(deadzonePx + 1, tunedProfile?.maxDragPx || 240);
        const scaledForceDist = Math.min(maxDragPx, dist * dragSensitivity);
        const normRaw = (scaledForceDist - deadzonePx) / Math.max(1, (maxDragPx - deadzonePx));
        const forceNorm = Math.max(0, Math.min(1, normRaw));
        const shapedForceNorm = this._shapeCatapultForceNorm(forceNorm, tunedProfile);
        const forceMax = Math.max(1, cfg?.forceMax || 1);

        return {
            angleDeg: Math.atan2(dy, dx) * 180 / Math.PI,
            force: shapedForceNorm * forceMax,
            forceNorm: shapedForceNorm,
            dirX: dx / dist,
            dirY: dy / dist,
            fromThumbOrigin: useThumbOrigin,
            visualDistPx: Math.min(maxDragPx, dist),
            visualMaxDistPx: maxDragPx
        };
    },

    _shapeCatapultForceNorm(forceNorm, profile = null) {
        const n = Math.max(0, Math.min(1, forceNorm || 0));
        const curve = Math.max(0.25, profile?.forceCurve || 1);
        const knee = Number(profile?.forceLinearKnee);
        const atKneeRaw = Number(profile?.forceAtKnee);

        // Default behavior: single power curve.
        if (!Number.isFinite(knee) || !Number.isFinite(atKneeRaw) || knee <= 0 || knee >= 1 || atKneeRaw <= 0 || atKneeRaw >= 1) {
            return Math.pow(n, curve);
        }
        // Guard rail: keep enough force progression after the knee.
        // If atKnee < knee, the second segment feels too steep near the end.
        const atKnee = Math.max(knee, Math.min(0.99, atKneeRaw));

        // Piecewise shaping:
        // - ease-in up to knee (fine control on small drags)
        // - linear after knee (prevents "near max" too early)
        if (n <= knee) {
            const t = n / Math.max(1e-6, knee);
            return Math.pow(t, curve) * atKnee;
        }

        const t = (n - knee) / Math.max(1e-6, (1 - knee));
        return atKnee + t * (1 - atKnee);
    },

    _updateCatapultAimAndChargeFromDrag(cfg, profile = null) {
        // Keep launch physics and aim rendering on the same reference:
        // vector from slime center to current pointer.
        const pointerAim = this._getCatapultPointerAim(
            cfg,
            profile || this._getCatapultInputProfile(),
            this._catapultDragX,
            this._catapultDragY
        );

        if (!pointerAim) {
            this._catapultHasAimSample = false;
            this._launcherCharge = 0;
            return;
        }

        // Catapult mode keeps full 360° control (no angle clamp).
        this._catapultHasAimSample = true;
        this._launcherFrozenAngleDeg = pointerAim.angleDeg;
        this._launcherAngleDeg = pointerAim.angleDeg;
        this._launcherCharge = pointerAim.force;

        // SFX: aim tick — one click per distance notch (like gear teeth)
        if (pointerAim.force > 0 && cfg?.forceMax > 0) {
            const dist = pointerAim.force;
            const notchSize = cfg.forceMax * 0.06; // ~16 notches over full drag
            const currentNotch = Math.floor(dist / notchSize);
            if (currentNotch !== (this._lastAimNotch || 0)) {
                this._lastAimNotch = currentNotch;
                this._playAimTickLight(Math.min(1, dist / cfg.forceMax));
            }
        } else {
            this._lastAimNotch = 0;
        }
    },

    _hideBombSpawnerFamilyInPlay() {
        if (RCHIPL.Editor?.isEditMode?.()) return;
        const allSpawners = RCHIPL.Scene?.getByFamily?.('bombSpawner') || [];
        for (const obj of allSpawners) {
            if (!obj) continue;
            obj.visible = false;
            if (obj._physicsBody) {
                obj._physicsBody.isSensor = true;
                if (obj._physicsBody.collisionFilter) {
                    obj._physicsBody.collisionFilter.mask = 0;
                }
            }
        }
    },

    _hideExplosionTriggerFamilyInPlay() {
        if (RCHIPL.Editor?.isEditMode?.()) return;
        const allZones = RCHIPL.Scene?.getByFamily?.('explosionTrigger') || [];
        for (const obj of allZones) {
            if (!obj) continue;
            obj.visible = false;
            if (obj._physicsBody) {
                obj._physicsBody.isSensor = true;
                if (obj._physicsBody.collisionFilter) {
                    obj._physicsBody.collisionFilter.mask = 0;
                }
            }
        }
    },

    _normalizeExplodeMode(mode) {
        const raw = String(mode || '').trim();
        if (raw === 'canExplose' || raw === 'canNotExplose' || raw === 'exploseInZone') return raw;

        const lc = raw.toLowerCase();
        if (lc === 'canexplode' || lc === 'canexplose' || lc === 'free') return 'canExplose';
        if (lc === 'cannotexplode' || lc === 'cannotexplose' || lc === 'disabled') return 'canNotExplose';
        if (lc === 'explodeinzone' || lc === 'exploseinzone' || lc === 'zone') return 'exploseInZone';
        return 'canExplose';
    },

    _findBombSpawnerObject() {
        const byFamily = RCHIPL.Scene?.getByFamily?.('bombSpawner') || [];
        if (!byFamily.length) return null;

        const selected = RCHIPL.Selection?.selected?.[0] || null;
        if (selected?.family === 'bombSpawner') {
            const selectedId = selected.id;
            const sameSelected = byFamily.find(o => o === selected || (selectedId && o?.id === selectedId));
            if (sameSelected) return sameSelected;
        }

        if (this._bombSpawnerObj) {
            const currentId = this._bombSpawnerObj.id;
            const sameCurrent = byFamily.find(o => o === this._bombSpawnerObj || (currentId && o?.id === currentId));
            if (sameCurrent) return sameCurrent;
        }

        // Prefer most recently added spawner so option-drag duplicates are picked naturally.
        return byFamily[byFamily.length - 1];
    },

    _applyBombSpawnerPropsToConfig(obj, cfg) {
        if (!obj || !cfg) return;

        const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
        const toNumber = (value, fallbackValue) => {
            const raw = typeof value === 'string' ? value.replace(',', '.') : value;
            const n = parseFloat(raw);
            return Number.isFinite(n) ? n : fallbackValue;
        };

        if (Number.isFinite(obj.x)) cfg.x = obj.x;
        if (Number.isFinite(obj.y)) cfg.y = obj.y;

        cfg.angleMin = toNumber(obj.angleMin ?? props.angleMin, cfg.angleMin);
        cfg.angleMax = toNumber(obj.angleMax ?? props.angleMax, cfg.angleMax);
        cfg.speedSin = Math.max(0.1, toNumber(obj.speedSin ?? props.speedSin, cfg.speedSin));
        const forceMaxBaseDefault = Math.max(1, Number(this._catapultForceMaxBaseDefault) || 34);
        const forceMaxRaw = Math.max(0, toNumber(obj.forceMax ?? props.forceMax, forceMaxBaseDefault));
        cfg.forceMax = forceMaxRaw;
        cfg.speedForce = Math.max(0, toNumber(obj.speedForce ?? props.speedForce, cfg.speedForce));
        cfg.dragSensitivity = Math.max(0.1, toNumber(obj.dragSensitivity ?? props.dragSensitivity, cfg.dragSensitivity));
        cfg.dragDeadzonePx = Math.max(0, toNumber(obj.dragDeadzonePx ?? props.dragDeadzonePx, cfg.dragDeadzonePx));
        cfg.forceCurve = Math.max(0.25, toNumber(obj.forceCurve ?? props.forceCurve, cfg.forceCurve));
        cfg.forceLinearKnee = Math.max(0.05, Math.min(0.99, toNumber(obj.forceLinearKnee ?? props.forceLinearKnee, cfg.forceLinearKnee)));
        cfg.forceAtKnee = Math.max(0.05, Math.min(0.99, toNumber(obj.forceAtKnee ?? props.forceAtKnee, cfg.forceAtKnee)));
        cfg.aimDotScale = Math.max(0.4, toNumber(obj.aimDotScale ?? props.aimDotScale, cfg.aimDotScale));
        cfg.aimHeadScale = Math.max(0.4, toNumber(obj.aimHeadScale ?? props.aimHeadScale, cfg.aimHeadScale));
        const requestedDesktopMode = this._normalizeDesktopCatapultMode(
            obj.desktopControlMode ?? props.desktopControlMode ?? cfg.desktopControlMode
        );
        cfg.desktopControlMode = requestedDesktopMode;
        cfg.explodeMode = this._normalizeExplodeMode(obj.explodeMode ?? props.explodeMode ?? cfg.explodeMode);

        if (cfg.angleMin > cfg.angleMax) {
            const tmp = cfg.angleMin;
            cfg.angleMin = cfg.angleMax;
            cfg.angleMax = tmp;
        }
    },

    _syncBombSpawnerLiveConfig() {
        if (!this._isSpawnerControlMode() || !this._bombSpawnerConfig) return;
        let obj = this._bombSpawnerObj;
        if (!obj) {
            obj = this._findBombSpawnerObject();
            if (!obj) return;
            this._bombSpawnerObj = obj;
        }
        this._applyBombSpawnerPropsToConfig(obj, this._bombSpawnerConfig);
    },

    _refreshBombSpawnerConfig() {
        const fallback = {
            x: 0,
            y: this._getFallbackSpawnY(),
            angleMin: -135,
            angleMax: -45,
            speedSin: 1.2,
            forceMax: 34,
            speedForce: 20,
            dragSensitivity: 1.2,
            dragDeadzonePx: 12,
            forceCurve: 1.4,
            forceLinearKnee: 0.72,
            forceAtKnee: 0.82,
            aimDotScale: 1.2,
            aimHeadScale: 1.5,
            desktopControlMode: 'desktopDefault',
            explodeMode: 'canExplose'
        };

        let obj = this._findBombSpawnerObject();
        if (!obj) {
            const all = RCHIPL.Scene?.getAll?.() || [];
            obj = all.find(o =>
                o?.family === 'bombSpawner' ||
                o?.id === 'bombSpawner' ||
                o?.asset === 'bombSpawner'
            ) || null;
        }

        this._bombSpawnerObj = obj;
        const cfg = { ...fallback };
        if (obj) {
            this._applyBombSpawnerPropsToConfig(obj, cfg);

            if (this._isSpawnerControlMode()) {
                // Spawner is only a gameplay marker: hide and disable collisions in play.
                obj.visible = false;
                if (obj._physicsBody) {
                    obj._physicsBody.isSensor = true;
                    if (obj._physicsBody.collisionFilter) {
                        obj._physicsBody.collisionFilter.mask = 0;
                    }
                }
            }

            this._spawnerWarnedMissing = false;
        } else if (this._isSpawnerControlMode() && !this._spawnerWarnedMissing) {
            
            this._spawnerWarnedMissing = true;
        }

        this._bombSpawnerConfig = cfg;
        this.aimX = cfg.x;
        this.aimY = cfg.y;
        this._launcherPhase = 0;
        this._launcherAngleDeg = (this.controlMode === 'catapult')
            ? (cfg.angleMin + cfg.angleMax) * 0.5
            : cfg.angleMin;
        this._launcherFrozenAngleDeg = null;
        this._launcherCharge = 0;
        this._launcherIsCharging = false;
        this._catapultHasAimSample = false;
    },

    // Fallback spawn Y when no rail markers (used during init before first update)
    _getFallbackSpawnY() {
        const S = RCHIPL.Screen;
        const vp = RCHIPL.Viewport;
        const zoom = vp?.zoom || 1;

        // Try to get Y from rail object (legacy support)
        const railObj = RCHIPL.Scene?.getAll?.().find(o => o.asset === 'rail' || o.id?.includes('rail'));
        if (railObj) {
            if (railObj.anchorToScreen && railObj.anchor) {
                const vb = S?.getVisibleBounds?.();
                const point = RCHIPL.Anchor?.POINTS?.[railObj.anchor];
                if (vb && point) {
                    const offsetY = railObj.anchorOffsetY ?? 0;
                    const screenY = vb.top + point.y * vb.height + offsetY;
                    const screenCenterY = vb.top + vb.height / 2;
                    const panY = vp?.pan?.y || 0;
                    return (screenY - screenCenterY - panY) / zoom;
                }
            } else {
                return railObj.y;
            }
        }

        // Fallback: 10% from visible top
        if (S?.getVisibleBoundsWorld) {
            const bounds = S.getVisibleBoundsWorld();
            const visibleHeight = bounds.bottom - bounds.top;
            return bounds.top + visibleHeight * 0.10;
        }

        // Last fallback
        const panY = vp?.pan?.y || 0;
        const visibleTop = -panY / zoom - this.HEIGHT / (2 * zoom);
        const visibleHeight = this.HEIGHT / zoom;
        return visibleTop + visibleHeight * 0.05;
    },

    _getLayerZRange(layerName) {
        const targetLayer = layerName || 'Main';
        const all = RCHIPL.Scene?.getAll?.() || [];
        let minZ = Infinity;
        let maxZ = -Infinity;
        let found = false;

        for (const obj of all) {
            if ((obj?.layer || 'Main') !== targetLayer) continue;
            if (obj?.isProjectile || obj?.isPending) continue;

            const zRaw = parseFloat(obj?.z);
            const z = Number.isFinite(zRaw) ? zRaw : 0;
            minZ = Math.min(minZ, z);
            maxZ = Math.max(maxZ, z);
            found = true;
        }

        if (!found) return { found: false, min: 0, max: 0 };
        return { found: true, min: minZ, max: maxZ };
    },

    _applyPendingPreviewDepth(obj, layerName) {
        if (!obj) return;
        const zRange = this._getLayerZRange(layerName || obj.layer || 'Main');
        obj._pendingPreviewDepthApplied = true;
        obj._pendingPreviewRestoreZ = obj.z;
        // Keep preview under regular colliders/objects on the same layer.
        obj.z = (zRange.found ? zRange.min : 0) - 0.25;
    },

    _restorePendingPreviewDepth(obj) {
        if (!obj || !obj._pendingPreviewDepthApplied) return;
        if (obj._pendingPreviewRestoreZ === undefined) delete obj.z;
        else obj.z = obj._pendingPreviewRestoreZ;
        delete obj._pendingPreviewDepthApplied;
        delete obj._pendingPreviewRestoreZ;
    },

    _emitBombSpawnEventWithFallback(x, y, bombsRemainingOverride = null) {
        const payload = {
            x: Number.isFinite(x) ? x : 0,
            y: Number.isFinite(y) ? y : 0,
            bombsRemaining: Number.isFinite(bombsRemainingOverride) ? bombsRemainingOverride : this.bombsRemaining
        };

        const events = RCHIPL.Events;
        if (!events?.emit) {
            RCHIPL.FX?.spawn?.('Spawn', payload.x, payload.y, { _scale: 2 });
            return;
        }

        const logBefore = Array.isArray(events._log) ? events._log.length : -1;
        events.emit('OnBombSpawn', payload);

        // If no event binding fired (domain mismatch or stale bindings sync), replay playFX bindings directly.
        let hasTriggeredBindings = false;
        if (logBefore >= 0 && Array.isArray(events._log)) {
            for (let i = events._log.length - 1; i >= logBefore; i--) {
                const e = events._log[i];
                if (e?.event !== 'OnBombSpawn') continue;
                hasTriggeredBindings = (e.bindingsTriggered || 0) > 0;
                break;
            }
        }

        const bindings = events.getBindings?.()?.OnBombSpawn || [];
        const matchesConditions = (binding) => {
            if (!binding?.conditions) return true;
            for (const k in binding.conditions) {
                if (payload[k] !== binding.conditions[k]) return false;
            }
            return true;
        };
        let hasConfiguredFXBinding = false;
        let fallbackSpawned = 0;
        for (const b of bindings) {
            if (!b || b.type !== 'playFX' || !b.asset) continue;
            if (!matchesConditions(b)) continue;
            hasConfiguredFXBinding = true;
            if (hasTriggeredBindings) continue;
            const scaleRaw = Number(b.scale);
            const scale = Number.isFinite(scaleRaw) ? scaleRaw : 1;
            const layer = typeof b.layer === 'string' ? b.layer.trim() : '';
            const spawnOpts = { _scale: scale };
            if (layer) spawnOpts._layer = layer;
            RCHIPL.FX?.spawn?.(b.asset, payload.x, payload.y, spawnOpts);
            fallbackSpawned++;
        }

        // Keep legacy visual when no FX binding is configured/matched,
        // but avoid double-spawn when event playFX bindings already ran.
        if (!hasConfiguredFXBinding || (!hasTriggeredBindings && fallbackSpawned === 0)) {
            RCHIPL.FX?.spawn?.('Spawn', payload.x, payload.y, { _scale: 2 });
        }
    },

    _getCurrentLayoutInfo() {
        const layoutName = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || null;
        const layout = layoutName ? RCHIPL.Layouts?._all?.[layoutName] : null;
        return { layoutName, layout };
    },

    _getLayoutVarHexColor(name, layoutName = null, layout = null) {
        if (!name) return null;
        let raw = null;
        const defs = RCHIPL.Layouts?.getVarDefs?.() || RCHIPL.Layouts?._varDefs || {};
        if (Object.prototype.hasOwnProperty.call(defs, name) && typeof RCHIPL.Layouts?.getVar === 'function') {
            raw = RCHIPL.Layouts.getVar(name, layoutName || undefined);
        } else if (layout?.vars && typeof layout.vars[name] === 'string') {
            raw = layout.vars[name];
        }
        if (typeof raw !== 'string') return null;
        const v = raw.trim();
        return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? v : null;
    },

    _isHexColor(value) {
        return typeof value === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value.trim());
    },

    _getWorldThemesStore() {
        const store = RCHIPL._projectData?.worldThemes;
        return (store && typeof store === 'object' && !Array.isArray(store)) ? store : {};
    },

    _getResolvedWorldThemeName(layoutName = null) {
        const themes = this._getWorldThemesStore();
        const previewName = String(this._previewWorldThemeName || RCHIPL.Editor?._previewWorldThemeName || '').trim();
        if (previewName && themes[previewName]) return previewName;

        const targetLayout = layoutName
            || RCHIPL.Layouts?.getCurrentId?.()
            || RCHIPL.Layouts?._currentName
            || null;
        if (!targetLayout) return '';

        const container = RCHIPL.Layouts?.getContainerFor?.(targetLayout);
        const themeName = String(container?.theme || '').trim();
        return themeName && themes[themeName] ? themeName : '';
    },

    _getResolvedWorldTheme(layoutName = null) {
        const themeName = this._getResolvedWorldThemeName(layoutName);
        if (!themeName) return null;
        return this._getWorldThemesStore()[themeName] || null;
    },

    _getThemeHexColor(key, layoutName = null) {
        const theme = this._getResolvedWorldTheme(layoutName);
        const value = theme?.[key];
        return this._isHexColor(value) ? value.trim() : null;
    },

    _getEffectiveBlobSkinColors(layoutName = null, layout = null) {
        const info = layoutName ? { layoutName, layout } : this._getCurrentLayoutInfo();
        const ln = info.layoutName;
        const lo = info.layout;
        return {
            bodyColor: this._getLayoutVarHexColor('blobBodyColor', ln, lo)
                || lo?.blobBodyColor
                || this._getThemeHexColor('blobBodyColor', ln)
                || null,
            gradientColor: this._getLayoutVarHexColor('blobGradientColor', ln, lo)
                || lo?.blobGradientColor
                || this._getThemeHexColor('blobGradientColor', ln)
                || null
        };
    },

    _getBombSkinColorOverrides(layoutName = null, layout = null) {
        const info = layoutName ? { layoutName, layout } : this._getCurrentLayoutInfo();
        const ln = info.layoutName;
        const lo = info.layout;
        return {
            bombBodyColor: this._getLayoutVarHexColor('bombBodyColor', ln, lo)
                || lo?.bombBodyColor
                || this._getThemeHexColor('bombBodyColor', ln)
                || null,
            bombGradientColor: this._getLayoutVarHexColor('bombGradientColor', ln, lo)
                || lo?.bombGradientColor
                || this._getThemeHexColor('bombGradientColor', ln)
                || null,
            readyBodyColor: this._getLayoutVarHexColor('bombReadyBodyColor', ln, lo)
                || this._getLayoutVarHexColor('blinkBodyColor', ln, lo)
                || lo?.bombReadyBodyColor
                || lo?.blinkBodyColor
                || this._getThemeHexColor('blinkBodyColor', ln)
                || null,
            readyGradientColor: this._getLayoutVarHexColor('bombReadyGradientColor', ln, lo)
                || this._getLayoutVarHexColor('blinkGradientColor', ln, lo)
                || lo?.bombReadyGradientColor
                || lo?.blinkGradientColor
                || this._getThemeHexColor('blinkGradientColor', ln)
                || null
        };
    },

    _pickWorldThemeBgLayerName(layout) {
        const layoutLayers = Array.isArray(layout?.layers) ? layout.layers : [];
        if (!layoutLayers.length) return null;

        const lowerMatch = layoutLayers.find(name => String(name || '').trim().toLowerCase() === 'bg');
        if (lowerMatch) return lowerMatch;

        for (const layerName of layoutLayers) {
            const globalDef = RCHIPL._projectData?.layers?.[layerName];
            const localDef = layout?.layerOverrides?.[layerName];
            if (globalDef?.background || localDef?.background) return layerName;
        }
        return null;
    },

    _pickWorldThemePatternLayerName(layout) {
        const layoutLayers = Array.isArray(layout?.layers) ? layout.layers : [];
        if (!layoutLayers.length) return null;

        for (const layerName of layoutLayers) {
            const globalDef = RCHIPL._projectData?.layers?.[layerName];
            const localDef = layout?.layerOverrides?.[layerName];
            if (globalDef?.pattern || localDef?.pattern) return layerName;
        }
        return this._pickWorldThemeBgLayerName(layout);
    },

    _buildWorldThemeLayerPreview(layoutName = null, layout = null) {
        const info = layoutName ? { layoutName, layout } : this._getCurrentLayoutInfo();
        const ln = info.layoutName;
        const lo = info.layout;
        if (!lo) return null;

        const bg1 = this._getThemeHexColor('bgGradientColor1', ln);
        const bg2 = this._getThemeHexColor('bgGradientColor2', ln) || bg1;
        const patternColor = this._getThemeHexColor('patternColor', ln);
        const preview = {};

        const bgLayer = this._pickWorldThemeBgLayerName(lo);
        const localBgOverride = bgLayer ? (lo?.layerOverrides?.[bgLayer]?.background || null) : null;
        if (bgLayer && (bg1 || bg2) && !localBgOverride) {
            const prevBg = RCHIPL._projectData?.layers?.[bgLayer]?.background || {};
            preview[bgLayer] = {
                ...(preview[bgLayer] || {}),
                background: {
                    ...prevBg,
                    color1: bg1 || prevBg.color1 || '#1a1a2e',
                    color2: bg2 || prevBg.color2 || bg1 || '#16213e',
                    stops: [
                        { pos: 0, color: bg1 || prevBg.color1 || '#1a1a2e', alpha: 1 },
                        { pos: 100, color: bg2 || prevBg.color2 || bg1 || '#16213e', alpha: 1 }
                    ]
                }
            };
        }

        const patternLayer = this._pickWorldThemePatternLayerName(lo);
        const localPatternOverride = patternLayer ? (lo?.layerOverrides?.[patternLayer]?.pattern || null) : null;
        if (patternLayer && patternColor && !localPatternOverride) {
            const prevPattern = RCHIPL._projectData?.layers?.[patternLayer]?.pattern || null;
            if (prevPattern) {
                const alphaMatch = String(prevPattern.motifColor || prevPattern.color1 || '')
                    .match(/rgba?\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\s*\)/i);
                const alpha = alphaMatch ? Math.max(0, Math.min(1, parseFloat(alphaMatch[1]) || 0)) : 1;
                const motifColor = alpha < 1
                    ? (() => {
                        const hex = patternColor.replace('#', '');
                        const r = parseInt(hex.slice(0, 2), 16);
                        const g = parseInt(hex.slice(2, 4), 16);
                        const b = parseInt(hex.slice(4, 6), 16);
                        return `rgba(${r},${g},${b},${alpha})`;
                    })()
                    : patternColor;
                preview[patternLayer] = {
                    ...(preview[patternLayer] || {}),
                    pattern: {
                        ...prevPattern,
                        motifColor,
                        color1: motifColor,
                        color2: 'rgba(0,0,0,0)'
                    }
                };
            }
        }

        return Object.keys(preview).length > 0 ? preview : null;
    },

    _applyWorldThemeToLayoutPreview(layoutName = null, layout = null) {
        const info = layoutName ? { layoutName, layout } : this._getCurrentLayoutInfo();
        const lo = info.layout;
        if (!lo) return;

        const preview = this._buildWorldThemeLayerPreview(info.layoutName, lo);
        if (preview) lo._themePreviewLayerOverrides = preview;
        else delete lo._themePreviewLayerOverrides;

        RCHIPL.Scene?.invalidateLayerCaches?.();
    },

    _applyWorldThemeToWater(layoutName = null, layout = null) {
        const water1 = this._getThemeHexColor('waterColor1', layoutName);
        const water2 = this._getThemeHexColor('waterColor2', layoutName) || water1;
        const liquids = RCHIPL.Liquid?._liquids || [];
        const sceneObjects = RCHIPL.Scene?.getAll?.() || [];
        const seen = new Set();

        const tagWaterObject = (obj) => {
            if (!obj || seen.has(obj)) return;
            seen.add(obj);
            if (water1 || water2) {
                obj._worldThemeFillType = 'linear';
                obj._worldThemeFillStops = [
                    { pos: 0, color: water1 || water2 || '#60c7ff', alpha: 1 },
                    { pos: 100, color: water2 || water1 || '#8fffb3', alpha: 1 }
                ];
            } else {
                delete obj._worldThemeFillType;
                delete obj._worldThemeFillStops;
            }
        };

        for (const liquid of liquids) {
            tagWaterObject(liquid?._sceneObj || null);
            if (liquid?._renderCache) {
                delete liquid._renderCache.baseCanvas;
                delete liquid._renderCache.baseKey;
            }
        }

        for (const obj of sceneObjects) {
            const assetName = String(obj?.asset || '').toLowerCase();
            if (assetName.includes('water')) {
                tagWaterObject(obj);
            }
        }
    },

    _applyWorldThemeToSoftbodies(layoutName = null, layout = null) {
        const info = layoutName ? { layoutName, layout } : this._getCurrentLayoutInfo();
        const ln = info.layoutName;
        const lo = info.layout;
        const blobColors = this._getEffectiveBlobSkinColors(ln, lo);
        const bombColors = this._getBombSkinColorOverrides(ln, lo);
        const softbodies = RCHIPL.SoftBody?._softbodies || [];

        for (const sb of softbodies) {
            if (!sb) continue;

            if (sb._isBomb) {
                const bombSkinName = sb._skinName || lo?.bombSkin || null;
                if (bombSkinName && RCHIPL.BlobSkins?.applyBomb) {
                    RCHIPL.BlobSkins.applyBomb(sb, bombSkinName);
                    this._applyBlueLightBombEyes(sb);
                    this._applyBombMouthYOffset(sb, 5);
                }
                if (RCHIPL.BlobSkins?.overrideColors) {
                    RCHIPL.BlobSkins.overrideColors(sb, bombColors.bombBodyColor, bombColors.bombGradientColor);
                }
                this._initBombReadyBlinkState(sb, bombColors);
                continue;
            }

            const blobSkinName = sb._skinName || lo?.blobSkin || null;
            if (blobSkinName && RCHIPL.BlobSkins?.apply) {
                RCHIPL.BlobSkins.apply(sb, blobSkinName);
            }
            if (RCHIPL.BlobSkins?.overrideColors) {
                RCHIPL.BlobSkins.overrideColors(sb, blobColors.bodyColor, blobColors.gradientColor);
            }
        }
    },

    _applyCurrentWorldTheme(force = false) {
        const { layoutName, layout } = this._getCurrentLayoutInfo();
        if (!layoutName || !layout) return;

        this._applyWorldThemeToLayoutPreview(layoutName, layout);
        this._applyWorldThemeToWater(layoutName, layout);

        if (!RCHIPL.Editor?.isEditMode?.() || force) {
            this._applyWorldThemeToSoftbodies(layoutName, layout);
        }
    },

    _installWorldThemeHooks() {
        if (this._worldThemeHooksInstalled) return;
        this._worldThemeHooksInstalled = true;

        const self = this;
        if (typeof RCHIPL.Layouts?.load === 'function') {
            const originalLoad = RCHIPL.Layouts.load;
            RCHIPL.Layouts.load = async function(...args) {
