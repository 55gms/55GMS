                const result = await originalLoad.apply(this, args);
                self._applyCurrentWorldTheme(true);
                return result;
            };
        }

        requestAnimationFrame(() => {
            self._applyCurrentWorldTheme(true);
        });
    },

    _isBombEyeFaceElement(el) {
        if (!el) return false;
        const ref = String(el.ref || el.name || el.id || '').toLowerCase();
        return ref.includes('eye');
    },

    _isBombMouthFaceElement(el) {
        if (!el) return false;
        const type = String(el.type || '').toLowerCase();
        if (type.includes('mouth')) return true;
        const ref = String(el.ref || el.name || el.id || el.shapeRef || '').toLowerCase();
        return ref.includes('mouth') || ref.includes('bouche');
    },

    _applyBombMouthYOffset(sb, deltaY = 5) {
        if (!sb || !Number.isFinite(deltaY) || deltaY === 0) return;
        if (sb._bombMouthOffsetAppliedY === deltaY) return;

        let moved = false;
        const shiftElement = (el) => {
            if (!this._isBombMouthFaceElement(el)) return;
            if (Number.isFinite(el.offsetY)) {
                el.offsetY += deltaY;
            } else if (Number.isFinite(el.y)) {
                el.y += deltaY;
            } else {
                el.offsetY = deltaY;
            }
            moved = true;
        };

        if (Array.isArray(sb._faceElements)) {
            sb._faceElements.forEach(shiftElement);
            sb._faceElementsSorted = false;
        }
        if (Array.isArray(sb._face?.elements)) {
            sb._face.elements.forEach(shiftElement);
        }

        if (moved) sb._bombMouthOffsetAppliedY = deltaY;
    },

    _getBlueLightBombEyeElements() {
        if (Array.isArray(this._blueLightBombEyeElementsCache) && this._blueLightBombEyeElementsCache.length > 0) {
            return this._blueLightBombEyeElementsCache.map(el => JSON.parse(JSON.stringify(el)));
        }

        const skins = RCHIPL.BlobSkins;
        if (!skins?.applyBomb) return null;

        const available = skins.getBombAvailable?.() || [];
        if (!available.length) return null;

        const pickSkin =
            available.find(name => name === 'blueLight')
            || available.find(name => String(name).toLowerCase() === 'bluelight')
            || available.find(name => String(name).toLowerCase().includes('bluelight'))
            || available.find(name => String(name).toLowerCase() === 'blue')
            || available.find(name => String(name).toLowerCase().startsWith('blue'))
            || null;
        if (!pickSkin) return null;

        const probe = {};
        const ok = skins.applyBomb(probe, pickSkin);
        if (!ok || !Array.isArray(probe._faceElements)) return null;

        const eyeElements = probe._faceElements
            .filter(el => this._isBombEyeFaceElement(el))
            .map(el => JSON.parse(JSON.stringify(el)));
        if (!eyeElements.length) return null;

        this._blueLightBombEyeElementsCache = eyeElements;
        this._blueLightBombEyeSkinName = pickSkin;
        return eyeElements.map(el => JSON.parse(JSON.stringify(el)));
    },

    _applyBlueLightBombEyes(sb) {
        if (!sb) return;
        const blueEyes = this._getBlueLightBombEyeElements();
        if (!blueEyes?.length) return;

        const currentFace = Array.isArray(sb._faceElements) ? sb._faceElements : [];
        const nonEyeFace = currentFace.filter(el => !this._isBombEyeFaceElement(el));

        sb._faceElements = [
            ...nonEyeFace.map(el => JSON.parse(JSON.stringify(el))),
            ...blueEyes.map(el => JSON.parse(JSON.stringify(el)))
        ];
        sb._faceElementsSorted = false;

        // Enforce simple face-elements path so eye swap is deterministic across skins.
        sb._faceComposite = null;
        sb._useClipBlink = false;

        if (!sb._blink) {
            sb._blink = {
                nextBlinkTime: performance.now() + 2000 + Math.random() * 4000,
                isBlinking: false,
                blinkFrame: 0,
                blinkDuration: 150
            };
        }
    },

    _ensureEnvelopeFillOverrideFromShape(env) {
        if (!env) return null;
        if (env._fillOverride?.fillStops?.length) return env._fillOverride;
        const shapeData = RCHIPL._projectData?.assets?.[env.shapeRef] || RCHIPL._projectData?.shapes?.[env.shapeRef];
        const base = shapeData?.params || null;
        if (!base?.fillStops?.length) return null;
        env._fillOverride = {
            fillType: base.fillType,
            fillStops: JSON.parse(JSON.stringify(base.fillStops)),
            fillAngle: base.fillAngle,
            fill: base.fill,
            stroke: base.stroke,
            strokeType: base.strokeType,
            strokeStops: base.strokeStops
        };
        return env._fillOverride;
    },

    _initBombReadyBlinkState(sb, colors) {
        if (!sb) return;
        const readyBody = colors?.readyBodyColor || null;
        const readyGradient = colors?.readyGradientColor || null;
        if (!readyBody && !readyGradient) {
            sb._bombReadyBlink = null;
            return;
        }

        const envs = sb.envelopes || [];
        const baseFill = envs.map(env => {
            const fill = env?._fillOverride || this._ensureEnvelopeFillOverrideFromShape(env);
            return fill ? JSON.parse(JSON.stringify(fill)) : null;
        });
        const readyFill = baseFill.map(fill => {
            if (!fill) return null;
            if (!readyBody || !fill.fillStops?.length) return fill;
            return {
                ...fill,
                fillStops: fill.fillStops.map(stop => ({ ...stop, color: readyBody }))
            };
        });

        const baseFace = sb._faceElements ? JSON.parse(JSON.stringify(sb._faceElements)) : null;
        let readyFace = baseFace;
        if (readyGradient && Array.isArray(baseFace)) {
            readyFace = baseFace.map(el => {
                if ((el.fillType === 'radial' || el.fillType === 'linear') && el.fillStops?.length) {
                    return {
                        ...el,
                        fillStops: el.fillStops.map(stop => ({ ...stop, color: readyGradient }))
                    };
                }
                return el;
            });
        }

        sb._bombReadyBlink = {
            timer: 0,
            cycleSec: 0.42,
            onSec: 0.14,
            applied: 'base',
            baseFill,
            readyFill,
            baseFace,
            readyFace
        };
        this._setBombReadyBlinkVariant(sb, false);
    },

    _setBombReadyBlinkVariant(sb, useReady) {
        const state = sb?._bombReadyBlink;
        if (!state) return;
        const target = useReady ? 'ready' : 'base';
        if (state.applied === target) return;

        const envs = sb.envelopes || [];
        const fillList = useReady ? state.readyFill : state.baseFill;
        for (let i = 0; i < envs.length; i++) {
            if (fillList[i]) envs[i]._fillOverride = fillList[i];
        }

        const faceList = useReady ? state.readyFace : state.baseFace;
        if (faceList) {
            sb._faceElements = faceList;
            sb._faceElementsSorted = false;
        }

        state.applied = target;
    },

    _updateBombReadyBlink(sb, dt, canExplodeNow) {
        const state = sb?._bombReadyBlink;
        if (!state) return;

        if (!canExplodeNow) {
            state.timer = 0;
            this._setBombReadyBlinkVariant(sb, false);
            return;
        }

        state.timer += Math.max(0, dt || 0);
        const cycle = Math.max(0.12, state.cycleSec || 0.42);
        const onSec = Math.max(0.04, Math.min(cycle, state.onSec || 0.14));
        const t = state.timer % cycle;
        this._setBombReadyBlinkVariant(sb, t < onSec);
    },

    _getBombCenter(bomb, out = null) {
        const p = out || (this._tmpBombCenter || (this._tmpBombCenter = { x: 0, y: 0 }));
        let x = bomb?.obj?.x ?? 0;
        let y = bomb?.obj?.y ?? 0;
        if (bomb?.softbody?.envelopes?.[0]?.vertices?.length) {
            const verts = bomb.softbody.envelopes[0].vertices;
            x = 0;
            y = 0;
            for (const v of verts) {
                x += v.x;
                y += v.y;
            }
            x /= verts.length;
            y /= verts.length;
        }
        p.x = x;
        p.y = y;
        return p;
    },

    _isPointInsideExplosionTriggerZone(x, y) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
        const zones = RCHIPL.Scene?.getByFamily?.('explosionTrigger') || [];
        for (const zone of zones) {
            if (!zone) continue;
            const zoneEnabled = RCHIPL.FamilyProps?.get?.(zone, 'enabled');
            if (zoneEnabled === false) continue;
            const b = RCHIPL.Scene?.getBounds?.(zone);
            if (!b) continue;
            if (x >= b.x && x <= (b.x + b.w) && y >= b.y && y <= (b.y + b.h)) {
                return true;
            }
        }
        return false;
    },

    _canExplodeBombNow(bomb, cfg = null) {
        // Perf/stability ship mode:
        // explosion is always available when a bomb exists (no zone scan / no mode gating).
        return !!bomb;
    },


    // ─── PENDING BOMB (follows rail) ───
    createPendingBomb() {
        if (this.state !== 'PLAYING') return;
        if (this.levelComplete || this.levelFailed) return;
        if (RCHIPL.Editor?.isEditMode?.()) return;
        if (this.pendingBomb) return; // Already have one
        if (this._pendingBombSpawning) return; // Already spawning
        // CHILL MODE: unlimited bombs (was: if (this.bombsRemaining <= 0) return;)
        if (!RCHIPL.SoftBody?._initialized) return;

        const spawnY = this.getSpawnY();
        const x = this.aimX || 0;

        // CHILL MODE: still track count for stats but never block spawning
        this.bombsRemaining--;
        this.updateBombUI();
        
        this._emitBombSpawnEventWithFallback(x || 0, spawnY, this.bombsRemaining);

        // Delay bomb creation by 0.1s
        this._pendingBombSpawning = true;
        if (this._pendingBombTimeout) clearTimeout(this._pendingBombTimeout);
        this._pendingBombTimeout = setTimeout(() => {
            this._pendingBombTimeout = null;
            this._pendingBombSpawning = false;
            if (RCHIPL.Editor?.isEditMode()) return;  // Don't spawn if switched to edit
            if (this.state !== 'PLAYING') return;     // Don't spawn if switched to menu
            if (this.levelComplete || this.levelFailed) return;
            // Use live spawner coordinates at creation time (avoid side snap after delayed spawn)
            const liveX = (this._isSpawnerControlMode() && this._bombSpawnerObj)
                ? (this._bombSpawnerObj.x ?? x)
                : (this.aimX ?? x);
            const liveY = this.getSpawnY();
            this._createPendingBombDelayed(liveX, liveY);
        }, 100);
    },


    // Actually create the bomb (called after FX delay)
    _createPendingBombDelayed(x, spawnY) {
        if (this.state !== 'PLAYING') return;
        if (this.levelComplete || this.levelFailed) return;
        if (RCHIPL.Editor?.isEditMode?.()) return;
        if (this.pendingBomb) return;

        // Get spawn layer from spawner marker (fallback to rail_left marker).
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        const railMarker = allObjs.find(o => o.id === 'rail_left' || o.asset === 'rail_left');
        const spawnLayer = this._bombSpawnerObj?.layer || railMarker?.layer || 'Main';

        const blobObj = {
            id: 'pending_blob_' + Date.now(),
            type: 'softbody',
            template: 'softbody_blob_01',
            layer: spawnLayer,  // Use layer from template dropdown
            x: x,
            y: spawnY,
            scaleX: 1,
            scaleY: 1,
            rotation: 0,
            anchorX: 0.5,
            anchorY: 0.5,
            width: 100,
            height: 100,
            selectable: false,
            visible: true,
            isSticky: false,
            team: 'red',
            isProjectile: true,
            isPending: true
        };

        // Pending bomb visual sits behind same-layer colliders/objects.
        this._applyPendingPreviewDepth(blobObj, spawnLayer);
        RCHIPL.Scene.objects.push(blobObj);

        // Create softbody at FULL SIZE (scale 1.0) to get correct restOffsets
        // Animation will start tiny via spawnScale
        const sb = RCHIPL.SoftBody.create('softbody_blob_01', x, spawnY, {
            scaleX: 1,
            scaleY: 1,
            rotation: 0
        });

        if (sb) {
            blobObj._softbodyInstance = sb;
            sb._sceneObj = blobObj;
            sb._isPending = true;
            sb._isBomb = true;

            // Apply bomb skin + color overrides from current layout.
            const { layoutName: currentLayoutName, layout: currentLayout } = this._getCurrentLayoutInfo();
            const bombSkin = currentLayout?.bombSkin;
            const bombColors = this._getBombSkinColorOverrides(currentLayoutName, currentLayout);
            if (bombSkin && RCHIPL.BlobSkins?.applyBomb) {
                RCHIPL.BlobSkins.applyBomb(sb, bombSkin);
                this._applyBlueLightBombEyes(sb);
                this._applyBombMouthYOffset(sb, 5);
                
            }
            if (RCHIPL.BlobSkins?.overrideColors && (bombColors.bombBodyColor || bombColors.bombGradientColor)) {
                RCHIPL.BlobSkins.overrideColors(sb,
                    bombColors.bombBodyColor, bombColors.bombGradientColor);
            }
            this._initBombReadyBlinkState(sb, bombColors);

            // Calculate restOffsets at FULL SIZE (before scaling down for animation)
            const verts = sb.envelopes[0].vertices;
            let cx = 0, cy = 0;
            for (const v of verts) { cx += v.x; cy += v.y; }
            cx /= verts.length;
            cy /= verts.length;
            // Add 8px extend to match target blobs visual size
            const extend = 8;
            const restOffsets = verts.map(v => {
                const dx = v.x - cx;
                const dy = v.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const scale = dist > 0 ? (dist + extend) / dist : 1;
                return { dx: dx * scale, dy: dy * scale };
            });
            const restMaxDy = restOffsets.reduce((m, r) => Math.max(m, r.dy), 0);

            // Now scale vertices down to tiny for spawn animation start
            for (const env of sb.envelopes || []) {
                for (const v of env.vertices || []) {
                    v.x = cx + (v.x - cx) * 0.01;
                    v.y = cy + (v.y - cy) * 0.01;
                    v.ox = v.x;
                    v.oy = v.y;
                }
            }

            this.pendingBomb = {
                obj: blobObj,
                softbody: sb,
                baseY: spawnY,
                restOffsets: restOffsets,
                restMaxDy: restMaxDy,
                animTime: 0,
                spawnAnimTime: 0,  // For pop-in animation
                spawnAnimDone: false,
                spawnCreatedAt: performance.now() // Time-based spawn pop (robust to dt stalls)
            };

            // Snap immediately to live launcher position to avoid 1-frame side offset.
            this.updatePendingBomb();
            
        }
    },


    // Move pending bomb to follow rail position + squash/stretch animation
    updatePendingBomb() {
        if (!this.pendingBomb) return;

        const sb = this.pendingBomb.softbody;
        if (!sb?.envelopes?.[0]?.vertices) return;

        const targetX = this.aimX;
        // Follow rail Y continuously (in case screen rotates)
        const targetY = this.getSpawnY();
        const verts = sb.envelopes[0].vertices;
        const restOffsets = this.pendingBomb.restOffsets;

        const dt = RCHIPL.Game.dt || 1/60;

        // === SPAWN POP-IN ANIMATION (easeOutBack) ===
        let spawnScale = 1;
        if (!this.pendingBomb.spawnAnimDone) {
            const spawnDuration = 0.35;  // 0.35s pop-in
            const createdAt = this.pendingBomb.spawnCreatedAt || performance.now();
            const elapsed = Math.max(0, (performance.now() - createdAt) / 1000);
            this.pendingBomb.spawnAnimTime = elapsed;
            const t = Math.min(1, elapsed / spawnDuration);

            // easeOutBack
            const c1 = 1.70158;
            const c3 = c1 + 1;
            const eased = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);

            spawnScale = eased;

            if (t >= 1) {
                this.pendingBomb.spawnAnimDone = true;
            }
        }

        // Update squash/stretch animation timer (2x faster cycle)
        const normalSpeed = 12;
        const slowSpeed = 2.4;
        const speed = this._isHolding ? slowSpeed : normalSpeed;
        this.pendingBomb.animTime += speed * dt;
        const animT = this.pendingBomb.animTime;

        // Squash & stretch:
        // - idle: subtle breathing
        // - charging: compression proportional to charge force (grounded feel)
        const idleWave = Math.sin(animT);
        const idleSquashAmount = 0.035;
        let chargeNorm = 0;
        if (this._isSpawnerControlMode() && this._bombSpawnerObj && this._bombSpawnerConfig && this._launcherIsCharging) {
            const maxForce = Math.max(1, this._bombSpawnerConfig.forceMax || 1);
            chargeNorm = Math.max(0, Math.min(1, (this._launcherCharge || 0) / maxForce));
        }

        // Fade idle wobble down as charge grows so the force-driven squash reads clearly.
        const idleWeight = this._launcherIsCharging ? (1 - chargeNorm) : 1;
        const wobbleX = 1 + idleWave * idleSquashAmount * idleWeight;
        const wobbleY = 1 - idleWave * idleSquashAmount * idleWeight;

        // Charge deformation (proportional to force): wider on X, flatter on Y.
        const chargeStretchX = 1 + chargeNorm * 0.22;
        const chargeSquashY = 1 - chargeNorm * 0.32;

        const deformX = wobbleX * chargeStretchX;
        const deformY = wobbleY * chargeSquashY;
        const scaleX = spawnScale * deformX;
        const scaleY = spawnScale * deformY;
        // Base-anchored squash in spawner mode: keep bottom contact stable while compressing.
        const baseAnchorShiftY = this._isSpawnerControlMode()
            ? (this.pendingBomb.restMaxDy || 0) * (1 - scaleY)
            : 0;
        const centerY = targetY + baseAnchorShiftY;

        // Store squash for face rendering (non-uniform scale)
        sb._squashX = deformX;
        sb._squashY = deformY;

        // Apply position + scale to each vertex
        for (let i = 0; i < verts.length; i++) {
            const v = verts[i];
            const rest = restOffsets[i];

            v.x = targetX + rest.dx * scaleX;
            v.y = centerY + rest.dy * scaleY;

            v.ox = v.x;
            v.oy = v.y;
            v.vx = 0;
            v.vy = 0;
        }
    },


    // ─── UPDATE BOMB LOOK TARGET ───
    // Make the bomb's eyes look at the nearest target blob
    // Cached arrays/objects for updateBombLookTarget (zero allocation per frame)
    _lookBombs: [],
    _lookNearest: { x: 0, y: 0 },
    _lookFallback: { x: 0, y: 0 },
    updateBombLookTarget() {
        // Collect all bombs to update (1P + 2P) — reuse cached array
        const bombs = this._lookBombs;
        bombs.length = 0;
        if (this.activeBomb || this.pendingBomb) {
            bombs.push(this.activeBomb || this.pendingBomb);
        }
        if (this._versusMode && this._vs) {
            for (const p of this._vs.players) {
                if (p.activeBomb) bombs.push(p.activeBomb);
                else if (p.pendingBomb) bombs.push(p.pendingBomb);
            }
        }

        for (const bomb of bombs) {
            if (!bomb?.softbody) continue;
            const sb = bomb.softbody;
            const env = sb.envelopes?.[0];
            if (!env?.vertices) continue;

            let bx = 0, by = 0;
            for (const v of env.vertices) { bx += v.x; by += v.y; }
            bx /= env.vertices.length;
            by /= env.vertices.length;

            let foundNearest = false;
            let nearestDist = Infinity;

            for (const target of this.targetBlobs) {
                if (!target.obj?._softbodyInstance?.envelopes?.[0]?.vertices) continue;
                const tEnv = target.obj._softbodyInstance.envelopes[0];
                let tx = 0, ty = 0;
                for (const v of tEnv.vertices) { tx += v.x; ty += v.y; }
                tx /= tEnv.vertices.length;
                ty /= tEnv.vertices.length;

                const dist = Math.sqrt((tx - bx) ** 2 + (ty - by) ** 2);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    this._lookNearest.x = tx;
                    this._lookNearest.y = ty;
                    foundNearest = true;
                }
            }

            if (foundNearest) {
                sb._lookTarget = this._lookNearest;
            } else {
                this._lookFallback.x = bx;
                this._lookFallback.y = by + 100;
                sb._lookTarget = this._lookFallback;
            }
        }
    },


    // ─── RELEASE BOMB (drop from rail) ───
    releaseBomb(launchOpts = null) {
        if (!this.pendingBomb) return;
        if (this.activeBomb) return; // Already have active bomb

        // Trigger first gameplay on first bomb throw (Poki SDK)
        RCHIPL.Platform.triggerFirstGameplay();
        this._unlockBackgroundMusicFromInput();
        this._trackPokiLaunch();

        // Reset shape to original (remove squash/stretch)
        const sb = this.pendingBomb.softbody;
        const verts = sb.envelopes[0].vertices;
        const restOffsets = this.pendingBomb.restOffsets;

        // Use natural center (spawn position), not the squashed center.
        // Base-anchor shift during charge is purely visual; resetting around
        // the squashed center pushes the bottom below ground and causes an
        // upward physics impulse that diverges from the aim arrow.
        const cx = this.aimX;
        const cy = this.getSpawnY();

        // Reset to rest shape (scale = 1)
        for (let i = 0; i < verts.length; i++) {
            verts[i].x = cx + restOffsets[i].dx;
            verts[i].y = cy + restOffsets[i].dy;
            verts[i].ox = verts[i].x;
            verts[i].oy = verts[i].y;
        }

        // Clear squash/stretch face deformation
        sb._squashX = undefined;
        sb._squashY = undefined;

        // Brief physics grace so the softbody step (which runs after update
        // in the same frame) doesn't shift the bomb away from aimX.
        sb._impulseGraceUntil = performance.now() + 20;

        // Convert pending to active
        sb._isPending = false;
        this.pendingBomb.obj.isPending = false;

        this.activeBomb = this.pendingBomb;
        this.pendingBomb = null;
        // Active bomb stays behind collision/gameplay elements (like blobs).
        // Keep the low Z from pending preview — don't restore original depth.

        // Optional launch impulse (new spawner control).
        if (launchOpts && sb?.envelopes?.[0]?.vertices?.length) {
            const angleDeg = parseFloat(launchOpts.angleDeg);
            const launchForce = parseFloat(launchOpts.force);
            if (Number.isFinite(angleDeg) && Number.isFinite(launchForce) && launchForce > 0) {
                const rad = angleDeg * Math.PI / 180;
                const vx = Math.cos(rad) * launchForce;
                const vy = Math.sin(rad) * launchForce;
                const launchVerts = sb.envelopes[0].vertices;
                for (const v of launchVerts) {
                    // Verlet: velocity = pos - oldPos
                    v.ox = v.x - vx;
                    v.oy = v.y - vy;
                }
            }
            this._catapultTapMissCount = 0;
            // Dismiss launch tutorial on first successful ballistic launch
            this._launchHintDismissed = true;
            this._launchHintActive = false;
        }

        // Emit drop position from actual softbody center (sb.cx/sb.cy are not guaranteed)
        let dropX = this.activeBomb?.obj?.x ?? 0;
        let dropY = this.activeBomb?.obj?.y ?? 0;
        if (sb?.envelopes?.[0]?.vertices?.length) {
            const dropVerts = sb.envelopes[0].vertices;
            dropX = 0;
            dropY = 0;
            for (const v of dropVerts) {
                dropX += v.x;
                dropY += v.y;
            }
            dropX /= dropVerts.length;
            dropY /= dropVerts.length;
        }
        RCHIPL.Events.emit('OnBombDrop', { x: dropX, y: dropY });

        // Start tap hint timer
        this._tapHintTimer = 0;
        this._tapHintLowSpeedTime = 0;
        this._tapHintShown = false;
        this._tapHintPhase = 0;
        this._tapHintPrevCx = null;
        this._tapHintPrevCy = null;
    },


    // Legacy function for compatibility
    spawnBomb(x) {
        // Create pending bomb if needed, then release it
        if (!this.pendingBomb) {
            this.createPendingBomb();
        }
        this.releaseBomb();
    },


    explodeBomb() {
        if (this.levelComplete || this.levelFailed) return false;
        if (!this.activeBomb) return false;
        if (!this._canExplodeBombNow(this.activeBomb, this._bombSpawnerConfig)) return false;

        const bomb = this.activeBomb;

        // Get position from softbody center (average of vertices), with robust fallback
        const center = this._getBombCenter(bomb);
        const bx = center.x;
        const by = center.y;

        // Use GameVars values (this.explosionForce, this.explosionRadius)
        const explosionRadius = this.explosionRadius;
        const explosionForce = this.explosionForce;

        
        RCHIPL.Events.emit('OnBombExplode', { x: bx, y: by });

        // ═══ GPE: Voronoi destruction ═══
        if (RCHIPL.Voronoi) {
            RCHIPL.Voronoi.explode(bx, by, explosionRadius, explosionForce / 5);
        }

        // ═══ GPE: Suspended rope breaking + push ═══
        if (RCHIPL.Suspended) {
            RCHIPL.Suspended.checkExplosion(bx, by, explosionRadius, explosionForce * 2.5);
        }

        // ═══ GPE: Bridge breaking ═══
        if (RCHIPL.Bridge) {
            RCHIPL.Bridge.checkExplosion(bx, by, explosionRadius);
        }

        // ═══ GPE: Pivot spin ═══
        if (RCHIPL.Pivot) {
            RCHIPL.Pivot.checkExplosion(bx, by, explosionRadius, explosionForce);
        }

        // ═══ GPE: Sticky release on explosion ═══
        if (RCHIPL.Sticky) {
            RCHIPL.Sticky.checkExplosion(bx, by, explosionRadius);
        }


        // ═══ PUFF EFFECT ═══
        // Instead of explosion FX, make the bomb blob puff up like a pufferfish!
        // Fast inflation with elastic overshoot, then remove
        this._startPuffEffect(bomb, bx, by, explosionRadius, explosionForce);

        // Clear activeBomb reference (puff handles cleanup)
        this.activeBomb = null;

        // Launch hint reminder policy:
        // - onboarding levels: always rearm on explosion
        // - later levels: rearm only after X explosions in the same level
        if (this._launchHintOnboardingLevel) {
            this._launchHintDismissed = false;
            this._launchHintActive = false;
            this._launchHintPhase = 0;
            this._catapultTapMissCount = 0;
        } else {
            this._launchHintExplosionsThisLevel = (this._launchHintExplosionsThisLevel || 0) + 1;
            const reminderThreshold = Math.max(1, parseInt(this._launchHintExplosionsForReminder, 10) || 3);
            if (this._launchHintExplosionsThisLevel >= reminderThreshold) {
                this._launchHintExplosionsThisLevel = 0;
                this._launchHintForcedByStruggle = true;
                this._launchHintDismissed = false;
                this._launchHintActive = false;
                this._launchHintPhase = 0;
                this._catapultTapMissCount = 0;
            }
        }

        // Hide tap hint
        this._tapHintShown = false;
        this._tapHintTimer = 0;
        this._tapHintLowSpeedTime = 0;
        this._tapHintPhase = 0;
        this._tapHintPrevCx = null;
        this._tapHintPrevCy = null;

        

        // CHILL MODE: always spawn next bomb (was: defeat check if bombsRemaining <= 0)
        // Original defeat logic kept in _updateDefeatCheck for future hardcore mode
        if (this._nextBombTimeout) clearTimeout(this._nextBombTimeout);
        this._nextBombTimeout = setTimeout(() => {
            this._nextBombTimeout = null;
            if (RCHIPL.Editor?.isEditMode()) return;
            if (this.state !== 'PLAYING') return;
            if (this.levelComplete || this.levelFailed) return;
            this.createPendingBomb();
        }, 500);
        return true;
    },


    // Pufferfish-style inflation effect with perfect circle
    _startPuffEffect(bomb, bx, by, explosionRadius, explosionForce) {
        const sb = bomb.softbody;
        const env = sb?.envelopes?.[0];

        // Get original bomb radius and shape reference from softbody
        const baseRadius = env?.radius || 25;
        const shapeRef = env?.shapeRef || null;
        const baseWidth = env?.width || baseRadius * 2;
        const baseHeight = env?.height || baseRadius * 2;

        // Capture shape params for fill/stroke before removing softbody
        // Use skin fill overrides if present (composite child colors), else base shape
        const shapeData = RCHIPL._projectData?.assets?.[shapeRef];
        const params = env?._fillOverride || (shapeData?.params ? { ...shapeData.params } : {});

        // Capture face elements if present (deep copy)
        // Supports both old _face format and new _faceElements from BlobSkins
        const face = sb?._face ? JSON.parse(JSON.stringify(sb._face)) : null;
        const faceElements = sb?._faceElements ? JSON.parse(JSON.stringify(sb._faceElements)) : null;
        const blink = sb?._blink ? { ...sb._blink } : null;

        // Capture template name for recreation
        const template = sb?.templateName || bomb.obj?.template || 'softbody_blob_01';

        // Remove softbody immediately (we'll draw a simple circle instead)
        if (sb && RCHIPL.SoftBody?._softbodies) {
            const sbIdx = RCHIPL.SoftBody._softbodies.indexOf(sb);
            if (sbIdx >= 0) {
                RCHIPL.SoftBody._softbodies.splice(sbIdx, 1);
            }

            // Also remove stuntman rigidbody if present (prevents collision during puff)
            if (sb._rigidProxy) {
                Matter.Composite.remove(RCHIPL.Physics._engine.world, sb._rigidProxy);
                const bodyIdx = RCHIPL.Physics._bodies.indexOf(sb._rigidProxy);
                if (bodyIdx >= 0) {
                    RCHIPL.Physics._bodies.splice(bodyIdx, 1);
                }
                sb._rigidProxy = null;
            }
        }

        // Capture bomb's layer before removing (for layer effects)
        const bombLayer = bomb.obj?.layer || 'Main';

        // Remove the softbody's scene object
        const idx = RCHIPL.Scene.objects.indexOf(bomb.obj);
        if (idx >= 0) {
            RCHIPL.Scene.objects.splice(idx, 1);
        }

        // Get shape dimensions to calculate correct scale
        // Use full skin composite if available (pre-baked image has correct colors)
        // BUT: if color overrides exist, use base shapeRef so overridden fills apply
        const skinAssetName = sb?._skinAssetName || null;
        const currentLayoutName_puff = RCHIPL.Layouts?.getCurrentId?.();
        const currentLayout_puff = currentLayoutName_puff ? RCHIPL.Layouts._all?.[currentLayoutName_puff] : null;
        const getLayoutVarColor = (name) => {
            if (!name) return null;
            let v = null;
            // Preferred path: official Layout Vars API when variable is defined.
            if (RCHIPL.Layouts?._varDefs?.[name] && typeof RCHIPL.Layouts?.getVar === 'function') {
                v = RCHIPL.Layouts.getVar(name, currentLayoutName_puff);
            // Fallback: direct vars bag for legacy/non-defined vars.
            } else if (currentLayout_puff?.vars && typeof currentLayout_puff.vars[name] === 'string') {
                v = currentLayout_puff.vars[name];
            }
            return (typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim())) ? v.trim() : null;
        };
        // Explosion color overrides: Layout Vars first, then legacy top-level layout props fallback.
        const legacyExploBodyColor = currentLayout_puff?.exploBodyColor || currentLayout_puff?.bombBodyColor || null;
        const legacyExploGradientColor = currentLayout_puff?.exploGradientColor || currentLayout_puff?.bombGradientColor || null;
        const themeExploBodyColor = this._getThemeHexColor('exploBodyColor', currentLayoutName_puff)
            || this._getThemeHexColor('bombBodyColor', currentLayoutName_puff)
            || null;
        const themeExploGradientColor = this._getThemeHexColor('exploGradientColor', currentLayoutName_puff)
            || this._getThemeHexColor('bombGradientColor', currentLayoutName_puff)
            || null;
        const exploBodyColor = getLayoutVarColor('exploBodyColor')
            || getLayoutVarColor('bombBodyColor')
            || legacyExploBodyColor
            || themeExploBodyColor;
        const exploGradientColor = getLayoutVarColor('exploGradientColor')
            || getLayoutVarColor('bombGradientColor')
            || legacyExploGradientColor
            || themeExploGradientColor;
        const hasExploColorOverride = !!(exploBodyColor || exploGradientColor);
        const useSkinComposite = skinAssetName && !hasExploColorOverride;
        const puffAsset = useSkinComposite ? skinAssetName : (shapeRef || '@skin_body_skin1');
        const assetData = RCHIPL.Assets?.get?.(puffAsset);
        const shapeW = assetData?.width || 100;
        const shapeH = assetData?.height || 100;
        // Base scale to match original bomb size (baseWidth/Height from softbody envelope)
        const baseScaleX = baseWidth / shapeW;
        const baseScaleY = baseHeight / shapeH;

        // Build explosion fill params (override body color if set)
        let exploParams = { ...params };
        if (exploBodyColor && exploParams.fillStops?.length) {
            exploParams.fillStops = exploParams.fillStops.map(s => ({ ...s, color: exploBodyColor }));
        }

        // Override gradient color on face elements for explosion
        let exploFaceElements = faceElements;
        if (exploGradientColor && faceElements) {
            exploFaceElements = JSON.parse(JSON.stringify(faceElements));
            for (const el of exploFaceElements) {
                if ((el.fillType === 'radial' || el.fillType === 'linear') && el.fillStops?.length) {

                }
            }
        }

        // Create a Scene object for the puff body (inherits layer effects: shadows, strokeBelow)

        const puffZRange = this._getLayerZRange(bombLayer);
        const puffObj = {
            id: 'puff_' + Date.now(),
            asset: puffAsset,
            x: bx,
            y: by,
            z: (puffZRange.found ? puffZRange.max : 0) + 1,
            layer: bombLayer,
            scaleX: baseScaleX,
            scaleY: baseScaleY,
            rotation: 0,
            alpha: 1,
            anchorX: 0.5,
            anchorY: 0.5
        };
        RCHIPL.Scene.objects.push(puffObj);

        // Puff animation state - simple circle that inflates/deflates
        const puff = {
            x: bx,
            y: by,
            layer: bombLayer,
            sceneObj: puffObj,  // Reference to Scene object for updates
            baseScaleX,         // Base scale to match original bomb size
            baseScaleY,
            baseRadius,
            baseWidth,
            baseHeight,
            shapeRef,
            params: hasExploColorOverride ? exploParams : params,
            exploBodyOverride: hasExploColorOverride,  // Flag: draw body via canvas instead of scene object

            face: useSkinComposite ? null : face,
            faceElements: useSkinComposite ? null : exploFaceElements,
            blink: useSkinComposite ? null : blink,
            template,
            currentRadius: baseRadius,
            currentScale: 1,
            explosionRadius,
            explosionForce,
            startTime: performance.now(),
            duration: 310,        // Total effect duration (inflate 60 + hold 150 + deflate 100)
            inflateTime: 60,      // Time to reach max size (very fast!)
            holdTime: 150,        // Time to hold at max (~9 frames at 60fps)
            maxScale: (explosionRadius * 0.56) / baseRadius,  // Inflate to 56% of explosion radius (80% of original 70%)
            elasticOvershoot: 0.25,  // Overshoot amount for elastic feel (smoother)
            forceApplied: false   // Track if we've applied the explosion force
        };

        // Store in Game for update loop (supports multiple simultaneous puffs)
        if (!this._activePuffs) this._activePuffs = [];
        this._activePuffs.push(puff);
    },


    // Update puff effect (called from update loop) — supports multiple simultaneous puffs
    _updatePuff(dt) {
        if (!this._activePuffs || !this._activePuffs.length) return;

        for (let pi = this._activePuffs.length - 1; pi >= 0; pi--) {
            const puff = this._activePuffs[pi];
            const elapsed = performance.now() - puff.startTime;

            // Phase timings
            const inflateEnd = puff.inflateTime;
            const holdEnd = puff.inflateTime + puff.holdTime;
            const deflateTime = puff.duration - holdEnd;

            let scale;

            if (elapsed < inflateEnd) {
                const t = elapsed / puff.inflateTime;
                const overshoot = Math.sin(t * Math.PI) * puff.elasticOvershoot * (1 - t);
                scale = puff.maxScale * (1 + overshoot);
            } else if (elapsed < holdEnd) {
                const t = (elapsed - inflateEnd) / puff.holdTime;
                const wobble = Math.cos(t * Math.PI * 2) * 0.08 * (1 - t);
                scale = puff.maxScale * (1 + wobble);

                if (!puff.forceApplied) {
                    puff.forceApplied = true;
                    this._applyPuffForce(puff);
                }
            } else if (elapsed < puff.duration) {
                const t = (elapsed - holdEnd) / deflateTime;
                const easeIn = 1 - Math.cos(t * Math.PI / 2);
                scale = puff.maxScale * (1 - easeIn);
            } else {
                // Animation complete - puff disappears with confetti!
                if (RCHIPL.FX?.spawnConfettiAt) {
                    RCHIPL.FX.spawnConfettiAt(puff.x, puff.y, {
                        count: 20 + Math.floor(Math.random() * 10),
                        shape: 'rect',
                        size: 30,
                        sizeVar: 15,
                        speed: 840 + Math.random() * 560,
                        spread: 360,
                        direction: -90,
                        gravity: 800,
                        drag: 0.98,
                        duration: 0.8,
                        durationVar: 0.5,
                        spin: 720,
                        colorStops: [
                            { color: '#FF6B6B' },
                            { color: '#FFE66D' },
                            { color: '#4ECDC4' },
                            { color: '#A78BFA' },
                            { color: '#FB7185' },
                        ]
                    });
                }
                if (puff.sceneObj) {
                    const objIdx = RCHIPL.Scene.objects.indexOf(puff.sceneObj);
                    if (objIdx >= 0) RCHIPL.Scene.objects.splice(objIdx, 1);
                }
                this._activePuffs.splice(pi, 1);
                continue;
            }

            puff.currentRadius = puff.baseRadius * scale;
            puff.currentScale = scale;

            if (puff.sceneObj) {
                puff.sceneObj.scaleX = puff.baseScaleX * scale;
                puff.sceneObj.scaleY = puff.baseScaleY * scale;
                // Hide scene object when we draw body via canvas (explosion color override)
                if (puff.exploBodyOverride) puff.sceneObj.alpha = 0;
            }
        }
    },


    // Render puff faces (body is rendered via Scene layer system with effects)
    _renderPuff(ctx) {
        if (!this._activePuffs || !this._activePuffs.length) return;

        for (const puff of this._activePuffs) {
            const scale = puff.currentScale;
            ctx.save();
            ctx.translate(puff.x, puff.y);

            // Draw body circle when explosion color override is active (scene object hidden)
            if (puff.exploBodyOverride && puff.params?.fillStops?.length) {
                const r = puff.currentRadius;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = puff.params.fillStops[0].color || '#fff';
                ctx.fill();
            }

        // Update timers and reinflate when ready
        for (let i = this._reinflateQueue.length - 1; i >= 0; i--) {
            const item = this._reinflateQueue[i];
            item.time -= dt;

            if (item.time <= 0) {
                // Reinflate this softbody using restX/restY (like mode 8 fix)
                const sb = item.softbody;
                const env = sb?.envelopes?.[0];
                if (env?.vertices?.length && env.vertices[0].restX !== undefined) {
                    // Get center position
                    let cx = 0, cy = 0;
                    for (const v of env.vertices) {

                        cy += v.y;

                    cx /= env.vertices.length;
                    cy /= env.vertices.length;

                    // Calculate current rotation (same as mode 8 detection)
                    const refIdx = 0;
                    const refV = env.vertices[refIdx];
                    const currentAngle = Math.atan2(refV.y - cy, refV.x - cx);
                    const restAngle = Math.atan2(refV.restY, refV.restX);

                    const sin = Math.sin(rotation);

                    // Keep velocity so they continue flying!

                        const targetY = cy + sin * v.restX + cos * v.restY;

                        const velX = v.x - v.ox;
                        const velY = v.y - v.oy;

                        v.y = targetY;
                        // Restore velocity by setting oldPos accordingly
                        v.ox = targetX - velX;
                        v.oy = targetY - velY;

    _renderLaunchHint(ctx) {

    // ═══ FUSE SYSTEM ═══

        const verts = bomb.softbody.envelopes[0].vertices;

            cy += v.y;

        const nx = dx / dist;
        const ny = dy / dist;

            baseY: topV.y,

            tipY: topV.y + ny * fuseLength

                pool[i].dead = false;
                pool._freeStart = i + 1;  // Next search starts after this
                return pool[i];
            }

    // Update fuse particles

    // Update ember particles (falling sparks with bounce) - uses pooling

                            this._cachedPhysicsBodies[write] = b;
                        }
                        b.x = obj.x || 0;
                        b.y = obj.y || 0;
                        b.hw = (obj.width || 50) / 2 * (obj.scaleX || 1);
                        b.hh = (obj.height || 50) / 2 * (obj.scaleY || 1);
                        write++;
                    }
                }
            }
            this._cachedPhysicsBodiesCount = write;
            this._cachedPhysicsFrame = frame;
        }

        // Check against cached bodies
        for (let i = 0; i < this._cachedPhysicsBodiesCount; i++) {
            const b = this._cachedPhysicsBodies[i];
            if (x > b.x - b.hw && x < b.x + b.hw && y > b.y - b.hh && y < b.y + b.hh) {
                return b.y - b.hh;
            }
        }
        return NaN;
    },


    // Spawn explosion embers (incandescent particles flying outward) - uses pooling
    _spawnExplosionEmbers(x, y, radius) {
        // Limit particles for mobile performance
        const isMobile = this._isMobileLikeForCatapult();
        const count = isMobile ? 20 : 40;

        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.3;
            const speed = 150 + Math.random() * 250;

            const p = this._getParticle(this._emberParticles);
            p.x = x + (Math.random() - 0.5) * 20;
            p.y = y + (Math.random() - 0.5) * 20;
            p.vx = Math.cos(angle) * speed;
            p.vy = Math.sin(angle) * speed - 50;
            p.size = 3 + Math.random() * 4;
            p.age = 0;
            p.life = 2 + Math.random() * 2;
            p.bounces = 0;
            p.maxBounces = 3 + Math.floor(Math.random() * 3);
            p.hue = 15 + Math.random() * 35;
        }
    },


    // Render pulsing outline around bomb (visual link with notch)
    _renderBombOutline(ctx) {
        if (RCHIPL.Editor?.isEditMode?.()) return;

        const bomb = this.activeBomb || this.pendingBomb;
        if (!bomb?.softbody?.envelopes?.[0]) return;

        const env = bomb.softbody.envelopes[0];
        if (!env.vertices || env.vertices.length < 3) return;

        // Same pulse as notch for visual sync
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 120);
        const glowAlpha = 0.4 + 0.5 * pulse;
        const outlineWidth = 4 + 2 * pulse;

        ctx.save();

        // Draw pulsing orange outline around the softbody shape
        ctx.beginPath();
        ctx.moveTo(env.vertices[0].x, env.vertices[0].y);
        for (let i = 1; i < env.vertices.length; i++) {
            ctx.lineTo(env.vertices[i].x, env.vertices[i].y);
        }
        ctx.closePath();

        ctx.strokeStyle = `rgba(255, 140, 0, ${glowAlpha})`;
        ctx.lineWidth = outlineWidth;
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.restore();
    },


    // Render tap hint (finger pointing at bomb) - tutorial for explosion
    _renderTapHint(ctx) {
        if (!this._tapHintShown || !this.activeBomb) return;
        if (RCHIPL.Editor?.isEditMode?.()) return;
        if (this._areTutorialHintsLocked()) return;
        if (!this._canExplodeBombNow(this.activeBomb, this._bombSpawnerConfig)) return;

        // Check layout variable - only show if showTutorial is true for this layout
        const showHint = RCHIPL.Layouts?.getVar?.('showTutorial');
        if (!showHint) return;

        // Get bomb position
        const bomb = this.activeBomb;
        if (!bomb.softbody?.envelopes?.[0]?.vertices) return;

        const verts = bomb.softbody.envelopes[0].vertices;
        let bx = 0, by = 0;
        for (const v of verts) {
            bx += v.x;
            by += v.y;
        }
        bx /= verts.length;
        by /= verts.length;

        // Get fingerBomb asset (optional: fallback drawing if missing)
        const fingerAsset = RCHIPL.Assets?.get?.('fingerBomb');

        // Animate: finger taps down then up
        const tapCycle = Math.sin(this._tapHintPhase * Math.PI) * 0.5 + 0.5; // 0 to 1 to 0
        const offsetY = 120 + tapCycle * 20; // Moves down 20px on tap
        const scale = 1 + tapCycle * 0.1; // Slightly bigger on tap

        ctx.save();
        ctx.translate(bx + 60, by + offsetY);
        ctx.scale(scale, scale);

        // Draw the finger asset
        if (fingerAsset?.img) {
            const w = fingerAsset.params?.w || 64;
            const h = fingerAsset.params?.h || 64;
            const ax = fingerAsset.anchor?.x ?? fingerAsset.params?.anchorX ?? 0.5;
            const ay = fingerAsset.anchor?.y ?? fingerAsset.params?.anchorY ?? 0.5;
            ctx.drawImage(fingerAsset.img, -w * ax, -h * ay, w, h);
        } else {
            // Fallback: draw a simple finger shape
            ctx.fillStyle = '#FFE4C4';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        ctx.restore();
    },


    // Render fuse and particles (with pooling - skip dead particles)
    _renderFuse(ctx) {
        // Skip in Edit mode and clear all particles
        if (RCHIPL.Editor?.isEditMode?.()) {
            for (const p of this._fuseParticles) p.dead = true;
            for (const p of this._smokeParticles) p.dead = true;
            for (const p of this._emberParticles) p.dead = true;
            RCHIPL.FX?.clear?.(); // Clear water splash particles too
            return;
        }

        // Skip if nothing to draw
        if (!this._smokeParticles.length && !this._fuseParticles.length &&
            !this._emberParticles.length && !this.activeBomb && !this.pendingBomb) return;

        // Draw smoke first (behind everything)
        for (const p of this._smokeParticles) {
            if (p.dead) continue;
            const t = p.age / p.life;
            const alpha = (1 - Math.pow(t, p.fadeSpeed)) * 0.5;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(60, 60, 60, ${alpha})`;
            ctx.fill();
        }

        // Draw ember particles (falling sparks)
        for (const p of this._emberParticles) {
            if (p.dead) continue;
            const t = p.age / p.life;
            const alpha = 1 - t * 0.7;
            const size = p.size * (1 - t * 0.3);

            // Glowing ember effect
            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 100%, 50%, ${alpha * 0.3})`;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 100%, ${60 + t * 20}%, ${alpha})`;
            ctx.fill();
        }

        // Draw sparkle particles
        for (const p of this._fuseParticles) {
            if (p.dead) continue;
            const t = p.age / p.life;
            const alpha = 1 - t;
            const size = p.size * (1 - t * 0.5);

            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 100%, ${60 + t * 30}%, ${alpha})`;
            ctx.fill();
        }

        // Draw fuse if bomb exists (active or pending)
        if (!this.activeBomb && !this.pendingBomb) return;

        const tip = this._getFuseTip();
        if (!tip) return;

        // Draw fuse line (2x wider: was 4, now 8)
        ctx.beginPath();
        ctx.moveTo(tip.baseX, tip.baseY);
        ctx.lineTo(tip.tipX, tip.tipY);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Draw glowing tip (bigger)
        ctx.beginPath();
        ctx.arc(tip.tipX, tip.tipY, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ff6600';
        ctx.fill();

        // Glow effect (bigger)
        const glow = ctx.createRadialGradient(tip.tipX, tip.tipY, 0, tip.tipX, tip.tipY, 20);
        glow.addColorStop(0, 'rgba(255, 200, 50, 0.9)');
        glow.addColorStop(0.5, 'rgba(255, 100, 0, 0.4)');
        glow.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.beginPath();
        ctx.arc(tip.tipX, tip.tipY, 20, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
    },


    // ═══ EMOTION BUBBLES ═══

    // Pre-rendered emoji cache (avoid fillText every frame)
    _emojiCache: {},

    _getCachedEmoji(emoji) {
        if (this._emojiCache[emoji]) return this._emojiCache[emoji];

        // Create canvas for this emoji
        const size = 80;  // Slightly larger than 62px font for shadow
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Draw emoji with shadow (once)
        ctx.font = '62px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 3;
        ctx.fillText(emoji, size / 2, size / 2);

        this._emojiCache[emoji] = canvas;
        return canvas;
    },

    // Show an emotion bubble above a blob
    _showEmotionBubble(blob, emoji, duration = 1.5) {
        if (!this._blobEmotionEnabled) return;

        // Don't stack multiple bubbles on same blob
        const existing = this._emotionBubbles.find(b => b.blob === blob);
        if (existing) {
            // Replace with new emotion
            existing.emoji = emoji;
            existing.startTime = performance.now();
            existing.duration = duration * 1000;
            return;
        }

        this._emotionBubbles.push({
            blob,
            emoji,
            startTime: performance.now(),
            duration: duration * 1000
        });
    },


    // Update emotion bubbles (reverse loop to avoid new array allocation)
    _updateEmotionBubbles() {
        if (!this._blobEmotionEnabled) {
            if (this._emotionBubbles.length > 0) this._emotionBubbles.length = 0;
            return;
        }

        const now = this._now || performance.now();
        for (let i = this._emotionBubbles.length - 1; i >= 0; i--) {
            if (now - this._emotionBubbles[i].startTime >= this._emotionBubbles[i].duration) {
                this._emotionBubbles.splice(i, 1);
            }
        }
    },


    // Render emotion bubbles above blobs
    _renderEmotionBubbles(ctx) {
        if (!this._blobEmotionEnabled) return;
        if (this._emotionBubbles.length === 0) return;

        const now = performance.now();

        for (const bubble of this._emotionBubbles) {
            const { blob, emoji, startTime, duration } = bubble;

            // Get blob position
            const sb = blob.softbody;
            if (!sb?.envelopes?.[0]?.vertices) continue;

            const verts = sb.envelopes[0].vertices;
            let cx = 0, topY = Infinity;
            for (const v of verts) {
                cx += v.x;
                if (v.y < topY) topY = v.y;
            }
            cx /= verts.length;

            // Animation progress
            const elapsed = now - startTime;
            const progress = elapsed / duration;

            // Simple elastic bounce (safer)
            let scale = 1;
            if (progress < 0.1) {
                // Pop in with overshoot
                const t = progress / 0.1;
                const overshoot = 1.3;
                scale = t < 0.6 ? t / 0.6 * overshoot : overshoot - (t - 0.6) / 0.4 * (overshoot - 1);
            } else if (progress > 0.9) {
                // Pop out (shrink to 0)
                const t = (progress - 0.9) / 0.1;
                scale = 1 - t;
            }

            // Bubble position (above blob)
            const bubbleX = cx;
            const bubbleY = topY - 70;

            ctx.save();
            ctx.translate(bubbleX, bubbleY);
            ctx.scale(scale, scale);

            // Draw bubble (proportions from BubbleEmoji composite: w:100, h:112.5)
            const circleY = -25;      // Circle center offset
            const radius = 50;        // Circle radius (100/2)
            const tailW = 50;         // Tail width
            const tailH = 25;         // Tail height
            const tailY = 25;         // Tail center Y

            // Draw circle (white fill)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, circleY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw triangle tail pointing down (w:50, h:25, rotated 180°)
            ctx.beginPath();
            ctx.moveTo(-tailW / 2, tailY - tailH / 2);  // top-left
            ctx.lineTo(0, tailY + tailH / 2);           // bottom center
            ctx.lineTo(tailW / 2, tailY - tailH / 2);   // top-right
            ctx.closePath();
            ctx.fill();

            // Draw pre-rendered emoji (cached canvas)
            const emojiCanvas = this._getCachedEmoji(emoji);
            ctx.drawImage(emojiCanvas, -emojiCanvas.width / 2, circleY - emojiCanvas.height / 2);

            ctx.restore();
        }
    },


    // ═══ TUTORIAL WATER HINTS (drop on blob layer + bubble on lower layer) ═══
    _clearTutorialWaterHints() {
        if (!Array.isArray(this._tutorialWaterHints) || this._tutorialWaterHints.length === 0) return;
        const scene = RCHIPL.Scene?.objects;
        if (!Array.isArray(scene)) {
            this._tutorialWaterHints = [];
            return;
        }

        for (const entry of this._tutorialWaterHints) {
            const obj = entry?.obj;
            if (!obj) continue;
            const idx = scene.indexOf(obj);
            if (idx >= 0) scene.splice(idx, 1);
        }
        this._tutorialWaterHints = [];
    },

    _triggerSavedHappyHint(blob) {
        if (!blob || !Array.isArray(this._tutorialWaterHints) || this._tutorialWaterHints.length === 0) return;
        const entry = this._tutorialWaterHints.find(e => e?.blob === blob);
        if (!entry?.obj) return;

        const tutorialHideDelayMultiplier = 4.2; // 2x longer display time
        const tutorialHideBaseMs = 450;
        const now = performance.now();
        const hideDelay = (tutorialHideBaseMs + (blob.bubbleOffset || 0)) * tutorialHideDelayMultiplier;

        entry.happyActive = true;
        entry.happyStartTime = now;
        entry.happyHideAt = now + hideDelay;
    },

    _getTutorialHintAnchor(blob) {
        const sb = blob?.softbody;
        const verts = sb?.envelopes?.[0]?.vertices;

        // Saved blobs move with a rigid proxy: use it directly to avoid one-frame lag.
        if (sb?._rigidProxy) {
            const px = sb._rigidProxy.position?.x || 0;
            const py = sb._rigidProxy.position?.y || 0;
            let topRestY = 0;
            if (Array.isArray(verts) && verts.length > 0) {
                topRestY = Infinity;
                for (const v of verts) topRestY = Math.min(topRestY, Number(v.restY ?? 0));
                if (!Number.isFinite(topRestY)) topRestY = 0;
            }
            return { x: px, topY: py + topRestY };
        }

        if (Array.isArray(verts) && verts.length > 0) {
            let cx = 0;
            let topY = Infinity;
            for (const v of verts) {
                cx += v.x;
                if (v.y < topY) topY = v.y;
            }
            return { x: cx / verts.length, topY };
        }

        const sceneObj = blob?.sceneObj;
        if (sceneObj) {
            const sx = Math.abs(Number(sceneObj.scaleX ?? sceneObj.scale ?? 1)) || 1;
            const sy = Math.abs(Number(sceneObj.scaleY ?? sceneObj.scale ?? 1)) || 1;
            const h = Number(sceneObj.height || 100) * sy;
            return {
                x: Number(sceneObj.x || 0),
                topY: Number(sceneObj.y || 0) - (h * 0.5)
            };
        }

        return null;
    },

    _initTutorialWaterHints() {
        const showHint = RCHIPL.Layouts?.getVar?.('showTutorial');
        if (!showHint) {
            this._clearTutorialWaterHints();
            return;
        }

        this._clearTutorialWaterHints();
        const scene = RCHIPL.Scene?.objects;
        if (!Array.isArray(scene) || !Array.isArray(this.targetBlobs) || this.targetBlobs.length === 0) return;

        const waterAsset = RCHIPL.Assets?.get?.('waterDrop3');
        const fallbackW = 117;
        const fallbackH = 165;
        const width = Math.max(1, waterAsset?.width || fallbackW);
        const height = Math.max(1, waterAsset?.height || fallbackH);
        const now = Date.now();

        this._tutorialWaterHints = this.targetBlobs.map((blob, i) => {
            const blobZ = Number(blob?.sceneObj?.z);
            const hintObj = {
                id: `water_hint_${now}_${i}`,
                type: 'instance',
                asset: 'waterDrop3',
                x: blob?.sceneObj?.x || 0,
                y: blob?.sceneObj?.y || 0,
                scaleX: 1,
                scaleY: 1,
                rotation: 0,
                anchorX: 0.5,
                anchorY: 0.5,
                width,
                height,
                layer: 'Main',
                z: 99999,  // Above all scene objects
                selectable: false,
                visible: false,
                _isTutorialWaterHint: true
            };
            scene.push(hintObj);
            return {
                blob,
                obj: hintObj,
                bubbleVisible: false,
                bubbleX: hintObj.x,
                bubbleY: hintObj.y,
                bubbleScale: 1,
                bubbleLayer: 'Main',
                happyActive: false,
                happyStartTime: 0,
                happyHideAt: 0
            };
        });
    },

    _updateTutorialWaterHints() {
        const showHint = RCHIPL.Layouts?.getVar?.('showTutorial');
        if (!showHint) {
            if (Array.isArray(this._tutorialWaterHints) && this._tutorialWaterHints.length > 0) {
                this._clearTutorialWaterHints();
            }
            return;
        }

        if (!Array.isArray(this._tutorialWaterHints) || this._tutorialWaterHints.length === 0) return;

        const tutorialIconScale = 0.95; // Bigger icon in bubble
        const tutorialYOffsetY = -36; // Raise drop + bubble by +20px more
        const appearDuration = 165;   // Quick pop-in, slightly smoother and bouncier
        const popOutDuration = 180;   // Quick pop-out before hide

        const now = this._now || performance.now();
        const levelTime = now - (this._levelStartTime || now);
        const waterAsset = RCHIPL.Assets?.get?.('waterDrop3');
        const happyAsset = RCHIPL.Assets?.get?.('@Emoji_happy');
        const targetSize = 58;

        const computeAnim = (timeSinceAppear, timeToHide) => {
            let popInScale = 1;
            let popInStretchX = 1;
            let popInStretchY = 1;
            if (timeSinceAppear < appearDuration) {
                const t = Math.max(0, Math.min(1, timeSinceAppear / appearDuration));
                const c1 = 2.05; // More overshoot for a lively pop
                const c3 = c1 + 1;
                const easeOutBack = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
                const springKick = Math.sin(t * Math.PI * 2.6) * Math.exp(-5.8 * t);
                const punch = Math.sin(t * Math.PI) * (1 - t);
                popInScale = 0.16 + (0.84 * (easeOutBack + springKick * 0.18));
                popInStretchX = 1 + (punch * 0.34) + (springKick * 0.10);
                popInStretchY = 1 - (punch * 0.22) - (springKick * 0.06);
            }

            let popOutScale = 1;
            let popOutStretchX = 1;
            let popOutStretchY = 1;
            if (Number.isFinite(timeToHide) && timeToHide <= popOutDuration) {
                const t = Math.max(0, Math.min(1, 1 - (timeToHide / popOutDuration)));
                if (t < 0.32) {
                    const k = t / 0.32;
                    popOutScale = 1 + (0.18 * k); // tiny extra punch before bye-bye
                    popOutStretchX = 1 + (0.22 * k);
                    popOutStretchY = 1 - (0.10 * k);
                } else {
                    const k = (t - 0.32) / 0.68;
                    const easeIn = k * k;
                    popOutScale = 1.18 * (1 - easeIn);
                    popOutStretchX = 1.22 - (1.02 * easeIn);
                    popOutStretchY = 0.90 - (0.70 * easeIn);
                }
                popOutScale = Math.max(0, popOutScale);
            }

            if (popOutScale <= 0.01) return null;

            // Bubble gets an extra springy pop on top of icon scaling.
            let bubbleSpringFactor = 1;
            if (timeSinceAppear < 460) {
                const t = Math.max(0, Math.min(1, timeSinceAppear / 460));
                const c1 = 2.1;
                const c3 = c1 + 1;
                const easeOutBack = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
                const settle = Math.sin(t * Math.PI * 4.8) * Math.exp(-3.8 * t) * 0.16;
                bubbleSpringFactor = 0.70 + (0.30 * easeOutBack) + settle;
            }

            return {
                scaleMul: popInScale * popOutScale,
                stretchX: popInStretchX * popOutStretchX,
                stretchY: popInStretchY * popOutStretchY,
                bubbleSpringFactor: Math.max(0.05, bubbleSpringFactor)
            };
        };

        for (const entry of this._tutorialWaterHints) {
            const blob = entry?.blob;
            const obj = entry?.obj;
            if (!blob || !obj) continue;

            if (entry.happyActive && now >= (entry.happyHideAt || 0)) {
                entry.happyActive = false;
            }

            const isHappyHint = !!entry.happyActive;
            if (!isHappyHint && (blob.saved || blob.softbody?._pendingSettle)) {
                obj.visible = false;
                entry.bubbleVisible = false;
                continue;
            }
            if (!isHappyHint && blob._tutorialHintTouched) {
                // Keep hint visible until this blob was actually touched.
                obj.visible = false;
                entry.bubbleVisible = false;
                continue;
            }

            let timeSinceAppear = 0;
            let timeToHide = Infinity;

            if (isHappyHint) {
                timeSinceAppear = Math.max(0, now - (entry.happyStartTime || now));
                timeToHide = (entry.happyHideAt || now) - now;
            } else {
                const blobDelay = blob.bubbleDelay || 800;
                if (levelTime < blobDelay) {
                    obj.visible = false;
                    entry.bubbleVisible = false;
                    continue;
                }
                timeSinceAppear = levelTime - blobDelay;
            }

            const anchor = this._getTutorialHintAnchor(blob);
            if (!anchor) {
                obj.visible = false;
                entry.bubbleVisible = false;
                continue;
            }

            const anim = computeAnim(timeSinceAppear, timeToHide);
            if (!anim) {
                obj.visible = false;
                entry.bubbleVisible = false;
                continue;
            }

            const desiredAsset = isHappyHint && happyAsset?.loaded ? '@Emoji_happy' : 'waterDrop3';
            const activeAsset = desiredAsset === '@Emoji_happy' ? happyAsset : waterAsset;
            const assetW = Math.max(1, activeAsset?.width || waterAsset?.width || 117);
            const assetH = Math.max(1, activeAsset?.height || waterAsset?.height || 165);
            const baseIconScale = (targetSize / Math.max(assetW, assetH)) * tutorialIconScale;
            const finalScale = baseIconScale * anim.scaleMul;

            if (obj.asset !== desiredAsset) obj.asset = desiredAsset;
            obj.width = assetW;
            obj.height = assetH;
            obj.x = anchor.x;
            obj.y = anchor.topY - (95 * tutorialIconScale) + tutorialYOffsetY;
            obj.scaleX = finalScale * anim.stretchX;
            obj.scaleY = finalScale * anim.stretchY;
            obj.rotation = 0;
            obj.visible = false; // Scene object hidden; icon drawn in bubble render pass

            entry.bubbleVisible = finalScale > 0.01;
            entry.bubbleX = obj.x;
            entry.bubbleY = obj.y;
            entry.bubbleStretchX = anim.stretchX * anim.bubbleSpringFactor;
            entry.bubbleStretchY = anim.stretchY * (2 - anim.bubbleSpringFactor);
        }
    },

    _renderTutorialWaterHintBubbles(ctx) {
        const showHint = RCHIPL.Layouts?.getVar?.('showTutorial');
        if (!showHint) return;
        if (!Array.isArray(this._tutorialWaterHints) || this._tutorialWaterHints.length === 0) return;

        const bubbleAssetName = '@UI_Bubble';
        const bubbleAsset = RCHIPL.Assets?.get?.(bubbleAssetName);
        const bubbleW = Math.max(1, bubbleAsset?.width || 100);
        const bubbleH = Math.max(1, bubbleAsset?.height || 121);
        const mainStrokeBelow = RCHIPL.Scene?._getLayerDef?.('Main')?.strokeBelow || null;
        const drawStrokeOnly = RCHIPL.Scene?._drawObjectStrokeOnly;

        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        for (const entry of this._tutorialWaterHints) {
            if (!entry?.bubbleVisible) continue;

            const x = Number(entry.bubbleX) || 0;
            const y = Number(entry.bubbleY) || 0;
            const hintObj = entry.obj;
            if (!hintObj) continue;

            const iconSX = Math.abs(hintObj.scaleX || 0.3);
            const iconSY = Math.abs(hintObj.scaleY || 0.3);
            const bsX = entry.bubbleStretchX || 1;
            const bsY = entry.bubbleStretchY || 1;
            const iconW = Math.max(1, (hintObj.width || 117) * iconSX);
            const iconH = Math.max(1, (hintObj.height || 165) * iconSY);
            const iconRadius = 0.5 * Math.max(iconW, iconH);
            const whiteMargin = Math.max(20, iconRadius * 0.52);
            const baseR = Math.max(48, iconRadius + whiteMargin);
            const r = baseR * 1.2;
            const assetName = hintObj.asset || 'waterDrop3';

            if (mainStrokeBelow && typeof drawStrokeOnly === 'function') {
                drawStrokeOnly.call(RCHIPL.Scene, ctx, {
                    type: 'instance',
                    asset: assetName,
                    x,
                    y,
                    scaleX: iconSX,
                    scaleY: iconSY,
                    rotation: 0,
                    anchorX: 0.5,
                    anchorY: 0.5,
                    visible: true
                }, mainStrokeBelow);
            }

            if (bubbleAsset?.loaded) {
                const scale = (2 * r) / bubbleW;
                const circleCenterYOffset = ((bubbleH - bubbleW) * 0.5) * scale;
                if (mainStrokeBelow && typeof drawStrokeOnly === 'function') {
                    drawStrokeOnly.call(RCHIPL.Scene, ctx, {
                        type: 'instance',
                        asset: bubbleAssetName,
                        x,
                        y: y + (circleCenterYOffset * bsY),
                        scaleX: scale * bsX,
                        scaleY: scale * bsY,
                        rotation: 0,
                        anchorX: 0.5,
                        anchorY: 0.5,
                        visible: true
                    }, mainStrokeBelow);
                }

                // ── Draw bubble + icon with squash/stretch spring ──
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(bsX, bsY);
                RCHIPL.Assets.draw(ctx, bubbleAssetName, 0, circleCenterYOffset, {
                    scaleX: scale,
                    scaleY: scale,
                    angle: 0,
                    alpha: 1
                });
            } else {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(bsX, bsY);
                const strokeW = Math.max(2.5, 0.11 * r);
                const tailTipX = 0.10 * r;
                const tailTipY = 1.32 * r;
                const attachDX = Math.min(r * 0.52, 0.30 * r);
                const attachDY = Math.sqrt(Math.max(0, (r * r) - (attachDX * attachDX)));
                const leftAttachAngle = Math.atan2(attachDY, -attachDX);
                const rightAttachAngle = Math.atan2(attachDY, attachDX);

                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = strokeW;
                ctx.beginPath();
                ctx.moveTo(-attachDX, attachDY);
                ctx.arc(0, 0, r, leftAttachAngle, (Math.PI * 2) + rightAttachAngle, false);
                ctx.lineTo(tailTipX, tailTipY);
                ctx.lineTo(-attachDX, attachDY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

            // ── Draw icon ON TOP of bubble ──
            RCHIPL.Assets.draw(ctx, assetName, 0, 0, {
                scaleX: iconSX / bsX,
                scaleY: iconSY / bsY,
                angle: 0,
                alpha: 1
            });

            ctx.restore();
        }

        ctx.restore();
    },


    // ═══ VICTORY YES ANIMATION ═══
    _victoryYesCache: null,  // Pre-rendered canvas with stroke+shadow baked in

    // Keep YES hidden only during runtime, and restore authoring visibility in Edit.
    _setVictoryYesRuntimeHidden(hidden, options = {}) {
        const objs = (RCHIPL.Scene?.getAll?.() || []).filter(o => o.asset === 'superYess');
        if (!objs.length) return;

        for (const obj of objs) {
            if (hidden) {
                if (obj._yesAuthoringVisible === undefined) {
                    obj._yesAuthoringVisible = (obj.visible !== false);
                }
                obj.visible = false;
                continue;
            }

            if (obj._yesAuthoringVisible !== undefined) {
                obj.visible = !!obj._yesAuthoringVisible;
                delete obj._yesAuthoringVisible;
            } else if (options.forceLegacyVisible && obj.visible === false) {
                // Legacy fix: old runtime leaked visible=false into saved data.
                obj.visible = true;
            }
        }
