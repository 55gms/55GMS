        const now = this._now || performance.now();
        const introActive = now < (this._screenEdgeCollidersUnlockAtMs || 0);
        const borders = this._borderObjs || [];

        for (const border of borders) {
            const body = border?._physicsBody;
            if (!body) continue;

            if (border._introOriginalSensor === undefined) {
                border._introOriginalSensor = !!body.isSensor;
            }

            const nextSensor = introActive ? true : !!border._introOriginalSensor;
            if (body.isSensor !== nextSensor) {
                body.isSensor = nextSensor;
            }
        }
    },


    // Get primary water liquid for finish line/notch rendering.
    // Prefers the liquid bound to an object named/typed like water, then falls back to first.
    _getPrimaryWaterLiquid() {
        const frame = RCHIPL.Game?._frameCount || 0;
        if (this._primaryWaterLiquidFrame === frame) {
            return this._primaryWaterLiquidCache || null;
        }

        const liquids = RCHIPL.Liquid?._liquids;
        if (!Array.isArray(liquids) || liquids.length === 0) {
            this._primaryWaterLiquidFrame = frame;
            this._primaryWaterLiquidCache = null;
            return null;
        }

        let first = liquids[0] || null;
        let firstBound = null;
        let namedWater = null;
        for (let i = 0; i < liquids.length; i++) {
            const liquid = liquids[i];
            if (!liquid) continue;
            const sceneObj = liquid._sceneObj;
            if (sceneObj) {
                if (!firstBound) firstBound = liquid;
                const assetName = String(sceneObj.asset || '').toLowerCase();
                if (assetName.includes('water')) {
                    namedWater = liquid;
                    break;
                }
            }
        }

        const picked = namedWater || firstBound || first;
        this._primaryWaterLiquidFrame = frame;
        this._primaryWaterLiquidCache = picked || null;
        return picked || null;
    },

    // Layer where finish line should be rendered.
    _getFinishLineLayer() {
        // Preferred: explicit layer named "finishLine" in current layout.
        const layoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const layout = layoutId ? RCHIPL.Layouts?._all?.[layoutId] : null;
        const layoutLayers = Array.isArray(layout?.layers) ? layout.layers : [];
        const namedFinishLayer = layoutLayers.find(name => String(name || '').trim().toLowerCase() === 'finishline');
        if (namedFinishLayer) return namedFinishLayer;

        // Optional override via layout var: finishLineLayer
        // (only if var is declared, to avoid warning logs)
        const varDefs = RCHIPL.Layouts?.getVarDefs?.() || {};
        if (Object.prototype.hasOwnProperty.call(varDefs, 'finishLineLayer')) {
            const val = String(RCHIPL.Layouts.getVar('finishLineLayer') || '').trim();
            if (val) return val;
        }

        // Default: render with blobs so line is below blobs (pre-layer render),
        // while water can live on a higher layer.
        const blobLayer = this.targetBlobs?.find(b => b?.sceneObj?.layer)?.sceneObj?.layer;
        if (blobLayer) return blobLayer;

        // Fallback: water layer (if blobs not yet initialized)
        const water = this._getPrimaryWaterLiquid();
        return water?._sceneObj?.layer || null;
    },

    // Effective layer where we inject finish-line rendering.
    // If finishLine layer is empty (and thus skipped by renderer), pick the nearest
    // visible/rendered layer in front of it so depth ordering stays coherent.
    _getFinishLineRenderLayer() {
        const targetLayer = this._getFinishLineLayer();
        if (!targetLayer) return null;

        const layoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const layout = layoutId ? RCHIPL.Layouts?._all?.[layoutId] : null;
        const layerOrder = Array.isArray(layout?.layers) ? layout.layers : [];
        const disabledLayers = Array.isArray(layout?.disabledLayers) ? layout.disabledLayers : [];
        const sceneObjects = RCHIPL.Scene?.getAll?.() || [];

        const isRenderableLayer = (name) => {
            if (!name) return false;
            if (disabledLayers.includes(name)) return false;
            if (sceneObjects.some(obj => (obj.layer || 'Main') === name)) return true;

            // A layer can still render without objects if it has visual layer effects.
            const def = RCHIPL.Scene?._getLayerDef?.(name);
            return !!(def?.pattern?.type || def?.background || def?.tiles?.asset);
        };

        // Most cases: target layer itself is rendered.
        if (isRenderableLayer(targetLayer)) return targetLayer;

        const idx = layerOrder.indexOf(targetLayer);
        if (idx < 0) return targetLayer;

        // Draw order is reverse(layerOrder), so "front" layers are lower indices.
        // Rendering in preLayer of the nearest front rendered layer emulates an empty target layer.
        for (let i = idx - 1; i >= 0; i--) {
            const candidate = layerOrder[i];
            if (isRenderableLayer(candidate)) return candidate;
        }

        // Fallback: nearest rendered layer behind if nothing in front.
        for (let i = idx + 1; i < layerOrder.length; i++) {
            const candidate = layerOrder[i];
            if (isRenderableLayer(candidate)) return candidate;
        }

        return targetLayer;
    },

    // Render goal notch in world-space (behind finish line)
    _renderGoalNotchWorld(ctx) {
        return;  // DISABLED - counter hidden for cleaner UI
        const targetCount = this.targetBlobs?.length || 0;
        if (targetCount <= 0) return;

        const water = this._getPrimaryWaterLiquid();
        if (!water) return;

        const savedCount = this.savedBlobs?.length || 0;

        // Blob counter text
        const counterText = `${savedCount}/${targetCount}`;
        const fontSize = 32;
        ctx.font = `800 ${fontSize}px Nunito, sans-serif`;
        const textMetrics = ctx.measureText(counterText);

        // Notch dimensions (just text, no icons)
        const paddingX = 20;
        const paddingY = 10;
        const cornerRadius = 12;
        const notchWidth = textMetrics.width + paddingX * 2;
        const notchHeight = fontSize + paddingY * 2;

        // Position: centered horizontally in game zone (1080x1080 centered at 0,0)
        const waterTop = water.y - water.height / 2;
        const squareSize = 30;
        const borderSize = 4;
        const finishLineTop = waterTop - squareSize - 70 - squareSize - borderSize;

        // Centered horizontally in game area
        const x = -notchWidth / 2;  // Centered at x=0
        const y = finishLineTop - notchHeight;

        ctx.save();

        // Draw inverted notch background (BLACK) - rounded only at TOP
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.moveTo(x, y + notchHeight);
        ctx.lineTo(x, y + cornerRadius);
        ctx.quadraticCurveTo(x, y, x + cornerRadius, y);
        ctx.lineTo(x + notchWidth - cornerRadius, y);
        ctx.quadraticCurveTo(x + notchWidth, y, x + notchWidth, y + cornerRadius);
        ctx.lineTo(x + notchWidth, y + notchHeight);
        ctx.closePath();
        ctx.fill();

        // Draw blob counter text in WHITE (centered in notch)
        ctx.font = `800 ${fontSize}px Nunito, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = savedCount === targetCount ? '#4CAF50' : '#ffffff';
        ctx.fillText(counterText, x + notchWidth / 2, y + notchHeight / 2);

        ctx.restore();
    },


    // Render finish line above water surface
    _renderFinishLine(ctx) {
        // Get water bounds
        const water = this._getPrimaryWaterLiquid();
        if (!water) return;

        const waterTop = water.y - water.height / 2;
        const waterLeft = water.x - water.width / 2;
        const waterRight = water.x + water.width / 2;

        // Draw checkered pattern (racing finish line style)
        const squareSize = 30;  // 2x bigger
        const borderSize = 4;   // Black border top/bottom
        // Finish line position (bottom of pattern 70px above water surface)
        const lineY = waterTop - squareSize - 70;

        ctx.save();
        const numSquares = Math.ceil((waterRight - waterLeft) / squareSize);

        // Top black border
        ctx.fillStyle = '#222';
        ctx.fillRect(waterLeft, lineY - squareSize - borderSize, waterRight - waterLeft, borderSize);

        for (let i = 0; i < numSquares; i++) {
            const x = waterLeft + i * squareSize;
            const isBlack = i % 2 === 0;

            // Top row
            ctx.fillStyle = isBlack ? '#222' : '#fff';
            ctx.fillRect(x, lineY - squareSize, squareSize, squareSize);

            // Bottom row (inverted)
            ctx.fillStyle = isBlack ? '#fff' : '#222';
            ctx.fillRect(x, lineY, squareSize, squareSize);
        }

        // Bottom black border
        ctx.fillStyle = '#222';
        ctx.fillRect(waterLeft, lineY + squareSize, waterRight - waterLeft, borderSize);

        ctx.restore();
    },


    // Raycast vertical - trouve le premier obstacle en dessous de (x, startY)
    // Parcourt les bodies Matter.js et, optionnellement, les softbodies (blobs)
    raycastDown(x, startY, includeSoftbodies = false) {
        let closestY = this.HEIGHT; // Default: bottom of game area
        const testVertices = (vertices) => {
            if (!vertices || vertices.length < 3) return;

            // Early exit: skip polygons not in X range
            let minVX = Infinity;
            let maxVX = -Infinity;
            for (const v of vertices) {
                if (v.x < minVX) minVX = v.x;
                if (v.x > maxVX) maxVX = v.x;
            }
            if (x < minVX || x > maxVX) return;

            // Test each edge for intersection with vertical line at x
            for (let i = 0; i < vertices.length; i++) {
                const v1 = vertices[i];
                const v2 = vertices[(i + 1) % vertices.length];

                // Skip if edge doesn't cross x
                const minX = Math.min(v1.x, v2.x);
                const maxX = Math.max(v1.x, v2.x);
                if (x < minX || x > maxX) continue;

                // Handle near-vertical edges
                if (Math.abs(v2.x - v1.x) < 0.001) continue;

                // Calculate y at intersection point
                const t = (x - v1.x) / (v2.x - v1.x);
                const intersectY = v1.y + t * (v2.y - v1.y);

                // Only consider intersection points below startY
                if (intersectY > startY && intersectY < closestY) {
                    closestY = intersectY;
                }
            }
        };

        const engine = RCHIPL.Physics?._engine;
        if (engine && Matter?.Composite) {
            const bodies = Matter.Composite.allBodies(engine.world);

            for (const body of bodies) {
                // Skip non-static bodies EXCEPT suspended platforms, bridge planks, and springboards
                if (!body.isStatic && !body._isSuspendedPlatform && !body._bridgePlank && !body._springboardPlank) continue;

                // Early exit: skip bodies not in X range (use Matter bounds)
                const b = body.bounds;
                if (b && (x < b.min.x || x > b.max.x)) continue;

                // Get all parts (for compound bodies like capsules)
                const parts = body._cachedParts || (body._cachedParts = body.parts.length > 1 ? body.parts.slice(1) : [body]);

                for (const part of parts) {
                    testVertices(part.vertices);
                }
            }
        }

        // Optional: include target blobs/softbodies in raycast (for bomb aim preview)
        if (includeSoftbodies) {
            if (Array.isArray(this.targetBlobs) && this.targetBlobs.length > 0) {
                for (let i = 0; i < this.targetBlobs.length; i++) {
                    const sb = this.targetBlobs[i]?.softbody;
                    if (!sb || sb._sceneObj?.isProjectile) continue;
                    const envs = sb.envelopes || [];
                    for (let j = 0; j < envs.length; j++) {
                        testVertices(envs[j]?.vertices);
                    }
                }
            } else {
                const softbodies = RCHIPL.SoftBody?._softbodies || [];
                for (let i = 0; i < softbodies.length; i++) {
                    const sb = softbodies[i];
                    if (!sb || sb._sceneObj?.isProjectile) continue;
                    const envs = sb.envelopes || [];
                    for (let j = 0; j < envs.length; j++) {
                        testVertices(envs[j]?.vertices);
                    }
                }
            }
        }

        return closestY;
    },

    // Draw aim indicator at top (always visible at 10% from top of screen)
    _getRaycastIndicatorRGB() {
        const fallback = { r: 244, g: 54, b: 250 }; // Existing default color

        let raw = '#f436fa';
        if (this._raycastColorVarDefined === undefined) {
            const defs = RCHIPL.Layouts?.getVarDefs?.() || {};
            this._raycastColorVarDefined = Object.prototype.hasOwnProperty.call(defs, 'raycastColor');
        }
        if (this._raycastColorVarDefined) {
            raw = RCHIPL.Layouts.getVar('raycastColor') ?? raw;
        }
        const color = String(raw || '').trim();
        if (!color) return fallback;

        const rgbMatch = color.match(/^rgba?\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*,\s*([0-9.]+)(?:\s*,\s*[0-9.]+\s*)?\)$/i);
        if (rgbMatch) {
            return {
                r: Math.max(0, Math.min(255, Math.round(parseFloat(rgbMatch[1])))),
                g: Math.max(0, Math.min(255, Math.round(parseFloat(rgbMatch[2])))),
                b: Math.max(0, Math.min(255, Math.round(parseFloat(rgbMatch[3]))))
            };
        }

        let hex = color.startsWith('#') ? color.slice(1) : color;
        if (/^[0-9a-f]{3}$/i.test(hex)) {
            hex = hex.split('').map(c => c + c).join('');
        }
        if (/^[0-9a-f]{6}$/i.test(hex)) {
            return {
                r: parseInt(hex.slice(0, 2), 16),
                g: parseInt(hex.slice(2, 4), 16),
                b: parseInt(hex.slice(4, 6), 16)
            };
        }

        return fallback;
    },

    _renderSpawnerDebug(ctx) {
        const spawners = (RCHIPL.Scene?.getAll?.() || []).filter(o => o?.family === 'bombSpawner');
        if (spawners.length === 0) return;
        const dt = RCHIPL.Game.dt || 1 / 60;
        if (!this._debugPhases) this._debugPhases = {};

        for (const obj of spawners) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            const toNum = (v, fb) => { const n = parseFloat(typeof v === 'string' ? v.replace(',', '.') : v); return Number.isFinite(n) ? n : fb; };
            const angleMin = toNum(obj.angleMin ?? props.angleMin, -135);
            const angleMax = toNum(obj.angleMax ?? props.angleMax, -45);
            const speedSin = Math.max(0.1, toNum(obj.speedSin ?? props.speedSin, 1.2));
            const cx = obj.x ?? 0;
            const cy = obj.y ?? 0;
            const lineLen = 160;
            const minRad = angleMin * Math.PI / 180;
            const maxRad = angleMax * Math.PI / 180;

            // Animate per-spawner phase
            const key = obj.id || obj.name || ('s' + spawners.indexOf(obj));
            if (!this._debugPhases[key]) this._debugPhases[key] = 0;
            this._debugPhases[key] += dt * speedSin * Math.PI * 2;
            const osc01 = 0.5 + 0.5 * Math.sin(this._debugPhases[key]);
            const currentRad = (angleMin + (angleMax - angleMin) * osc01) * Math.PI / 180;

            ctx.save();

            // Arc sweep between min and max
            ctx.beginPath();
            ctx.arc(cx, cy, lineLen * 0.6, minRad, maxRad, false);
            ctx.strokeStyle = 'rgba(0,212,255,0.25)';
            ctx.lineWidth = 18;
            ctx.stroke();

            // AngleMin line (dashed)
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(minRad) * lineLen, cy + Math.sin(minRad) * lineLen);
            ctx.strokeStyle = 'rgba(0,212,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // AngleMax line (dashed)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(maxRad) * lineLen, cy + Math.sin(maxRad) * lineLen);
            ctx.stroke();
            ctx.setLineDash([]);

            // Current angle line (solid, bright)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(currentRad) * lineLen, cy + Math.sin(currentRad) * lineLen);
            ctx.strokeStyle = '#00D4FF';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Dot at tip
            ctx.beginPath();
            ctx.arc(cx + Math.cos(currentRad) * lineLen, cy + Math.sin(currentRad) * lineLen, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#00D4FF';
            ctx.fill();

            ctx.restore();
        }
    },

    drawAimIndicator(ctx) {
        // ═══ 2P VERSUS: draw both player indicators ═══
        if (this._versusMode && this._vs) {
            this._drawVersusAimIndicators(ctx);
            return;
        }

        if (this._isSpawnerControlMode() && this._bombSpawnerObj && this._bombSpawnerConfig) {
            const isCatapult = this.controlMode === 'catapult';
            const indicatorColor = this._getRaycastIndicatorRGB();
            const cfg = this._bombSpawnerConfig;
            const fallbackX = this.aimX;
            const fallbackY = this.getSpawnY();
            // Use natural center so the arrow matches the actual launch origin
            // (spawn position, not the base-anchor-shifted squash center).
            const x = fallbackX;
            const y = fallbackY;

            const pointerAim = (isCatapult && this._launcherIsCharging && this.pendingBomb && !this.activeBomb)
                ? this._getCatapultPointerAim(cfg, this._getCatapultInputProfile(), this._catapultDragX, this._catapultDragY)
                : null;
            let angleDeg = this._launcherIsCharging
                ? (this._launcherFrozenAngleDeg ?? this._launcherAngleDeg)
                : this._launcherAngleDeg;
            if (pointerAim) angleDeg = pointerAim.angleDeg;
            const angleRad = angleDeg * Math.PI / 180;
            const dx = Math.cos(angleRad);
            const dy = Math.sin(angleRad);
            let renderDx = dx;
            let renderDy = dy;

            const maxForce = Math.max(1, cfg.forceMax || 1);
            let chargeNorm = Math.max(0, Math.min(1, (this._launcherCharge || 0) / maxForce));
            if (pointerAim) chargeNorm = Math.max(chargeNorm, pointerAim.forceNorm || 0);
            const dotScaleValue = Number(cfg.aimDotScale);
            const headScaleValue = Number(cfg.aimHeadScale);
            const dotScale = Math.max(0.4, Number.isFinite(dotScaleValue) ? dotScaleValue : 1.2);
            const headScale = Math.max(0.4, Number.isFinite(headScaleValue) ? headScaleValue : 1.5);
            const headLen = (isCatapult ? 20 : 22) * headScale;
            const headHalfWidth = 10 * headScale;
            const baseStartOffset = isCatapult ? 46 : 65;
            const shaftBaseLen = isCatapult ? 8 : 80;
            const shaftStretchLen = isCatapult ? 320 : 170;
            const shaftNorm = isCatapult ? Math.pow(chargeNorm, 0.82) : chargeNorm;
            const shaftDefaultLen = shaftBaseLen + shaftNorm * shaftStretchLen;
            let startOffset = baseStartOffset;
            let shaftLen = shaftDefaultLen;
            let headBaseX;
            let headBaseY;
            let tipX;
            let tipY;
            let maxTipX = null;
            let maxTipY = null;

            if (pointerAim && !pointerAim.fromThumbOrigin) {
                // Desktop / landscape behavior: tip follows cursor in WORLD coords.
                const pointerWorld = this.canvasToWorld(RCHIPL.Input?.x, RCHIPL.Input?.y);
                const toPointerX = pointerWorld.x - x;
                const toPointerY = pointerWorld.y - y;
                const pointerWorldDist = Math.hypot(toPointerX, toPointerY);
                if (pointerWorldDist > 0.001) {
                    renderDx = toPointerX / pointerWorldDist;
                    renderDy = toPointerY / pointerWorldDist;
                }
                const zoom = Math.max(0.0001, RCHIPL.Viewport?.zoom || 1);
                const tipMaxDistWorld = Math.max(0, (pointerAim.visualMaxDistPx || 0) / zoom);
                const tipDist = Math.min(pointerWorldDist, tipMaxDistWorld);
                const maxStartOffset = Math.max(0, tipDist - headLen);
                startOffset = Math.min(baseStartOffset, maxStartOffset);
                shaftLen = Math.max(0, tipDist - startOffset - headLen);
                tipX = x + renderDx * tipDist;
                tipY = y + renderDy * tipDist;
                headBaseX = tipX - renderDx * headLen;
                headBaseY = tipY - renderDy * headLen;
                maxTipX = x + renderDx * tipMaxDistWorld;
                maxTipY = y + renderDy * tipMaxDistWorld;
            } else if (pointerAim) {
                // Mobile portrait behavior: direction/strength from drag vector anchored at first touch.
                if (Number.isFinite(pointerAim.dirX) && Number.isFinite(pointerAim.dirY)) {
                    renderDx = pointerAim.dirX;
                    renderDy = pointerAim.dirY;
                }
                const zoom = Math.max(0.0001, RCHIPL.Viewport?.zoom || 1);
                const tipDistWorld = Math.max(0, (pointerAim.visualDistPx || 0) / zoom);
                const tipMaxDistWorld = Math.max(0, (pointerAim.visualMaxDistPx || 0) / zoom);
                const maxStartOffset = Math.max(0, tipDistWorld - headLen);
                startOffset = Math.min(baseStartOffset, maxStartOffset);
                shaftLen = Math.max(0, tipDistWorld - startOffset - headLen);
                tipX = x + renderDx * tipDistWorld;
                tipY = y + renderDy * tipDistWorld;
                headBaseX = tipX - renderDx * headLen;
                headBaseY = tipY - renderDy * headLen;
                maxTipX = x + renderDx * tipMaxDistWorld;
                maxTipY = y + renderDy * tipMaxDistWorld;
            } else {
                const shaftMaxLen = shaftBaseLen + shaftStretchLen;
                shaftLen = Math.max(0, Math.min(shaftMaxLen, shaftLen));
                headBaseX = x + renderDx * (startOffset + shaftLen);
                headBaseY = y + renderDy * (startOffset + shaftLen);
                tipX = headBaseX + renderDx * headLen;
                tipY = headBaseY + renderDy * headLen;
            }

            const startX = x + renderDx * startOffset;
            const startY = y + renderDy * startOffset;
            const dotsEndX = headBaseX;
            const dotsEndY = headBaseY;

            ctx.save();

            if (!isCatapult) {
                const hitY = this.raycastDown(x, y, true);
                const cycleSpeed = 200;
                const dashLength = 15;
                const gapLength = 10;
                const cycleOffset = (performance.now() / 1000 * cycleSpeed) % (dashLength + gapLength);

                ctx.strokeStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.4)`;
                ctx.lineWidth = 8;
                ctx.setLineDash([dashLength, gapLength]);
                ctx.lineDashOffset = -cycleOffset;
                ctx.beginPath();
                ctx.moveTo(x, y + 80);
                ctx.lineTo(x, hitY);
                ctx.stroke();

                ctx.setLineDash(_EMPTY_DASH);
                ctx.fillStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.8)`;
                ctx.beginPath();
                ctx.arc(x, hitY, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
                return;
            }

            // Dotted shaft
            const dotCount = isCatapult ? 10 : 8;
            for (let i = 0; i < dotCount; i++) {
                const t = i / (dotCount - 1);
                const px = startX + (dotsEndX - startX) * t;
                const py = startY + (dotsEndY - startY) * t;
                const r = (5 + t * 3) * dotScale;
                ctx.fillStyle = `rgb(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b})`;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Arrow head
            const nx = -renderDy;
            const ny = renderDx;
            ctx.fillStyle = `rgb(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b})`;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(headBaseX + nx * headHalfWidth, headBaseY + ny * headHalfWidth);
            ctx.lineTo(headBaseX - nx * headHalfWidth, headBaseY - ny * headHalfWidth);
            ctx.closePath();
            ctx.fill();

            // Catapult: subtle max-range ghost marker in drag direction.
            if (isCatapult && this._launcherIsCharging && Number.isFinite(maxTipX) && Number.isFinite(maxTipY)) {
                ctx.fillStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.16)`;
                ctx.strokeStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.5)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(maxTipX, maxTipY, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // Charging glow at max tension — ellipse matching squashed blob
            if (this._launcherIsCharging && chargeNorm > 0.97) {
                const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.02);
                ctx.strokeStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, ${0.35 + pulse * 0.45})`;
                ctx.lineWidth = 6 + pulse * 4;
                const stretchX = 1 + chargeNorm * 0.22;
                const squashY = 1 - chargeNorm * 0.32;
                const baseR = 68;
                const restMaxDy = this.pendingBomb?.restMaxDy || 0;
                const shiftY = restMaxDy * (1 - squashY);
                ctx.beginPath();
                ctx.ellipse(x, y + shiftY, baseR * stretchX, baseR * squashY, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
            return;
        }

        const x = this.aimX;
        const y = this.getSpawnY();
        const indicatorColor = this._getRaycastIndicatorRGB();

        // Raycast down to find first obstacle
        const hitY = this.raycastDown(x, y, true);

        ctx.save();

        // Cycling animation offset (moves downward)
        const cycleSpeed = 200; // pixels per second
        const dashLength = 15;
        const gapLength = 10;
        const cycleOffset = (performance.now() / 1000 * cycleSpeed) % (dashLength + gapLength);

        // Draw vertical line from below bomb to obstacle
        ctx.strokeStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.4)`;
        ctx.lineWidth = 8; // 2x wider
        ctx.setLineDash([dashLength, gapLength]);
        ctx.lineDashOffset = -cycleOffset; // Negative = animate downward
        ctx.beginPath();
        ctx.moveTo(x, y + 80); // Start further below the bomb
        ctx.lineTo(x, hitY);
        ctx.stroke();

        // Draw impact dot at hit point
        ctx.setLineDash(_EMPTY_DASH);
        ctx.fillStyle = `rgba(${indicatorColor.r}, ${indicatorColor.g}, ${indicatorColor.b}, 0.8)`;
        ctx.beginPath();
        ctx.arc(x, hitY, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        // Note: bomb preview is now the real softbody (pendingBomb), no manual drawing needed
    },

    _clearVsScoreUiCache() {
        this._vsScorePointObjs = null;
        this._vsScoreUiDirty = true;
        this._vsScoreUiLastKey = '';
    },

    _markVsScoreUiDirty() {
        this._vsScoreUiDirty = true;
    },

    _buildVsScoreStops(color1, color2) {
        const c1 = String(color1 || '').trim() || '#ffffff';
        const c2raw = String(color2 || '').trim();
        const c2 = c2raw || c1;
        if (c2.toLowerCase() !== c1.toLowerCase()) {
            return [
                { pos: 0, color: c1, alpha: 1 },
                { pos: 100, color: c2, alpha: 1 }
            ];
        }
        return [{ pos: 0, color: c1, alpha: 1 }];
    },

    _isVersusScoreLayoutActive() {
        const currentLayout = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        const family = currentLayout ? RCHIPL.Layouts?._all?.[currentLayout]?.family : '';
        return family === '2joueursScore';
    },

    _cacheVsScorePoints() {
        const objs = RCHIPL.Scene?.getByFamily?.('playerScorePoint') || [];
        const entries = [];

        for (const obj of objs) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            const playerTag = String(props.player || 'P1').trim().toUpperCase();
            const playerIdx = playerTag === 'P2' ? 1 : 0;
            const slotRaw = Math.round(Number(props.slot) || 1);
            const slot = Math.max(1, Math.min(5, slotRaw));

            const idleColor1 = String(props.idleColor1 || '#ffffff').trim();
            const idleColor2 = String(props.idleColor2 || '#ffffff').trim();
            const activeColor1 = String(props.activeColor1 || '#4fc3f7').trim();
            const activeColor2 = String(props.activeColor2 || activeColor1).trim();
            const paintModeRaw = String(props.paintMode || 'bodyChild').trim();
            const paintMode = paintModeRaw === 'wholeAsset' ? 'wholeAsset' : 'bodyChild';
            const bodyChildIndexRaw = Math.round(Number(props.bodyChildIndex) || 0);
            const bodyChildIndex = Math.max(0, bodyChildIndexRaw);

            entries.push({
                obj,
                playerIdx,
                slot,
                paintMode,
                bodyChildIndex,
                idleStops: this._buildVsScoreStops(idleColor1, idleColor2),
                activeStops: this._buildVsScoreStops(activeColor1, activeColor2)
            });
        }

        this._vsScorePointObjs = entries;
        this._vsScoreUiDirty = true;
        this._vsScoreUiLastKey = '';
    },

    _updateVsScoreUi(force = false) {
        const scoreLayoutActive = this._isVersusScoreLayoutActive();
        if (!this._versusMode && !scoreLayoutActive) return;
        if (!Array.isArray(this._vsScorePointObjs)) {
            this._cacheVsScorePoints();
        }

        const entries = this._vsScorePointObjs || [];
        if (!entries.length) {
            this._vsScoreUiDirty = false;
            this._vsScoreUiLastKey = '';
            return;
        }

        const s0 = Math.max(0, Math.floor(this._vs?.scores?.[0] ?? this._vsPersistentScores?.[0] ?? 0));
        const s1 = Math.max(0, Math.floor(this._vs?.scores?.[1] ?? this._vsPersistentScores?.[1] ?? 0));
        const key = `${s0}|${s1}|${entries.length}`;
        if (!force && !this._vsScoreUiDirty && key === this._vsScoreUiLastKey) return;

        let changed = false;
        for (const entry of entries) {
            const obj = entry.obj;
            if (!obj) continue;
            const isActive = (entry.playerIdx === 0 ? s0 : s1) >= entry.slot;
            const stops = isActive ? entry.activeStops : entry.idleStops;
            // Keep bodyChild mode deterministic: do not fallback to wholeAsset when
            // shape metadata is temporarily unavailable in Play.
            const useBodyChild = entry.paintMode === 'bodyChild';
            const styleKey = `${isActive ? 'A' : 'I'}|${useBodyChild ? `C${entry.bodyChildIndex}` : 'W'}|${stops.map(s => `${s.color}:${s.alpha}:${s.pos}`).join(';')}`;
            if (obj._vsScoreStyleKey === styleKey) continue;

            obj._vsScoreStyleKey = styleKey;
            if (useBodyChild) {
                const childKey = String(entry.bodyChildIndex);
                obj.instanceCompositeFillStops = { [childKey]: stops.map(s => ({ pos: s.pos, color: s.color, alpha: s.alpha })) };
                delete obj.instanceFillType;
                delete obj.instanceFillStops;
            } else {
                obj.instanceFillType = stops.length > 1 ? 'linear' : 'solid';
                obj.instanceFillStops = stops.map(s => ({ pos: s.pos, color: s.color, alpha: s.alpha }));
                delete obj.instanceCompositeFillStops;
            }
            RCHIPL.Scene?._regenerateInstanceAsset?.(obj);
            changed = true;
        }

        if (changed) {
            RCHIPL.Scene?.invalidateLayerCaches?.();
        }
        this._vsScoreUiLastKey = key;
        this._vsScoreUiDirty = false;
    },


    // ═══════════════════════════════════════════════════════════════════
    // ═══ 2P VERSUS MODE ═══════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════

    _shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
    },

    _createVsPlayerState() {
        return {
            spawnerObj: null,
            spawnerConfig: null,
            launcherPhase: 0,
            launcherAngleDeg: -90,
            launcherFrozenAngleDeg: null,
            launcherCharge: 0,
            launcherIsCharging: false,
            pendingBomb: null,
            activeBomb: null,
            bombsRemaining: 0,
            pendingBombSpawning: false,
            pendingBombTimeout: null,
            nextBombTimeout: null,
            introBombTimeout: null,
            justExploded: false,
            isHolding: false,
            kingBlob: null,
            teamBlobs: [],
            _touchWasActive: false,
        };
    },

    _initVersusMatch() {
        const gs = RCHIPL._projectData?.gameStructure;
        const container = gs?.containers?.find(c => c.name === '2PLAYER');
        const rawLayouts = container?.layouts || [];
        const allLayouts = rawLayouts.filter((layoutId) => {
            const family = RCHIPL.Layouts?._all?.[layoutId]?.family;
            // Keep only gameplay rounds in the random pool.
            return family === '2joueurs' || !family;
        });
        const playableLayouts = allLayouts.length > 0 ? allLayouts : rawLayouts;
        const p0 = Math.max(0, Math.floor(Number(this._vsPersistentScores?.[0]) || 0));
        const p1 = Math.max(0, Math.floor(Number(this._vsPersistentScores?.[1]) || 0));

        this._vs = {
            scores: [p0, p1],
            scoreToWin: 5,
            roundActive: false,
            goalScoredBy: -1,
            goalFreezeTimer: 0,
            levelPool: this._shuffleArray([...playableLayouts]),
            levelPoolAll: [...playableLayouts],
            winner: -1,
            awaitingScoreScreen: false,
            players: [this._createVsPlayerState(), this._createVsPlayerState()]
        };
        this._clearVsScoreUiCache();
        this._markVsScoreUiDirty();
        
    },

    _initVersusLevel() {
        const vs = this._vs;
        if (!vs) return;

        vs.roundActive = true;
        vs.goalScoredBy = -1;
        vs.goalFreezeTimer = 0;

        // Reset player state for new round (preserve scores)
        for (const p of vs.players) {
            p.spawnerObj = null;
            p.spawnerConfig = null;
            p.launcherPhase = 0;
            p.launcherAngleDeg = -90;
            p.launcherFrozenAngleDeg = null;
            p.launcherCharge = 0;
            p.launcherIsCharging = false;
            p.pendingBomb = null;
            p.activeBomb = null;
            p.pendingBombSpawning = false;
            p.justExploded = false;
            p.isHolding = false;
            p.kingBlob = null;
            p.teamBlobs = [];
            p._touchWasActive = false;
        }

        // Find spawners (P1/P2) and king markers (K1/K2) by family + player prop
        const allSpawners = RCHIPL.Scene?.getByFamily?.('bombSpawner') || [];
        const kingMarkers = []; // { pIdx, x, y }

        for (const obj of allSpawners) {
            const props = RCHIPL.FamilyProps?.getAll?.(obj) || {};
            const tag = String(props.player || 'P1').toUpperCase().trim();

            if (tag === 'P1' || tag === 'P2') {
                // Bomb spawner
                const pIdx = tag === 'P2' ? 1 : 0;
                const p = vs.players[pIdx];
                p.spawnerObj = obj;

                // Build config (reuse existing 1P pattern)
                const cfg = {
                    x: 0, y: 0,
                    angleMin: -135, angleMax: -45,
                    speedSin: 1.2, forceMax: 34, speedForce: 20,
                    aimDotScale: 1.2, aimHeadScale: 1.5
                };
                this._applyBombSpawnerPropsToConfig(obj, cfg);
                p.spawnerConfig = cfg;

                // Hide spawner in play mode (same as 1P, line ~3617)
                obj.visible = false;
                if (obj._physicsBody) {
                    obj._physicsBody.isSensor = true;
                    if (obj._physicsBody.collisionFilter) {
                        obj._physicsBody.collisionFilter.mask = 0;
                    }
                }
            } else if (tag === 'K1' || tag === 'K2') {
                // King spawn marker — auto-create softbody king here
                const pIdx = tag === 'K2' ? 1 : 0;
                const kx = obj.x || 0;
                const ky = obj.y || 0;
                const spawnLayer = obj.layer || 'Main';

                // Hide marker
                obj.visible = false;
                if (obj._physicsBody) {
                    obj._physicsBody.isSensor = true;
                    if (obj._physicsBody.collisionFilter) {
                        obj._physicsBody.collisionFilter.mask = 0;
                    }
                }

                // Spawn king softbody (same pattern as 1P bomb creation)
                const kingScaleX = 1.3;
                const kingScaleY = 1.3;
                const kingObj = {
                    id: `vs_king_p${pIdx}_` + Date.now(),
                    type: 'softbody',
                    template: 'softbody_blob_01',
                    layer: spawnLayer,
                    x: kx,
                    y: ky,
                    scaleX: kingScaleX,
                    scaleY: kingScaleY,
                    rotation: 0,
                    anchorX: 0.5,
                    anchorY: 0.5,
                    width: 100,
                    height: 100,
                    selectable: false,
                    visible: true,
                    isSticky: false,
                    isProjectile: false,
                };
                RCHIPL.Scene.objects.push(kingObj);

                const kingSb = RCHIPL.SoftBody.create('softbody_blob_01', kx, ky, {
                    scaleX: kingScaleX,
                    scaleY: kingScaleY,
                    rotation: 0
                });
                if (kingSb) {
                    kingObj._softbodyInstance = kingSb;
                    kingSb._sceneObj = kingObj;
                    kingSb._isVsKing = true;
                    kingSb._vsPlayerIdx = pIdx;

                    // Apply blob skin if defined
                    const currentLayoutName = RCHIPL.Layouts?.getCurrentId?.();
                    const currentLayout = currentLayoutName ? RCHIPL.Layouts._all?.[currentLayoutName] : null;
                    const layoutSkin = currentLayout?.blobSkin;
                    const blobColors = this._getEffectiveBlobSkinColors(currentLayoutName, currentLayout);
                    if (layoutSkin && RCHIPL.BlobSkins) {
                        RCHIPL.BlobSkins.apply(kingSb, layoutSkin);
                    }
                    if (RCHIPL.BlobSkins?.overrideColors) {
                        RCHIPL.BlobSkins.overrideColors(kingSb,
                            blobColors.bodyColor, blobColors.gradientColor);
                    }

                    // Zero velocity so it sits still initially
                    const verts = kingSb.envelopes?.[0]?.vertices;
                    if (verts) {
                        for (const v of verts) { v.ox = v.x; v.oy = v.y; }
                    }

                    const kingBlob = {
                        softbody: kingSb,
                        sceneObj: kingObj,
                        saved: false,
                        pinned: true,
                        settled: true,
                        activated: false,
                        _tutorialHintTouched: false,
                        _isVersusKing: true,
                        _versusPlayerIdx: pIdx,
                        _versusFallen: false,
                    };
                    this.targetBlobs.push(kingBlob);
                    vs.players[pIdx].teamBlobs.push(kingBlob);
                    if (!vs.players[pIdx].kingBlob) {
                        // Legacy alias kept for compatibility with old debug/UI expectations.
                        vs.players[pIdx].kingBlob = kingBlob;
                    }
                }
            }
        }

        // 2P: unlimited bombs
        vs.players[0].bombsRemaining = Infinity;
        vs.players[1].bombsRemaining = Infinity;

        // Hide goal assets at start (like superYess)
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        for (const obj of allObjs) {
            if (obj.asset === 'goalP1' || obj.asset === 'goalP2') {
                obj._origScaleX = obj._origScaleX || obj.scaleX || 1;
                obj._origScaleY = obj._origScaleY || obj.scaleY || 1;
                obj._origY = obj._origY || obj.y;
                obj.visible = false;
            }
        }

        

        // Guard: abort if config is incomplete
        const hasP1 = vs.players[0].spawnerObj && vs.players[0].teamBlobs.length > 0;
        const hasP2 = vs.players[1].spawnerObj && vs.players[1].teamBlobs.length > 0;
        if (!hasP1 || !hasP2) {
            
            vs.roundActive = false;
            return;
        }

        this._cacheVsScorePoints();
        this._updateVsScoreUi(true);

        // Schedule first pending bombs for both players shortly after init
        for (let i = 0; i < 2; i++) {
            const pIdx = i;
            const p = vs.players[pIdx];
            if (!p.spawnerObj) continue;
            p.introBombTimeout = setTimeout(() => {
                p.introBombTimeout = null;
                if (RCHIPL.Editor?.isEditMode()) return;
                if (this.state !== 'PLAYING' || !vs.roundActive) return;
                this._createVsPlayerBomb(pIdx);
            }, 100);
        }
    },


    // ─── 2P INPUT SPLIT ───

    _getVersusInputForPlayer(pIdx) {
        const I = RCHIPL.Input;
        const screenCenterX = window.innerWidth / 2;

        // Keyboard: P1 = Space/KeyA, P2 = Enter/KeyL
        let kPressed, kDown, kReleased;
        if (pIdx === 0) {
            kPressed = I.keyPressed?.('Space') || I.keyPressed?.('KeyA');
            kDown = I.keyDown?.('Space') || I.keyDown?.('KeyA');
            kReleased = I.keyReleased?.('Space') || I.keyReleased?.('KeyA');
        } else {
            kPressed = I.keyPressed?.('Enter') || I.keyPressed?.('KeyL');
            kDown = I.keyDown?.('Enter') || I.keyDown?.('KeyL');
            kReleased = I.keyReleased?.('Enter') || I.keyReleased?.('KeyL');
        }

        // Touch: compare rawTouches clientX against screen center
        const rawTouches = this._rawTouches;
        let touchActive = false;
        for (let t = 0; t < rawTouches.length; t++) {
            const clientX = rawTouches[t].clientX;
            if ((pIdx === 0 && clientX < screenCenterX) || (pIdx === 1 && clientX >= screenCenterX)) {
                touchActive = true;
                break;
            }
        }

        const wasActive = this._vs?.players?.[pIdx]?._touchWasActive || false;
        const touchStarted = touchActive && !wasActive;
        const touchEnded = !touchActive && wasActive;
        if (this._vs?.players?.[pIdx]) {
            this._vs.players[pIdx]._touchWasActive = touchActive;
        }

        return {
            pressed: kPressed || touchStarted,
            released: kReleased || touchEnded,
            holding: kDown || touchActive,
        };
    },


    // ─── 2P SPAWNER INPUT ───

    _handleVersusInput(dt, isPostGameLocked) {
        const vs = this._vs;
        if (!vs || !vs.roundActive) return;

        for (let pIdx = 0; pIdx < 2; pIdx++) {
            const p = vs.players[pIdx];
            if (!p.spawnerObj || !p.spawnerConfig) continue;

            const cfg = p.spawnerConfig;
            const input = isPostGameLocked
                ? { pressed: false, released: false, holding: false }
                : this._getVersusInputForPlayer(pIdx);

            // Follow spawner position
            p.aimX = p.spawnerObj.x ?? cfg.x;
            p.aimY = p.spawnerObj.y ?? cfg.y;

            // Angle oscillation (only while not charging)
            if (!p.launcherIsCharging) {
                p.launcherPhase += dt * Math.max(0.1, cfg.speedSin) * Math.PI * 2;
                const osc01 = 0.5 + 0.5 * Math.sin(p.launcherPhase);
                p.launcherAngleDeg = cfg.angleMin + (cfg.angleMax - cfg.angleMin) * osc01;
            }

            // EXPLODE active bomb
            if (input.pressed && p.activeBomb) {
                const exploded = this._explodeVsPlayerBomb(pIdx);
                if (exploded) p.justExploded = true;
            }

            // Start charge (skip if we just exploded on this same press)
            if (input.pressed && p.pendingBomb && !p.activeBomb && !p.launcherIsCharging && !p.justExploded) {
                p.launcherIsCharging = true;
                p.launcherFrozenAngleDeg = p.launcherAngleDeg;
                p.launcherCharge = 0;
            }

            // Charge force while holding
            if (input.holding && p.launcherIsCharging && p.pendingBomb && !p.activeBomb) {
                p.launcherCharge = Math.min(
                    cfg.forceMax,
                    p.launcherCharge + Math.max(0, cfg.speedForce) * dt
                );
            }

            // RELEASE: launch with frozen angle + charged force
            if (input.released && p.launcherIsCharging && p.pendingBomb && !p.activeBomb && !p.justExploded) {
                const launchAngleDeg = p.launcherFrozenAngleDeg ?? p.launcherAngleDeg;
                // Minimum force on instant tap (prevents zero-velocity drop)
                const launchForce = Math.max(p.launcherCharge, cfg.forceMax * 0.15);
                this._releaseVsPlayerBomb(pIdx, { angleDeg: launchAngleDeg, force: launchForce });
            }

            // Reset launcher state on release
            if (input.released || p.activeBomb || !p.pendingBomb) {
                p.launcherIsCharging = false;
                p.launcherFrozenAngleDeg = null;
                p.launcherCharge = 0;
            }
            if (input.released) p.justExploded = false;

            p.isHolding = p.launcherIsCharging && p.pendingBomb && !p.activeBomb;
        }
    },


    // ─── 2P BOMB LIFECYCLE ───

    _createVsPlayerBomb(pIdx) {
        const vs = this._vs;
        if (!vs || !vs.roundActive) return;
        if (this.state !== 'PLAYING') return;
        if (RCHIPL.Editor?.isEditMode?.()) return;

        const p = vs.players[pIdx];
        if (p.pendingBomb) return;
        if (p.pendingBombSpawning) return;
        if (p.bombsRemaining <= 0) return;
        if (!RCHIPL.SoftBody?._initialized) return;
        if (!p.spawnerObj) return;

        const x = p.spawnerObj.x ?? 0;
        const y = p.spawnerObj.y ?? 0;

        p.bombsRemaining--;
        this._emitBombSpawnEventWithFallback(x, y, p.bombsRemaining);

        // Delay bomb creation (same as 1P)
        p.pendingBombSpawning = true;
        if (p.pendingBombTimeout) clearTimeout(p.pendingBombTimeout);
        p.pendingBombTimeout = setTimeout(() => {
            p.pendingBombTimeout = null;
            p.pendingBombSpawning = false;
            if (RCHIPL.Editor?.isEditMode()) return;
            if (this.state !== 'PLAYING') return;
            if (!vs.roundActive) return;
            // Use live spawner coordinates at creation time (avoid side snap after delayed spawn)
            const liveX = p.spawnerObj?.x ?? x;
            const liveY = p.spawnerObj?.y ?? y;
            this._createVsPlayerBombDelayed(pIdx, liveX, liveY);
        }, 100);
    },

    _createVsPlayerBombDelayed(pIdx, x, y) {
        const vs = this._vs;
        if (!vs) return;
        if (this.state !== 'PLAYING') return;
        if (RCHIPL.Editor?.isEditMode?.()) return;

        const p = vs.players[pIdx];
        if (p.pendingBomb) return;

        const spawnLayer = p.spawnerObj?.layer || 'Main';

        const blobObj = {
            id: `vs_bomb_p${pIdx}_` + Date.now(),
            type: 'softbody',
            template: 'softbody_blob_01',
            layer: spawnLayer,
            x: x,
            y: y,
            scaleX: 1,
            scaleY: 1,
            rotation: 0,
            anchorX: 0.5,
            anchorY: 0.5,
            width: 100,
            height: 100,
            selectable: false,
            visible: true,
            isSticky: false,
            team: 'red',
            isProjectile: true,
            isPending: true,
        };

        // Same pattern as 1P: push to scene objects, then create softbody
        this._applyPendingPreviewDepth(blobObj, spawnLayer);
        RCHIPL.Scene.objects.push(blobObj);

        const sb = RCHIPL.SoftBody.create('softbody_blob_01', x, y, {
            scaleX: 1,
            scaleY: 1,
            rotation: 0
        });
        if (!sb) return;

        blobObj._softbodyInstance = sb;
        sb._sceneObj = blobObj;
        sb._isPending = true;
        sb._isBomb = true;
        sb._isVsBomb = true;
        sb._vsPlayerIdx = pIdx;

        // Apply bomb skin if defined in layout
        const currentLayoutName = RCHIPL.Layouts?.getCurrentId?.();
        const currentLayout = currentLayoutName ? RCHIPL.Layouts._all?.[currentLayoutName] : null;
        const bombSkin = currentLayout?.bombSkin;
        const bombColors = this._getBombSkinColorOverrides(currentLayoutName, currentLayout);
        if (bombSkin && RCHIPL.BlobSkins?.applyBomb) {
            RCHIPL.BlobSkins.applyBomb(sb, bombSkin);
            this._applyBlueLightBombEyes(sb);
            this._applyBombMouthYOffset(sb, 5);
        }
        if (RCHIPL.BlobSkins?.overrideColors && (bombColors.bombBodyColor || bombColors.bombGradientColor)) {
            RCHIPL.BlobSkins.overrideColors(sb,
                bombColors.bombBodyColor, bombColors.bombGradientColor);
        }
        this._initBombReadyBlinkState(sb, bombColors);

        // Calculate restOffsets at full size with 8px extend (identical to 1P)
        const verts = sb.envelopes?.[0]?.vertices;
        let cx2 = 0, cy2 = 0;
        if (verts) {
            for (const v of verts) { cx2 += v.x; cy2 += v.y; }
            cx2 /= verts.length;
            cy2 /= verts.length;
        }
        const extend = 8;
        const restOffsets = verts ? verts.map(v => {
            const ddx = v.x - cx2;
            const ddy = v.y - cy2;
            const dist = Math.sqrt(ddx * ddx + ddy * ddy);
            const scale = dist > 0 ? (dist + extend) / dist : 1;
            return { dx: ddx * scale, dy: ddy * scale };
        }) : [];
        const restMaxDy = restOffsets.reduce((m, r) => Math.max(m, r.dy), 0);

        // Scale vertices down to tiny for spawn pop-in animation (identical to 1P)
        if (verts) {
            for (const v of verts) {
                v.x = cx2 + (v.x - cx2) * 0.01;
                v.y = cy2 + (v.y - cy2) * 0.01;
                v.ox = v.x;
                v.oy = v.y;
            }
        }

        p.pendingBomb = {
            obj: blobObj,
            softbody: sb,
            restOffsets: restOffsets,
            restMaxDy: restMaxDy,
            animTime: 0,
            spawnAnimTime: 0,
            spawnAnimDone: false,
            spawnCreatedAt: performance.now(),
            spawnX: x,
            spawnY: y,
        };

        // Snap immediately to live launcher position to avoid 1-frame side offset.
        this._updateVsPlayerPendingBomb(pIdx);
    },

    _releaseVsPlayerBomb(pIdx, launchOpts) {
        const vs = this._vs;
        if (!vs) return;
        const p = vs.players[pIdx];
        if (!p.pendingBomb) return;
        if (p.activeBomb) return;

        // Trigger first gameplay on first bomb throw (Poki SDK)
        RCHIPL.Platform.triggerFirstGameplay();
        this._unlockBackgroundMusicFromInput();
        this._trackPokiLaunch();

        const sb = p.pendingBomb.softbody;
        const verts = sb.envelopes?.[0]?.vertices;
        if (!verts) return;
        const restOffsets = p.pendingBomb.restOffsets;

        // Use natural center (spawner position), not the squashed center.
        // Same fix as 1P: base-anchor shift is visual-only during charge.
        const cx = p.spawnerObj?.x ?? p.pendingBomb.spawnX ?? 0;
        const cy = p.spawnerObj?.y ?? p.pendingBomb.spawnY ?? 0;

        // Reset to rest shape
        for (let i = 0; i < verts.length; i++) {
            if (restOffsets[i]) {
                verts[i].x = cx + restOffsets[i].dx;
                verts[i].y = cy + restOffsets[i].dy;
                verts[i].ox = verts[i].x;
                verts[i].oy = verts[i].y;
            }
        }

        sb._squashX = undefined;
        sb._squashY = undefined;
        sb._isPending = false;
        p.pendingBomb.obj.isPending = false;

        p.activeBomb = p.pendingBomb;
        p.pendingBomb = null;

        // Restore depth
        this._restorePendingPreviewDepth?.(p.activeBomb?.obj);

        // Launch impulse
        if (launchOpts && verts.length) {
            const angleDeg = parseFloat(launchOpts.angleDeg);
            const launchForce = parseFloat(launchOpts.force);
            if (Number.isFinite(angleDeg) && Number.isFinite(launchForce) && launchForce > 0) {
                const rad = angleDeg * Math.PI / 180;
                const vx = Math.cos(rad) * launchForce;
                const vy = Math.sin(rad) * launchForce;
                for (const v of verts) {
                    v.ox = v.x - vx;
                    v.oy = v.y - vy;
                }
            }
        }

        // Emit drop event
        let dropX = cx, dropY = cy;
        RCHIPL.Events.emit('OnBombDrop', { x: dropX, y: dropY });
    },

    _explodeVsPlayerBomb(pIdx) {
        const vs = this._vs;
        if (!vs) return false;
        const p = vs.players[pIdx];
        if (!p.activeBomb) return false;
        if (!vs.roundActive) return false;
        if (!this._canExplodeBombNow(p.activeBomb, p.spawnerConfig)) return false;

        const bomb = p.activeBomb;

        // Get position from softbody center
        const center = this._getBombCenter(bomb);
        const bx = center.x;
        const by = center.y;

        const explosionRadius = this.explosionRadius;
        const explosionForce = this.explosionForce;
        RCHIPL.Events.emit('OnBombExplode', { x: bx, y: by });

        // GPE systems
        if (RCHIPL.Voronoi) RCHIPL.Voronoi.explode(bx, by, explosionRadius, explosionForce / 5);
        if (RCHIPL.Suspended) RCHIPL.Suspended.checkExplosion(bx, by, explosionRadius, explosionForce * 2.5);
        if (RCHIPL.Bridge) RCHIPL.Bridge.checkExplosion(bx, by, explosionRadius);
        if (RCHIPL.Pivot) RCHIPL.Pivot.checkExplosion(bx, by, explosionRadius, explosionForce);
        if (RCHIPL.Sticky) RCHIPL.Sticky.checkExplosion(bx, by, explosionRadius);

        // Puff effect
        this._startPuffEffect(bomb, bx, by, explosionRadius, explosionForce);

        p.activeBomb = null;

        // Camera shake is handled by shared _startPuffEffect → _applyPuffForce → _startCameraShake
        // No zoom punch (disabled in 1P, same here)

        // Next bomb or check draw
        if (p.bombsRemaining > 0) {
            if (p.nextBombTimeout) clearTimeout(p.nextBombTimeout);
            p.nextBombTimeout = setTimeout(() => {
                p.nextBombTimeout = null;
                if (RCHIPL.Editor?.isEditMode()) return;
                if (this.state !== 'PLAYING') return;
                if (!vs.roundActive) return;
                this._createVsPlayerBomb(pIdx);
            }, 500);
        } else {
            // Check if BOTH players have no bombs and no active bombs → draw round
            this._checkVersusDrawRound();
        }
        return true;
    },

    _updateVsPlayerPendingBomb(pIdx) {
        const vs = this._vs;
        if (!vs) return;
        const p = vs.players[pIdx];
        if (!p.pendingBomb || !p.spawnerObj) return;

        const sb = p.pendingBomb.softbody;
        const verts = sb?.envelopes?.[0]?.vertices;
        if (!verts) return;
        const restOffsets = p.pendingBomb.restOffsets;

        const targetX = p.spawnerObj.x ?? p.spawnerConfig?.x ?? 0;
        const targetY = p.spawnerObj.y ?? p.spawnerConfig?.y ?? 0;

        const dt = RCHIPL.Game.dt || 1/60;

        // === SPAWN POP-IN ANIMATION (easeOutBack) — identical to 1P ===
        let spawnScale = 1;
        if (!p.pendingBomb.spawnAnimDone) {
            const spawnDuration = 0.35;
            const createdAt = p.pendingBomb.spawnCreatedAt || performance.now();
            const elapsed = Math.max(0, (performance.now() - createdAt) / 1000);
            p.pendingBomb.spawnAnimTime = elapsed;
            const t = Math.min(1, elapsed / spawnDuration);
            const c1 = 1.70158;
            const c3 = c1 + 1;
            spawnScale = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            if (t >= 1) p.pendingBomb.spawnAnimDone = true;
        }

        // Squash/stretch animation timer (identical to 1P)
        const normalSpeed = 12;
        const slowSpeed = 2.4;
        const speed = p.isHolding ? slowSpeed : normalSpeed;
        p.pendingBomb.animTime += speed * dt;
        const animT = p.pendingBomb.animTime;

        // Idle breathing (identical to 1P)
        const idleWave = Math.sin(animT);
        const idleSquashAmount = 0.035;
        let chargeNorm = 0;
        if (p.spawnerConfig && p.launcherIsCharging) {
            const maxForce = Math.max(1, p.spawnerConfig.forceMax || 1);
            chargeNorm = Math.max(0, Math.min(1, (p.launcherCharge || 0) / maxForce));
        }

        // Fade idle wobble as charge grows (identical to 1P)
        const idleWeight = p.launcherIsCharging ? (1 - chargeNorm) : 1;
        const wobbleX = 1 + idleWave * idleSquashAmount * idleWeight;
        const wobbleY = 1 - idleWave * idleSquashAmount * idleWeight;

        // Charge deformation (identical to 1P)
        const chargeStretchX = 1 + chargeNorm * 0.22;
        const chargeSquashY = 1 - chargeNorm * 0.32;

        const deformX = wobbleX * chargeStretchX;
        const deformY = wobbleY * chargeSquashY;
        const scaleX = spawnScale * deformX;
        const scaleY = spawnScale * deformY;
        // Base-anchored squash (identical to 1P)
        const baseAnchorShiftY = (p.pendingBomb.restMaxDy || 0) * (1 - scaleY);
        const centerY = targetY + baseAnchorShiftY;

        // Store squash for face rendering (identical to 1P)
        sb._squashX = deformX;
        sb._squashY = deformY;

        // Apply position + scale to each vertex (identical to 1P)
        for (let i = 0; i < verts.length; i++) {
            const v = verts[i];
            const rest = restOffsets[i];
            v.x = targetX + rest.dx * scaleX;
            v.y = centerY + rest.dy * scaleY;
            v.ox = v.x;
            v.oy = v.y;
            v.vx = 0;
            v.vy = 0;
        }
    },

    _updateVsPlayerBomb(pIdx) {
        const vs = this._vs;
        if (!vs) return;
        const p = vs.players[pIdx];
        if (!p.activeBomb) return;

        // Sync scene object position from softbody (identical to 1P updateBomb)
        const bomb = p.activeBomb;
        if (bomb.softbody?.envelopes?.[0]?.vertices && bomb.obj) {
            const verts = bomb.softbody.envelopes[0].vertices;
            let cx = 0, cy = 0;
            for (const v of verts) { cx += v.x; cy += v.y; }
            bomb.obj.x = cx / verts.length;
            bomb.obj.y = cy / verts.length;
        }
    },


    // ─── 2P TEAM WATER DETECTION ───

    _checkVersusKingsInWater() {
        const vs = this._vs;
        if (!vs || !vs.roundActive) return;

        const water = this._getPrimaryWaterLiquid();
        if (!water) return;

        const waterTop = water.y - water.height / 2;
        const waterLeft = water.x - water.width / 2;
        const waterRight = water.x + water.width / 2;

        const completedPlayers = [];
        const completionDepth = [0, 0];

        for (let pIdx = 0; pIdx < 2; pIdx++) {
            const team = vs.players[pIdx]?.teamBlobs || [];
            if (!team.length) continue;

            let allInWater = true;
            let hasValidBlob = false;
            let minDepth = Infinity;

            for (const blob of team) {
                const verts = blob?.softbody?.envelopes?.[0]?.vertices;
                if (!verts || verts.length <= 0) {
                    allInWater = false;
                    break;
                }
                hasValidBlob = true;

                let cx = 0;
                let lowestY = -Infinity;
                for (const v of verts) {
                    cx += v.x;
                    if (v.y > lowestY) lowestY = v.y;
                }
                cx /= verts.length;

                const inWater = lowestY > waterTop && cx > waterLeft && cx < waterRight;
                blob._versusInWater = inWater;
                if (!inWater) {
                    allInWater = false;
                    break;
                }
                const depth = lowestY - waterTop;
                if (depth < minDepth) minDepth = depth;
            }

            if (allInWater && hasValidBlob) {
                completedPlayers.push(pIdx);
                completionDepth[pIdx] = Number.isFinite(minDepth) ? minDepth : 0;
            }
        }

        if (completedPlayers.length === 1) {
            this._versusGoal(completedPlayers[0]);
            return;
        }

        if (completedPlayers.length > 1) {
            const pA = completedPlayers[0];
            const pB = completedPlayers[1];
            const delta = completionDepth[pA] - completionDepth[pB];
            // If both teams complete on the same frame, prefer the one deeper in water.
            // If still too close, treat as draw and replay round.
            if (Math.abs(delta) > 0.25) {
                this._versusGoal(delta > 0 ? pA : pB);
                return;
            }

            vs.roundActive = false;
            
            this._clearVersusBombTimers();
            if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
            this._victoryTimeout = setTimeout(() => {
                this._victoryTimeout = null;
                if (RCHIPL.Editor?.isEditMode()) return;
                if (this.state !== 'PLAYING') return;
                this._versusNextRound();
            }, 1200);
        }
    },


    // ─── 2P SCORING + TRANSITIONS ───

    _getVersusScoreLayoutId() {
        const layouts = RCHIPL.Layouts?._all || {};
        const explicit = Object.entries(layouts).find(([, layout]) => layout?.family === '2joueursScore');
        if (explicit) return explicit[0];
        const fallback = Object.keys(layouts).find((id) => /(^|[_-])(?:2p|2joueurs|versus)[_-]?score/i.test(id));
        return fallback || null;
    },

    _scheduleVersusScoreLayoutAdvance(expectedLayoutId = '') {
        const vs = this._vs;
        if (!vs) return;
        if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
        const delayMs = vs.winner >= 0 ? 2300 : 1400;
        this._victoryTimeout = setTimeout(() => {
            this._victoryTimeout = null;
            if (RCHIPL.Editor?.isEditMode()) return;

            const activeLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName || '';
            if (expectedLayoutId && activeLayoutId !== expectedLayoutId) return;

            const currentVs = this._vs;
            if (!currentVs) return;
            if (currentVs.winner >= 0) {
                this._versusMode = false;
                this._vs = null;
                this._vsPersistentScores = [0, 0];
                this._clearVsScoreUiCache();
                const menuLayoutId = this._getMenuLayoutId();
                if (menuLayoutId) {
                    RCHIPL.Layouts.goTo(menuLayoutId, { showAd: false });
                }
                return;
            }
            this._versusNextRound();
        }, delayMs);
    },

    _goToVersusScoreLayoutOrContinue() {
        const vs = this._vs;
        if (!vs) return;

        const scoreLayoutId = this._getVersusScoreLayoutId();
        if (scoreLayoutId) {
            RCHIPL.Layouts.goTo(scoreLayoutId, { showAd: false }).catch(() => {
                if (vs.winner >= 0) this._versusMatchEnd(vs.winner);
                else this._versusNextRound();
            });
            return;
        }

        // Fallback when no score layout exists yet.
        if (vs.winner >= 0) this._versusMatchEnd(vs.winner);
        else this._versusNextRound();
    },

    _clearVersusBombTimers() {
        const vs = this._vs;
        if (!vs?.players) return;
        for (const p of vs.players) {
            if (p.introBombTimeout) { clearTimeout(p.introBombTimeout); p.introBombTimeout = null; }
            if (p.pendingBombTimeout) { clearTimeout(p.pendingBombTimeout); p.pendingBombTimeout = null; }
            if (p.nextBombTimeout) { clearTimeout(p.nextBombTimeout); p.nextBombTimeout = null; }
        }
    },

    _versusGoal(scorerIdx) {
        const vs = this._vs;
        if (!vs) return;
        if (scorerIdx !== 0 && scorerIdx !== 1) return;

        vs.roundActive = false;
        vs.goalScoredBy = scorerIdx;
        vs.scores[scorerIdx]++;
        this._vsPersistentScores = [vs.scores[0], vs.scores[1]];
        vs.awaitingScoreScreen = true;
        this._markVsScoreUiDirty();
        this._updateVsScoreUi(true);

        

        // Clear all bomb timers for both players
        this._clearVersusBombTimers();

        // Show goal asset (like YES)
        this._showVersusGoal(scorerIdx);

        // Confetti
        if (RCHIPL.FX?.spawnConfetti) {
            RCHIPL.FX.spawnConfetti({ count: 50, duration: 3 });
        }

        // Camera flash
        this._victoryFlash = 0.7;

        // Mark match winner if this point closes the BO5.
        vs.winner = vs.scores[scorerIdx] >= vs.scoreToWin ? scorerIdx : -1;

        // After goal feedback, go to score layout (or fallback to direct continue).
        if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
        this._victoryTimeout = setTimeout(() => {
            this._victoryTimeout = null;
            if (RCHIPL.Editor?.isEditMode()) return;
            if (this.state !== 'PLAYING') return;
            this._goToVersusScoreLayoutOrContinue();
        }, 1250);
    },

    _showVersusGoal(scorerIdx) {
        const assetName = scorerIdx === 0 ? 'goalP1' : 'goalP2';
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        const goalObjs = allObjs.filter(o => o.asset === assetName);
        if (!goalObjs.length) {
            
            return;
        }

        const obj = goalObjs[0];
        obj._origScaleX = obj._origScaleX || obj.scaleX || 1;
        obj._origScaleY = obj._origScaleY || obj.scaleY || 1;
        obj._origY = obj._origY || obj.y;

        // Pre-render with stroke+shadow (reuse YES pipeline)
        this._victoryYesCache = this._prerenderVictoryYes(obj);

        // Hide original — cached version is drawn by _renderVictoryYes
        goalObjs.forEach(o => { o.visible = false; });

        this._victoryYes = {
            objs: goalObjs,
            startTime: performance.now(),
            baseX: obj.x,
            baseY: obj._origY,
            x: obj.x,
            y: obj._origY,
            vy: 0,
            scale: 0,
            squash: 0
        };
    },

    _versusNextRound() {
        const vs = this._vs;
        if (!vs) return;

        // Pick next random level from pool
        if (vs.levelPool.length === 0) {
            vs.levelPool = this._shuffleArray([...vs.levelPoolAll]);
        }

        const nextLayoutId = vs.levelPool.pop();
        if (nextLayoutId) {
            // Reset per-player refs (but NOT scores)
            for (const p of vs.players) {
                p.pendingBomb = null;
                p.activeBomb = null;
                p.spawnerObj = null;
                p.spawnerConfig = null;
                p.kingBlob = null;
                p.teamBlobs = [];
            }
            vs.awaitingScoreScreen = false;
            RCHIPL.Layouts.goTo(nextLayoutId, { showAd: false });
        }
    },

    _versusMatchEnd(winnerIdx) {
        const vs = this._vs;
        if (!vs) return;

        vs.winner = winnerIdx;
        this.levelComplete = true;

        

        // Return to menu after 5s (user can handle victory UI display via vs.winner)
        if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
            this._victoryTimeout = setTimeout(() => {
                this._victoryTimeout = null;
                this._versusMode = false;
                this._vs = null;
                this._vsPersistentScores = [0, 0];
                this._clearVsScoreUiCache();
                const menuLayoutId = this._getMenuLayoutId();
                if (menuLayoutId) {
                    RCHIPL.Layouts.goTo(menuLayoutId, { showAd: false });
                }
        }, 5000);
    },

    _checkVersusDrawRound() {
        const vs = this._vs;
        if (!vs || !vs.roundActive) return;

        // Check if both players have 0 bombs remaining AND no active bombs
        const p0 = vs.players[0];
        const p1 = vs.players[1];
        if (p0.bombsRemaining > 0 || p1.bombsRemaining > 0) return;
        if (p0.activeBomb || p1.activeBomb) return;
        if (p0.pendingBomb || p1.pendingBomb) return;
        if (p0.pendingBombSpawning || p1.pendingBombSpawning) return;

        // All bombs exhausted — start draw timer
        
        if (this._victoryTimeout) clearTimeout(this._victoryTimeout);
        this._victoryTimeout = setTimeout(() => {
            this._victoryTimeout = null;
            if (RCHIPL.Editor?.isEditMode()) return;
            if (this.state !== 'PLAYING') return;
            if (!vs.roundActive) return;  // A king fell during the wait
            
            this._versusNextRound();
        }, 3000);
    },


    // ─── 2P AIM INDICATORS ───

    _drawVersusAimIndicators(ctx) {
        const vs = this._vs;
        if (!vs) return;

        const colors = [
            { r: 79, g: 195, b: 247 },   // P1 = cyan/blue
            { r: 255, g: 112, b: 67 },    // P2 = orange/red
        ];

        for (let pIdx = 0; pIdx < 2; pIdx++) {
            const p = vs.players[pIdx];
            if (!p.spawnerObj || !p.spawnerConfig) continue;
            if (!p.pendingBomb) continue;

            const cfg = p.spawnerConfig;
            const color = colors[pIdx];
            const fallbackX = p.spawnerObj.x ?? cfg.x;
            const fallbackY = p.spawnerObj.y ?? cfg.y;
            // Use natural center (spawner position) — same fix as 1P aim indicator.
            const x = fallbackX;
            const y = fallbackY;

            const angleDeg = p.launcherIsCharging
                ? (p.launcherFrozenAngleDeg ?? p.launcherAngleDeg)
                : p.launcherAngleDeg;
            const angleRad = angleDeg * Math.PI / 180;
            const dx = Math.cos(angleRad);
            const dy = Math.sin(angleRad);

            const maxForce = Math.max(1, cfg.forceMax || 1);
            const chargeNorm = Math.max(0, Math.min(1, (p.launcherCharge || 0) / maxForce));
            const shaftLen = 80 + chargeNorm * 170;
            const startOffset = 65;
            const dotScaleValue = Number(cfg.aimDotScale);
            const headScaleValue = Number(cfg.aimHeadScale);
            const dotScale = Math.max(0.4, Number.isFinite(dotScaleValue) ? dotScaleValue : 1.2);
            const headScale = Math.max(0.4, Number.isFinite(headScaleValue) ? headScaleValue : 1.5);
            const headLen = 22 * headScale;
            const headHalfWidth = 10 * headScale;
            const startX = x + dx * startOffset;
            const startY = y + dy * startOffset;
            const dotsEndX = startX + dx * shaftLen;
            const dotsEndY = startY + dy * shaftLen;
            // Arrow head base at center of last dot
            const headBaseX = dotsEndX;
            const headBaseY = dotsEndY;
            const tipX = headBaseX + dx * headLen;
            const tipY = headBaseY + dy * headLen;

            ctx.save();

            // Dotted shaft (identical to 1P)
            const dotCount = 8;
            for (let i = 0; i < dotCount; i++) {
                const t = i / (dotCount - 1);
                const px = startX + (dotsEndX - startX) * t;
                const py = startY + (dotsEndY - startY) * t;
                const r = (5 + t * 3) * dotScale;
                const a = 0.25 + t * 0.55;
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${a})`;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Arrow head (identical to 1P)
            const nx = -dy;
            const ny = dx;
            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.95)`;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(headBaseX + nx * headHalfWidth, headBaseY + ny * headHalfWidth);
            ctx.lineTo(headBaseX - nx * headHalfWidth, headBaseY - ny * headHalfWidth);
            ctx.closePath();
            ctx.fill();

            // Charging glow at max tension (identical to 1P)
            if (p.launcherIsCharging && chargeNorm > 0.97) {
                const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.02);
                ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${0.35 + pulse * 0.45})`;
                ctx.lineWidth = 6 + pulse * 4;
                ctx.beginPath();
                ctx.arc(x, y, 58, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }
    },


    // ─── 2P CLEANUP ───

    _cleanupVsBombs() {
        const vs = this._vs;
        if (!vs) return;

        for (const p of vs.players) {
            // Clear timers
            if (p.introBombTimeout) { clearTimeout(p.introBombTimeout); p.introBombTimeout = null; }
            if (p.pendingBombTimeout) { clearTimeout(p.pendingBombTimeout); p.pendingBombTimeout = null; }
            if (p.nextBombTimeout) { clearTimeout(p.nextBombTimeout); p.nextBombTimeout = null; }

            // Destroy active bomb
            if (p.activeBomb) {
                if (p.activeBomb.softbody) RCHIPL.SoftBody.destroy(p.activeBomb.softbody);
                if (p.activeBomb.obj) {
                    const idx = RCHIPL.Scene.objects.indexOf(p.activeBomb.obj);
                    if (idx >= 0) RCHIPL.Scene.objects.splice(idx, 1);
                }
            }
            p.activeBomb = null;

            // Destroy pending bomb
            if (p.pendingBomb) {
                if (p.pendingBomb.softbody) RCHIPL.SoftBody.destroy(p.pendingBomb.softbody);
                if (p.pendingBomb.obj) {
                    const idx = RCHIPL.Scene.objects.indexOf(p.pendingBomb.obj);
                    if (idx >= 0) RCHIPL.Scene.objects.splice(idx, 1);
                }
            }
            p.pendingBomb = null;
            p.pendingBombSpawning = false;
        }
    }
};

    // Stub to prevent errors

// ═══════════════════════════════════════════════════════════════
// SKIN COLLECTION - Gestion des skins débloqués
// ═══════════════════════════════════════════════════════════════
const SkinCollection = {
    // Liste de tous les skins disponibles (IDs)
    ALL_SKINS: [
        'blob_default', 'blob_red', 'blob_blue', 'blob_green', 'blob_yellow',
        'blob_purple', 'blob_orange', 'blob_pink', 'blob_cyan', 'blob_gold',
        'blob_rainbow', 'blob_ghost', 'blob_ninja', 'blob_pirate', 'blob_wizard'
    ],

    owned: ['blob_default'],  // Skins débloqués (default toujours owned)
    selected: 'blob_default', // Skin actif

    // Charger depuis localStorage
    load() {
        const saved = localStorage.getItem('ploptheblob_skins');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                this.owned = data.owned || ['blob_default'];
                this.selected = data.selected || 'blob_default';
                // Valider que selected est bien owned
                if (!this.owned.includes(this.selected)) {
                    this.selected = 'blob_default';
                }
            } catch (e) {
                
            }
        }
        
    },

    // Sauvegarder dans localStorage
    save() {
        localStorage.setItem('ploptheblob_skins', JSON.stringify({
            owned: this.owned,
            selected: this.selected
        }));
    },

    // Débloquer un skin
    unlock(skinId) {
        if (!this.ALL_SKINS.includes(skinId)) {
            
            return false;
        }
        if (this.owned.includes(skinId)) {
            
            return false;
        }
        this.owned.push(skinId);
        this.save();
        
        return true;
    },

    // Sélectionner un skin (doit être owned)
    select(skinId) {
        if (!this.owned.includes(skinId)) {
            
            return false;
        }
        this.selected = skinId;
        this.save();
        
        return true;
    },

    // Retourne un skin random parmi les non-débloqués (pour gachapon)
    getRandomLocked() {
        const locked = this.ALL_SKINS.filter(s => !this.owned.includes(s));
        if (locked.length === 0) {
            
            return null;
        }
        return locked[Math.floor(Math.random() * locked.length)];
    },

    // Stats
    getStats() {
        return {
            total: this.ALL_SKINS.length,
            owned: this.owned.length,
            locked: this.ALL_SKINS.length - this.owned.length
        };
    }
};

// Charger les skins au démarrage
SkinCollection.load();
