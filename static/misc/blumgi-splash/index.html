            if (height) svg = svg.replace(/height=(['"])[^'"]+\1/, `height="${height[2]}"`);

        const registered = RCHIPL.Assets.register(assetName, svg, {
            width: sourceAsset?.width || Math.round((p.w || 100) * (p.scale || 1)),
            height: sourceAsset?.height || Math.round((p.h || 100) * (p.scale || 1)),

        if (!name) return null;

            if (obj?.type !== 'table') continue;
            const tChildren = obj?.params?.children;
            if (!Array.isArray(tChildren)) continue;

            for (const cell of tChildren) {
                const currentAsset = cell?.asset;
                if (!currentAsset || typeof currentAsset !== 'string' || !currentAsset.startsWith('@Cards_')) continue;

                const baseAsset = this._stripMenuRuntimeSuffix(currentAsset);
                const containerName = this._getContainerForCardAsset(baseAsset);
                const prog = containerName ? this._containerProgress?.[containerName] : null;

                // V2 simplified card states:
                // - TO_DO: decor only
                // - DONE: decor + slime + crown
                // "Done" means the whole container is completed.
                const isDone = !!(prog && (prog.total || 0) > 0 && (prog.completed || 0) >= (prog.total || 0));
                const stateKey = `${baseAsset}|${isDone ? 'done' : 'todo'}`;

                let variantName = variantCache.get(stateKey);
                if (!variantName) {
                    variantName = `${baseAsset}__menu_rt_${isDone ? 1 : 0}`;
                    // Always regenerate runtime variants from current logic.
                    if (assets[variantName]) delete assets[variantName];
                    if (lib?.[variantName]) delete lib[variantName];
                    if (pathCache && Object.prototype.hasOwnProperty.call(pathCache, variantName)) delete pathCache[variantName];

                    const sourceData = assets[baseAsset];
                    if (!sourceData || sourceData.type !== 'composite' || !sourceData.params?.children) continue;

                    const sourceChildren = Array.isArray(sourceData.params.children)
                        ? sourceData.params.children
                        : Object.values(sourceData.params.children || {});
                    const childrenByRef = new Map();
                    for (const child of sourceChildren) {
                        if (!child?.ref) continue;
                        childrenByRef.set(child.ref, child);
                    }

                    const nextChildren = sourceChildren
                        .filter(child => !dynamicSet.has(child?.ref))
                        .map(child => JSON.parse(JSON.stringify(child)));

                    if (isDone) {
                        const skin = childrenByRef.get('@Cards_skin');
                        if (skin) nextChildren.push(JSON.parse(JSON.stringify(skin)));
                        const crown = childrenByRef.get('@Cards_crown');
                        if (crown) nextChildren.push(JSON.parse(JSON.stringify(crown)));
                    }

                    nextChildren.sort((a, b) => (a?.zOrder || 0) - (b?.zOrder || 0));
                    const variantData = JSON.parse(JSON.stringify(sourceData));
                    variantData.params = variantData.params || {};
                    variantData.params.children = nextChildren;
                    const baseMeta = RCHIPL.Assets?.get?.(baseAsset);
                    const registered = this._registerCardAssetFromData(variantName, variantData, baseMeta);
                    if (!registered) continue;
                    assets[variantName] = variantData;
                    this._menuRuntimeVariantNames.push(variantName);
                    variantCache.set(stateKey, variantName);
                }

                if (variantName && cell.asset !== variantName) {
                    this._menuRuntimeCellPatches.push({ cell, baseAsset });
                    cell.asset = variantName;
                }
            }
        }
    },

    _restoreMenuRuntimeCardVariants() {
        const assets = RCHIPL._projectData?.assets;
        const lib = RCHIPL.Assets?._library;
        const pathCache = RCHIPL.Assets?._path2DCache;
        const sceneObjects = RCHIPL.Scene?.getAll?.() || [];

        // Defensive cleanup for any stale runtime aliases.
        for (const obj of sceneObjects) {
            if (obj?.type !== 'table') continue;
            const tChildren = obj?.params?.children;
            if (!Array.isArray(tChildren)) continue;
            for (const cell of tChildren) {
                const current = cell?.asset;
                if (!current || typeof current !== 'string') continue;
                if (!current.includes('__menu_rt_')) continue;
                const base = this._stripMenuRuntimeSuffix(current);
                if (base && assets?.[base]) cell.asset = base;
            }
        }

        if (Array.isArray(this._menuRuntimeCellPatches)) {
            for (const patch of this._menuRuntimeCellPatches) {
                if (!patch?.cell || !patch.baseAsset) continue;
                patch.cell.asset = patch.baseAsset;
            }
        }
        this._menuRuntimeCellPatches = null;

        if (Array.isArray(this._menuRuntimeVariantNames)) {
            for (const name of this._menuRuntimeVariantNames) {
                if (!name || typeof name !== 'string') continue;
                if (assets?.[name]) delete assets[name];
                if (lib?.[name]) delete lib[name];
                if (pathCache && Object.prototype.hasOwnProperty.call(pathCache, name)) delete pathCache[name];
            }
        }
        this._menuRuntimeVariantNames = null;
    },

    _bindMenuWorldSelectionHooks() {
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        this._cardToContainer = {};
        containers.forEach((c) => { if (c.card) this._cardToContainer[c.card] = c.name; });

        // Pre-compute progression per container, refreshed every menu entry / menu play relaunch.
        this._rebuildContainerProgressCache();

        this._menuTapEnabledAt = performance.now() + 250;
        this._applyMenuRuntimeCardVariants();

        RCHIPL.Scene._onTableCellTap = (table, idx, child) => {
            if (this.state !== 'MENU') return;
            if (performance.now() < (this._menuTapEnabledAt || 0)) return;
            if (!child?.asset) return;
            const containerName = this._getContainerForCardAsset(child.asset);
            if (containerName) {
                RCHIPL.Events.emit('OnMenuCardTap', { containerName: containerName });
                const resumeLayout = this._getResumeLayoutForContainer(containerName);
                if (resumeLayout) {
                    RCHIPL.Layouts.goTo(resumeLayout);
                } else {
                    RCHIPL.Layouts.startContainer(containerName);
                }
            }
        };

        // Progression visuals are now baked per runtime variant (same child offsets/z-order as source card).
        RCHIPL.Scene._onDrawTableCell = null;

        // No return to menu on container complete — keep advancing through levels
        RCHIPL.Layouts.onContainerComplete(null);
    },

    _unbindMenuWorldSelectionHooks() {
        this._restoreMenuRuntimeCardVariants();
        RCHIPL.Scene._onTableCellTap = null;
        RCHIPL.Scene._onDrawTableCell = null;
        RCHIPL.Layouts.onContainerComplete(null);
        this._cardToContainer = null;
        this._containerProgress = null;
    },

    _getWorldMapLayoutId() {
        const layouts = RCHIPL.Layouts?._all || {};
        if (layouts.WorldMap?.family === 'worldMap') return 'WorldMap';
        const firstMap = Object.entries(layouts).find(([, l]) => l?.family === 'worldMap');
        return firstMap ? firstMap[0] : null;
    },

    _getFinishRewardLayoutId() {
        const layouts = RCHIPL.Layouts?._all || {};
        if (layouts.Finish) return 'Finish';
        const fallback = Object.entries(layouts).find(([name]) => String(name || '').trim().toLowerCase() === 'finish');
        return fallback ? fallback[0] : null;
    },

    _getWorldMapAdvanceForCompletedLevel(layoutId) {
        const targetLayout = layoutId || RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
        if (!targetLayout) return null;

        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        if (!containers.length) return null;

        for (let i = 0; i < containers.length; i++) {
            const container = containers[i];
            const layouts = Array.isArray(container?.layouts) ? container.layouts : [];
            const idx = layouts.indexOf(targetLayout);
            if (idx < 0) continue;
            const isLastInContainer = idx === layouts.length - 1;
            if (!isLastInContainer) return null;
            const worldMapLayoutId = this._getWorldMapLayoutId();
            if (!worldMapLayoutId) return null;
            const nextContainer = containers[i + 1];
            if (!nextContainer?.name) {
                const finishLayoutId = this._getFinishRewardLayoutId();
                return {
                    fromContainerName: container.name,
                    toContainerName: null,
                    targetKind: 'finish',
                    finishLayoutId,
                    worldMapLayoutId
                };
            }
            return {
                fromContainerName: container.name,
                toContainerName: nextContainer.name,
                targetKind: 'container',
                finishLayoutId: null,
                worldMapLayoutId
            };
        }
        return null;
    },

    _easeInOutCubic01(t) {
        const x = Math.max(0, Math.min(1, t));
        return x < 0.5
            ? 4 * x * x * x
            : 1 - Math.pow(-2 * x + 2, 3) / 2;
    },

    _resetWorldMapPlayerScale() {
        const markers = this._levelMapPlayers || [];
        for (const marker of markers) {
            const baseX = Number(marker._lmBaseScaleX);
            const baseY = Number(marker._lmBaseScaleY);
            if (Number.isFinite(baseX)) marker.scaleX = baseX;
            if (Number.isFinite(baseY)) marker.scaleY = baseY;
        }
    },

    _updateWorldMapPlayerSpring(rt, nowMs, targetScaleX = 1, targetScaleY = 1) {
        const markers = this._levelMapPlayers || [];
        if (!rt || !markers.length) return;

        if (!rt.playerSpring) {
            rt.playerSpring = { sx: 1, sy: 1, vx: 0, vy: 0, lastMs: nowMs };
        }
        const spring = rt.playerSpring;
        const dtSec = Math.max(
            1 / 240,
            Math.min(1 / 24, ((nowMs - (spring.lastMs || nowMs)) / 1000) || (1 / 60))
        );
        spring.lastMs = nowMs;

        const tx = Math.max(0.82, Math.min(1.22, targetScaleX));
        const ty = Math.max(0.82, Math.min(1.22, targetScaleY));
        const stiffness = 65;
        const damping = 14;

        spring.vx += (tx - spring.sx) * stiffness * dtSec;
        spring.vy += (ty - spring.sy) * stiffness * dtSec;
        const drag = Math.exp(-damping * dtSec);
        spring.vx *= drag;
        spring.vy *= drag;
        spring.sx += spring.vx * dtSec;
        spring.sy += spring.vy * dtSec;

        for (const marker of markers) {
            const baseX = Number(marker._lmBaseScaleX) || Number(marker.scaleX) || 1;
            const baseY = Number(marker._lmBaseScaleY) || Number(marker.scaleY) || 1;
            marker._lmBaseScaleX = baseX;
            marker._lmBaseScaleY = baseY;
            marker.scaleX = baseX * spring.sx;
            marker.scaleY = baseY * spring.sy;
        }
    },

    _launchWorldMapContainer(containerName, { auto = false } = {}) {
        if (!containerName) return;
        if (this._worldMapAutoLaunchInFlight) return;
        this._worldMapAutoLaunchInFlight = true;
        this._worldMapAdvancePending = null;
        this._worldMapAdvanceRuntime = null;

        RCHIPL.Events.emit('OnMenuCardTap', { containerName });
        const resumeLayout = this._getResumeLayoutForContainer(containerName);
        const navPromise = resumeLayout
            ? (auto
                ? RCHIPL.Layouts.goTo(resumeLayout, { showAd: false })
                : RCHIPL.Layouts.goTo(resumeLayout))
            : (auto
                ? RCHIPL.Layouts.startContainer(containerName)
                : RCHIPL.Layouts.startContainer(containerName));

        Promise.resolve(navPromise)
            .catch(() => {})
            .finally(() => {
                this._worldMapAutoLaunchInFlight = false;
            });
    },

    _launchWorldMapFinishLayout(layoutId = null) {
        const finishLayoutId = layoutId || this._getFinishRewardLayoutId();
        if (!finishLayoutId) return;
        if (this._worldMapAutoLaunchInFlight) return;
        this._worldMapAutoLaunchInFlight = true;
        this._worldMapAdvancePending = null;
        this._worldMapAdvanceRuntime = null;
        this._finishLoopPendingIncrement = true;

        Promise.resolve(RCHIPL.Layouts.goTo(finishLayoutId, { showAd: false }))
            .catch(() => {
                this._finishLoopPendingIncrement = false;
            })
            .finally(() => {
                this._worldMapAutoLaunchInFlight = false;
            });
    },

    _isLocalDebugRuntime() {
        const host = String(location?.hostname || '').toLowerCase();
        const isLoopback = host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '';
        const isPrivateIpv4 = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(host);
        const isLocalSuffix = host.endsWith('.local');
        return location?.protocol === 'file:' || isLoopback || isPrivateIpv4 || isLocalSuffix;
    },

    _getDebugLoopCountOverride() {
        if (!this._isLocalDebugRuntime()) return null;

        const candidates = [];
        try {
            const params = new URLSearchParams(location?.search || '');
            candidates.push(params.get('debugLoops'));
        } catch (_) {}

        try {
            candidates.push(localStorage?.getItem?.('plop_debug_loops'));
        } catch (_) {}

        candidates.push(globalThis?.__PLP_DEBUG_LOOPS);
        try {
            if (globalThis?.parent && globalThis.parent !== globalThis) {
                candidates.push(globalThis.parent.__PLP_DEBUG_LOOPS);
            }
        } catch (_) {}
        try {
            if (globalThis?.top && globalThis.top !== globalThis && globalThis.top !== globalThis.parent) {
                candidates.push(globalThis.top.__PLP_DEBUG_LOOPS);
            }
        } catch (_) {}

        for (const raw of candidates) {
            if (raw === null || raw === undefined || raw === '') continue;
            const n = Math.floor(Number(raw));
            if (Number.isFinite(n) && n >= 0) return n;
        }
        return null;
    },

    _getCompletedLoopCount() {
        const debugOverride = this._getDebugLoopCountOverride();
        if (debugOverride !== null) return debugOverride;
        return Math.max(0, Math.floor(Number(RCHIPL.Save?.get?.('loopsCompleted')) || 0));
    },

    _incrementCompletedLoopCount() {
        const next = this._getCompletedLoopCount() + 1;
        RCHIPL.Save?.set?.('loopsCompleted', next);
        return next;
    },

    _rebuildContainerProgressCache() {
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const levels = RCHIPL.Save?.get?.('levels') || {};
        this._containerProgress = {};
        containers.forEach(cont => {
            if (!cont.layouts?.length) {
                this._containerProgress[cont.name] = { completed: 0, stars: 0, total: 0 };
                return;
            }
            let completed = 0;
            let stars = 0;
            for (const lid of cont.layouts) {
                const lv = levels[lid];
                if (!lv?.completed) continue;
                completed++;
                if (lv.star) stars++;
            }
            this._containerProgress[cont.name] = { completed, stars, total: cont.layouts.length };
        });
    },

    _completeLoopAndResetProgress() {
        const nextLoopCount = this._getCompletedLoopCount() + 1;
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const firstContainerName = containers[0]?.name || null;
        const firstLayoutId = this._getFirstPlayableLayoutId();

        if (RCHIPL.Save?.update) {
            RCHIPL.Save.update({
                loopsCompleted: nextLoopCount,
                levels: {},
                cups: {},
                container: firstContainerName,
                containerIndex: 0
            });
        } else {
            RCHIPL.Save?.set?.('loopsCompleted', nextLoopCount);
            RCHIPL.Save?.set?.('levels', {});
            RCHIPL.Save?.set?.('cups', {});
            RCHIPL.Save?.set?.('container', firstContainerName);
            RCHIPL.Save?.set?.('containerIndex', 0);
        }

        RCHIPL.GameStructure?.resetProgress?.();
        if (firstContainerName && firstLayoutId) {
            RCHIPL.GameStructure?.setCurrent?.(firstContainerName, firstLayoutId);
        }

        this._rebuildContainerProgressCache();
        if (this._cardToContainer) {
            this._applyMenuRuntimeCardVariants();
        }
        this._markUiProgressDirty();
        if (this.state === 'MENU') {
            this._updateTemplateUIRuntime(true);
        }

        return nextLoopCount;
    },

    _getFirstPlayableLayoutId() {
        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        return containers[0]?.layouts?.[0] || null;
    },

    _clearFinishLoopTimeout() {
        if (this._finishLoopTimeout) {
            clearTimeout(this._finishLoopTimeout);
            this._finishLoopTimeout = null;
        }
    },

    _handleFinishRewardEntry(layout) {
        const finishLayoutId = this._getFinishRewardLayoutId();
        if (!finishLayoutId || layout?.id !== finishLayoutId) {
            this._finishLoopPendingIncrement = false;
            this._clearFinishLoopTimeout();
            return;
        }

        if (RCHIPL.Editor?.isEditMode?.()) return;

        if (this._finishLoopPendingIncrement) {
            this._completeLoopAndResetProgress();
            this._finishLoopPendingIncrement = false;
        }

        const firstLayoutId = this._getFirstPlayableLayoutId();
        if (!firstLayoutId) return;

        this._clearFinishLoopTimeout();
        const expectedLayoutId = layout?.id || finishLayoutId;
        this._finishLoopTimeout = setTimeout(() => {
            this._finishLoopTimeout = null;
            const currentLayoutId = RCHIPL.Layouts?.getCurrentId?.() || RCHIPL.Layouts?._currentName;
            if (currentLayoutId !== expectedLayoutId) return;
            RCHIPL.Layouts.goTo(firstLayoutId, { showAd: false }).catch(() => {});
        }, 3000);
    },

    _startWorldMapAdvanceAfterContainerWin(layoutId) {
        const flow = this._getWorldMapAdvanceForCompletedLevel(layoutId);
        if (!flow) return false;
        if (this._worldMapAdvancePending || this._worldMapAdvanceRuntime) return true;

        this._worldMapAdvancePending = {
            fromContainerName: flow.fromContainerName,
            toContainerName: flow.toContainerName,
            targetKind: flow.targetKind || 'container',
            finishLayoutId: flow.finishLayoutId || null,
            worldMapLayoutId: flow.worldMapLayoutId
        };
        this._worldMapAdvanceRuntime = null;
        this._worldMapAutoLaunchInFlight = false;

        RCHIPL.Layouts.goTo(flow.worldMapLayoutId, { showAd: false }).catch(() => {
            this._worldMapAdvancePending = null;
            this._worldMapAdvanceRuntime = null;
            this._worldMapAutoLaunchInFlight = false;
            RCHIPL.Layouts.win();
        });
        return true;
    },

    // ═══════════════════════════════════════════════════════════
    // WORLD MAP — levelMap family nodes
    // ═══════════════════════════════════════════════════════════

    _initWorldMap() {
        const nodes = RCHIPL.Scene?.getByFamily?.('levelMap') || [];
        if (!nodes.length) {
            this._cleanupWorldMap();
            return;
        }

        const containers = RCHIPL._projectData?.gameStructure?.containers || [];
        const levels = RCHIPL.Save.get('levels') || {};

        // Compute container progress
        const containerProgress = {};
        for (const cont of containers) {
            if (!cont.layouts?.length) {
                containerProgress[cont.name] = { completed: 0, total: 0 };
                continue;
            }
            let completed = 0;
            for (const lid of cont.layouts) {
                if (levels[lid]?.completed) completed++;
            }
            containerProgress[cont.name] = { completed, total: cont.layouts.length };
        }

        // Determine which containers are unlocked (sequential: previous must be done)
        const containerOrder = containers.map(c => c?.name).filter(Boolean);
        const unlocked = new Set();
        if (containerOrder[0]) unlocked.add(containerOrder[0]); // First world always unlocked
        for (let i = 1; i < containerOrder.length; i++) {
            const prev = containerProgress[containerOrder[i - 1]];
            if (prev && prev.completed >= prev.total && prev.total > 0) {
                unlocked.add(containerOrder[i]);
            } else {
                break; // Sequential unlock — stop at first incomplete
            }
        }

        // Sort entries by order (stable) and split node/player roles
        const normalizeLevelMapRole = (value) =>
            String(value || 'node').trim().toLowerCase();

        const rawEntries = nodes.map((node, idx) => {
            const props = RCHIPL.FamilyProps?.getAll?.(node) || {};
            let order = Number(props.order);
            if (!Number.isFinite(order) || order <= 0) order = idx + 1;
            return { node, props, order, idx };
        }).sort((a, b) => (a.order - b.order) || (a.idx - b.idx));
        const entries = rawEntries.filter(e => normalizeLevelMapRole(e.props.role) !== 'player');
        const playerEntries = rawEntries.filter(e => normalizeLevelMapRole(e.props.role) === 'player');
        const playerMarkers = playerEntries.map(e => e.node);
        if (!entries.length) {
            this._cleanupWorldMap();
            return;
        }

        // Shared world-map style is driven by reference node (order 1 / first in sequence).
        // This intentionally overrides per-node style values for consistency.
        const refEntry = entries.find(e => e.order === 1) || entries[0] || null;
        const refProps = refEntry?.props || {};
        const defaultPlotColor = String(
            refProps.plotColor || refProps.colorReady || '#FFD700'
        ).trim();
        const defaultBgGradientColor1 = String(
            refProps.bgGradientColor1 || '#1a1a2e'
        ).trim();
        const defaultBgGradientColor2 = String(
            refProps.bgGradientColor2 || '#16213e'
        ).trim();
        const sharedLinkColor = refProps.linkColor;
        const sharedLinkWidth = refProps.linkWidth;
        const sharedLinkDash = refProps.linkDash;
        // Empty value means "same layer logic" (legacy behavior).
        this._levelMapLinkLayer = String(refProps.linkLayer || '').trim();

        for (let i = 0; i < entries.length; i++) {
            const { node, props } = entries[i];
            const role = normalizeLevelMapRole(props.role);
            const isCrown = role === 'crown';
            const fallbackContainer = isCrown ? '' : (containerOrder[i] || '');
            const containerName = String(props.container || fallbackContainer || '').trim();
            const prog = containerName ? containerProgress[containerName] : null;
            const isUnlocked = isCrown
                ? true
                : (containerName ? unlocked.has(containerName) : (i === 0)); // authoring fallback when container not configured yet
            const isDone = !!(prog && prog.total > 0 && prog.completed >= prog.total);

            const nodePlotColor = String(
                props.plotColor || props.colorReady || defaultPlotColor || '#FFD700'
            ).trim();
            const nodeBgGradientColor1 = String(
                props.bgGradientColor1 || defaultBgGradientColor1 || '#1a1a2e'
            ).trim();
            const nodeBgGradientColor2 = String(
                props.bgGradientColor2 || defaultBgGradientColor2 || '#16213e'
            ).trim();

            // Apply plot color (state lock/unlock no longer drives node color)
            if (!isCrown && nodePlotColor) {
                node.instanceFillStops = [{ pos: 0, color: nodePlotColor, alpha: 1 }];
                node.instanceFillType = 'solid';
                // Runtime override needs a regenerated instance asset to be visible in drawObject().
                RCHIPL.Scene?._regenerateInstanceAsset?.(node);
            }

            // Store state on node for tap handler
            node._lmUnlocked = isUnlocked;
            node._lmDone = isDone;
            node._lmContainer = containerName;
            node._lmOrder = i + 1;
            node._lmIsCrown = isCrown;
            node._lmPlotColor = nodePlotColor;
            node._lmBgGradientColor1 = nodeBgGradientColor1;
            node._lmBgGradientColor2 = nodeBgGradientColor2;
        }

        // Auto-link order N → order N+1
        const links = [];
        for (let i = 0; i < entries.length - 1; i++) {
            const from = entries[i];
            const to = entries[i + 1];
            links.push({
                fromNode: from.node,
                toNode: to.node,
                color: sharedLinkColor || '#ffffff',
                width: sharedLinkWidth || 4,
                dash: sharedLinkDash || 8
            });
        }

        // Move player marker(s) to the current progression world node
        let currentContainerName = '';
        for (const cont of containers) {
            const prog = containerProgress[cont.name];
            if (!prog || prog.total <= 0 || prog.completed < prog.total) {
                currentContainerName = cont.name;
                break;
            }
        }
        if (!currentContainerName && containerOrder.length) {
            currentContainerName = containerOrder[containerOrder.length - 1];
        }
        let playerTargetNode = entries.find(e => !e.node._lmIsCrown && e.node._lmContainer === currentContainerName)?.node || null;
        if (!playerTargetNode) {
            playerTargetNode = entries.find(e => !e.node._lmIsCrown && e.node._lmUnlocked)?.node || null;
        }
        if (!playerTargetNode) {
            playerTargetNode = entries.find(e => !e.node._lmIsCrown)?.node || entries[0].node;
        }

        const pendingAdvance = (!RCHIPL.Editor?.isEditMode?.()) ? this._worldMapAdvancePending : null;
        let advanceFromNode = null;
        let advanceToNode = null;
        if (pendingAdvance) {
            advanceFromNode = entries.find(e =>
                !e.node._lmIsCrown && e.node._lmContainer === pendingAdvance.fromContainerName
            )?.node || null;
            if (pendingAdvance.targetKind === 'finish') {
                advanceToNode = entries.find(e => e.node._lmIsCrown)?.node || null;
            } else {
                advanceToNode = entries.find(e =>
                    !e.node._lmIsCrown && e.node._lmContainer === pendingAdvance.toContainerName
                )?.node || null;
            }
            if (advanceFromNode) playerTargetNode = advanceFromNode;
            else if (advanceToNode) playerTargetNode = advanceToNode;
        }

        if (playerTargetNode && playerMarkers.length) {
            for (const marker of playerMarkers) {
                if (!Number.isFinite(Number(marker._lmBaseScaleX))) {
                    marker._lmBaseScaleX = Number(marker.scaleX) || 1;
                }
                if (!Number.isFinite(Number(marker._lmBaseScaleY))) {
                    marker._lmBaseScaleY = Number(marker.scaleY) || 1;
                }
                marker.scaleX = marker._lmBaseScaleX;
                marker.scaleY = marker._lmBaseScaleY;
                marker.x = playerTargetNode.x;
                marker.y = playerTargetNode.y;
                marker.visible = true;
            }
        }

        if (pendingAdvance) {
            if (advanceFromNode && advanceToNode && advanceFromNode !== advanceToNode && playerMarkers.length) {
                this._worldMapAdvanceRuntime = {
                    phase: 'holdBeforeMove',
                    phaseStartMs: performance.now(),
                    holdBeforeMs: 750,
                    moveDurationMs: 850,
                    holdAfterMs: 750,
                    fromNode: advanceFromNode,
                    toNode: advanceToNode,
                    targetContainerName: pendingAdvance.toContainerName,
                    targetKind: pendingAdvance.targetKind || 'container',
                    finishLayoutId: pendingAdvance.finishLayoutId || null,
                    confettiDone: false,
                    arrivalConfettiDone: false,
                    moveSoundDone: false,
                    bgTransition: null,
                    playerSpring: null,
                    prevMarkerX: advanceFromNode?.x,
                    prevMarkerY: advanceFromNode?.y
                };
                this._levelMapTapEnabled = performance.now() + 3000;
            } else {
                // Fallback: no valid path for animation, keep a short hold then auto-launch.
                this._worldMapAdvanceRuntime = {
                    phase: 'holdAfterMove',
                    phaseStartMs: performance.now(),
                    holdBeforeMs: 0,
                    moveDurationMs: 0,
                    holdAfterMs: 750,
                    fromNode: playerTargetNode,
                    toNode: playerTargetNode,
                    targetContainerName: pendingAdvance.toContainerName,
                    targetKind: pendingAdvance.targetKind || 'container',
                    finishLayoutId: pendingAdvance.finishLayoutId || null,
                    confettiDone: false,
                    arrivalConfettiDone: false,
                    moveSoundDone: false,
                    bgTransition: null,
                    playerSpring: null,
                    prevMarkerX: playerTargetNode?.x,
                    prevMarkerY: playerTargetNode?.y
                };
                this._levelMapTapEnabled = performance.now() + 1200;
            }
        } else {
            this._worldMapAdvanceRuntime = null;
            // Keep world-map background gradient in sync with current progression node palette.
            if (playerTargetNode && !RCHIPL.Editor?.isEditMode?.()) {
                this._applyWorldMapBackgroundGradient(playerTargetNode);
            }
        }

        this._levelMapNodes = entries.map(e => e.node);
        this._levelMapLinks = links;
        this._levelMapPlayers = playerMarkers;
        this._levelMapTapEnabled = performance.now() + 300;
        // World map colors/variants can change layer cache output.
        RCHIPL.Scene?.invalidateLayerCaches?.();
    },

    _cleanupWorldMap() {
        this._resetWorldMapPlayerScale();
        this._levelMapNodes = null;
        this._levelMapLinks = null;
        this._levelMapPlayers = null;
        this._levelMapLinkLayer = '';
        this._worldMapAdvanceRuntime = null;
        this._worldMapAutoLaunchInFlight = false;
    },

    _parseHexColorRgb(color) {
        const raw = String(color || '').trim();
        if (!raw) return null;
        const hex = raw.startsWith('#') ? raw.slice(1) : raw;
        if (/^[0-9a-fA-F]{3}$/.test(hex)) {
            return {
                r: parseInt(hex[0] + hex[0], 16),
                g: parseInt(hex[1] + hex[1], 16),
                b: parseInt(hex[2] + hex[2], 16)
            };
        }
        if (/^[0-9a-fA-F]{6}$/.test(hex)) {
            return {
                r: parseInt(hex.slice(0, 2), 16),
                g: parseInt(hex.slice(2, 4), 16),
                b: parseInt(hex.slice(4, 6), 16)
            };
        }
        return null;
    },

    _rgbToHex({ r, g, b }) {
        const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
        const toHex = (v) => clamp(v).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    },

    _lerpColorHex(fromColor, toColor, t01) {
        const toRgb = this._parseHexColorRgb(toColor);
        if (!toRgb) return String(fromColor || '').trim();
        const fromRgb = this._parseHexColorRgb(fromColor) || toRgb;
        const t = Math.max(0, Math.min(1, t01));
        return this._rgbToHex({
            r: fromRgb.r + (toRgb.r - fromRgb.r) * t,
            g: fromRgb.g + (toRgb.g - fromRgb.g) * t,
            b: fromRgb.b + (toRgb.b - fromRgb.b) * t
        });
    },

    _getSkipRewardPopupProps() {
        return this._skipRewardPopupObj
            ? (RCHIPL.FamilyProps?.getAll?.(this._skipRewardPopupObj) || {})
            : {};
    },

    _getSkipRewardCloseProps() {
        return this._skipRewardCloseObj
            ? (RCHIPL.FamilyProps?.getAll?.(this._skipRewardCloseObj) || {})
            : {};
    },

    _isSkipLevelButton(btn) {
        const family = String(btn?.family || '').trim().toLowerCase();
        const familyProps = RCHIPL.FamilyProps?.getAll?.(btn) || {};
        const isUiAction = family === 'uiaction';
        const buttonLabel = [
            String(btn?.asset || ''),
            String(btn?.id || ''),
            String(btn?.name || '')
        ].join(' ').toLowerCase();
        const isHardcodedSkipButton = family === 'button' && buttonLabel.includes('skip');
        return family === 'skiplevel'
            || isHardcodedSkipButton
            || (isUiAction && String(familyProps.actionId || '').trim() === 'skipLevel');
    },

    _isRestartActionButton(btn) {
        const family = String(btn?.family || '').trim().toLowerCase();
        const familyProps = RCHIPL.FamilyProps?.getAll?.(btn) || {};
        return family === 'uiaction' && String(familyProps.actionId || '').trim() === 'restartLevel';
    },

    _isSoundToggleButton(btn) {
        const family = String(btn?.family || '').trim().toLowerCase();
        const familyProps = RCHIPL.FamilyProps?.getAll?.(btn) || {};
        const isUiAction = family === 'uiaction';
        const buttonLabel = [
            String(btn?.asset || ''),
            String(btn?.id || ''),
            String(btn?.name || '')
        ].join(' ').toLowerCase();
        return (isUiAction && String(familyProps.actionId || '').trim() === 'toggleSound')
            || buttonLabel.includes('soundbutton');
    },

    _getSkipHintProps() {
        const base = {
            enabled: true,
            delaySec: 15,
            offsetYPx: 4,
            amplitudePx: 8,
            frequencyHz: 2,
            scale: 0.6,
            alpha: 0.95,
            rotationDeg: 0
        };
        if (!this._skipHintArrowObj) return base;
        return {
            ...base,
            ...(RCHIPL.FamilyProps?.getAll?.(this._skipHintArrowObj) || {})
        };
    },

    _resetSkipHintState() {
        this._skipHintTimer = 0;
        this._skipHintActive = false;
    },

    _clampAudioVolume(value, fallback = 1) {
        const n = Number(value);
        const base = Number.isFinite(n) ? n : fallback;
        return Math.max(0, Math.min(1, base));
    },

    _getProjectMasterVolume() {
        const editorMixVol = RCHIPL._projectData?.editorSettings?.mixer?.master != null
            ? (Number(RCHIPL._projectData.editorSettings.mixer.master) / 100)
            : null;
        return this._clampAudioVolume(editorMixVol ?? 1, 1);
    },

    _getProjectSfxVolume() {
        const editorMixVol = RCHIPL._projectData?.editorSettings?.mixer?.sfx != null
            ? (Number(RCHIPL._projectData.editorSettings.mixer.sfx) / 100)
            : null;
        const gameMixVol = RCHIPL._projectData?.audio?.gameMix?.sfxVolume;
        return this._clampAudioVolume(editorMixVol ?? gameMixVol, 1);
    },

    _getSoundToggleButtonSize(btn = this._soundToggleButtonObj) {
        const assetName = btn?.asset || 'Sound';
        const asset = RCHIPL.Assets.get(assetName) || RCHIPL.Assets.get('Sound') || RCHIPL.Assets.get('soundButton2');
        const nativeW = Number(asset?.width) || 75;
        const nativeH = Number(asset?.height) || 100;
        const targetScale = 0.9;
        const buttons = this._buttonObjs || [];
        const refBtn = buttons.find(other => other && other !== btn && (
            this._isRestartActionButton(other)
            || String(other?.asset || '').toLowerCase().includes('restart')
        ));
        const refH = Number(refBtn?.height);
        if (Number.isFinite(refH) && refH > 0 && nativeH > 0) {
            const targetH = refH * targetScale;
            return {
                width: Math.round(nativeW * (targetH / nativeH)),
                height: Math.round(targetH)
            };
        }
        return { width: 83, height: 111 };
    },

    _syncSoundToggleButtonVisual(btn = this._soundToggleButtonObj) {
        if (!btn) return;
        btn._soundVisualAsset = 'Sound';
        btn.asset = 'Sound';
        const size = this._getSoundToggleButtonSize(btn);
        btn.width = size.width;
        btn.height = size.height;
        btn.scaleX = 1;
        btn.scaleY = 1;
        btn._baseScaleX = 1;
        btn._baseScaleY = 1;
        btn._baseWidth = size.width;
        btn._baseHeight = size.height;
        btn.visible = true;
    },

    _renderSoundToggleMuteOverlay(ctx) {
        if (!this._soundMuted) return;
        const btn = this._soundToggleButtonObj;
        if (!btn || btn.visible === false) return;
        const assetName = RCHIPL.Assets.get('crossSound') ? 'crossSound' : null;
        if (!assetName) return;
        const pos = this._getUiButtonScreenPosition(btn);
        const size = this._getSoundToggleButtonSize(btn);
        const crossAsset = RCHIPL.Assets.get(assetName);
        const soundAsset = RCHIPL.Assets.get('Sound');
        const nativeW = Number(crossAsset?.width) || 71;
        const nativeH = Number(crossAsset?.height) || 71;
        const soundNativeW = Number(soundAsset?.width) || 75;
        const targetSize = size.width * (nativeW / Math.max(1, soundNativeW));
        const uniformScale = targetSize / Math.max(1, Math.max(nativeW, nativeH));
        ctx.save();
        ctx.translate(pos.x, pos.y);
        RCHIPL.Assets.draw(ctx, assetName, 0, 0, {
            scaleX: uniformScale,
            scaleY: uniformScale,
            angle: 0,
            alpha: 1
        });
        ctx.restore();
    },

    _primeSoundToggleButtonForCurrentScene() {
        const allObjs = RCHIPL.Scene?.getAll?.() || [];
        if (!allObjs.length) return null;

        const familyButtons = RCHIPL.Scene?.getByFamily?.('button') || [];
        const actionButtons = RCHIPL.Scene?.getByFamily?.('uiAction') || [];
        const inferredSoundButtons = allObjs.filter(o => this._isSoundToggleButton(o));
        const existingButtons = Array.isArray(this._buttonObjs) ? this._buttonObjs : [];
        this._buttonObjs = [...new Set([...existingButtons, ...familyButtons, ...actionButtons, ...inferredSoundButtons])];

        const btn = this._buttonObjs.find(candidate => this._isSoundToggleButton(candidate)) || null;
        if (!btn) return null;

        this._soundToggleButtonObj = btn;
        this._soundMuted = this._clampAudioVolume(RCHIPL.Audio?.masterVolume, this._getProjectMasterVolume()) <= 0.0001;
        this._syncSoundToggleButtonVisual(btn);
        return btn;
    },

    _setSoundMuted(muted) {
        const next = !!muted;
        const currentMaster = this._clampAudioVolume(RCHIPL.Audio?.masterVolume, this._getProjectMasterVolume());
        const currentSfx = this._clampAudioVolume(RCHIPL.Sampler?._sfxBaseVolume, this._getProjectSfxVolume());
        if (!next && this._soundMasterBeforeMute == null) {
            this._soundMasterBeforeMute = this._getProjectMasterVolume();
            this._soundSfxBeforeMute = this._getProjectSfxVolume();
        } else if (next && currentMaster > 0.0001) {
            this._soundMasterBeforeMute = currentMaster;
            this._soundSfxBeforeMute = currentSfx;
        }
        this._soundMuted = next;
        const targetMaster = next
            ? 0
            : this._clampAudioVolume(this._soundMasterBeforeMute, this._getProjectMasterVolume());
        const targetSfx = next
            ? 0
            : this._clampAudioVolume(this._soundSfxBeforeMute, this._getProjectSfxVolume());
        if (RCHIPL.Audio) {
            RCHIPL.Audio.masterVolume = targetMaster;
        } else if (RCHIPL.Sampler?.setMasterVolume) {
            RCHIPL.Sampler.setMasterVolume(targetMaster);
        }
        RCHIPL.Sampler?.setSfxVolume?.(targetSfx);
        if (typeof GameSFX !== 'undefined' && GameSFX) {
            if (next) {
                if (GameSFX._master?.gain) {
                    this._soundGameSfxBeforeMute = Number(GameSFX._master.gain.value) || 0.45;
                    GameSFX._master.gain.value = 0;
                }
                GameSFX._enabled = false;
                GameSFX.stopAll?.();
            } else {
                GameSFX._enabled = true;
                if (GameSFX._master?.gain) {
                    const gameSfxVol = Number.isFinite(this._soundGameSfxBeforeMute)
                        ? this._soundGameSfxBeforeMute
                        : 0.45;
                    GameSFX._master.gain.value = Math.max(0, gameSfxVol);
                }
            }
        }
        this._setBackgroundMusicVolume(this._backgroundMusicTargetVolume, next ? 0 : 120);
        this._syncSoundToggleButtonVisual();
        return this._soundMuted;
    },

    _toggleSoundMuted() {
        return this._setSoundMuted(!this._soundMuted);
    },

    _usesBackgroundMusicFile() {
        return typeof this._backgroundMusicFileSrc === 'string' && this._backgroundMusicFileSrc.trim().length > 0;
    },

    _getEffectiveBackgroundMusicVolume(volume = this._backgroundMusicTargetVolume) {
        const musicVol = this._clampAudioVolume(volume, this._getBackgroundMusicTargetForState());
        if (this._soundMuted) return 0;
        return this._clampAudioVolume(musicVol * this._getProjectMasterVolume(), 0);
    },

    _cancelBackgroundMusicFileFade() {
        if (!this._backgroundMusicFileFadeRaf) return;
        cancelAnimationFrame(this._backgroundMusicFileFadeRaf);
        this._backgroundMusicFileFadeRaf = 0;
    },

    // Route the background <audio> element through WebAudio via
    // createMediaElementSource, so volume/mute are controlled by a gain node
    // (iOS respects WebAudio gains, but ignores HTMLMediaElement.volume). Once
    // this is wired, the element's direct output is captured by WebAudio — we
    // set el.volume = 1 / el.muted = false and drive everything via _musicFileGain.
    // Must be called when Sampler._ctx exists. Idempotent; MediaElementSource can
    // only be created once per element.
    _ensureBackgroundMusicWebAudioRoute() {
        if (this._backgroundMusicFileSourceNode) return true;
        const el = this._backgroundMusicFileEl;
        if (!el) return false;
        const sampler = RCHIPL.Sampler;
        if (!sampler) return false;
        try { sampler._initContext?.(); } catch (_) {}
        try { sampler._initBuses?.(); } catch (_) {}
        const ctx = sampler._ctx;
        if (!ctx) return false;
        try {
            const source = ctx.createMediaElementSource(el);
            const gain = ctx.createGain();
            gain.gain.value = 0;
            source.connect(gain);
            const dest = sampler._masterGain || ctx.destination;
            gain.connect(dest);
            this._backgroundMusicFileSourceNode = source;
            this._backgroundMusicFileGain = gain;
            // Once routed through WebAudio, the HTMLMediaElement's own volume/mute
            // are bypassed — pin them at passthrough so they don't silence us.
            el.volume = 1;
            el.muted = false;
            return true;
        } catch (e) {
            
            return false;
        }
    },

    _setBackgroundMusicFileElementVolume(target, fadeMs = this._backgroundMusicFadeMs) {
        const el = this._backgroundMusicFileEl;
        const next = this._clampAudioVolume(target, 0);
        if (!el) return next;

        // Preferred path: WebAudio gain. Try to establish the route lazily.
        const routed = this._ensureBackgroundMusicWebAudioRoute();
        if (routed && this._backgroundMusicFileGain && RCHIPL.Sampler?._ctx) {
            const ctx = RCHIPL.Sampler._ctx;
            const g = this._backgroundMusicFileGain.gain;
            const now = ctx.currentTime;
            this._cancelBackgroundMusicFileFade();
            try { g.cancelScheduledValues(now); } catch (_) {}
            if (fadeMs > 0) {
                const current = Number.isFinite(g.value) ? g.value : next;
                try { g.setValueAtTime(current, now); } catch (_) {}
                try { g.linearRampToValueAtTime(next, now + (fadeMs / 1000)); } catch (_) { g.value = next; }
            } else {
                // Direct assignment — setValueAtTime at currentTime is inconsistently
                // honoured by some Safari versions and can leave the gain stuck at
                // its previous scheduled value. Writing .value directly is reliable.
                g.value = next;
            }
            // iOS Safari bug: createMediaElementSource doesn't always silence the
            // element's direct output — audio plays through both WebAudio (gain
            // controlled) AND the element's own pipeline (uncontrolled). Mirror
            // mute on el.muted so both paths are silenced together.
            el.muted = next <= 0.001;
            el.volume = 1;
            return next;
        }

        // Fallback (WebAudio unavailable): HTMLMediaElement volume + muted.
        // iOS Safari ignores el.volume but respects el.muted — set both.
        el.muted = next <= 0.001;

        this._cancelBackgroundMusicFileFade();
        if (!(fadeMs > 0) || typeof requestAnimationFrame !== 'function') {
            el.volume = next;
            return next;
        }

        const start = performance.now();
        const from = this._clampAudioVolume(el.volume, next);
        const duration = Math.max(1, Number(fadeMs) || 0);
        const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const cur = this._clampAudioVolume(from + ((next - from) * t), next);
            el.volume = cur;
            el.muted = cur <= 0.001;
            if (t < 1) {
                this._backgroundMusicFileFadeRaf = requestAnimationFrame(tick);
            } else {
                this._backgroundMusicFileFadeRaf = 0;
            }
        };
        this._backgroundMusicFileFadeRaf = requestAnimationFrame(tick);
        return next;
    },

    _pauseBackgroundMusicFile(trackResume = true) {
        const el = this._backgroundMusicFileEl;
        if (!el) return;
        if (trackResume) {
            this._backgroundMusicFileResumeOnForeground = this._backgroundMusicStarted && !el.paused && !el.ended;
        }
        try {
            el.pause();
        } catch (_) {}
    },

    _resumeBackgroundMusicFile() {
        if (!this._backgroundMusicFileResumeOnForeground) return;
        const el = this._backgroundMusicFileEl;
        if (!el || !this._backgroundMusicUnlocked || !this._backgroundMusicStarted) {
            this._backgroundMusicFileResumeOnForeground = false;
            return;
        }
        this._backgroundMusicFileResumeOnForeground = false;
        const playResult = el.play();
        this._setBackgroundMusicFileElementVolume(this._getEffectiveBackgroundMusicVolume(), 0);
        if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(() => {
                this._backgroundMusicStarted = false;
            });
        }
    },

    _installBackgroundMusicFileHooks() {
        const music = RCHIPL.Music;
        if (!music || music._externalBackgroundMusicHooksInstalled) return;
        const basePause = typeof music.pause === 'function' ? music.pause.bind(music) : null;
        const baseResume = typeof music.resume === 'function' ? music.resume.bind(music) : null;
        music.pause = (...args) => {
            if (basePause) basePause(...args);
            this._pauseBackgroundMusicFile(true);
        };
        music.resume = (...args) => {
            if (baseResume) baseResume(...args);
            this._resumeBackgroundMusicFile();
        };
        music._externalBackgroundMusicHooksInstalled = true;
    },

    _playPublishedSfx(patchId, volume = 1, extraOpts = null) {
        const sampler = RCHIPL.Sampler;
        const patch = sampler?._audioData?.sfxPatches?.[patchId];
        if (!sampler?.playSFX || !patchId || !patch) return false;
        try {
            sampler.playSFX(patchId, {
                volume: Math.max(0, Number(volume) || 0),
                ...(extraOpts || {})
            });
            return true;
        } catch (e) {
            
            return false;
        }
    },

    _mergePrebakedAudioManifestIntoRuntime(manifest) {
        const sfxMap = manifest?.sfx;
        if (!sfxMap || typeof sfxMap !== 'object') return 0;
        const projectData = RCHIPL._projectData || INLINE_PROJECT_DATA;
        if (!projectData) return 0;
        projectData.audio = projectData.audio || {};
        projectData.audio.sfxPatches = projectData.audio.sfxPatches || {};
        let changed = 0;
        for (const [id, entry] of Object.entries(sfxMap)) {
            const src = entry?.src || entry?.fileSrc || entry?.prebakedSrc || null;
            if (!id || !src) continue;
            const existing = projectData.audio.sfxPatches[id] || {};
            const next = {
                ...existing,
                id,
                name: existing.name || id,
                machine: 'file',
                params: existing.params || {},
                fileSrc: src,
                fileMimeType: entry?.mimeType || entry?.fileMimeType || existing.fileMimeType || null,
                runtimeMode: 'file'
            };
            const prevSig = JSON.stringify(existing);
            const nextSig = JSON.stringify(next);
            if (prevSig !== nextSig) {
                projectData.audio.sfxPatches[id] = next;
                changed++;
            }
        }
        if (changed > 0 && RCHIPL.Sampler?.loadAudio) {
            RCHIPL.Sampler.loadAudio(projectData.audio);
        }
        return changed;
    },

    async _ensurePrebakedAudioPreviewManifest() {
        if (this._prebakedAudioPreviewManifestPromise) return this._prebakedAudioPreviewManifestPromise;
        const sampler = RCHIPL.Sampler;
        const requiredIds = [
            'sfx_runtime_magnet_loop',
            'sfx_runtime_wind_loop',
            'sfx_runtime_zero_g_loop',
            'sfx_runtime_contact_grain_a',
            'sfx_runtime_contact_grain_b',
            'sfx_runtime_contact_grain_c'
        ];
        const allPresent = requiredIds.every((id) => {
            const patch = sampler?._audioData?.sfxPatches?.[id];
            return !!(patch && (patch.fileSrc || patch.prebakedSrc || patch.src));
        });
        if (allPresent) {
            this._prebakedAudioPreviewManifestPromise = Promise.resolve(true);
            return this._prebakedAudioPreviewManifestPromise;
        }
        this._prebakedAudioPreviewManifestPromise = (async () => {
            const folderName = INLINE_PROJECT_DATA?._meta?.folderName || 'PlopCtrlCatapulte';
            const candidates = [
                new URL('./audio-prebaked-manifest.json', document.baseURI || window.location.href).href,
                new URL(`./games/${folderName}/audio-prebaked-manifest.json`, document.baseURI || window.location.href).href
            ];
            for (const manifestUrl of candidates) {
                let response = null;
                try {
                    response = await fetch(manifestUrl, { cache: 'no-store' });
                } catch (_) {
                    response = null;
                }
                if (!response?.ok) continue;
                const manifest = await response.json();
                this._mergePrebakedAudioManifestIntoRuntime(manifest);
                return true;
            }
            return false;
        })();
        return this._prebakedAudioPreviewManifestPromise;
    },

    _getPublishedSfxPatch(patchId) {
        const sampler = RCHIPL.Sampler;
        const patch = sampler?._audioData?.sfxPatches?.[patchId];
        if (!patch) return null;
        const fileSrc = patch.fileSrc || patch.prebakedSrc || patch.src || null;
        return fileSrc ? patch : null;
    },

    _prewarmLightDynamicAudioFiles() {
        if (this._lightDynamicAudioPrewarmQueued) return;
        this._lightDynamicAudioPrewarmQueued = true;
        const sampler = RCHIPL.Sampler;
        const ids = [
            'sfx_runtime_magnet_loop',
            'sfx_runtime_wind_loop',
            'sfx_runtime_zero_g_loop',
            'sfx_runtime_contact_grain_a',
            'sfx_runtime_contact_grain_b',
            'sfx_runtime_contact_grain_c',
            'sfx_runtime_contact_grain'
        ];
        Promise.resolve().then(async () => {
            try {
                for (const patchId of ids) {
                    const patch = this._getPublishedSfxPatch(patchId);
                    if (!patch || !sampler?._ensureBuffer) continue;
                    await sampler._ensureBuffer(patchId, 'sfx', patch.params, {
                        machine: patch.machine,
                        fileSrc: patch.fileSrc || patch.prebakedSrc || patch.src || null,
                        fileMimeType: patch.fileMimeType || patch.mimeType || null
                    });
                }
            } catch (_) {}
        });
    },

    async _bootPublishedLoopSlot(slotKey, patchId, volume = 0, playbackRate = 1) {
        const sampler = RCHIPL.Sampler;
        const patch = this._getPublishedSfxPatch(patchId);
        if (!patch || !sampler?._ensureBuffer || !sampler?._initContext || !sampler?._initBuses) return false;
        sampler._initContext();
        sampler._initBuses();
        const ctx = sampler._ctx;
        const bus = sampler._sfxGain || sampler._masterGain || ctx?.destination;
        if (!ctx || !bus) return false;

        const existing = this._publishedLoopSlots[slotKey];
        if (existing?.patchId === patchId && existing.source && !existing.stopped) {
            return true;
        }

        this._stopPublishedLoopSlot(slotKey, 80);

        const slot = {
            key: slotKey,
            patchId,
            loading: true,
            stopped: false,
            targetVolume: Math.max(0, Number(volume) || 0),
            targetPlaybackRate: Math.max(0.25, Math.min(4, Number(playbackRate) || 1))
        };
        this._publishedLoopSlots[slotKey] = slot;

        const buf = await sampler._ensureBuffer(patchId, 'sfx', patch.params, {
            machine: patch.machine,
            fileSrc: patch.fileSrc || patch.prebakedSrc || patch.src || null,
            fileMimeType: patch.fileMimeType || patch.mimeType || null
        });
        if (!buf || this._publishedLoopSlots[slotKey] !== slot || slot.stopped) return false;

        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        src.loopStart = 0;
        src.loopEnd = Math.max(0.05, buf.duration || 0.05);
        src.playbackRate.value = slot.targetPlaybackRate;

        const gain = ctx.createGain();
        gain.gain.value = 0.0001;
        src.connect(gain).connect(bus);
        src.start(ctx.currentTime + 0.005);

        slot.loading = false;
        slot.source = src;
        slot.gain = gain;
        src.onended = () => {
            const current = this._publishedLoopSlots[slotKey];
            if (current === slot && current.stopped) delete this._publishedLoopSlots[slotKey];
        };
        this._updatePublishedLoopSlot(slotKey, slot.targetVolume, slot.targetPlaybackRate, 120);
        return true;
    },

    _updatePublishedLoopSlot(slotKey, volume = 0, playbackRate = 1, fadeMs = 90) {
        const slot = this._publishedLoopSlots[slotKey];
        if (!slot) return false;
        slot.targetVolume = Math.max(0, Number(volume) || 0);
        slot.targetPlaybackRate = Math.max(0.25, Math.min(4, Number(playbackRate) || 1));
        if (slot.loading || !slot.source || !slot.gain) return true;
        const sampler = RCHIPL.Sampler;
        const ctx = sampler?._ctx;
        if (!ctx) return false;
        const now = ctx.currentTime;
        const fadeSec = Math.max(0.01, (Number(fadeMs) || 0) / 1000);
        try {
            slot.gain.gain.cancelScheduledValues(now);
            slot.gain.gain.setValueAtTime(Math.max(0.0001, slot.gain.gain.value || 0.0001), now);
            slot.gain.gain.linearRampToValueAtTime(Math.max(0.0001, slot.targetVolume), now + fadeSec);
        } catch (_) {}
        try {
            slot.source.playbackRate.cancelScheduledValues(now);
            slot.source.playbackRate.setValueAtTime(slot.source.playbackRate.value || 1, now);
            slot.source.playbackRate.linearRampToValueAtTime(slot.targetPlaybackRate, now + fadeSec);
        } catch (_) {}
        return true;
    },

    _ensurePublishedLoopSlot(slotKey, patchId, volume = 0, playbackRate = 1, fadeMs = 90) {
        const slot = this._publishedLoopSlots[slotKey];
        if (!slot || slot.patchId !== patchId || slot.stopped) {
            this._bootPublishedLoopSlot(slotKey, patchId, volume, playbackRate);
            return !!this._getPublishedSfxPatch(patchId);
        }
        return this._updatePublishedLoopSlot(slotKey, volume, playbackRate, fadeMs);
    },

    _stopPublishedLoopSlot(slotKey, fadeMs = 180) {
        const slot = this._publishedLoopSlots[slotKey];
        if (!slot) return false;
        delete this._publishedLoopSlots[slotKey];
        slot.stopped = true;
        if (slot.loading || !slot.source || !slot.gain) return true;
        const sampler = RCHIPL.Sampler;
        const ctx = sampler?._ctx;
        const fadeSec = Math.max(0.01, (Number(fadeMs) || 0) / 1000);
        const now = ctx?.currentTime || 0;
        try {
            slot.gain.gain.cancelScheduledValues(now);
            slot.gain.gain.setValueAtTime(Math.max(0.0001, slot.gain.gain.value || 0.0001), now);
            slot.gain.gain.linearRampToValueAtTime(0.0001, now + fadeSec);
        } catch (_) {}
        setTimeout(() => {
            try { slot.source.stop(); } catch (_) {}
            try { slot.source.disconnect(); } catch (_) {}
            try { slot.gain.disconnect(); } catch (_) {}
        }, Math.ceil(fadeSec * 1000) + 80);
        return true;
    },

    _stopAllPublishedLoopSlots(fadeMs = 120) {
        for (const slotKey of Object.keys(this._publishedLoopSlots || {})) {
            this._stopPublishedLoopSlot(slotKey, fadeMs);
        }
    },

    _playPublishedContactGrain(squashRatio, velocity) {
        const patchIds = ['sfx_runtime_contact_grain_a', 'sfx_runtime_contact_grain_b', 'sfx_runtime_contact_grain_c', 'sfx_runtime_contact_grain'];
        const available = patchIds.filter((patchId) => !!this._getPublishedSfxPatch(patchId));
        if (!available.length) return false;
        const deformation = Math.abs((Number(squashRatio) || 1) - 1);
        const deformDelta = Math.abs(deformation - (this._lightContactLastDeform || 0));
        this._lightContactLastDeform = deformation;
        if (deformation < 0.022 || deformDelta < 0.002 || (Number(velocity) || 0) < 0.75) return false;
        const speed = Math.max(0, Number(velocity) || 0);
        const speedNorm = Math.min(1, speed / 9.5);
        const speedCurve = Math.pow(speedNorm, 1.05);
        const interval = 210 - speedCurve * 165;
        const nowMs = performance.now();
        if (nowMs - (this._lightContactLastAt || 0) < interval) return true;
        this._lightContactLastAt = nowMs;
        const patchId = available[Math.floor(Math.random() * available.length)];
        const volume = (0.013 + speedCurve * 0.052 + Math.min(0.018, deformation * 0.045)) * 0.95;
        const rate = 0.9 + speedCurve * 0.24 + Math.min(0.78, deformation * 1.12) + (Math.random() * 0.2);
        return this._playPublishedSfx(patchId, volume, { playbackRate: rate });
    },

    _playLightTick(kind = 'aim', progress = 0) {
        const sampler = RCHIPL.Sampler;
        if (!sampler?._initContext || !sampler?._initBuses) return false;
        try {
            sampler._initContext();
            sampler._initBuses();
            const ctx = sampler._ctx;
            const bus = sampler._sfxGain || sampler._masterGain || ctx?.destination;
            if (!ctx || !bus) return false;
            sampler._duckMusic?.(70);
            const p = Math.max(0, Math.min(1, Number(progress) || 0));
            const now = ctx.currentTime + 0.005;
            if (kind === 'pivot') {
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                const pitch = 600 + Math.random() * 200;
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, now + 0.02);
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.0012, now + 0.001);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
                osc.connect(gain).connect(bus);
                osc.start(now);
                osc.stop(now + 0.03);
                return true;
            }

            const basePitch = 400 + Math.pow(p, 1.5) * 1200;
            const carrier = ctx.createOscillator();
            carrier.type = 'sine';
            carrier.frequency.setValueAtTime(basePitch, now);
            carrier.frequency.exponentialRampToValueAtTime(basePitch * 0.5, now + 0.04);

            const mod = ctx.createOscillator();
            mod.type = 'sine';
            mod.frequency.setValueAtTime(basePitch * 1.4, now);
            mod.frequency.exponentialRampToValueAtTime(basePitch * 0.7, now + 0.04);

            const fm = ctx.createGain();
            fm.gain.setValueAtTime(200 + p * 200, now);
            fm.gain.exponentialRampToValueAtTime(1, now + 0.035);
            mod.connect(fm).connect(carrier.frequency);

            const bandpass = ctx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.setValueAtTime(basePitch * 1.2, now);
            bandpass.frequency.exponentialRampToValueAtTime(400, now + 0.04);
            bandpass.Q.value = 5;

            const gain = ctx.createGain();
            const peak = 0.003 + p * 0.0055;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(peak, now + 0.003);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

            carrier.connect(bandpass).connect(gain).connect(bus);
            carrier.start(now);
            carrier.stop(now + 0.06);
            mod.start(now);
            mod.stop(now + 0.06);
            return true;
        } catch (e) {
            
            return false;
        }
    },

    _applyLightCollisionAudioConfig() {
        const collisionSound = RCHIPL.CollisionSound;
        if (!collisionSound) return;
        collisionSound._trigger = () => {};
        collisionSound._enabled = true;
        if (collisionSound._config) {
            collisionSound._config.blobSquashThr = 0.038;
            collisionSound._config.bombSquashThr = 0.014;
            collisionSound._config.cooldownMs = 220;
            collisionSound._config.maxVoices = 2;
        }
    },

    _resetLightRuntimeAudioState() {
        this._lastAimNotch = 0;
        this._pivotAudioNotches = {};
        this._lightContactLastAt = 0;
        this._lightContactLastDeform = 0;
        this._stopAllPublishedLoopSlots(100);
    },

    _ensureLightAudioBoot() {
        if (this._lightAudioBootBound) return;
        this._lightAudioBootBound = true;
        const reapply = () => {
            this._applyLightCollisionAudioConfig();
            this._resetLightRuntimeAudioState();
        };
        reapply();
        RCHIPL.Events?.on?.('OnLevelStart', reapply);
        RCHIPL.Events?.on?.('OnLevelRestart', () => {
            this._applyLightCollisionAudioConfig();
            this._resetLightRuntimeAudioState();
        });
    },

    _playAimTickLight(progress = 0) {
        const n = Math.max(0, Math.min(1, Number(progress) || 0));
        if (this._playLightTick('aim', n)) return;
        this._playPublishedSfx('sfx_aim_tick', 0.002 + (n * 0.003));
    },

    _updatePivotTicksLight() {
        const pivots = RCHIPL.Pivot?._pivots || [];
        const seen = new Set();
        for (const pivot of pivots) {
            const body = pivot?.body;
            if (!body) continue;
            const id = String(pivot.id || body.id || '');
            if (!id) continue;
            seen.add(id);
            const angleDeg = ((((body.angle || 0) * 180 / Math.PI) % 360) + 360) % 360;
            const notch = Math.floor(angleDeg / 10);
            const angularSpeed = Math.abs(body.angularVelocity || 0);
            if (this._pivotAudioNotches[id] == null) {
                this._pivotAudioNotches[id] = notch;
                continue;
            }
            if (notch !== this._pivotAudioNotches[id]) {
                this._pivotAudioNotches[id] = notch;
                if (angularSpeed > 0.015) {
                    if (this._playLightTick('pivot', Math.min(1, angularSpeed * 12))) continue;
                    this._playPublishedSfx('sfx_aim_tick', 0.0012);
                }
            }
        }
        for (const id of Object.keys(this._pivotAudioNotches)) {
            if (!seen.has(id)) delete this._pivotAudioNotches[id];
        }
    },

    _ensureBackgroundMusicFileElement() {
        if (!this._usesBackgroundMusicFile()) return null;
        this._installBackgroundMusicFileHooks();
        if (this._backgroundMusicFileUnsupported) return null;

        const src = String(this._backgroundMusicFileSrc || '').trim();
        if (!src) return null;
        const mimeType = String(this._backgroundMusicFileMimeType || '').trim();
        if (mimeType) {
            try {
                const probe = new Audio();
                if (!probe.canPlayType || probe.canPlayType(mimeType) === '') {
                    this._backgroundMusicFileUnsupported = true;
                    return null;
                }
            } catch (_) {
                this._backgroundMusicFileUnsupported = true;
                return null;
            }
        }

        const existing = this._backgroundMusicFileEl;
        if (existing && existing._rchiplSrc === src) return existing;

        if (existing) {
            this._cancelBackgroundMusicFileFade();
            try { existing.pause(); } catch (_) {}
            this._backgroundMusicFileEl = null;
        }

        const el = new Audio(src);
        el.preload = 'auto';
        el.loop = true;
        el.playsInline = true;
        el.volume = 0;
        el._rchiplSrc = src;
        el.addEventListener('error', () => {
            
            this._backgroundMusicFileUnsupported = true;
            this._backgroundMusicStarted = false;
            this._backgroundMusicStartPromise = null;
        });
        this._backgroundMusicFileEl = el;
        return el;
    },

    _getBackgroundMusicGameplayVolume() {
        const editorMixVol = RCHIPL._projectData?.editorSettings?.mixer?.music != null
            ? (Number(RCHIPL._projectData.editorSettings.mixer.music) / 100)
            : null;
        const gameMixVol = RCHIPL._projectData?.audio?.gameMix?.musicVolume;
        return this._clampAudioVolume(editorMixVol ?? gameMixVol, this._backgroundMusicGameplayVolume);
    },

    _getBackgroundMusicMenuVolume() {
        return this._clampAudioVolume(
            this._getBackgroundMusicGameplayVolume() * this._backgroundMusicMenuVolumeRatio,
            0.34
        );
    },

    _getBackgroundMusicTargetForState() {
        return this.state === 'PLAYING'
            ? this._getBackgroundMusicGameplayVolume()
            : this._getBackgroundMusicMenuVolume();
    },

    _setBackgroundMusicVolume(volume = null, fadeMs = this._backgroundMusicFadeMs) {
        const target = this._clampAudioVolume(volume ?? this._getBackgroundMusicTargetForState(), 0);
        this._backgroundMusicTargetVolume = target;

        if (this._usesBackgroundMusicFile()) {
            if (!this._backgroundMusicStarted) return target;
            this._setBackgroundMusicFileElementVolume(this._getEffectiveBackgroundMusicVolume(target), fadeMs);
            return target;
        }

        if (!this._backgroundMusicStarted) {
            return target;
        }

        if (RCHIPL.Sampler?._setMusicBaseVolume) {
            RCHIPL.Sampler._setMusicBaseVolume(target, fadeMs);
        } else if (RCHIPL.Sampler?.setMusicVolume) {
            RCHIPL.Sampler.setMusicVolume(target);
        } else if (RCHIPL.Music) {
            RCHIPL.Music.masterVolume = target;
        }
        return target;
    },

    _ensureBackgroundMusic(volume = null, fadeMs = this._backgroundMusicFadeMs) {
        if (this._usesBackgroundMusicFile()) {
            const audioEl = this._ensureBackgroundMusicFileElement();
            if (!audioEl) return false;

            const target = this._clampAudioVolume(volume ?? this._backgroundMusicTargetVolume, 0);
            this._backgroundMusicTargetVolume = target;
            const effectiveTarget = this._getEffectiveBackgroundMusicVolume(target);

            if (!this._backgroundMusicUnlocked) {
                try { audioEl.load(); } catch (_) {}
                this._backgroundMusicStarted = false;
                this._setBackgroundMusicFileElementVolume(0, 0);
                return false;
            }

            if (!audioEl.paused && !audioEl.ended) {
                this._backgroundMusicStarted = true;
                this._setBackgroundMusicFileElementVolume(effectiveTarget, fadeMs);
                return true;
            }

            if (this._backgroundMusicStartPromise) {
                this._setBackgroundMusicFileElementVolume(effectiveTarget, fadeMs);
                return true;
            }

            // Skip non-gesture play() attempts once a previous play() has been
            // rejected by iOS. Each automatic call (family.onEnter on level change)
            // would otherwise spawn a new play() that pins a pending promise for
            // ~2s, blocking the real gesture-driven retry in tryUnlock. The flag
            // is cleared in tryUnlock which is always called inside a user gesture.
            if (this._backgroundMusicNeedsGestureRetry) {
                return true;
            }

            this._setBackgroundMusicFileElementVolume(0, 0);
            // Belt-and-braces: iOS ignores el.volume on HTMLMediaElement and only
                // respects el.muted. `_setBackgroundMusicFileElementVolume(0, 0)` above
                // does set el.muted = true, but if something else (ad unmute flip,
                // prime re-deriving _soundMuted from masterVolume, etc.) left el.muted
                // as false, the first few frames of play() would be audible at full
                // volume. Force mute directly from the authoritative _soundMuted flag
                // right before play() to close the race.
            if (this._soundMuted) {
                audioEl.muted = true;
            }
            let startResult = null;
            try {
                startResult = audioEl.play();
            } catch (err) {
                
                this._backgroundMusicStarted = false;
                this._backgroundMusicNeedsGestureRetry = true;
                return false;
            }

            this._backgroundMusicStarted = true;
            if (startResult && typeof startResult.then === 'function') {
                // iOS can leave the play() promise pending for tens of seconds before
                // rejecting when called outside a user gesture (e.g., automatic from
                // family.level.onEnter at boot). Race with a 2s timeout so the guard
                // clears quickly and the next user gesture can actually retry play().
                const timedPlay = Promise.race([
                    startResult,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('play timeout')), 2000))
                ]);
                this._backgroundMusicStartPromise = timedPlay
                    .then(() => {
                        this._backgroundMusicNeedsGestureRetry = false;
                        this._setBackgroundMusicFileElementVolume(this._getEffectiveBackgroundMusicVolume(this._backgroundMusicTargetVolume), fadeMs);
                    })
                    .catch((err) => {
                        
                        this._backgroundMusicStarted = false;
                        this._backgroundMusicNeedsGestureRetry = true;
                    })
                    .finally(() => {
                        this._backgroundMusicStartPromise = null;
                    });
            } else {
                this._setBackgroundMusicFileElementVolume(effectiveTarget, fadeMs);
            }
            return true;
        }

        const compId = this._backgroundMusicCompId;
        if (!compId) return false;
        if (!RCHIPL.Sampler?._audioData?.compositions?.[compId]) return false;

        const target = this._clampAudioVolume(volume ?? this._backgroundMusicTargetVolume, 0);
        this._backgroundMusicTargetVolume = target;

        const current = RCHIPL.Sampler?._compositionState;
        if (current?.compId === compId && !current.stopped) {
            this._backgroundMusicStarted = true;
            this._setBackgroundMusicVolume(target, fadeMs);
            return true;
        }

        if (this._backgroundMusicStartPromise) {
            this._setBackgroundMusicVolume(target, fadeMs);
            return true;
        }

        let startResult = null;
        try {
            startResult = RCHIPL.Sampler.playComposition(compId, { loop: true, volume: target });
        } catch (err) {
            
            this._backgroundMusicStarted = false;
            return false;
        }
        this._backgroundMusicStarted = true;
        if (startResult && typeof startResult.then === 'function') {
            this._backgroundMusicStartPromise = startResult
                .then(() => {
                    this._setBackgroundMusicVolume(this._backgroundMusicTargetVolume, fadeMs);
                })
                .catch((err) => {
                    
                    this._backgroundMusicStarted = false;
                })
                .finally(() => {
                    this._backgroundMusicStartPromise = null;
                });
        }
        return true;
    },

    _prewarmBackgroundMusic() {
        if (this._backgroundMusicPrewarmQueued) return;
        this._backgroundMusicPrewarmQueued = true;

        const run = async () => {
            if (this._usesBackgroundMusicFile()) {
                const audioEl = this._ensureBackgroundMusicFileElement();
                if (!audioEl) return;
                try { audioEl.load(); } catch (_) {}
                return;
            }

            const compId = this._backgroundMusicCompId;
            const sampler = RCHIPL.Sampler;
            const comp = sampler?._audioData?.compositions?.[compId];
            if (!sampler || !comp) return;
            try {
                if (sampler._shouldUseProgressiveLiveComposition?.(comp)) {
                    await sampler._ensureCompositionStartupBuffers?.(compId, comp);
                } else if (sampler._shouldUseCompositionMixdown?.(comp)) {
                    await sampler._ensureCompositionBuffer?.(compId, comp);
                } else if (sampler._supportsStemPlayback?.(comp)) {
                    await sampler._ensureStemSet?.(compId, comp);
                } else {
                    const needed = [];
                    sampler._collectCompositionSounds?.(comp, needed);
                    for (const entry of needed) {
                        await sampler._ensureBuffer?.(entry.soundId, entry.type, entry.params, entry.extra);
                    }
                }
            } catch (err) {
                
            }
        };

        if (typeof requestIdleCallback === 'function') {
            requestIdleCallback(() => { void run(); }, { timeout: 1200 });
        } else {
            setTimeout(() => { void run(); }, 0);
        }
    },

    _unlockBackgroundMusicFromInput() {
        this._backgroundMusicUnlocked = true;
        return this._ensureBackgroundMusic(this._getBackgroundMusicTargetForState(), this._backgroundMusicFadeMs);
    },

    _bindBackgroundMusicGestureUnlock() {
        if (this._backgroundMusicGestureUnlockBound) return;
        this._backgroundMusicGestureUnlockBound = true;
        const tryUnlock = () => {
            if (RCHIPL.Platform?._adInProgress) return;
            // iOS phone lock / wake: visibilitychange may not fire in Poki iframe
            // context when the screen turns off, so the lifecycle guard never runs
            // and Sampler._ctx stays suspended after wake — SFX go silent and the
            // mute gains have no effect. Resume on every gesture; idempotent when
            // already running so safe to call unconditionally.
            if (RCHIPL.Sampler?._ctx?.state === 'suspended') {
                RCHIPL.Sampler._ctx.resume().catch(() => {});
            }
            // First gesture: flip unlock flag and trigger initial play.
            if (!this._backgroundMusicUnlocked) {
                this._unlockBackgroundMusicFromInput();
                return;
            }
            // Already unlocked but music didn't actually start — iOS Safari often
            // rejects the first audioEl.play() even inside a gesture if the media
            // wasn't fully ready. Retry on every subsequent gesture until the audio
            // element is actually playing. Cheap no-op once it's running.
            const el = this._backgroundMusicFileEl;
            if (!el) return;
            if (!el.paused && !el.ended) return;
            if (this._backgroundMusicStartPromise) return;
            // We ARE in a user gesture here — clear the needs-retry flag so
            // _ensureBackgroundMusic actually attempts play() (it would skip
            // otherwise when called from non-gesture code paths like onEnter).
            this._backgroundMusicNeedsGestureRetry = false;
            this._ensureBackgroundMusic(this._getBackgroundMusicTargetForState(), this._backgroundMusicFadeMs);
        };
        window.addEventListener('pointerdown', tryUnlock, { passive: true });
        window.addEventListener('touchstart', tryUnlock, { passive: true });
        window.addEventListener('keydown', tryUnlock);
    },
