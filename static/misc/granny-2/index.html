<script>
window.SDK_OPTIONS = {
  gameId: "local",
  onEvent: function (a) {
    switch (a.name) {
      case "SDK_GAME_PAUSE":
        if (window.myGameInstance) { try { window.myGameInstance.SendMessage('AudioManager', 'MuteAudio'); } catch (e) {} }
        break;
      case "SDK_GAME_START":
        if (window.myGameInstance) { try { window.myGameInstance.SendMessage('AudioManager', 'UnmuteAudio'); } catch (e) {} }
        break;
    }
  }
};

(function () {
  function fire(name) {
    try {
      if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === 'function') {
        window.SDK_OPTIONS.onEvent({ name: name, message: '', status: 'success' });
      }
    } catch (e) {}
  }
  function resume() { setTimeout(function () { fire('SDK_GAME_START'); }, 0); }

  var api = {
    showBanner:   function () { resume(); return Promise.resolve(); },
    showAd:       function () { resume(); return Promise.resolve(); },
    showAdBanner: function () { resume(); return Promise.resolve(); },
    preloadAd:    function () { return Promise.resolve(); },
    preloadRewarded: function () { return Promise.resolve(); },
    showRewarded: function () { resume(); return Promise.resolve(); },
    openConsole:  function () {},
    msgrt:        function () {},
    pauseGame:    function () {},
    resumeGame:   function () { resume(); },
    setUserId:    function () {},
    getUserId:    function () { return ''; }
  };

  var noop = function () { return Promise.resolve(); };
  window.sdk = new Proxy(api, {
    get: function (t, p) {
      if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
      if (p in t) return t[p];
      if (typeof p === 'symbol') return undefined;
      return noop;
    }
  });
  window.gamemonetize = window.sdk;
  window.gameMonetize = window.sdk;

  setTimeout(function () { fire('SDK_READY'); }, 0);
})();
</script>

<script>
(function () {
  function res(v) { return Promise.resolve(v); }

      get: function (t, p) {
        if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
        if (typeof p === 'symbol') return undefined;
        return deep();

  var store = {};

      var o = {};
      for (var i = 0; i < keys.length; i++) if (store[keys[i]] !== undefined) o[keys[i]] = store[keys[i]];
      return res(o);
    },
    setData: function (d) { for (var k in d) store[k] = d[k]; persist(); return res(true); },
    getStats: function () { return res({}); },

    incrementStats: function () { return res({}); },
    getName: function () { return 'Player'; },

    getPlayerEntry: function () { var e = new Error('no entry'); e.code = 'LEADERBOARD_PLAYER_NOT_PRESENT'; return Promise.reject(e); },
    getLeaderboardPlayerEntry: function () { return lbApi.getPlayerEntry(); }

  var fsState = { status: 'off' };

  var base = {
    environment: {
      app: { id: '0' },
      browser: { lang: 'en' },
      i18n: { lang: 'en', tld: 'com' },
      payload: null
    },
    deviceInfo: {
      type: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',

      isTV: function () { return false; }
    },
    adv: {

        var c = (o && o.callbacks) || {};
        setTimeout(function () { try { c.onClose && c.onClose(false); } catch (e) {} }, 0);
      },
      showRewardedVideo: function (o) {
        var c = (o && o.callbacks) || {};
        setTimeout(function () {
          try { c.onOpen && c.onOpen(); } catch (e) {}
          try { c.onRewarded && c.onRewarded(); } catch (e) {}
          try { c.onClose && c.onClose(); } catch (e) {}
        }, 0);
      },
      showBannerAdv: function () { return res({ stickyAdvIsShowing: false, reason: 'adv_is_not_connected' }); },
      hideBannerAdv: function () { return res({ stickyAdvIsShowing: false }); },
      getBannerAdvStatus: function () { return res({ stickyAdvIsShowing: false, reason: 'adv_is_not_connected' }); }
    },
    features: {
      LoadingAPI: { ready: noop },
      GameplayAPI: { start: noop, stop: noop },
      GamesAPI: { getAllGames: function () { return res({ games: [], developerURL: '' }); } }
    },
    leaderboards: lbApi,
    getLeaderboards: function () { return res(lbApi); },
    getPlayer: function () { return res(playerObj); },
    getPayments: function () { return Promise.reject(new Error('payments unavailable')); },
    getStorage: function () { return res(window.localStorage); },
    getFlags: function () { return res({}); },
    feedback: {
      canReview: function () { return res({ value: false, reason: 'NO_AUTH' }); },
      requestReview: function () { return res({ feedbackSent: false }); }
    },
    shortcut: {
      canShowPrompt: function () { return res({ canShow: false }); },
      showPrompt: function () { return res({ outcome: 'dismissed' }); }
    },
    screen: {
      fullscreen: {
        get status() { return fsState.status; },
        request: function () {
          try {
            var el = document.documentElement;
            var fn = el.requestFullscreen || el.webkitRequestFullscreen;
            if (fn) { var r = fn.call(el); if (r && r.catch) r.catch(function () {}); }
          } catch (e) {}
          fsState.status = 'on'; return res(true);
        },
        exit: function () {
          try { if (document.exitFullscreen) { var r = document.exitFullscreen(); if (r && r.catch) r.catch(function () {}); } } catch (e) {}
          fsState.status = 'off'; return res(true);
        }
      }
    },
    auth: { openAuthDialog: function () { return Promise.reject(new Error('no auth')); } },
    isAvailableMethod: function () { return res(false); },
    dispatchEvent: function () { return res(true); },
    on: function () { return noop; },
    off: function () { return true; },
    EVENT_HISTORY_BACK: 'HISTORY_BACK',
    EVENT_GAME_API_PAUSE: 'game_api_pause',
    EVENT_GAME_API_RESUME: 'game_api_resume'
  };

  document.addEventListener('fullscreenchange', function () {
    fsState.status = document.fullscreenElement ? 'on' : 'off';
  });

  var proxied = new Proxy(base, {
    get: function (t, p) {
      if (p === 'then' || p === 'catch' || p === 'finally') return undefined;
      if (p in t) return t[p];
      if (typeof p === 'symbol') return undefined;
      return deep();
    }
  });

  window.YaGames = { init: function () { return res(proxied); } };
  window.yandexMetricaCounterId = 0;
  if (typeof window.ym !== 'function') window.ym = function () {};

<script>
(function () {
  var container      = document.querySelector('#unity-container');
  var canvas         = document.querySelector('#unity-canvas');
  var loadingBar     = document.querySelector('#unity-loading-bar');
  var progressBarFull= document.querySelector('#unity-progress-bar-full');
  var warningBanner  = document.querySelector('#unity-warning');

  window.myGameInstance = null;
  var isAdShown = false;

  function unityShowBanner(msg, type) {
    function updateBannerVisibility() {
      warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    var div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') div.style = 'background: red; padding: 10px;';
    else {
      if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
      setTimeout(function () { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
    }
    updateBannerVisibility();
  }

  function showAdOnClick() {
    if (isAdShown) return;
    isAdShown = true;
    try { window.sdk && window.sdk.showBanner(); } catch (e) {}
  }

  try {
    var rfs = Element.prototype.requestFullscreen;
    if (rfs) {
      Element.prototype.requestFullscreen = function () {
        try { var r = rfs.apply(this, arguments); if (r && r.catch) r.catch(function () {}); return r; }
        catch (e) { return Promise.resolve(); }
      };
    }
    var rpl = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = function () {
      try { var r = rpl.apply(this, arguments); if (r && r.catch) r.catch(function () {}); return r; } catch (e) {}
    };
  } catch (e) {}

  var CACHE_DB = 'g2_assets', CACHE_STORE = 'files', CACHE_TTL = 30 * 24 * 60 * 60 * 1000;
  var CACHE_MIN_FREE = 220 * 1024 * 1024;
  function flagOn(q, key) {
    try { if (new RegExp('[?&]' + q + '=1').test(location.search)) return true; } catch (e) {}
    try { return localStorage.getItem(key) === '1'; } catch (e) { return false; }
  }
  var cacheOn = !flagOn('nocache', 'g2_nocache');
  var cacheHits = 0, cacheMiss = 0, dbPromise = null;

  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (ok) { if (!ok) return navigator.storage.persist(); });
    }
  } catch (e) {}

  function cacheOpen() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve) {
      var done = false;
      function fin(v) { if (!done) { done = true; resolve(v); } }
      try {
        if (!cacheOn || !window.indexedDB) return fin(null);
        var rq = indexedDB.open(CACHE_DB, 1);
        rq.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(CACHE_STORE)) {
            var st = db.createObjectStore(CACHE_STORE, { keyPath: 'url' });
            st.createIndex('t', 't');
          }
        };
        rq.onsuccess = function (e) { fin(e.target.result); };
        rq.onerror = function () { fin(null); };
        rq.onblocked = function () { fin(null); };
        setTimeout(function () { fin(null); }, 8000);
      } catch (e) { fin(null); }
    });
    return dbPromise;
  }
  function cacheTx(mode) {
    return cacheOpen().then(function (db) {
      if (!db) return null;
      try { return db.transaction(CACHE_STORE, mode); } catch (e) { return null; }
    });
  }
  function cacheGet(url) {
    return cacheTx('readonly').then(function (tx) {
      if (!tx) return null;
      return new Promise(function (resolve) {
        try {
          var rq = tx.objectStore(CACHE_STORE).get(url);
          rq.onsuccess = function () {
            var v = rq.result;
            resolve(v && v.buf && (Date.now() - v.t) < CACHE_TTL ? v.buf : null);
          };
          rq.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    }).catch(function () { return null; });
  }
  function cachePut(url, buf) {
    if (!cacheOn) return Promise.resolve();
    return cacheTx('readwrite').then(function (tx) {
      if (!tx) return;
      return new Promise(function (resolve) {
        try {
          tx.oncomplete = function () { resolve(); };
          tx.onerror = tx.onabort = function () {
            if ((tx.error && tx.error.name) === 'QuotaExceededError') { cacheOn = false; cacheSweep(null, 10); }
            resolve();
          };
          tx.objectStore(CACHE_STORE).put({ url: url, buf: buf, t: Date.now() });
        } catch (e) { resolve(); }
      });
    }).catch(function () {});
  }
  function cacheSweep(cutoff, limit) {
    return cacheTx('readwrite').then(function (tx) {
      if (!tx) return;
      try {
        var st = tx.objectStore(CACHE_STORE);
        var range = cutoff ? IDBKeyRange.upperBound(cutoff) : null;
        var n = 0;
        var rq = st.index('t').openCursor(range);
        rq.onsuccess = function () {
          var c = rq.result; if (!c) return;
          if (limit && n >= limit) return;
          try { c.delete(); } catch (e) {}
          n++; c.continue();
        };
      } catch (e) {}
    }).catch(function () {});
  }
  cacheSweep(Date.now() - CACHE_TTL, 0);
  try {
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (s) {
        if (s && s.quota && s.usage !== undefined && (s.quota - s.usage) < CACHE_MIN_FREE) cacheOn = false;
      }).catch(function () {});
    }
  } catch (e) {}

  function cacheFetch(url) {
    return cacheGet(url).then(function (hit) {
      if (hit) { cacheHits++; return hit; }
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error(r.status + ': ' + url);
        return r.arrayBuffer();
      }).then(function (buf) { cacheMiss++; cachePut(url, buf); return buf; });
    });
  }

  function mergeFiles(parts, type, onProgress) {
    var loaded = 0, total = parts.length;
    return Promise.all(parts.map(function (p) {
      return cacheFetch(p).then(function (buf) {
        loaded++;
        if (onProgress) onProgress(loaded / total);
        return buf;
      });
    })).then(function (bufs) {
      return URL.createObjectURL(new Blob(bufs, { type: type }));
    });
  }

  var BASE = 'https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main';
  var buildUrl = BASE + '/Build';
  var loaderUrl = buildUrl + '/Granny 2.loader.js';

  var dataParts = [
    '/misc/granny-2/_ext/cdn.jsdelivr.net/gh/events-files-manager/responsive%40090adb8/Build/Granny 2_part1.data',
    '/misc/granny-2/_ext/cdn.jsdelivr.net/gh/events-files-manager/responsive%40090adb8/Build/Granny 2_part2.data',
    '/misc/granny-2/_ext/cdn.jsdelivr.net/gh/events-files-manager/responsive%40090adb8/Build/Granny 2_part3.data'
  ];
  var wasmParts = [
    '/misc/granny-2/_ext/cdn.jsdelivr.net/gh/events-files-manager/stles%40e37df5d/f/Granny 2_part1.wasm',
    '/misc/granny-2/_ext/cdn.jsdelivr.net/gh/events-files-manager/stles%40e37df5d/f/Granny 2_part2.wasm'
  ];

  function initializeGame() {
    loadingBar.style.display = 'block';

    mergeFiles(dataParts, 'application/octet-stream', function (p) {
      progressBarFull.style.width = (50 * p) + '%';
    }).then(function (dataUrl) {
      return mergeFiles(wasmParts, 'application/wasm', function (p) {
        progressBarFull.style.width = (50 + 50 * p) + '%';
      }).then(function (wasmUrl) {
        return { dataUrl: dataUrl, wasmUrl: wasmUrl };
      });
    }).then(function (u) {
      var config = {
        dataUrl:            u.dataUrl,
        frameworkUrl:       buildUrl + '/Granny 2.frameworkx.js',
        codeUrl:            u.wasmUrl,
        streamingAssetsUrl: BASE + '/StreamingAssets',
        companyName:        'Awesome',
        productName:        'Granny 2',
        productVersion:     '1.0',
        showBanner:         unityShowBanner
      };

      var script = document.createElement('script');
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + '%';
        }).then(function (unityInstance) {
          window.myGameInstance = unityInstance;
          setTimeout(function () { loadingBar.style.display = 'none'; }, 500);
          canvas.addEventListener('pointerdown', showAdOnClick);
          canvas.addEventListener('touchstart', showAdOnClick);
          try { canvas.focus(); } catch (e) {}
        }).catch(function (message) {
          unityShowBanner('Could not start the game. Please reload the page.', 'error');
          console.error(message);
        });
      };
      script.onerror = function () { unityShowBanner('Loader could not be loaded.', 'error'); };
      document.body.appendChild(script);
    }).catch(function (e) {
      unityShowBanner('Game files could not be downloaded. Please reload the page.', 'error');
      console.error(e);
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (!window.myGameInstance) return;
    try {
      window.myGameInstance.SendMessage('AudioManager', document.hidden ? 'MuteAudio' : 'UnmuteAudio');
    } catch (e) {}
  });

  document.addEventListener('pointerdown', function () {
    try { window.focus(); canvas.focus(); } catch (e) {}
  });

  initializeGame();
})();
</script>
