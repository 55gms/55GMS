	<script>
	// Poki user-API bridge for Unity (2026-10-05, Aquapark.io).
	// The build's boot (ABTestLoader) waits for getUser/getToken replies before it loads anything.
	// /scripts/sdk.js?v=22 defines window.getUser/getToken/login but never learns the Unity bridge
	// object's name (its pokiBridgeObjectName is never assigned), so those replies were dropped and
	// the game sat on its splash screen forever. This captures the name from initPokiBridge (defined
	// later by /scripts/unity-2020.js) and answers the way Poki's own loader does for a logged-out
	// player: getUser -> "{}", getToken -> rejected, login -> rejected.
	(function () {
		var bridge = null, initFn = null;
		function send(m, a) {
			try {
				if (!window.unityGame || !bridge) return;
				if (a === undefined) window.unityGame.SendMessage(bridge, m); else window.unityGame.SendMessage(bridge, m, a);
			} catch (e) {}
		}
		function settle(fn, ok, fail) {
			try { Promise.resolve(fn()).then(ok, fail); } catch (e) { fail(); }
		}
		var mine = {
			getUser: function () { settle(function () { return window.PokiSDK && PokiSDK.getUser(); }, function (u) { send("getUserResolved", JSON.stringify(u || {})); }, function () { send("getUserRejected"); }); },
			getToken: function () { settle(function () { return window.PokiSDK && PokiSDK.getToken(); }, function (t) { if (t) send("getTokenResolved", t); else send("getTokenRejected"); }, function () { send("getTokenRejected"); }); },
			login: function () { send("loginRejected"); }
		};
		try {
			Object.defineProperty(window, "initPokiBridge", { configurable: true,
				get: function () { return initFn && function (n) { bridge = n; return initFn.apply(this, arguments); }; },
				set: function (f) { initFn = f; } });
			Object.keys(mine).forEach(function (k) {
				Object.defineProperty(window, k, { configurable: true, get: function () { return mine[k]; }, set: function () {} });
			});
		} catch (e) {}
	})();
	</script>
