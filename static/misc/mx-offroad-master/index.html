<!DOCTYPE html>
<html lang="en-us">
  <head>
  <script src="/assets/js/save-agent.js?v=4"></script>
  <script
    src="https://cdn.jsdelivr.net/gh/55gms/gms-ads@b995962daa60e71ea2ab3bdaf6e10f8c6853a7fe/embed/dist/sdk.min.js"
    integrity="sha384-TshTwF2bDJgpoZFNenR6Wn1Ldh7BMyNG42LqxG2OTTuBEUk0+Nabn9pIPCWz5AIT"
    crossorigin="anonymous"
    data-game-id="mx-offroad-master"
    data-compat="gamedistribution"
  ></script>
    <meta charset="utf-8">
    <script src="/assets/js/loader-ui.js?v=5gz9swuael"></script>
    <script src="/assets/js/game-loader.js?v=5gz9swuael" data-title="MX OffRoad Master"></script>
    <base href="https://cdn.jsdelivr.net/gh/55gms/assets@ef898ca80a6b89faf73fe23270939ef9cd737338/misc/mx-offroad-master/" />
    <script id="gamedistribution-jssdk" src="gd-sdk.js"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MX OffRoad Master</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const hideFullScreenButton = "1";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/MXOffroadMasterv15.loader.js";
      const config = {
        dataUrl: buildUrl + "/MXOffroadMasterv15.data.unityweb",
        frameworkUrl: buildUrl + "/MXOffroadMasterv15.framework.js.unityweb",
        codeUrl: buildUrl + "/MXOffroadMasterv15.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Rhm Interactive",
        productName: "MX Offroad Master",
        productVersion: "1",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      canvas.style.background = "url('" + buildUrl + "/MXOffroadMasterv15.jpg') center / cover";
      loadingCover.style.display = "";

      (async () => {
        const B = "Build/MXOffroadMasterv15";
        const data = [
          [B + ".data.unityweb.part1", 10000000],
          [B + ".data.unityweb.part2", 10000000],
          [B + ".data.unityweb.part3", 10000000],
          [B + ".data.unityweb.part4", 10000000],
          [B + ".data.unityweb.part5", 10000000],
          [B + ".data.unityweb.part6", 10000000],
          [B + ".data.unityweb.part7", 10000000],
          [B + ".data.unityweb.part8", 10000000],
          [B + ".data.unityweb.part9", 10000000],
          [B + ".data.unityweb.part10", 10000000],
          [B + ".data.unityweb.part11", 10000000],
          [B + ".data.unityweb.part12", 1592279],
        ];
        const wasm = [[B + ".wasm.unityweb", 5935546]];
        const framework = [[B + ".framework.js.unityweb", 77133]];
        const loader = [[B + ".loader.js", 110629]];
        GameLoader.prepare([...data, ...wasm, ...framework, ...loader]);
        const paths = (files) => files.map(([path]) => path);
        const [dataUrl, codeUrl, frameworkUrl, loaderUrl2] = await Promise.all([
          GameLoader.merge(paths(data)),
          GameLoader.merge(paths(wasm), "application/wasm"),
          GameLoader.merge(paths(framework), "application/javascript"),
          GameLoader.merge(paths(loader), "application/javascript"),
        ]);
        await GameLoader.script(loaderUrl2);
        config.dataUrl = dataUrl;
        config.codeUrl = codeUrl;
        config.frameworkUrl = frameworkUrl;
        config.streamingAssetsUrl = new URL("StreamingAssets", document.baseURI).href;
        await createUnityInstance(canvas, config);
        loadingCover.style.display = "none";
        GameLoader.finish();
      })().catch(GameLoader.fail);
    </script>
  </body>
</html>
