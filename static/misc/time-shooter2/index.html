  <div id="unity-fullscreen-button" style="display: none"></div>
  <script>
    const hideFullScreenButton = "1";
    const buildUrl = "Build";
    const loaderUrl = "TimeShooter2_Yandex.loader.js";
    const config = {
      dataUrl: "TimeShooter2_Yandex.data.unityweb",
      frameworkUrl: "TimeShooter2_Yandex.framework.js.unityweb",
      codeUrl: "TimeShooter2_Yandex.wasm.unityweb",
      streamingAssetsUrl: new URL("StreamingAssets", document.baseURI).href,
      companyName: "GoGoMan",
      productName: "Time Shooter 2",
      productVersion: "0.1",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector(
      "#unity-progress-bar-empty"
    );
    const progressBarFull = document.querySelector(
      "#unity-progress-bar-full"
    );
    const fullscreenButton = document.querySelector(
      "#unity-fullscreen-button"
    );
    const spinner = document.querySelector(".spinner");

    const canFullscreen = (function () {
      for (const key of [
        "exitFullscreen",
        "webkitExitFullscreen",
        "webkitCancelFullScreen",
        "mozCancelFullScreen",
        "msExitFullscreen",
      ]) {
        if (key in document) {
          return true;
        }
      }
      return false;
    })();

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }
    canvas.style.background = "url('TimeShooter2_Yandex.jpg') center / cover";
    loadingCover.style.display = "";

    const loaderScript = document.createElement("script");
    loaderScript.src = loaderUrl;
    loaderScript.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      })
        .then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadData();
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        })
        .catch((message) => {
          alert(message);
        });
    };
    document.body.appendChild(loaderScript);
  </script>
  <script src="v2.js"></script>


  <script type="text/javascript">
    var player = null;
    var sdk;
    var payments = null;

    YaGames.init({
      adv: {
        onAdvClose: (wasShown) => {
          console.info("adv closed!");
        },
      },
    }).then((ysdk) => {
      sdk = ysdk;
      ysdk
        .getPlayer({ signed: true })
        .then((_player) => {
          player = _player;
        })
        .catch((err) => { });
      sdk.adv.showFullscreenAdv({ callbacks: {} });
    });

    // Off Yandex the SDK reports its Russian defaults, so always start as
    // the .com build in English (0 Russian, 1 English, 2 Turkish).
    function checkCom() {
      window.unityInstance.SendMessage("GameManager", "IsCom", 1);
    }

    function checkLanguage() {
      window.unityInstance.SendMessage("GameManager", "SetLanguage", 1);
    }

    // There is no Yandex player here (the SDK cannot init outside Yandex),
    // so progress lives in this browser under the names the player API used.
    var SAVE_KEY = "time-shooter2-data";

    function readSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function loadData() {
      checkCom();
      var data = readSave();
      if (!data.levels) return;
      var dataStr = [
        data.levels,
        data.sounds ? 1 : 0,
        data.music ? 1 : 0,
        data.language,
        data.tutor ? 1 : 0,
        data.sensitivity,
      ].join(" ");
      console.log("Get Data ", dataStr);
      window.unityInstance.SendMessage("GameManager", "LoadData", dataStr);
    }
  </script>

  <script>
    function saveData(level, isSound, isMusic, language, tutor, sensitivity) {
      var data = readSave();
      // Like the Yandex version, never move the level back.
      if (data.levels && data.levels > level) level = data.levels;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          levels: level,
          sounds: isSound,
          music: isMusic,
          language: language,
          tutor: tutor,
          sensitivity: sensitivity,
        }));
      } catch (e) {
        console.error("Save error:", e.message);
      }
    }
  </script>
