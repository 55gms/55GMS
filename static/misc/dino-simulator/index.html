 <!-- Defer lets the initial text paint while the SDK downloads. It runs before bootstrap.js. -->
 <script defer src="poki-sdk.js"></script>
 <!-- On a dev host every file is fetched under its own content hash, the shell included. The
      ?nocache stamp busts the page, but a static import resolves bare, and with no Cache-Control
      from the server a browser is free to serve whichever copy of a module it holds; an iPhone
      did, and the page died at link time on an export the old copy never had. An import map
      applies to relative specifiers once resolved, so one that sends every module of the build
      to itself plus its hash makes a changed module a new URL and an unchanged one a cached
      one. The same table stamps the art through window.__NOCACHE_URL. It is script/files.json,
      written by the upload beside the build; a checkout has none and uses the load's stamp, as
      it always did. Read synchronously: the map has to be in the document before the first
      module script is. -->
 <script>
(function () {
 var stamp = Date.now()
 var table = null
 if (window.__IS_DEV) {
  try {
   var request = new XMLHttpRequest()
   request.open('GET', 'script/files.json?nocache=' + stamp, false)
   request.send(null)
   if (request.status === 200) table = JSON.parse(request.responseText)
  } catch (e) { console.warn('[boot] files not stamped:', e) }
 }
 window.__FILE_STAMPS = table
 window.__FILE_STAMP = function (url) {
  try { return (table && table[new URL(url, location.href).pathname.slice(new URL('.', location.href).pathname.length)]) || '' } catch (e) { return '' }
 }
 var shell = 'bootstrap.js' + (window.__IS_DEV ? '?' + (table && table['bootstrap.js'] ? 'v=' + table['bootstrap.js'] : 'nocache=' + stamp) : '')
 if (table) {
  var imports = {}, count = 0
  for (var path in table) {
   if (!/\.m?js$/.test(path)) continue
   var full = new URL(path, location.href).pathname
   imports[full] = full + '?v=' + table[path]
   count++
  }
  window.__STAMPED_MODULES = count
  document.write('<script type="importmap">' + JSON.stringify({ imports: imports }) + '<\/script>')
 }
 document.write('<script type="module" src="' + shell + '"><\/script>')
})()
</script>
