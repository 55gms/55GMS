<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 Seconds! Reatomized</title>
    <link rel="stylesheet" href="/assets/css/game-loader.css">
    <!-- .js/.css are cached for a day: bump ?v= whenever these files change. -->
    <link rel="stylesheet" href="/misc/60-seconds-reatomized/loader.css?v=2">
    <script defer src="/assets/js/game-loader.js?v=2"></script>
    <script defer src="/misc/60-seconds-reatomized/load.js?v=2"></script>
    <base href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/">
  </head>
  <body>
    <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="game-loading" data-total-mb="133.35">
      <div class="loader">
        <p class="loader-brand">
          <span class="loader-mark" aria-hidden="true">55</span>
          <span>55GMS</span>
          <span class="loader-slash" aria-hidden="true">/</span>
          <span class="loader-crumb">Games</span>
        </p>
        <h1 class="loader-title">60 Seconds! Reatomized</h1>
        <div class="loader-live" role="status" aria-live="polite" aria-atomic="true">
          <span class="loader-spinner" aria-hidden="true"></span>
          <p id="game-loading-text" class="loader-status">Preparing download</p>
          <p class="loader-detail">
            A required game file could not be downloaded.<br>
            Reload the page to try again.
          </p>
        </div>
        <div class="loader-progress">
          <div
            class="loader-track"
            role="progressbar"
            aria-label="Download progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="game-loading-bar" class="loader-fill"></div>
          </div>
          <div class="loader-meta" aria-hidden="true">
            <span id="game-loading-amount">0.00 MB / 133.35 MB</span>
            <span id="game-loading-percent">0%</span>
          </div>
        </div>
        <button id="game-loading-reload" class="loader-reload" type="button">
          Reload
        </button>
      </div>
    </div>
  </body>
</html>
