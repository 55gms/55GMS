/* ── PART İNDİRME ─────────────────────────────────────────── */
async function fetchParts(baseUrl, partCount, label) {
  var parts = [];
  for (var i = 0; i < partCount; i++) {
    loadLabel.textContent = label + ' ' + (i+1) + '/' + partCount + '...';
    var r = await fetch(baseUrl + '.part' + i);
    if (!r.ok) throw new Error('part' + i + ': HTTP ' + r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
  }
  var total  = parts.reduce(function(s,p){ return s+p.length; }, 0);
  var merged = new Uint8Array(total);
  var off = 0;
  for (var j = 0; j < parts.length; j++){ merged.set(parts[j], off); off += parts[j].length; }
  return merged;
}

function brotliBlobUrl(uint8, filename) {
  var blob = new Blob([uint8], { type:'application/octet-stream' });
  return URL.createObjectURL(blob) + '#' + encodeURIComponent(filename);
}

/* ── PAYMENTS ─────────────────────────────────────────────── */
function InitPayments() {
  return new Promise(function(resolve){
    try {
      if (!ysdk){ Final(NO_DATA); return; }
      ysdk.getPayments().then(function(_p){
        payments=_p;
        payments.getCatalog().then(function(products){
          payments.getPurchases().then(function(purchases){
            var ids=[],titles=[],descs=[],imgs=[],prices=[],priceVals=[],codes=[],imgURLs=[],cons=[];
            for(var i=0;i<products.length;i++){
              ids[i]=products[i].id; titles[i]=products[i].title;
              descs[i]=products[i].description; imgs[i]=products[i].imageURI;
              prices[i]=products[i].price; priceVals[i]=products[i].priceValue;
              codes[i]=products[i].priceCurrencyCode;
              imgURLs[i]=products[i].getPriceCurrencyImage("medium");
              cons[i]=!purchases.some(function(p){ return p.productID===ids[i]; });
            }
            Final(JSON.stringify({id:ids,title:titles,description:descs,imageURI:imgs,
              price:prices,priceValue:priceVals,priceCurrencyCode:codes,
              currencyImageURL:imgURLs,consumed:cons,
              language:ysdk.environment.i18n.lang}));
          });
        });
      }).catch(function(){ LogStyledMessage('Purchases not available'); Final(NO_DATA); });
    } catch(e){ console.error(e); Final(NO_DATA); }
    function Final(r){ paymentsData=r; YG2Instance('PaymentsEntries',r); resolve(r); }
  });
}
function BuyPayments(id) {
  try {
    if (!payments){ YG2Instance('OnPurchaseFailed',id); return; }
    payments.purchase(id).then(function(){ LogStyledMessage('Purchase OK'); ConsumePurchase(id,true); FocusGame(); })
      .catch(function(e){ console.error(e); YG2Instance('OnPurchaseFailed',id); FocusGame(); });
  } catch(e){ console.error(e); YG2Instance('OnPurchaseFailed',id); FocusGame(); }
}
function ConsumePurchase(id, ok) {
  try {
    if (!payments) return;
    payments.getPurchases().then(function(ps){
      for(var i=0;i<ps.length;i++){
        if(ps[i].productID===id){
          payments.consumePurchase(ps[i].purchaseToken);
          if(ok) YG2Instance('OnPurchaseSuccess',id);
        }
      }
    });
  } catch(e){ console.error(e); }
}
function ConsumePurchases(ok) {
  try {
    if (!payments) return;
    payments.getPurchases().then(function(ps){
      for(var i=0;i<ps.length;i++){
        payments.consumePurchase(ps[i].purchaseToken);
        if(ok) YG2Instance('OnPurchaseSuccess',ps[i].productID);
      }
    });
  } catch(e){ console.error(e); }
}

    try {
      ysdk.shortcut.canShowPrompt().then(function(p){
        if(p.canShow){ gameLabelData='true'; resolve('true'); }
        else resolve('false');
      });
    } catch(e){ console.error(e); resolve('false'); }
  });
}
function GameLabelShowDialog() {
  try {
    ysdk.shortcut.showPrompt().then(function(r){
      YG2Instance(r.outcome==='accepted'?'OnGameLabelSuccess':'OnGameLabelFail');
      FocusGame();
    });
  } catch(e){ console.error(e); FocusGame(); }
}

/* ── FLAGS ────────────────────────────────────────────────── */
function GetFlags() {
  return new Promise(function(resolve){
    if (!ysdk){ Final(NO_DATA); return; }
    try {
      ysdk.getFlags().then(function(flags){
        var names=[],values=[];
        for(var k in flags){ if(flags.hasOwnProperty(k)){ names.push(k); values.push(flags[k]); } }
        Final(JSON.stringify({names:names,values:values}));
      });
    } catch(e){ console.error(e); Final(NO_DATA); }
    function Final(r){ flasgsData=r; resolve(r); }
  });
}

/* ── ENVIRONMENT ──────────────────────────────────────────── */
function RequestingEnvironmentData() {
  return new Promise(function(resolve){
    if (!ysdk){ Final(NO_DATA); return; }
    try {
      var ua=navigator.userAgent, browser;
      if(ua.includes('YaBrowser')||ua.includes('YaSearchBrowser')) browser='Yandex';
      else if(ua.includes('Opera')||ua.includes('OPR')) browser='Opera';
      else if(ua.includes('Firefox')) browser='Firefox';
      else if(ua.includes('MSIE')) browser='IE';
      else if(ua.includes('Edge')) browser='Edge';
      else if(ua.includes('Chrome')) browser='Chrome';
      else if(ua.includes('Safari')) browser='Safari';
      else browser='Other';
      Final(JSON.stringify({
        language:   ysdk.environment.i18n.lang,
        domain:     ysdk.environment.i18n.tld,
        deviceType: ysdk.deviceInfo.type,
        isMobile:   ysdk.deviceInfo.isMobile(),
        isDesktop:  ysdk.deviceInfo.isDesktop(),
        isTablet:   ysdk.deviceInfo.isTablet(),
        isTV:       ysdk.deviceInfo.isTV(),
        appID:      ysdk.environment.app.id,
        browserLang:ysdk.environment.browser.lang,
        payload:    ysdk.environment.payload,
        platform:   navigator.platform,
        browser:    browser
      }));
    } catch(e){ console.error(e); Final(NO_DATA); }
    function Final(r){ environmentData=r; YG2Instance('SetEnvirData',r); resolve(r); }
  });
}

/* ── PLAYER ───────────────────────────────────────────────── */
async function InitPlayer() {
  return new Promise(async function(resolve){
    try {
      if (!ysdk) return Final(NotAuthorized(false));
      player = await ysdk.getPlayer();
      if (!player.isAuthorized()) return Final(NotAuthorized());
      return Final(JSON.stringify({
        playerAuth:'resolved', playerName:player.getName(),
        playerId:player.getUniqueID(), playerPhoto:player.getPhoto('medium'),
        payingStatus:player.getPayingStatus()
      }));
    } catch(e){ console.error(e); return Final(NotAuthorized(false)); }
    function Final(r){ playerData=r; YG2Instance('SetAuth',r); resolve(r); }
  });
}
function NotAuthorized(isInitSDK) {
  if (isInitSDK===undefined) isInitSDK=true;
  return JSON.stringify({
    playerAuth:'rejected', playerName:'unauthorized',
    playerId: isInitSDK&&player ? player.getUniqueID() : 'unauthorized',
    playerPhoto:'no data', payingStatus:'unknown'
  });
}
function OpenAuthDialog() {
  if (!ysdk) return;
  try {
    ysdk.auth.openAuthDialog().then(function(){
      InitPlayer().then(function(){ YG2Instance('LoggedIn'); });
    });
  } catch(e){ console.error(e); }
}

document.body.appendChild(script);
</script>
