  <script>
    // Online play is on the 55GMS multiplayer server (github.com/55gms/multiplayer,
    // games/kartbros, which serves Bike Bros at bikebros), not Blue Wizard's: the game's socket
    // (wss://kart<xx>.kartbros.io/<n>) and its region ping
    // (https://kart<xx>.kartbros.io/ping) go to /api/mp/bikebros/ on this host.
    // Locally: localStorage["gms-mp-base"] = "ws://localhost:8093/api/mp"
    (() => {
      let base = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/api/mp";
      try {
        base = localStorage.getItem("gms-mp-base") || base;
      } catch (e) {}
      const httpBase = base.replace(/^ws/, "http");
      const region = (host) => {
        const m = /^kart([a-z]{2})\.kartbros\.io$/i.exec(host);
        return m && m[1].toUpperCase();
      };
      const Native = window.WebSocket;
      function KartSocket(url, protocols) {
        try {
          const u = new URL(String(url), location.href);
          const r = /^wss?:$/.test(u.protocol) && region(u.hostname);
          if (r) url = base + "/bikebros/play?region=" + r;
        } catch (e) {}
        return protocols == null ? new Native(url) : new Native(url, protocols);
      }
      KartSocket.prototype = Native.prototype;
      for (const k of ["CONNECTING", "OPEN", "CLOSING", "CLOSED"]) KartSocket[k] = Native[k];
      window.WebSocket = KartSocket;

      const pingUrl = (url) => {
        try {
          const u = new URL(String(url), location.href);
          const r = u.pathname === "/ping" && region(u.hostname);
          if (r) return httpBase + "/bikebros/ping?region=" + r;
        } catch (e) {}
        return null;
      };
      // The tracks are Addressables bundles the game asks for next to the page
      // (TrackContent/WebGL/…); they are in the assets repo, under <base>.
      const tracks = location.pathname.replace(/[^/]*$/, "") + "TrackContent/";
      const trackUrl = (url) => {
        try {
          const u = new URL(String(url), location.href);
          if (u.origin === location.origin && u.pathname.startsWith(tracks)) {
            return new URL(u.pathname.slice(tracks.length - "TrackContent/".length), document.baseURI).href;
          }
        } catch (e) {}
        return null;
      };
      const rewrite = (url) => pingUrl(url) || trackUrl(url);
      const nativeFetch = window.fetch;
      window.fetch = function (input, init) {
        const url = typeof input === "string" || input instanceof URL ? String(input) : input && input.url;
        return nativeFetch.call(this, (url && rewrite(url)) || input, init);
      };
      const open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        return open.call(this, method, rewrite(url) || url, ...rest);
      };
    })();
  </script>

  <script>
    // Stand-ins for the page's ad, analytics and session hooks the game calls
    // (BikeBrosAds bridge, SendEvent). Nothing is shown and no rewards are granted;
    // every video request completes straight back to the game.
    function SendEvent() {}
    function GA4_SendEvent() {}
    function completeVideoAd() {
      if (window.unityInstance) {
        try { window.unityInstance.SendMessage("AdsManager", "OnVideoAdCompleted"); } catch (e) {}
      }
      window.focus();
      var c = document.getElementById("unity-canvas");
      if (c) c.focus();
    }
    function LoadVideo() {}
    function ShowVideo() { setTimeout(completeVideoAd, 0); }
    ["ShowAd0", "ShowAd1", "ShowAd2", "ShowAd3", "ShowAd4", "ShowAd6", "ShowAd7", "ShowAd8", "ShowAd9", "ShowAd10"].forEach(function (n) { window[n] = function () {}; });
    window.BikeBrosAds = {
      provider: "none",
      isMsStart: function () { return false; },
      showBanner: function () { return false; },
      refreshBanner: function () { return false; },
      forceAipBanner: function () { return false; },
      hideBanner: function () { return false; },
      showVideo: function () { ShowVideo(); return true; },
      loadVideo: LoadVideo
    };
  </script>

  <canvas id="unity-canvas" tabindex="-1" onblur="window.focus(); window.scrollTo(0, 0);"></canvas>
  <script>
    (async () => {
      const data = [["Build/d2d4abcbed33b53ddbc49506d4beba91.data", 16081212]];
      const wasm = [
        ["Build/1335248c0b322785ee6a5fc8e217125b.wasm.part1", 10000000],
        ["Build/1335248c0b322785ee6a5fc8e217125b.wasm.part2", 10000000],
        ["Build/1335248c0b322785ee6a5fc8e217125b.wasm.part3", 8812077],
      ];
      const framework = [["Build/c89429ecd0bc28dba38b6ba49b789706.framework.js", 372664]];
      const loader = [["Build/96b075ebac401afce219dcbac451e193.loader.js", 28051]];
      GameLoader.prepare([...data, ...wasm, ...framework, ...loader]);

      const paths = (files) => files.map(([path]) => path);
      const [dataUrl, codeUrl, frameworkUrl, loaderUrl] = await Promise.all([
        GameLoader.merge(paths(data)),
        GameLoader.merge(paths(wasm), "application/wasm"),
        GameLoader.merge(paths(framework), "application/javascript"),
        GameLoader.merge(paths(loader), "application/javascript"),
      ]);
      await GameLoader.script(loaderUrl);

      const canvas = document.getElementById("unity-canvas");
      window.unityInstance = await createUnityInstance(canvas, {
        arguments: [],
        dataUrl,
        codeUrl,
        frameworkUrl,
        streamingAssetsUrl: new URL("StreamingAssets", document.baseURI).href,
        companyName: "BlueWizard",
        productName: "BIKE BROS!",
        productVersion: "1.19",
        showBanner(message, type) {
          type === "error" ? GameLoader.fail(new Error(message)) : console.warn(message);
        },
      });
      GameLoader.finish();
      canvas.focus();
    })().catch(GameLoader.fail);
  </script>
