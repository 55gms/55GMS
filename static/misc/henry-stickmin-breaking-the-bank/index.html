<html>
    <head>
<base href="https://cdn.jsdelivr.net/gh/55gms/55gms@main/static/misc/henry-stickmin-breaking-the-bank/">


      <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breaking the Bank | </title>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <script src="lib/ruffle/ruffle.js"></script>

    <div id="ruffle" width="100%" height="100%"></div>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("breaking-the-bank.swf");
      });
    </script>
  </body>
</html>
