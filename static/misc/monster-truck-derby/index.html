    // ===== CHUNKED DATA LOADER =====
    async function loadChunkedDataFile(onProgress) {
        const chunks = [];
        let totalLoaded = 0;
        
        for (let i = 0; i < DATA_CHUNK_COUNT; i++) {
            const chunkUrl = DATA_CHUNK_BASE_URL + i;
            console.log("Loading chunk " + i + "/" + (DATA_CHUNK_COUNT - 1) + ": " + chunkUrl);
            
            try {
                const response = await fetch(chunkUrl);
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                chunks.push(arrayBuffer);
                totalLoaded += arrayBuffer.byteLength;
                
                // Progress: 0-50% for data loading
                if (onProgress) {
                    const dataProgress = totalLoaded / ESTIMATED_TOTAL_SIZE;
                    onProgress(Math.min(dataProgress * 0.5, 0.5));
                }
                
                console.log("Chunk " + i + " loaded: " + (arrayBuffer.byteLength / 1024 / 1024).toFixed(2) + " MB");
            } catch (e) {
                console.error("Failed to load chunk " + i + ": " + e.message);
                throw e;
            }
        }
        
        // Combine all chunks
        const totalSize = chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
        const combined = new Uint8Array(totalSize);
        let offset = 0;
        
        for (const chunk of chunks) {
            combined.set(new Uint8Array(chunk), offset);
            offset += chunk.byteLength;
        }
        
        console.log("All " + DATA_CHUNK_COUNT + " chunks combined: " + (totalSize / 1024 / 1024).toFixed(2) + " MB");
        
        // Create Blob URL
        const blob = new Blob([combined], { type: "application/octet-stream" });
        return URL.createObjectURL(blob);
    }

    function updateProgress(progress) {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;

    // ===== MAIN GAME INITIALIZATION =====

        try {
            console.log("Starting chunked data file loading...");
            
            // Load chunked data file
            const dataBlobUrl = await loadChunkedDataFile(updateProgress);
            console.log("Data file loaded, initializing Unity...");
            
            // Unity config with blob URL
            const config = {
                dataUrl: dataBlobUrl,
                frameworkUrl: buildUrl + "/Builds.framework.js.unityweb",
                codeUrl: buildUrl + "/Builds.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "AA2G1LtdS",
                productName: "Monster Truck Crash Bigfoot",
                productVersion: "1.0",
            };
            
            // Load Unity loader script
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    // Unity progress: 50-100%
                    const adjustedProgress = 0.5 + (progress * 0.5);
                    updateProgress(adjustedProgress);
                }).then((unityInstance) => {
                    myGameInstance = unityInstance;
                    loadingCover.style.display = "none";
                    window.focus();
                    console.log("Game loaded successfully!");
                    
                    // Clean up blob URL
                    URL.revokeObjectURL(dataBlobUrl);
                    
                    // Auto-init SDK bypass
                    setTimeout(() => {
                        if (myGameInstance) {
                            InitSDK("medium", false);
                        }
                    }, 1000);
                }).catch((message) => {
                    console.error("Unity initialization failed:", message);
                    alert("Oyun yüklenemedi. Sayfayı yenileyin: " + message);
                });
            };
            script.onerror = () => {
                console.error("Failed to load Unity loader script");
                alert("Oyun yükleyici yüklenemedi. Sayfayı yenileyin.");
            };
            document.body.appendChild(script);
            
        } catch (error) {
            console.error("Failed to load game data:", error);
            alert("Oyun verileri yüklenemedi. Sayfayı yenileyin.");
        }
    }
