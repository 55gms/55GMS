		// The compiled GMSDK makes its own UnityWebRequest to
		// api.cdndom.com (and azgame.io) to report this page's domain and
		// have it verified, independent of any JS here. Blocking that does
		// NOT stop the lock -- the SDK counts failures down from

		// lock is defeated in the wasm instead: GMSDK::LockGame (function
		// 11322) is patched to a no-op, so nothing here has to succeed.

		// to azgame.io's servers on every load.
		(function () {
			var blocked = new RegExp([
				// azgames.io licence / domain-verification and event collection
				'(^|\\.)azgame\\.io$', '(^|\\.)azgames\\.io$', '(^|\\.)cdnwave\\.com$',
				'(^|\\.)cdndom\\.com$', '(^|\\.)readyplayer1\\.xyz$',

				'(^|\\.)facebook\\.com$', '(^|\\.)facebook\\.net$',
				'(^|\\.)services\\.api\\.unity\\.com$', '(^|\\.)unity3d\\.com$',
				'(^|\\.)crazygames\\.com$', '(^|\\.)geoplugin\\.net$'
			].join('|'));
			function isBlocked(url) {
				try { return blocked.test(new URL(url, location.href).hostname); }
				catch (e) { return false; }
			}
			var open = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function (method, url) {
				if (isBlocked(url)) { url = 'about:blank#blocked-license-check'; }
				return open.apply(this, [method, url].concat([].slice.call(arguments, 2)));
			};
			var fetch0 = window.fetch;
			if (fetch0) {
				window.fetch = function (input, init) {
					var url = typeof input === 'string' ? input : (input && input.url);
					if (url && isBlocked(url)) { return Promise.reject(new TypeError('blocked')); }
					return fetch0.apply(this, arguments);
				};
			}
			// gma.readyplayer1.xyz's gm-sdk.js is loaded by setting <script>.src
			// directly (not fetch/XHR), and its own domain check is what's
			// dispatching the 'gmsoftbanevent' -> GmSoft.LockGame bridge call
			// ("Game is locked: code 1"). Stop it from ever loading.
			var srcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src') ||
				Object.getOwnPropertyDescriptor(HTMLImageElement.prototype.__proto__, 'src');

						return srcDesc.set.call(this, value);
					}
				});
			}
		})();
