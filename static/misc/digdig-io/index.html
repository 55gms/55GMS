<script>
	// digdig.io plays on the 55GMS multiplayer server (github.com/55gms/multiplayer,
	// games/digdig), which speaks the client's own protocol and keeps bots in every
	// lobby. M28's server list (api.n.m28.io) and game servers (*.s.m28n.net) are
	// both answered on this page's own host.
	(() => {
		let base = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/mp`;
		try {
			base = localStorage.getItem("gms-mp-base") || base;
		} catch {}
		const httpBase = base.replace(/^ws/, "http");
		const rewrite = (url) => {
			try {
				const u = new URL(url, location.href);
				if (/(^|\.)m28n\.net$/i.test(u.hostname)) return base + "/digdig/play";
				if (/(^|\.)n\.m28\.io$/i.test(u.hostname)) return httpBase + "/digdig/servers";
			} catch {}
			return url;
		};
		const Native = window.WebSocket;
		function GMSWebSocket(url, protocols) {
			return protocols === undefined ? new Native(rewrite(url)) : new Native(rewrite(url), protocols);
		}
		GMSWebSocket.prototype = Native.prototype;
		for (const k of ["CONNECTING", "OPEN", "CLOSING", "CLOSED"]) GMSWebSocket[k] = Native[k];
		window.WebSocket = GMSWebSocket;
		const open = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url, ...rest) {
			return open.call(this, method, rewrite(url), ...rest);
		};
		const nativeFetch = window.fetch;
		window.fetch = (input, init) => nativeFetch(typeof input === "string" ? rewrite(input) : input, init);
	})();
</script>
