<script>
	// digdig.io plays on the 55GMS multiplayer server (github.com/55gms/multiplayer,
	// games/digdig), which speaks the client's own protocol and keeps bots in every
	// lobby. M28's server list (api.n.m28.io) and game servers (*.s.m28n.net) are
	// both answered on this page's own host.
	(() => {
		let base = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/mp`;
		try {
			base = localStorage.getItem("gms-mp-base") || base;
		} catch {}
		const httpBase = base.replace(/^ws/, "http");
		// The mode buttons ask for /endpoint/digdig-<mode>/findEach/; the server
		// answers with the mode as the server id, so wss://<mode>.s.m28n.net/ names
		// it again. Over plain http the client dials 127.0.0.1:443 instead, so the
		// last mode asked for goes along.
		let mode = "ffa";
		// the server the client is on (a mode), for squads (below)
		let serverId = "";
		const rewrite = (url) => {
			try {
				const u = new URL(url, location.href);
				if (/(^|\.)n\.m28\.io$/i.test(u.hostname)) {
					// joining a squad of another mode asks for its server by id
					const byId = /^\/server\/([a-z]+)\/?$/.exec(u.pathname);
					if (byId) {
						mode = byId[1];
						return `${httpBase}/digdig/server?id=${mode}`;
					}
					const m = /\/endpoint\/digdig-([a-z]+)\//.exec(u.pathname);
					if (m) mode = m[1];
					return `${httpBase}/digdig/servers?mode=${mode}`;
				}
				if (/(^|\.)m28n\.net$/i.test(u.hostname)) {
					const id = u.hostname.split(".")[0];
					serverId = /^[a-z]+$/.test(id) ? id : mode;
					return `${base}/digdig/play?mode=${serverId}`;
				}
				if (u.protocol === "ws:" && u.hostname === "127.0.0.1" && u.port === "443") {
					serverId = mode;
					return `${base}/digdig/play?mode=${mode}`;
				}
			} catch {}
			return url;
		};
		const Native = window.WebSocket;
		// The client compares the hostname it asked for with the socket's url and
		// shows "Uninstall any scripts" when they differ, so the socket reports
		// the address the client gave it.
		function GMSWebSocket(url, protocols) {
			const ws = protocols === undefined ? new Native(rewrite(url)) : new Native(rewrite(url), protocols);
			try {
				Object.defineProperty(ws, "url", { value: new URL(url, location.href).href });
			} catch {}
			return ws;
		}
		GMSWebSocket.prototype = Native.prototype;
		for (const k of ["CONNECTING", "OPEN", "CLOSING", "CLOSED"]) GMSWebSocket[k] = Native[k];
		window.WebSocket = GMSWebSocket;
		const open = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url, ...rest) {
			return open.call(this, method, rewrite(url), ...rest);
		};
		const nativeFetch = window.fetch;
		window.fetch = (input, init) => nativeFetch(typeof input === "string" ? rewrite(input) : input, init);

		// A 55GMS account stands in for the game's Discord login. Signed in to
		// 55GMS, the page saves a game token as the game's own login before the
		// game starts; the game sends it to the multiplayer server, which keeps
		// gold and skins on the account (/api/digdig/*). Signed out, the login
		// buttons (patched in client.js and client.wasm) open the 55GMS sign-in.
		const LOGIN_KEY = "oauth2_data_DO_NOT_SHARE";
		// what the game keeps: base64 of id, provider, token, display name (each
		// NUL-ended), the expiry as a little-endian f64 (ms), and an avatar
		const saveLogin = (a) => {
			const enc = new TextEncoder();
			const str = (t) => [...enc.encode(t), 0];
			const time = new Uint8Array(new Float64Array([a.expires]).buffer);
			const bytes = [...str(a.uuid), ...str("discord"), ...str(a.token), ...str(`@${a.handle}`), ...time, ...str("")];
			localStorage.setItem(LOGIN_KEY, btoa(String.fromCharCode(...bytes)));
		};
		window.gmsAccountReady = (async () => {
			let session = null;
			try {
				session = localStorage.getItem("gms-session");
			} catch {}
			try {
				const response = await nativeFetch(`${location.origin}/api/digdig/token`, {
					method: "POST",
					credentials: "same-origin",
					headers: session ? { "X-GMS-Session": session } : {},
				});
				if (response.ok) saveLogin(await response.json());
				// signed out (or the feature is off): no login, so no stale one either
				else if ([401, 409, 503].includes(response.status)) localStorage.removeItem(LOGIN_KEY);
			} catch {}
		})();
		// Two things the client keeps in memory that no server message sets
		// (addresses for this build of client.wasm): Tag's "You are a
		// seeker/hider" banner shows only while byte 331776 + 10 is set, which
		// the page sets in Tag games; and the server id squads need (below).
		let memory = null;
		const keep = (result) => {
			for (const v of Object.values((result.instance || result).exports)) if (v instanceof WebAssembly.Memory) memory = v;
			return result;
		};
		const instantiate = WebAssembly.instantiate;
		WebAssembly.instantiate = (...a) => instantiate.apply(WebAssembly, a).then(keep);
		const streaming = WebAssembly.instantiateStreaming;
		if (streaming) WebAssembly.instantiateStreaming = (...a) => streaming.apply(WebAssembly, a).then(keep);
		// Squads: Join compares the code's server id with the server the client
		// is on, which the client keeps in its world object (a short string at
		// offset 24 of the object at 331776 + 544) and nothing the server sends
		// fills. The page writes it there.
		const writeServerId = (heap) => {
			if (!serverId || serverId.length > 10) return;
			const world = new DataView(memory.buffer).getUint32(331776 + 544, true);
			if (!world || world + 36 > heap.length || heap[world + 35] & 128) return;
			const bytes = new TextEncoder().encode(serverId);
			if (heap[world + 35] === bytes.length && bytes.every((b, i) => heap[world + 24 + i] === b)) return;
			heap.fill(0, world + 24, world + 35);
			heap.set(bytes, world + 24);
			heap[world + 35] = bytes.length;
		};
		setInterval(() => {
			if (!memory) return;
			const heap = new Uint8Array(memory.buffer);
			if (!heap[331772] || !heap[331776 + 8]) return;
			if (mode === "tag") heap[331776 + 10] = 1;
			writeServerId(heap);
		}, 250);
		const goTop = (path) => {
			let here = "/";
			try {
				here = window.top.location.pathname + window.top.location.search;
			} catch {}
			// Absolute: this page's <base> is the game's CDN folder.
			const target = `${location.origin}${path}?next=${encodeURIComponent(here)}`;
			try {
				window.top.location.href = target;
			} catch {
				location.href = target;
			}
		};
		window.gmsNavigate = (url) => {
			if (/^https:\/\/discord\.com\/api\/oauth2\/authorize/.test(url)) goTop("/login");
			else if (/^https:\/\/appleid\.apple\.com\//.test(url)) goTop("/signup");
			else return url;
			return "javascript:void 0";
		};
	})();
</script>

<script>
window["cp6"] = window["cp6"] || {};
window["Module"] = window["Module"] || {};
Module.canvas = document.getElementById("canvas");

(function(window, document){
	var canvas = document.createElement("canvas");
	if(!canvas || !canvas.getContext){
		document.getElementById("loading").style.display = "none";
		document.getElementById("unsupported").style.display = "block";
		return;
	}
	document.getElementById("canvas").style.display = "block";
	// the game reads its saved login as it starts: wait for the 55GMS one
	// (a few seconds at most)
	var started = false;
	function start() {
		if (started) return;
		started = true;
		var gameScript = document.createElement('script');
		gameScript.async = true;
		gameScript.src = baseHref + "client.js";
		var node = document.getElementsByTagName('script')[0];
		node.parentNode.insertBefore(gameScript, node);
	}
	setTimeout(start, 4000);
	(window.gmsAccountReady || Promise.resolve()).then(start, start);
})(window, document);
</script>
