      window.payments.getPurchases().then(function (purchases) {
        for (var i = 0; i < purchases.length; i++) {
          if (purchases[i].productID === id) {
            window.payments.consumePurchase(purchases[i].purchaseToken);
            if (onPurchaseSuccess) window.YG2Instance("OnPurchaseSuccess", id);
          }
        }
      });
    } catch (e) {}
  };

  window.ConsumePurchases = function (onPurchaseSuccess) {
    try {
      if (window.payments == null) return;
      window.payments.getPurchases().then(function (purchases) {
        for (var i = 0; i < purchases.length; i++) {
          window.payments.consumePurchase(purchases[i].purchaseToken);
          if (onPurchaseSuccess) window.YG2Instance("OnPurchaseSuccess", purchases[i].productID);
        }
      });
    } catch (e) {}
  };

  window.SetLeaderboard = function (name, score, extraData) {
    if (!window.ysdk) return;
    try { window.ysdk.leaderboards.setScore(name, score, extraData); } catch (e) {}
  };

  window.GetLeaderboard = function (nameLB, quantityTop, quantityAround, photoSize, auth) {
    if (!window.ysdk) return;
    var jsonEntries = {
      technoName: "", isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: ""
    };
    window.ysdk.leaderboards.getDescription(nameLB)
      .then(function (r) {
        jsonEntries.technoName = nameLB;
        jsonEntries.isDefault = r.default;
        jsonEntries.isInvertSortOrder = r.description.invert_sort_order;
        jsonEntries.decimalOffset = r.description.score_format.options.decimal_offset;
        jsonEntries.type = r.description.type;
        return window.ysdk.leaderboards.getEntries(nameLB, {
          quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
        });
      })
      .then(function (r) {
        var jsonPlayers = window.EntriesLB(r, photoSize);
        var combined = {}, k;
        for (k in jsonEntries) combined[k] = jsonEntries[k];
        for (k in jsonPlayers) combined[k] = jsonPlayers[k];
        window.YG2Instance("LeaderboardEntries", JSON.stringify(combined));
      })
      .catch(function () {});
  };

  window.EntriesLB = function (r, photoSize) {
    var text = "";
    var count = r.entries.length;
    var ranks = new Array(count), photos = new Array(count), names = new Array(count);
    var scores = new Array(count), uniqueIDs = new Array(count), extraDataArray = new Array(count);

    for (var i = 0; i < count; i++) {
      ranks[i] = r.entries[i].rank;
      scores[i] = r.entries[i].score;
      uniqueIDs[i] = r.entries[i].player.uniqueID;
      photos[i] = r.entries[i].player.getAvatarSrc(photoSize);

      if (r.entries[i].extraData === "" || r.entries[i].extraData == null) extraDataArray[i] = NO_DATA;
      else extraDataArray[i] = r.entries[i].extraData;

      if (r.entries[i].player.scopePermissions.public_name !== "allow") names[i] = "anonymous";
      else names[i] = r.entries[i].player.publicName;

      text += ranks[i] + ". " + names[i] + ": " + scores[i] + "\n";
    }
    if (count === 0) text = "no data";

    return {
      entries: text, ranks: ranks, photos: photos, names: names,
      scores: scores, uniqueIDs: uniqueIDs, extraDataArray: extraDataArray
    };
  };

  window.InterAdvShow = function () {
    try {
      if (window.ysdk == null) return;
      if (window.nowFullAdOpen === true) return;
      window.ysdk.adv.showFullscreenAdv({
        callbacks: {
          onOpen: function () {
            window.nowFullAdOpen = true;
            if (window.initGame === true) window.YG2Instance("OpenInterAdv");
          },
          onClose: function (wasShown) {
            window.nowFullAdOpen = false;
            if (window.initGame === true) window.YG2Instance("CloseInterAdv", wasShown ? "true" : "false");
            window.FocusGame();
          },
          onError: function () {
            window.nowFullAdOpen = false;
            window.YG2Instance("ErrorInterAdv");
            window.FocusGame();
          }
        }
      });
    } catch (e) {}
  };

  window.RequestingEnvironmentData = function () {
    return new Promise(function (resolve) {
      function Final(r) {
        window.environmentData = r;
        window.YG2Instance("SetEnvirData", r);
        resolve(r);
      }
      if (window.ysdk == null) return Final(NO_DATA);
      try {
        var ua = navigator.userAgent, browser;
        if (ua.indexOf("YaBrowser") !== -1 || ua.indexOf("YaSearchBrowser") !== -1) browser = "Yandex";
        else if (ua.indexOf("Opera") !== -1 || ua.indexOf("OPR") !== -1) browser = "Opera";
        else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
        else if (ua.indexOf("MSIE") !== -1) browser = "IE";
        else if (ua.indexOf("Edge") !== -1) browser = "Edge";
        else if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
        else if (ua.indexOf("Safari") !== -1) browser = "Safari";
        else browser = "Other";

        Final(JSON.stringify({
          language: window.ysdk.environment.i18n.lang,
          domain: window.ysdk.environment.i18n.tld,
          deviceType: window.ysdk.deviceInfo.type,
          isMobile: window.ysdk.deviceInfo.isMobile(),
          isDesktop: window.ysdk.deviceInfo.isDesktop(),
          isTablet: window.ysdk.deviceInfo.isTablet(),
          isTV: window.ysdk.deviceInfo.isTV(),
          appID: window.ysdk.environment.app.id,
          browserLang: window.ysdk.environment.browser.lang,
          payload: window.ysdk.environment.payload,
          platform: navigator.platform,
          browser: browser
        }));
      } catch (e) { Final(NO_DATA); }
    });
  };

  window.NotAuthorized = function (hasPlayer) {
    return JSON.stringify({
      playerAuth: "rejected",
      playerName: "unauthorized",
      playerId: (hasPlayer && window.player) ? window.player.getUniqueID() : "unauthorized",
      playerPhoto: "no data",
      payingStatus: "unknown"
    });
  };

  window.InitPlayer = function () {
    function Final(r) {
      window.playerData = r;
      window.YG2Instance("SetAuth", r);
      return r;
    }
    if (!window.ysdk) return Promise.resolve(Final(window.NotAuthorized(false)));
    return window.ysdk.getPlayer().then(function (p) {
      window.player = p;
      if (!p || !p.isAuthorized()) return Final(window.NotAuthorized(true));
      return Final(JSON.stringify({
        playerAuth: "resolved",
        playerName: p.getName(),
        playerId: p.getUniqueID(),
        playerPhoto: p.getPhoto("medium"),
        payingStatus: p.getPayingStatus()
      }));
    }).catch(function () {
      return Final(window.NotAuthorized(false));
    });
  };

  window.OpenAuthDialog = function () {
    if (!window.ysdk) return Promise.resolve();
    return window.ysdk.getPlayer().then(function (p) {
      window.player = p;
      if (p.isAuthorized()) {
        return window.InitPlayer().then(function () { window.YG2Instance("LoggedIn"); });
      }
      return window.ysdk.auth.openAuthDialog().then(function () {
        return window.ysdk.getPlayer().then(function (p2) {
          window.player = p2;
          return window.InitPlayer().then(function () {
            if (p2.isAuthorized()) window.YG2Instance("LoggedIn");
          });
        });
      }).catch(function () { return window.InitPlayer(); });
    }).catch(function () {
      window.player = null;
      return window.InitPlayer();
    });
  };

  window.InitYSDK = function () {
    return window.YaGames.init().then(function (sdk) {
      window.ysdk = sdk;
      sdk.on("game_api_pause", window.PauseCallback);
      sdk.on("game_api_resume", window.ResumeCallback);
      return window.RequestingEnvironmentData();
    }).then(function () {
      return window.InitPlayer();
    }).then(function () {
      return window.LoadCloud();
    }).then(function () {
      return window.GetStats();
    }).then(function () {
      return window.InitPayments();
    }).then(function () {
      window.initYSDK = true;
      if (window.ygGameInstance != null) window.ygGameInstance.SendMessage("YG2Instance", "InitSDKComplete");
    }).catch(function (e) {
      console.error("CRASH Initialization SDK: ", e);
      window.initYSDK = true;
    });
  };

  Promise.all([
    FetchSingle("js", G.FRAMEWORK),
    FetchSingle("wasm", G.WASM),
    FetchParts("data", G.DATA_PARTS)
  ]).then(function (u) {
    config = {
      dataUrl: u[2],
      frameworkUrl: u[0],
      codeUrl: u[1],
      streamingAssetsUrl: G.STREAMING,
      companyName: "Nepochat",
      productName: "ABYSS_1.1",
      productVersion: "1.1"
    };
    filesReady = true;
    window.StartUnityInstance();
  }).catch(function (e) {
    console.error("asset load failed", e);
  });

  var script = document.createElement("script");
  script.src = G.LOADER;
  script.onload = function () {
    loaderReady = true;
    window.InstallBlurFocusBlocker();
    window.InitYSDK();
    window.StartUnityInstance();
  };
  script.onerror = function () { console.error("loader failed"); };
  document.body.appendChild(script);
})();
</script>

    transform: translate(-50%, 100%);

  #ad-iframe {

    width: 745px;
    height: 90px;
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {

  #close-ad {

  #close-ad::before {

  #ad-right-mask {

  @media (max-width: 440px) {

  }
</style>
