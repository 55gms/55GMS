    // ============================================================
    // PART YAPILANDIRMASI (gercek part sayilari - resimden)
    // ============================================================
    const splitFiles = {
        "YandexBuilde.data.br": 4,   // part0-part3
        "YandexBuilde.wasm.br": 5    // part0-part4
    };

    // Birlestirilen dosyalar burada tutulur (key: dosya adi, value: ArrayBuffer)
    const mergedFileCache = {};

    // ============================================================
    // PART'LARI INDIRIP BIRLESTIR
    // ============================================================
    async function downloadAndMergeParts(fileName, partCount) {
        const parts = [];
        let totalLoaded = 0;

        for (let i = 0; i < partCount; i++) {
            const partUrl = buildUrl + "/parts/" + fileName + ".part" + i;
            const response = await fetch(partUrl);
            if (!response.ok) {
                throw new Error("Part indirilemedi: " + partUrl + " (HTTP " + response.status + ")");
            }
            const arrayBuffer = await response.arrayBuffer();
            parts.push(new Uint8Array(arrayBuffer));
            totalLoaded += arrayBuffer.byteLength;
            console.log("  [" + fileName + "] Part " + (i + 1) + "/" + partCount + " (" + (totalLoaded / 1048576).toFixed(1) + " MB)");
        }

        // Birlestir
        const totalSize = parts.reduce(function(sum, p) { return sum + p.length; }, 0);
        const merged = new Uint8Array(totalSize);
        let offset = 0;
        for (let j = 0; j < parts.length; j++) {
            merged.set(parts[j], offset);
            offset += parts[j].length;
        }

        LogStyledMessage("[Merger] " + fileName + " birlestirildi: " + (totalSize / 1048576).toFixed(1) + " MB");
        return merged.buffer;
    }

    async function mergeAllSplitFiles() {
        const fileNames = Object.keys(splitFiles);
        for (let i = 0; i < fileNames.length; i++) {
            const fileName = fileNames[i];
            const partCount = splitFiles[fileName];
            LogStyledMessage("[Merger] " + fileName + " birlestiriliyor (" + partCount + " part)...");
            mergedFileCache[fileName] = await downloadAndMergeParts(fileName, partCount);
        }
        LogStyledMessage("[Merger] Tum dosyalar basariyla birlestirildi!");
    }

    // ============================================================
    // FETCH OVERRIDE
    // Unity loader .data.br ve .wasm.br istediginde bellekten dondur.
    // Sunucudan orijinal dosyalar ALINMAZ.
    // ============================================================
    const originalFetch = window.fetch.bind(window);

    window.fetch = function(input, init) {
        const url = (typeof input === "string") ? input : (input && input.url ? input.url : "");
        const cachedNames = Object.keys(mergedFileCache);

        for (let i = 0; i < cachedNames.length; i++) {
            if (url.indexOf(cachedNames[i]) !== -1 && mergedFileCache[cachedNames[i]]) {
                LogStyledMessage("[FetchOverride] " + cachedNames[i] + " -> bellekten veriliyor");
                var buf = mergedFileCache[cachedNames[i]];
                var resp = new Response(buf, {
                    status: 200,
                    statusText: "OK",
                    headers: {
                        "Content-Type": "application/octet-stream",
                        "Content-Length": buf.byteLength.toString()
                    }
                });
                return Promise.resolve(resp);
            }
        }

        return originalFetch(input, init);
    };

    // ============================================================
    // XMLHttpRequest OVERRIDE (Unity bazen XHR kullanir)
    // ============================================================
    const OrigXHR = window.XMLHttpRequest;

    window.XMLHttpRequest = function PatchedXHR() {
        const xhr = new OrigXHR();
        const origOpen = xhr.open.bind(xhr);
        const origSend = xhr.send.bind(xhr);
        let interceptedFile = null;

        xhr.open = function(method, url) {
            interceptedFile = null;
            if (typeof url === "string") {
                const cachedNames = Object.keys(mergedFileCache);
                for (let i = 0; i < cachedNames.length; i++) {
                    if (url.indexOf(cachedNames[i]) !== -1 && mergedFileCache[cachedNames[i]]) {
                        interceptedFile = cachedNames[i];
                        break;
                    }
                }
            }
            return origOpen.apply(xhr, arguments);
        };

        xhr.send = function(body) {
            if (interceptedFile) {
                LogStyledMessage("[XHROverride] " + interceptedFile + " -> bellekten veriliyor");
                var buf = mergedFileCache[interceptedFile];

                Object.defineProperty(xhr, "status", { get: function() { return 200; } });
                Object.defineProperty(xhr, "statusText", { get: function() { return "OK"; } });
                Object.defineProperty(xhr, "readyState", { get: function() { return 4; } });
                Object.defineProperty(xhr, "response", { get: function() { return buf; } });

                setTimeout(function() {
                    if (xhr.onreadystatechange) xhr.onreadystatechange();
                    if (xhr.onload) xhr.onload();
                    try { xhr.dispatchEvent(new Event("load")); } catch(e) {}
                    try { xhr.dispatchEvent(new Event("loadend")); } catch(e) {}
                }, 0);
                return;
            }
            return origSend.apply(xhr, arguments);
        };

        return xhr;
    };

    // ============================================================

    // ============================================================
    const config = {
        dataUrl: buildUrl + "/YandexBuilde.data.br",

    // ============================================================

    // ============================================================
    // BLUR / FOCUS BLOCKER
    // ============================================================
    function InstallBlurFocusBlocker() {
        if (!("onblur" in document)) return;
        if (window.blurFocusHandlersInstalled) return;

            var b = document.createElement("button");
            b.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,0);border:none;cursor:default;";
            document.body.appendChild(b);
            function rm() {
                if (b && b.parentNode) b.parentNode.removeChild(b);
                window.removeEventListener("focus", rm);
            }
            window.addEventListener("focus", rm);
        });
        window.blurFocusHandlersInstalled = true;
    }

    function FocusGame() {
        if (!isPausedGame) canvas.focus();

    function SetVisibility(visibility) {
        if (initGame === true && isVisibility !== visibility) {

    // ============================================================
    // YG2Instance - Unity'ye mesaj gonder
    // ============================================================
    function YG2Instance(method, arg) {
        if (ygGameInstance == null) return;
        if (!initGame) {
            setTimeout(function () {
                if (ygGameInstance) {
                    if (arg !== undefined) ygGameInstance.SendMessage("YG2Instance", method, arg);
                    else ygGameInstance.SendMessage("YG2Instance", method);
                }
            }, 100);
        } else {
            if (arg !== undefined) ygGameInstance.SendMessage("YG2Instance", method, arg);
            else ygGameInstance.SendMessage("YG2Instance", method);
        }
    }

    function LogStyledMessage(message, style) {

    }

    // ============================================================
    // LOADER & UNITY BASLATMA
    // Sira: part birlestir -> fetch override aktif -> Unity baslat
    // ============================================================
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = async function() {
        InstallBlurFocusBlocker();

        // 1) Part'lari indir ve birlestir (fetch override zaten yukarida tanimli)

            await mergeAllSplitFiles();

            console.error("[Merger] KRITIK HATA - birlestirme basarisiz:", err);
            return; // Basarisizsa Unity baslatilmaz

        // 2) Unity'yi baslat - fetch override orijinal URL isteklerini yakalayacak
        StartUnityInstance = function () {
            createUnityInstance(canvas, config, function(progress) {

    // --- ENVIRONMENT DATA ---

        return new Promise(function(resolve) {

            else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Safari";
