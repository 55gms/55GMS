<body>

        <script>
            var canvas = document.querySelector("#unity-canvas");
            var progressBar = document.querySelector("#progress-bar");
            var gameContainer = document.querySelector("#gameContainer");
            var orientationWarning = document.querySelector("#orientation-warning");
            var orientationImage = document.querySelector("#orientation-image");
            var loadingText = document.querySelector("#loading-text");

            // Dosya adı yapılandırması
            const dataFilename = "0aea490714d24dd56d5d8f133db73317.data.unityweb";

            var config = {
                dataUrl: "", // mergeDataParts fonksiyonu ile doldurulacak
                frameworkUrl: "/misc/shapy-runner/_ext/cdn.jsdelivr.net/gh/ftbaldana/heex%40main/Build/4b48f13749459fd9a85976d443eff8f8.js.unityweb",
                codeUrl: "/misc/shapy-runner/_ext/cdn.jsdelivr.net/gh/ftbaldana/heex%40main/Build/b4413c95649420a69c46417273ba947e.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "GameVGames",
                productName: "Shape Transform Race",
                productVersion: "0.1.0",
            };

            var scaleToFit;
            try {
                scaleToFit = !!JSON.parse("");
            } catch (e) {
                scaleToFit = true;
            }

            function updateProgressUI(percentVal, statusText) {
                var percentStr = percentVal + '%';
                progressBar.style.background = 'linear-gradient(to right, white, white ' + percentStr + ', transparent ' + percentStr + ', transparent)';
                if (statusText) {
                    loadingText.innerText = statusText + " " + Math.round(percentVal) + "%";
                }
            }

            function progressHandler(progress) {
                // Unity motoru yüklenirken çağrılır
                updateProgressUI(progress * 100, "Initializing Game...");
            }

            function onResize() {
                var container = canvas.parentElement;
                var w;
                var h;

                if (scaleToFit) {
                    w = window.innerWidth;
                    h = window.innerHeight;
                    var r = 1080 / 1920;
                    if (w * r > window.innerHeight) {
                        w = Math.min(w, Math.ceil(h / r));
                    }
                    h = Math.floor(w * r);
                } else {
                    w = 1920;
                    h = 1080;
                }

                container.style.width = canvas.style.width = w + "px";
                container.style.height = canvas.style.height = h + "px";
                container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
                container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
            }

            function checkOrientation(orientation) {
                if (orientation === "Portrait" && window.innerHeight < window.innerWidth) {
                    orientationWarning.style.display = 'block';
                    gameContainer.style.display = 'none';
                    orientationWarning.innerText = 'Please rotate your device to portrait mode.';
                    orientationImage.style.display = 'block';
                } else if (orientation === "Landscape" && window.innerHeight > window.innerWidth) {
                    orientationWarning.style.display = 'block';
                    gameContainer.style.display = 'none';
                    orientationWarning.innerText = 'Please rotate your device to landscape mode.';
                    orientationImage.style.display = 'block';
                } else {
                    orientationWarning.style.display = 'none';
                    gameContainer.style.display = 'block';
                    orientationImage.style.display = 'none';
                }
            }

            function loadTemplateConfig() {
                var request = new XMLHttpRequest();
                request.open('GET', '/misc/shapy-runner/_ext/cdn.jsdelivr.net/gh/ftbaldana/heex%40main/TemplateData/Orientation/template.json', true);
                request.onreadystatechange = function () {
                    if (request.readyState === 4 && request.status === 200) {
                        var configJson = JSON.parse(request.responseText);
                        var orientation = configJson.customOptions.find(option => option.name === "orientation").default;
                        checkOrientation(orientation);
                    }
                };
                request.send();
            }

            // --- 8 PARTLI VERİ BİRLEŞTİRME SİSTEMİ ---
            async function mergeDataParts() {
                const totalParts = 8; // 10MB sınırına göre toplam 8 parça
                const chunks = [];

                for (let i = 1; i <= totalParts; i++) {
                    const partNumber = i.toString().padStart(2, '0');
                    const partUrl = `/misc/shapy-runner/_ext/cdn.jsdelivr.net/gh/ftbaldana/heex%40main/Build/${dataFilename}.part${partNumber}`;

                    try {
                        const response = await fetch(partUrl);
                        if (!response.ok) throw new Error(`Part ${partNumber} could not be loaded.`);

                        const chunk = await response.arrayBuffer();
                        chunks.push(chunk);

                        // İndirme aşaması UI güncelleme
                        const downloadProgress = (i / totalParts) * 100;
                        updateProgressUI(downloadProgress, "Downloading Assets...");

                    } catch (error) {
                        console.error(error);
                        loadingText.innerText = "Error: Data missing!";
                        throw error;
                    }
                }

                updateProgressUI(100, "Merging Assets...");
                const blob = new Blob(chunks);
                return URL.createObjectURL(blob);
            }

            // --- BAŞLATICI ---
            window.addEventListener('resize', function () {
                onResize();
                loadTemplateConfig();
            });

            mergeDataParts().then(blobUrl => {
                config.dataUrl = blobUrl;
                
                createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                    // Yükleme UI'larını gizle
                    document.querySelector(".loadingOut").style.display = "none";
                    loadingText.style.display = "none";
                    
                    onResize();
                    loadTemplateConfig();
                }).catch(err => {
                    console.error("Unity Instance Error:", err);
                    loadingText.innerText = "Error starting the engine.";
                });
            }).catch(err => {
                console.error("Merge Error:", err);
            });

            loadTemplateConfig();
        </script>
