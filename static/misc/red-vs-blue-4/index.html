}

var leaderboard = null;

function InitLeaderboards() {
    if (ysdk == null) return;
    ysdk.getLeaderboards().then(function (_lb) { leaderboard = _lb; });
}

function WaitForLeaderboard() {
    return new Promise(function (resolve, reject) {
        var interval = setInterval(function () {
            if (leaderboard !== null) {
                clearInterval(interval);
                clearTimeout(timeout);
                resolve();
            }
        }, 100);
        var timeout = setTimeout(function () {
            clearInterval(interval);
            reject(new Error("Leaderboard initialization timeout"));
        }, 5000);
    });
}

function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
    function run() {
        var jsonEntries = { technoName: '', isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: '' };
        return ysdk.getLeaderboards()
            .then(function (lb) { return lb.getLeaderboardDescription(nameLB); })
            .then(function (res) {
                jsonEntries.technoName = nameLB;
                jsonEntries.isDefault = res["default"];
                jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
                jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
                jsonEntries.type = res.description.type;
                return leaderboard.getLeaderboardEntries(nameLB, {
                    quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
                });
            })
            .then(function (res) {
                var jsonPlayers = EntriesLB(res, maxPlayers, photoSize);
                var combined = Object.assign({}, jsonEntries, jsonPlayers);
                myGameInstance.SendMessage('YandexGame', 'LeaderboardEntries', JSON.stringify(combined));
            })["catch"](function (error) { console.error(error); });
    }
    try {
        if (leaderboard === null) return WaitForLeaderboard().then(run)["catch"](function () {});
        return run();
    } catch (e) {
        console.error('CRASH Get Leaderboard: ', e.message);
    }
}

function SetLeaderboardScores(_name, score) {
    function run() {
        return ysdk.getLeaderboards().then(function (lb) { lb.setLeaderboardScore(_name, score); });
    }
    try {
        if (leaderboard === null) return WaitForLeaderboard().then(run)["catch"](function () {});
        return run();
    } catch (e) {
        console.error('CRASH Set Leader board Scores: ', e.message);
    }
}

function EntriesLB(res, maxPlayers, photoSize) {
    var LeaderboardEntriesText = '';
    var playersCount = res.entries.length < maxPlayers ? res.entries.length : maxPlayers;

    var ranks = new Array(playersCount);
    var photos = new Array(playersCount);
    var mames = new Array(playersCount);
    var scores = new Array(playersCount);
    var uniqueIDs = new Array(playersCount);

    for (var i = 0; i < playersCount; i++) {
        ranks[i] = res.entries[i].rank;
        scores[i] = res.entries[i].score;
        uniqueIDs[i] = res.entries[i].player.uniqueID;
        photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
        if (res.entries[i].player.scopePermissions.public_name !== "allow") mames[i] = "anonymous";
        else mames[i] = res.entries[i].player.publicName;
        LeaderboardEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
    }
    if (playersCount === 0) LeaderboardEntriesText = 'no data';

    return {
        "entries": LeaderboardEntriesText,
        "ranks": ranks,
        "photos": photos,
        "names": mames,
        "scores": scores,
        "uniqueIDs": uniqueIDs
    };
}

var environmentData = 'null';

function RequestingEnvironmentData(sendback) {
    return new Promise(function (resolve) {
        function Final(res) {
            if (sendback && myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetEnvirData', res);
            resolve(res);
        }
        if (ysdk == null) { Final('null'); return; }
        try {
            var promptCanShow = false;
            var reviewCanShow = false;
            ysdk.feedback.canReview().then(function (r) {
                if (r.value) reviewCanShow = true;
                return ysdk.shortcut.canShowPrompt();
            }).then(function (prompt) {
                if (prompt && prompt.canShow) promptCanShow = true;
                var browser = navigator.userAgent;
                if (browser.indexOf('YaBrowser') >= 0 || browser.indexOf('YaSearchBrowser') >= 0) browser = 'Yandex';
                else if (browser.indexOf('Opera') >= 0 || browser.indexOf('OPR') >= 0) browser = 'Opera';
                else if (browser.indexOf('Firefox') >= 0) browser = 'Firefox';
                else if (browser.indexOf('MSIE') >= 0) browser = 'IE';
                else if (browser.indexOf('Edge') >= 0) browser = 'Edge';
                else if (browser.indexOf('Chrome') >= 0) browser = 'Chrome';
                else if (browser.indexOf('Safari') >= 0) browser = 'Safari';
                else browser = 'Other';

                var jsonEnvir = {
                    "language": ysdk.environment.i18n.lang,
                    "domain": ysdk.environment.i18n.tld,
                    "deviceType": ysdk.deviceInfo.type,
                    "isMobile": ysdk.deviceInfo.isMobile(),
                    "isDesktop": ysdk.deviceInfo.isDesktop(),
                    "isTablet": ysdk.deviceInfo.isTablet(),
                    "isTV": ysdk.deviceInfo.isTV(),
                    "appID": ysdk.environment.app.id,
                    "browserLang": ysdk.environment.browser.lang,
                    "payload": ysdk.environment.payload,
                    "promptCanShow": promptCanShow,
                    "reviewCanShow": reviewCanShow,
                    "platform": navigator.platform,
                    "browser": browser
                };
                Final(JSON.stringify(jsonEnvir));
            })["catch"](function () { Final('null'); });
        } catch (e) {
            Final('null');
        }
    });
}

var playerData = 'noData';

function InitPlayer(sendback) {
    return new Promise(function (resolve) {
        function Final(res) {
            if (sendback && myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', res);
            resolve(res);
        }
        if (ysdk == null) { Final(NotAuthorized()); return; }
        try {
            ysdk.getPlayer({ scopes: true }).then(function (_player) {
                player = _player;
                var playerName = player.getName();
                var playerPhoto = player.getPhoto('small');
                if (player.getMode() === 'lite') { Final(NotAuthorized()); return; }
                var authJson = {
                    "playerAuth": "resolved",
                    "playerName": playerName,
                    "playerId": player.getUniqueID(),
                    "playerPhoto": playerPhoto,
                    "payingStatus": player.getPayingStatus()
                };
                Final(JSON.stringify(authJson));
            })["catch"](function () { Final(NotAuthorized()); });
        } catch (e) {
            Final(NotAuthorized());
        }
    });
}

function NotAuthorized() {
    var authJson = {
        "playerAuth": "rejected",
        "playerName": "unauthorized",
        "playerId": "unauthorized",
        "playerPhoto": "unknown",
        "payingStatus": (player && player.getPayingStatus) ? player.getPayingStatus() : "unknown"
    };
    return JSON.stringify(authJson);
}

function OpenAuthDialog() {
    if (ysdk === null) return;
    try {
        ysdk.auth.openAuthDialog().then(function () {
            return InitPlayer(true);
        }).then(function () {
            myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
        })["catch"](function () {});
    } catch (e) {}
}
