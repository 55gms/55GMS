var __IGNORE=/pointer\s*lock|pointerlock|sandbox|SecurityError|fullscreen|sdk\.js|YaGames|NotAllowedError|AbortError|play\(\)/i;
window.addEventListener("error",function(e){ var m=e&&e.message||""; if(__IGNORE.test(m)) return; });
window.addEventListener("unhandledrejection",function(e){
  var m=(e&&e.reason&&(e.reason.message||e.reason.name))||"";
  if(__IGNORE.test(String(m))) e.preventDefault();
});

/* ── Pointer Lock / Fullscreen guard + sahte kilit ──
   Oyun kilit isterse ve sandbox engellerse kilidi taklit ederiz.
   Oyun hic istemediyse hicbir sey yapmayiz.                      */
(function(){
  var wantLock=false, faked=false, target=null;
  var d=Object.getOwnPropertyDescriptor(Document.prototype,"pointerLockElement");
  var realGet=d&&d.get;
  try{
    Object.defineProperty(Document.prototype,"pointerLockElement",{
      configurable:true,
      get:function(){ return faked?target:(realGet?realGet.call(this):null); }
    });
  }catch(e){}
  function fire(){
    ["pointerlockchange","mozpointerlockchange","webkitpointerlockchange"].forEach(function(n){
      try{ document.dispatchEvent(new Event(n)); }catch(e){}
    });
  }
  function fake(el){
    if(faked) return;
    target=el||document.getElementById("unity-canvas");
    if(!target) return;
    faked=true; try{ target.focus(); }catch(e){} fire();
  }
  function unfake(){ if(!faked) return; faked=false; target=null; fire(); }
  var rpl=Element.prototype.requestPointerLock;
  if(typeof rpl==="function"){
    Element.prototype.requestPointerLock=function(){
      wantLock=true;
      var self=this;
      try{
        var r=rpl.apply(this,arguments);
        if(r&&typeof r.then==="function"){
          return r.catch(function(){ fake(self); });
        }
        /* senkron API: kisa sure sonra gercek kilit yoksa taklit et */
        setTimeout(function(){ if(!(realGet&&realGet.call(document))) fake(self); },60);
        return Promise.resolve();
      }catch(e){ fake(self); return Promise.resolve(); }
    };
  }
  var rex=Document.prototype.exitPointerLock;
  Document.prototype.exitPointerLock=function(){
    if(faked){ unfake(); return; }
    try{ if(rex) rex.call(this); }catch(e){}
  };
  document.addEventListener("click",function(){
    if(wantLock && !document.pointerLockElement) fake();
  },true);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"||e.keyCode===27) unfake();
  },true);
  function guard(o,k){
    var f=o&&o[k]; if(typeof f!=="function") return;
    o[k]=function(){ try{ var r=f.apply(this,arguments);
      return (r&&r.catch)?r.catch(function(){}):Promise.resolve(); }
      catch(e){ return Promise.resolve(); } };
  }
  guard(Element.prototype,"requestFullscreen");
  guard(Element.prototype,"webkitRequestFullscreen");
  guard(Element.prototype,"mozRequestFullScreen");
  guard(Element.prototype,"msRequestFullscreen");
  guard(Document.prototype,"exitFullscreen");
})();

async function __buildDataUrl(){
  progressBarEmpty.style.display="";
  spinner.style.display="none";
  var parts=[], total=0;
  for(var i=0;i<DATA_PARTS;i++){
    var url = buildUrl + "/DriftH.data.unityweb.part" + i;
    var r = await fetch(url);
    if(!r.ok) throw new Error("part"+i+" HTTP "+r.status);
    var ab = await r.arrayBuffer();
    if(ab.byteLength===0) throw new Error("part"+i+" bos geldi");
    parts.push(new Uint8Array(ab));
    total += ab.byteLength;
    var pct = Math.round((i+1)/DATA_PARTS*100);
    progressBarFull.style.width = pct+"%";
    if(loadText) loadText.textContent = "DATA "+(i+1)+"/"+DATA_PARTS+"  "+pct+"%";
  }
  var merged=new Uint8Array(total), off=0;
  for(var j=0;j<parts.length;j++){ merged.set(parts[j],off); off+=parts[j].length; }
  parts=null;
  console.log("[DATA] merged: "+total+" bytes");
  if(loadText) loadText.textContent="";
  progressBarFull.style.width="0%";
  var blob=new Blob([merged],{type:"application/octet-stream"});
  merged=null;
  return URL.createObjectURL(blob);
}

function TVInit() {
    LogStyledMessage('Init TV ysdk');
    if (ysdk.deviceInfo.isTV()) {
        ysdk.onEvent(ysdk.EVENTS.HISTORY_BACK, () => {
            const currentTime = Date.now();
            if (!initGame || currentTime - lastBackPressTime < 300) { ysdk.dispatchEvent(ysdk.EVENTS.EXIT); }
            else { lastBackPressTime = currentTime; YG2Instance('TVKeyBack'); }
        });
        document.addEventListener("keydown", (e) => { YG2Instance('TVKeyDown', e.key); });
        document.addEventListener("keyup", (e) => { YG2Instance('TVKeyUp', e.key); });
        function UpdateGamepadState() {
            var gamepads = navigator.getGamepads();
            for (var i = 0; i < gamepads.length; i++) {
                var gamepad = gamepads[i];
                if (gamepad) {
                    if (gamepad.buttons[12].pressed && !previousButtonState[12]) { YG2Instance('TVKeyDown', 'Up'); }
                    else if (!gamepad.buttons[12].pressed && previousButtonState[12]) { YG2Instance('TVKeyUp', 'Up'); }
                    if (gamepad.buttons[13].pressed && !previousButtonState[13]) { YG2Instance('TVKeyDown', 'Down'); }
                    else if (!gamepad.buttons[13].pressed && previousButtonState[13]) { YG2Instance('TVKeyUp', 'Down'); }
                    if (gamepad.buttons[14].pressed && !previousButtonState[14]) { YG2Instance('TVKeyDown', 'Left'); }
                    else if (!gamepad.buttons[14].pressed && previousButtonState[14]) { YG2Instance('TVKeyUp', 'Left'); }
                    if (gamepad.buttons[15].pressed && !previousButtonState[15]) { YG2Instance('TVKeyDown', 'Right'); }
                    else if (!gamepad.buttons[15].pressed && previousButtonState[15]) { YG2Instance('TVKeyUp', 'Right'); }
                    previousButtonState[12] = gamepad.buttons[12].pressed;
                    previousButtonState[13] = gamepad.buttons[13].pressed;
                    previousButtonState[14] = gamepad.buttons[14].pressed;
                    previousButtonState[15] = gamepad.buttons[15].pressed;

                    if (purchases[i].productID === id) {
                        payments.consumePurchase(purchases[i].purchaseToken);
                        if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', id);
                    }
                }
            });
        } else { LogStyledMessage('Consume purchase: payments null'); }
    } catch (e) { console.error('CRASH Consume Purchase: ', e.message); }
}
function ConsumePurchases(onPurchaseSuccess) {
    try {
        if (payments != null) {
            payments.getPurchases().then(purchases => {
                LogStyledMessage('Unprocessed purchases: ', purchases.length);
                for (i = 0; i < purchases.length; i++) {
                    payments.consumePurchase(purchases[i].purchaseToken);
                    if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', purchases[i].productID);
                }
            });
        } else { LogStyledMessage('Consume purchases: payments null'); }
    } catch (e) { console.error('CRASH Consume purchases: ', e.message); }
}

    if (leaderboards == null) return;

function GetLeaderboard(nameLB, quantityTop, quantityAround, photoSize, auth) {
    if (leaderboards == null) return;
    try {
        var jsonEntries = { technoName: '', isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: '' };
        leaderboards.getLeaderboardDescription(nameLB).then(res => {
            jsonEntries.technoName = nameLB;
            jsonEntries.isDefault = res.default;
            jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
            jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
            jsonEntries.type = res.description.type;
            return leaderboards.getLeaderboardEntries(nameLB, { quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround });
        }).then(res => {
            let jsonPlayers = EntriesLB(res, photoSize);
            let combinedJson = { ...jsonEntries, ...jsonPlayers };
            YG2Instance('LeaderboardEntries', JSON.stringify(combinedJson));
        }).catch(err => {
            if (err.code === 'LEADERBOARD_PLAYER_NOT_PRESENT') LogStyledMessage('Leaderboard player not present');
            console.error(err);
        });
    } catch (e) { console.error('CRASH Get Leaderboard: ', e.message); }
}
function EntriesLB(res, photoSize) {
    let LbdEntriesText = '', plCount = res.entries.length;
    let ranks = new Array(plCount), photos = new Array(plCount), mames = new Array(plCount),
        scores = new Array(plCount), uniqueIDs = new Array(plCount), extraDataArray = new Array(plCount);
    for (i = 0; i < plCount; i++) {
        ranks[i] = res.entries[i].rank; scores[i] = res.entries[i].score;
        uniqueIDs[i] = res.entries[i].player.uniqueID;
        photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
        if (res.entries[i].extraData == "" || res.entries[i].extraData == null) extraDataArray[i] = NO_DATA;
        else extraDataArray[i] = res.entries[i].extraData;
        if (res.entries[i].player.scopePermissions.public_name !== "allow") mames[i] = "anonymous";
        else mames[i] = res.entries[i].player.publicName;
        LbdEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
    }
    if (plCount === 0) LbdEntriesText = 'no data';
    return { "entries": LbdEntriesText, "ranks": ranks, "photos": photos, "names": mames,
             "scores": scores, "uniqueIDs": uniqueIDs, "extraDataArray": extraDataArray };
}

var playerData = NO_DATA;
let player = null;
function InitPlayer() {
    return new Promise((resolve) => {
        try {
            if (ysdk == null) { Final(NotAuthorized()); }
            else {
                let _scopes = true;
                ysdk.getPlayer({ scopes: _scopes }).then(_player => {
                    player = _player;
                    let playerName = player.getName(), playerPhoto = player.getPhoto('medium');
                    if (!_scopes) { playerName = "anonymous"; playerPhoto = "NO_DATA"; }

                    else {
                        Final(JSON.stringify({ "playerAuth": "resolved", "playerName": playerName,
                            "playerId": player.getUniqueID(), "playerPhoto": playerPhoto,
                            "payingStatus": player.getPayingStatus() }));

                }).catch(e => { console.error('Authorized err: ', e.message); Final(NotAuthorized()); });
            }
        } catch (e) { console.error('CRASH init Player: ', e.message); Final(NotAuthorized()); }
        function Final(res) { playerData = res; YG2Instance('SetAuth', res); resolve(res); }
    });
}
