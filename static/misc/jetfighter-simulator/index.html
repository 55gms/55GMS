(function(){

  guard(Element.prototype,"msRequestFullscreen");

})();

async function __fetchParts(name,count,from,span){
  var parts=[], total=0;
  for(var i=0;i<count;i++){
    var r=await fetch(buildUrl+"/"+name+".part"+i);
    if(!r.ok) throw new Error(name+".part"+i+" HTTP "+r.status);
    var ab=await r.arrayBuffer();
    if(ab.byteLength===0) throw new Error(name+".part"+i+" bos");
    parts.push(new Uint8Array(ab)); total+=ab.byteLength;
    __setProgress(from+span*(i+1)/count, name+"  "+(i+1)+"/"+count);
  }
  var merged=new Uint8Array(total), off=0;
  for(var j=0;j<parts.length;j++){ merged.set(parts[j],off); off+=parts[j].length; }
  console.log("["+name+"] merged: "+total+" bytes");
  return merged;
}
var __brotli=null;
async function __getBrotli(){
  if(__brotli) return __brotli;
  var m=await import("https://cdn.jsdelivr.net/npm/brotli-dec-wasm@2.3.2/index.js");
  __brotli=await m.default;
  return __brotli;
}
function __looksRaw(name,u){
  if(u.length<4) return false;
  if(name.indexOf(".wasm")>=0) return (u[0]===0x00&&u[1]===0x61&&u[2]===0x73&&u[3]===0x6D);
  if(name.indexOf(".data")>=0) return (u[0]===0x55&&u[1]===0x6E&&u[2]===0x69&&u[3]===0x74);
  var n=Math.min(32,u.length);
  for(var i=0;i<n;i++){ var c=u[i]; if(c===9||c===10||c===13) continue; if(c<32||c>126) return false; }
  return true;
}
async function __decode(name,bytes){
  var head=Array.prototype.slice.call(bytes.subarray(0,4))
            .map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(" ");
  if(__looksRaw(name,bytes)){
    console.log("["+name+"] zaten cozulmus ("+head+"), "+bytes.length+" bytes");
    return bytes;
  }
  try{
    var br=await __getBrotli();
    var out=br.decompress(bytes);
    console.log("["+name+"] brotli: "+bytes.length+" -> "+out.length);
    return out;
  }catch(e){
    console.warn("["+name+"] brotli cozulemedi ("+head+"), ham kullaniliyor:", e&&e.message);
    return bytes;
  }
}
function __blobUrl(bytes,mime){ return URL.createObjectURL(new Blob([bytes],{type:mime})); }

(async function prepareFiles(){

    __setProgress(96,"decompress data...");
    data = await __decode("rocket15.data.br", data);
    config.dataUrl = __blobUrl(data,"application/octet-stream"); data = null;

function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
    try {
        var jsonEntries = { technoName: '', isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: '' };
        ysdk.getLeaderboards()
            .then(leaderboard => leaderboard.getLeaderboardDescription(nameLB))

                jsonEntries.type = res.description.type;

                    quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround });

            .then(res => {
                let jsonPlayers = EntriesLB(res, maxPlayers, photoSize);

            })
            .catch(error => { console.error(error); });
    } catch (e) { console.error('CRASH Get Leaderboard: ', e.message); }
}
function EntriesLB(res, maxPlayers, photoSize) {
    let LeaderboardEntriesText = '';
    let playersCount = (res.entries.length < maxPlayers) ? res.entries.length : maxPlayers;
    let ranks = new Array(playersCount), photos = new Array(playersCount), mames = new Array(playersCount),
        scores = new Array(playersCount), uniqueIDs = new Array(playersCount);
    for (i = 0; i < playersCount; i++) {
        ranks[i] = res.entries[i].rank;
        scores[i] = res.entries[i].score;
        uniqueIDs[i] = res.entries[i].player.uniqueID;
        if (photoSize === 'nonePhoto' || res.entries[i].player.scopePermissions.avatar !== "allow") photos[i] = 'nonePhoto';
        else photos[i] = res.entries[i].player.getAvatarSrc(photoSize);
        if (res.entries[i].player.scopePermissions.public_name !== "allow") mames[i] = "anonymous";
        else mames[i] = res.entries[i].player.publicName;
        LeaderboardEntriesText += ranks[i] + '. ' + mames[i] + ": " + scores[i] + '\n';
    }
    if (playersCount === 0) LeaderboardEntriesText = 'no data';
    return { "entries": LeaderboardEntriesText, "ranks": ranks, "photos": photos,
             "names": mames, "scores": scores, "uniqueIDs": uniqueIDs };
}

                    let productID = [], title = [], description = [], imageURI = [], priceValue = [], consumed = [];
                    payments.getPurchases().then(purchases => {
                        for (let i = 0; i < products.length; i++) {
                            productID[i] = products[i].id; title[i] = products[i].title;
                            description[i] = products[i].description; imageURI[i] = products[i].imageURI;
                            priceValue[i] = products[i].priceValue; consumed[i] = true;
                            for (i2 = 0; i2 < purchases.length; i2++) {
                                if (purchases[i2].productID === productID[i]) { consumed[i] = false; break; }
                            }
                        }
                        let jsonPayments = { "id": productID, "title": title, "description": description,
                            "imageURI": imageURI, "priceValue": priceValue, "consumed": consumed,
                            "language": ysdk.environment.i18n.lang };
                        if (sendback) myGameInstance.SendMessage('YandexGame', 'PaymentsEntries', JSON.stringify(jsonPayments));
                        resolve(JSON.stringify(jsonPayments));
                    });
                });
            }).catch(e => { console.log('Purchases are not available', e.message); resolve('none'); })
        } catch (e) { console.error('CRASH Init Payments: ', e.message); resolve('none'); }
    });
}
function BuyPayments(id) {
    try {
        if (payments != null) {
            payments.purchase(id).then(() => { console.log('Purchase Success'); ConsumePurchase(id); FocusGame(); })
              .catch(e => { console.error('Purchase Failed', e.message); myGameInstance.SendMessage('YandexGame', 'OnPurchaseFailed', id); FocusGame(); })
        } else { console.log('Payments == null'); }
    } catch (e) { console.error('CRASH Buy Payments: ', e.message); FocusGame(); }
}
function ConsumePurchase(id) {
    try {
        if (payments != null) {
            payments.getPurchases().then(purchases => {
                for (i = 0; i < purchases.length; i++) {
                    if (purchases[i].productID === id) {
                        payments.consumePurchase(purchases[i].purchaseToken);
                        myGameInstance.SendMessage('YandexGame', 'OnPurchaseSuccess', id);
                    }
                }
            });
        } else console.log('Consume purchase: payments null');
    } catch (e) { console.error('CRASH Consume Purchase: ', e.message); }
}
function ConsumePurchases() {
    try {
        if (payments != null) {
            payments.getPurchases().then(purchases => {
                console.log('Unprocessed purchases: ', purchases.length);
                for (i = 0; i < purchases.length; i++) {
                    payments.consumePurchase(purchases[i].purchaseToken);
                    myGameInstance.SendMessage('YandexGame', 'OnPurchaseSuccess', purchases[i].productID);
                }
            });
        } else console.log('Consume purchases: payments null');
    } catch (e) { console.error('CRASH Consume purchases: ', e.message); }
}
var environmentData = JSON.stringify({
    "language": GAME_LANG, "domain": "com", "deviceType": "desktop",
    "isMobile": /iPhone|iPad|iPod|Android/i.test(navigator.userAgent),
    "isDesktop": !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent),
    "isTablet": false, "isTV": false, "appID": "0",
    "browserLang": GAME_LANG, "payload": "",
    "promptCanShow": false, "reviewCanShow": false,
    "platform": navigator.platform, "browser": "Chrome"
});
function RequestingEnvironmentData(sendback) {
    return new Promise((resolve) => {
        if (ysdk == null) { resolve(environmentData); return; }
        try {
            var promptCanShow = false, reviewCanShow = false;
            ysdk.feedback.canReview().then(({ value }) => {
                if (value) reviewCanShow = true;
                ysdk.shortcut.canShowPrompt().then(prompt => {
                    if (prompt.canShow) promptCanShow = true;
                    var browser = navigator.userAgent;
                    if (browser.includes('YaBrowser') || browser.includes('YaSearchBrowser')) browser = 'Yandex';
                    else if (browser.includes('Opera') || browser.includes('OPR')) browser = 'Opera';
                    else if (browser.includes('Firefox')) browser = 'Firefox';
                    else if (browser.includes('MSIE')) browser = 'IE';
                    else if (browser.includes('Edge')) browser = 'Edge';
                    else if (browser.includes('Chrome')) browser = 'Chrome';
                    else if (browser.includes('Safari')) browser = 'Safari';
                    else browser = 'Other';
                    let jsonEnvir = {
                        "language": ysdk.environment.i18n.lang, "domain": ysdk.environment.i18n.tld,
                        "deviceType": ysdk.deviceInfo.type, "isMobile": ysdk.deviceInfo.isMobile(),
                        "isDesktop": ysdk.deviceInfo.isDesktop(), "isTablet": ysdk.deviceInfo.isTablet(),
                        "isTV": ysdk.deviceInfo.isTV(), "appID": ysdk.environment.app.id,
                        "browserLang": ysdk.environment.browser.lang, "payload": ysdk.environment.payload,
                        "promptCanShow": promptCanShow, "reviewCanShow": reviewCanShow,
                        "platform": navigator.platform, "browser": browser
                    };
                    if (sendback) myGameInstance.SendMessage('YandexGame', 'SetEnvirData', JSON.stringify(jsonEnvir));
                    resolve(JSON.stringify(jsonEnvir));
                    console.log("Environment Data: " + JSON.stringify(jsonEnvir));
                });
            });
        } catch (e) { console.error('CRASH Requesting Environment Data: ', e.message); resolve(environmentData); }
    });
}
var playerData = 'noData';
function InitPlayer(sendback) {
    return new Promise((resolve) => {
        try {
            if (ysdk == null) {
                if (sendback && myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                resolve(NotAuthorized());
            } else {
                let _scopes = true;
                ysdk.getPlayer({ scopes: _scopes }).then(_player => {
                    player = _player;
                    let playerName = player.getName(), playerPhoto = player.getPhoto('small');
                    if (!_scopes) { playerName = "anonymous"; playerPhoto = "null"; }
                    if (player.getMode() === 'lite') {
                        console.log('Not Authorized');
                        if (sendback) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                        resolve(NotAuthorized());
                    } else {
                        let authJson = { "playerAuth": "resolved", "playerName": playerName,
                            "playerId": player.getUniqueID(), "playerPhoto": playerPhoto };
                        if (sendback) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', JSON.stringify(authJson));
                        resolve(JSON.stringify(authJson));
                    }
                }).catch(e => {
                    console.error('Authorized err: ', e.message);
                    if (sendback) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
                    resolve(NotAuthorized());
                });
            }
        } catch (e) {
            console.error('CRASH init Player: ', e.message);
            if (sendback && myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetInitializationSDK', NotAuthorized());
            resolve(NotAuthorized());
        }
    });
}
function NotAuthorized() {
    return JSON.stringify({ "playerAuth": "rejected", "playerName": "unauthorized",
        "playerId": "unauthorized", "playerPhoto": "null" });
}
function OpenAuthDialog() {
    if (ysdk !== null) {
        try {
            ysdk.auth.openAuthDialog().then(() => {
                InitPlayer(true).then(() => { myGameInstance.SendMessage('YandexGame', 'GetDataInvoke'); });
            });
        } catch (e) { console.log('CRASH Open Auth Dialog: ', e.message); }
    }
}
