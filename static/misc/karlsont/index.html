<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Google</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/55gms/assets@main/misc/karlsont/TemplateData/style.css">
    <script src="/assets/js/loader-ui.js?v=2re0106df4"></script>
    <script src="/assets/js/game-loader.js?v=2re0106df4" data-title="KARLSON&#x27;T"></script>
    <script>
      GameLoader.unity([
        ["Build/KARLSON'T.data.unityweb", 14850578],
        ["Build/KARLSON'T.framework.js.unityweb", 88003],
        ["Build/KARLSON'T.wasm.unityweb", 6865506],
      ]);
    </script>
    <base href="https://cdn.jsdelivr.net/gh/55gms/assets@main/misc/karlsont/">
</head>

<body style="margin: 0; overflow: hidden; background: #231F20">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/KARLSON'T.loader.js";
        var config = {
            dataUrl: buildUrl + "/KARLSON'T.data.unityweb",
            frameworkUrl: buildUrl + "/KARLSON'T.framework.js.unityweb",
            codeUrl: buildUrl + "/KARLSON'T.wasm.unityweb",
            streamingAssetsUrl: new URL("StreamingAssets", document.baseURI).href,
            companyName: "CompanyName",
            productName: "KARLSON'T",
            productVersion: "0.1.0",
            showBanner: unityShowBanner,
        };


        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
            unityShowBanner('WebGL builds are not supported on mobile devices.');
        } else {
            canvas.style.width = "100vw";
            canvas.style.height = "100vh";
            canvas.style.display = "block";
        }
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>

</html>
