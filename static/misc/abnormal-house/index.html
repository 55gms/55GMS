            return ysdk.getPlayer().then(function (p) {
                player = p;
                if (!player || !player.isAuthorized()) return Final(NotAuthorized(true));
                var authJson = {
                    playerAuth: "resolved",
                    playerName: player.getName(),
                    playerId: player.getUniqueID(),
                    playerPhoto: player.getPhoto('medium'),
                    payingStatus: player.getPayingStatus()
                };
                return Final(JSON.stringify(authJson));
            })["catch"](function () {
                return Final(NotAuthorized(false));
            });
        }

        function NotAuthorized(hasPlayer) {
            var authJson = {
                playerAuth: "rejected",
                playerName: "unauthorized",
                playerId: (hasPlayer && player && player.getUniqueID) ? player.getUniqueID() : "unauthorized",
                playerPhoto: "no data",
                payingStatus: "unknown"
            };
            return JSON.stringify(authJson);
        }

        function OpenAuthDialog() {
            if (!ysdk) return;
            try {
                ysdk.auth.openAuthDialog().then(function () {
                    return InitPlayer();
                }).then(function () {
                    YG2Instance('LoggedIn');
                })["catch"](function () { InitPlayer(); });
            } catch (e) {}
        }

        var script = document.createElement("script");
        script.src = F(".loader.js");
        script.onload = function () {
            StartUnityInstance = function () {
                if (unityStarted) return;
                unityStarted = true;
                createUnityInstance(canvas, config, function (progress) {
                    UpdateProgress(0.4 + progress * 0.6);
                }).then(function (unityInstance) {
                    ygGameInstance = unityInstance;
                    window.unityGame = unityInstance;
                    setTimeout(function () { window.HideUnityLoadingCover(); }, 4000);
                })["catch"](function (message) {
                    console.error(message);
                });
            };
            loaderReady = true;
            InstallBlurFocusBlocker();
            StartUnityInstance_IfUnloaded();
        };
        document.body.appendChild(script);

        PrepareFiles().then(function () {
            filesReady = true;
            return InitYSDK();
        }).then(function () {
            StartUnityInstance_IfUnloaded();
        })["catch"](function (e) {
            console.error("[prepare] ", e);
            try {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = "100%";
                progressBarFull.style.background = "#c0392b";
            } catch (e2) {}
        });
    </script>




</body></html>
