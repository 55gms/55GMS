<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <script src="/assets/js/font.js" defer></script>
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css?v=6" />
    <link rel="stylesheet" href="/assets/css/nav.css?v=7" />
    <title>Google</title>
    <meta name="googlebot" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rednotsus" />
    <meta http-equiv="Cache-control" content="public" />
    <meta charset="utf-8" />

    <meta
      name="description"
      content="55GMS - Reds Exploit Corner - Join the discord for links!"
    />

    <script src="/assets/js/script.js?v=17"></script>

    <script src="/assets/js/easteregg.min.js" async></script>
    <meta name="theme-color" content="#0b1220" />

    <link rel="stylesheet" href="/assets/css/ui.css?v=1" />
    <script src="/assets/js/ui.js?v=1" defer></script>
    <script src="/assets/js/auth.js?v=1" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav aria-label="Main navigation">
      <div class="navbar">
        <a id="nav-title" href="/">Reds Exploit Corner</a>
        <a href="/g"
          ><i aria-hidden="true" class="fa-solid fa-gamepad">&nbsp;</i>Games</a
        >
        <a href="/a"
          ><i aria-hidden="true" class="fa-solid fa-box-archive">&nbsp;</i
          >Apps</a
        >
        <a href="/-"
          ><i aria-hidden="true" class="fa-solid fa-tv">&nbsp;</i>Media</a
        >
        <a href="/s"
          ><i aria-hidden="true" class="fa-solid fa-gears">&nbsp;</i>Settings</a
        >
        <a href="/chat" aria-label="Chat" title="Chat"
          ><i aria-hidden="true" class="fa-solid fa-comments">&nbsp;</i></a
        >
        <a href="/profile" aria-label="Profile" title="Profile"
          ><i aria-hidden="true" class="fa-solid fa-user"></i
        ></a>
      </div>
    </nav>
    <main id="main-content" tabindex="-1" class="auth-page">
      <h1>Welcome back</h1>
      <p>Sign in to access your saves and conversations.</p>
      <form id="authForm" class="auth-form" data-mode="login" novalidate>
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form__input"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="authFeedback"
          required
        />
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form__input"
          name="password"
          autocomplete="current-password"
          aria-describedby="authFeedback"
          required
        />

        <p
          id="authFeedback"
          class="form-feedback"
          role="alert"
          tabindex="-1"
        ></p>
        <button type="submit" class="gs">Sign in</button>
        <span id="authLoader" class="auth-loader" role="status" hidden
          >Working…</span
        >
      </form>

      <p>New to 55GMS? <a href="/signup">Create an account</a></p>
    </main>
  </body>
</html>
