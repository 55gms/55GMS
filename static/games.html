  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav aria-label="Main navigation">
      <div class="navbar">
        <a id="nav-title" href="/">Reds's Exploit Corner</a>
        <a href="/g" aria-current="page"
          ><i aria-hidden="true" class="fa-solid fa-gamepad">&nbsp;</i>Games</a
        >
        <a href="/a"
          ><i aria-hidden="true" class="fa-solid fa-box-archive">&nbsp;</i
          >Apps</a
        >
        <a href="/-"
          ><i aria-hidden="true" class="fa-solid fa-tv">&nbsp;</i>Media</a
        >
        <a href="/s"
          ><i aria-hidden="true" class="fa-solid fa-gears">&nbsp;</i>Settings</a
        >

          ><i aria-hidden="true" class="fa-solid fa-comments">&nbsp;</i></a

          ><i aria-hidden="true" class="fa-solid fa-user"></i

    <main id="main-content" tabindex="-1">
      <header class="page-header">
        <h1>Games</h1>
        <p>Find a favorite or try something new.</p>
      </header>
      <script src="/assets/js/games.js?v=13"></script>
      <input
        class="searchbar"
        oninput="search()"
        aria-label="Search games"
        name="q"
        placeholder="Search games…"
        type="search"
        autocomplete="off"
      /><br />
      <div
        id="loading-container"
        class="loading-container"
        role="status"
        aria-live="polite"
      >
        <div class="loading-text" id="loading-text">Loading games…</div>
        <div class="progress-bar-container">
          <div
            class="progress-bar"
            id="progress-bar"
            role="progressbar"
            aria-label="Game catalog loaded"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>
        <div class="progress-percentage" id="progress-percentage">0%</div>
        <button id="retry-games" class="loading-retry" type="button" hidden>
          Try Again
        </button>
      </div>
      <p
        id="search-status"
        class="search-status"
        role="status"
        aria-live="polite"
      ></p>
      <div id="game-container"></div>
      <br />
    </main>
    <script src="/assets/js/searchbar.v2.js?v=9"></script>
