<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading</title>
    <!-- The play page frames this while it starts the game. It wears the
         shared loading screen (loader-ui.css) so a Unity game's own loader
         takes over without a change of look. -->
    <link rel="stylesheet" href="/assets/css/loader-ui.css?v=1" />
    <style>
      html,
      body {
        margin: 0;
        background: #5e7594;
      }

      .loader-cover .loader-initial:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game-loading" class="loader-ui" data-state="loading">
      <div class="loader">
        <div class="loader-cover" aria-hidden="true">
          <span class="loader-initial"></span>
          <img class="loader-art" alt="" decoding="async" />
        </div>
        <h1 class="loader-title">Loading game…</h1>
        <div class="loader-progress">
          <div class="loader-track" role="progressbar" aria-label="Loading">
            <div class="loader-fill"></div>
          </div>
          <p class="loader-meta" aria-hidden="true"></p>
        </div>
        <div class="loader-live">
          <p class="loader-line">
            <span class="loader-status" role="status">Loading game…</span>
          </p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById("game-loading");
        var find = function (name) {
          return overlay.querySelector(".loader-" + name);
        };
        try {
          var theme = localStorage.getItem("siteTheme") || "legacy";
          overlay.dataset.theme = theme === "classic" ? "legacy" : theme;
          var bg = getComputedStyle(overlay).getPropertyValue("--loader-bg");
          if (bg) document.body.style.background = bg;
        } catch (error) {}

        // The play page holds the game's title and, once its catalogue is in,
        // the cover. Outside it (or cross-origin) the screen stays generic.
        var page;
        try {
          if (parent !== window) page = parent.document;
        } catch (error) {}
        if (!page) return;

        var title = page.querySelector("#gameframe .titletext");
        var name = title && title.textContent.trim();
        if (name) {
          find("title").textContent = name;
          find("initial").textContent = name.charAt(0).toUpperCase();
        }

        var art = find("art");
        art.onload = function () {
          overlay.classList.add("loader-has-art");
        };
        var icon = page.querySelector("#gameframe .gameicon");
        if (!icon) return;
        var showCover = function () {
          var src = icon.getAttribute("src");
          if (!src) return false;
          art.src = icon.src;
          return true;
        };
        if (showCover()) return;
        var watch = new MutationObserver(function () {
          if (showCover()) watch.disconnect();
        });
        watch.observe(icon, { attributes: true, attributeFilter: ["src"] });
      })();
    </script>
  </body>
</html>
