    #titles .word {

      #titles .ch {

      }
    }

    @keyframes intro-letter {
      from {
        opacity: 0;
        transform: translateY(0.45em) rotate(6deg) scale(0.9);
        filter: blur(10px);
      }
    }

    @keyframes intro-rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
    }

    @keyframes intro-pop {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.85);
      }
    }
  </style>
  <script>
    (function () {
      var title = document.getElementById("titles");
      if (title && !title.dataset.split) {
        var text = title.textContent.trim();
        var index = 0;
        title.dataset.split = "1";
        title.setAttribute("aria-label", text);
        title.textContent = "";
        text.split(/\s+/).forEach(function (word, wordIndex, words) {
          var wordSpan = document.createElement("span");
          wordSpan.className = "word";
          wordSpan.setAttribute("aria-hidden", "true");
          Array.from(word).forEach(function (letter) {
            var span = document.createElement("span");
            span.className = "ch";
            span.style.setProperty("--i", String(index++));
            span.textContent = letter;
            wordSpan.appendChild(span);
          });
          title.appendChild(wordSpan);
          if (wordIndex < words.length - 1) title.appendChild(document.createTextNode(" "));
        });
      }
      document.querySelectorAll(".quicklink .shortcut").forEach(function (tile, i) {
        tile.style.setProperty("--i", String(i));
      });
    })();
  </script>
