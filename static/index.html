  <style>
    .daily-feature {
      box-sizing: border-box;
      width: min(820px, calc(100% - 32px));
      margin: 34px auto 52px;
      font-family: "Roboto", Arial, sans-serif;
      color: var(--site-text, #fff);
    }

    .daily-feature * {
      box-sizing: border-box;
    }

    .daily-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 14px;
    }

    .daily-heading {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .daily-date {
      color: var(--site-muted, #d9e5f5);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .daily-card {
      display: flex;
      align-items: stretch;
      gap: 23px;
      border: 1px solid color-mix(
        in srgb,
        var(--site-text, #fff) 20%,
        transparent
      );
      border-radius: var(--site-radius-lg, 18px);
      padding: 16px;
      background: linear-gradient(
        120deg,
        var(--site-surface, #7a8fab),
        var(--site-surface-3, #4a5f7a)
      );
      box-shadow:
        0 15px 34px var(--site-shadow, rgba(0, 0, 0, .24)),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .daily-cover {
      flex: 0 0 230px;
      width: 230px;
      min-height: 168px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--site-surface-3, #4a5f7a);
    }

    .daily-content {
      flex: 1;
      min-width: 0;
      padding: 5px 6px 3px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .daily-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: color-mix(
        in srgb,
        var(--site-accent, #f5b942) 19%,
        transparent
      );
      color: var(--site-text, white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .daily-title {
      font-size: clamp(23px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: -.8px;
      line-height: 1.15;
      margin: 11px 0 7px;
    }

    .daily-description {
      font-size: 14px;
      line-height: 1.5;
      color: var(--site-muted, #e0eaf5);
      margin: 0 0 17px;
    }

    .daily-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: auto;
    }

    .daily-play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 18px;
      border-radius: var(--site-radius-sm, 10px);
      background: var(--site-accent, #f5b942);
      color: var(--site-accent-text, #292e3c);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition:
        transform .15s ease,
        background .15s ease;
    }

    .daily-play:hover {
      transform: translateY(-2px);
      background: var(--site-accent-hover, #f8cd6b);
    }

    .daily-play:focus-visible {
      outline: 3px solid var(--site-text, #fff);
      outline-offset: 3px;
    }

    .daily-change {
      color: var(--site-muted, #e0eaf5);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .daily-feature {
        margin-top: 28px;
      }

      .daily-head {
        align-items: baseline;
      }

      .daily-heading {
        font-size: 19px;
      }

      .daily-date {
        font-size: 11px;
      }

      .daily-card {
        gap: 13px;
        padding: 12px;
      }

      .daily-cover {
        flex: 0 0 115px;
        width: 115px;
        min-height: 154px;
      }

      .daily-content {
        padding: 0;
      }

      .daily-tag {
        font-size: 9px;
        letter-spacing: .5px;
        padding: 5px 7px;
      }

      .daily-title {
        font-size: 21px;
        margin: 8px 0 5px;
      }

      .daily-description {
        font-size: 12px;
        margin-bottom: 10px;
      }

      .daily-play {
        padding: 9px 12px;
        font-size: 12px;
      }

      .daily-change {
        display: none;
      }
    }

    @media (max-width: 370px) {
      .daily-cover {
        flex-basis: 90px;
        width: 90px;
